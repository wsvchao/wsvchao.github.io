 LORD [is] perfect, converting the soul: the testimony of the LORD [is] sure, making wise the simple."],"41.24.44":["耶穌對他們說：這就是我從前與你們同在之時所告訴你們的話說：摩西的律法、先知的書，和詩篇上所記的，凡指著我的話都必須應驗。","耶稣对他们说：这就是我从前与你们同在之时所告诉你们的话说：摩西的律法、先知的书，和诗篇上所记的，凡指着我的话都必须应验。","And he said unto them, These [are] the words which I spake unto you, while I was yet with you, that all things must be fulfilled, which were written in the law of Moses, and [in] the prophets, and [in] the psalms, concerning me."],"41.24.45":["於是耶穌開他們的心竅，使他們能明白聖經，","于是耶稣开他们的心窍，使他们能明白圣经，","Then opened he their understanding, that they might understand the scriptures,"],"53.5.18":["因為經上說：牛在場上踹穀的時候，不可籠住他的嘴；又說：工人得工價是應當的。","因为经上说：牛在场上踹谷的时候，不可笼住他的嘴；又说：工人得工价是应当的。","For the scripture saith, Thou shalt not muzzle the ox that treadeth out the corn. And, The labourer [is] worthy of his reward."],"42.5.39":["你們查考聖經（或作：應當查考聖經），因你們以為內中有永生；給我作見證的就是這經。","你们查考圣经（或作：应当查考圣经），因你们以为内中有永生；给我作见证的就是这经。","Search the scriptures; for in them ye think ye have eternal life: and they are they which testify of me."],"65.22.18":["我向一切聽見這書上預言的作見證，若有人在這預言上加添什麼，神必將寫在這書上的災禍加在他身上；","我向一切听见这书上预言的作见证，若有人在这预言上加添什么，神必将写在这书上的灾祸加在他身上；","For I testify unto every man that heareth the words of the prophecy of this book, If any man shall add unto these things, God shall add unto him the plagues that are written in this book:"],"65.22.19":["這書上的預言，若有人刪去什麼，神必從這書上所寫的生命樹和聖城刪去他的分。","这书上的预言，若有人删去什么，神必从这书上所写的生命树和圣城删去他的分。","And if any man shall take away from the words of the book of this prophecy, God shall take away his part out of the book of life, and out of the holy city, and [from] the things which are written in this book."],"61.5.10":["信神兒子的，就有這見證在他心裡；不信神的，就是將神當作說謊的，因不信神為他兒子作的見證。","信神儿子的，就有这见证在他心里；不信神的，就是将神当作说谎的，因不信神为他儿子作的见证。","He that believeth on the Son of God hath the witness in himself: he that believeth not God hath made him a liar; because he believeth not the record that God gave of his Son."],"61.5.11":["這見證就是神賜給我們永生；這永生也是在他兒子裡面。","这见证就是神赐给我们永生；这永生也是在他儿子里面。","And this is the record, that God hath given to us eternal life, and this life is in his Son."],"61.5.12":["人有了神的兒子就有生命，沒有神的兒子就沒有生命。","人有了神的儿子就有生命，没有神的儿子就没有生命。","He that hath the Son hath life; [and] he that hath not the Son of God hath not life."],"42.15.26":["但我要從父那裡差保惠師來，就是從父出來真理的聖靈；他來了，就要為我作見證。","但我要从父那里差保惠师来，就是从父出来真理的圣灵；他来了，就要为我作见证。","But when the Comforter is come, whom I will send unto you from the Father, [even] the Spirit of truth, which proceedeth from the Father, he shall testify of me:"],"47.4.4":["及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下，","及至时候满足，神就差遣他的儿子，为女子所生，且生在律法以下，","But when the fulness of the time was come, God sent forth his Son, made of a woman, made under the law,"],"47.4.5":["要把律法以下的人贖出來，叫我們得著兒子的名分。","要把律法以下的人赎出来，叫我们得着儿子的名分。","To redeem them that were under the law, that we might receive the adoption of sons."],"47.4.6":["你們既為兒子，神就差他兒子的靈進入你們（原文作我們）的心，呼叫：阿爸！父！","你们既为儿子，神就差他儿子的灵进入你们（原文作我们）的心，调用：阿爸！父！","And because ye are sons, God hath sent forth the Spirit of his Son into your hearts, crying, Abba, Father."],"46.13.14":["願主耶穌基督的恩惠、神的慈愛、聖靈的感動，常與你們眾人同在！","愿主耶稣基督的恩惠、神的慈爱、圣灵的感动，常与你们众人同在！","The grace of the Lord Jesus Christ, and the love of God, and the communion of the Holy Ghost, [be] with you all. Amen."],"22.45.18":["創造諸天的耶和華，製造成全大地的神，他創造堅定大地，並非使地荒涼，是要給人居住。他如此說：我是耶和華，再沒有別神。","创造诸天的耶和华，制造成全大地的神，他创造坚定大地，并非使地荒凉，是要给人居住。他如此说：我是耶和华，再没有别神。","For thus saith the LORD that created the heavens; God himself that formed the earth and made it; he hath established it, he created it not in vain, he formed it to be inhabited: I [am] the LORD; and [there is] none else."],"44.11.36":["因為萬有都是本於他，倚靠他，歸於他。願榮耀歸給他，直到永遠。阿們！","因为万有都是本于他，倚靠他，归于他。愿荣耀归给他，直到永远。阿们！","For of him, and through him, and to him, [are] all things: to whom [be] glory for ever. Amen."],"1.3.14":["神對摩西說：我是自有永有的；又說：你要對以色列人這樣說：那自有的打發我到你們這裡來。","神对摩西说：我是自有永有的；又说：你要对以色列人这样说：那自有的打发我到你们这里来。","And God said unto Moses, I AM THAT I AM: and he said, Thus shalt thou say unto the children of Israel, I AM hath sent me unto you."],"1.6.3":["我從前向亞伯拉罕、以撒、雅各顯現為全能的神；至於我名耶和華，他們未曾知道。","我从前向亚伯拉罕、以撒、雅各显现为全能的神；至于我名耶和华，他们未曾知道。","And I appeared unto Abraham, unto Isaac, and unto Jacob, by [the name of] God Almighty, but by my name JEHOVAH was I not known to them."],"39.5.45":["這樣就可以作你們天父的兒子；因為他叫日頭照好人，也照歹人；降雨給義人，也給不義的人。","这样就可以作你们天父的儿子；因为他叫日头照好人，也照歹人；降雨给义人，也给不义的人。","That ye may be the children of your Father which is in heaven: for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust."],"42.14.28":["你們聽見我對你們說了，我去還要到你們這裡來。你們若愛我，因我到父那裡去，就必喜樂，因為父是比我大的。","你们听见我对你们说了，我去还要到你们这里来。你们若爱我，因我到父那里去，就必喜乐，因为父是比我大的。","Ye have heard how I said unto you, I go away, and come [again] unto you. If ye loved me, ye would rejoice, because I said, I go unto the Father: for my Father is greater than I."],"42.14.31":["但要叫世人知道我愛父，並且父怎樣吩咐我，我就怎樣行。起來，我們走吧！","但要叫世人知道我爱父，并且父怎样吩咐我，我就怎样行。起来，我们走吧！","But that the world may know that I love the Father; and as the Father gave me commandment, even so I do. Arise, let us go hence."],"42.8.28":["所以耶穌說：你們舉起人子以後，必知道我是基督，並且知道我沒有一件事是憑著自己做的。我說這些話乃是照著父所教訓我的。","所以耶稣说：你们举起人子以后，必知道我是基督，并且知道我没有一件事是凭着自己做的。我说这些话乃是照着父所教训我的。","Then said Jesus unto them, When ye have lifted up the Son of man, then shall ye know that I am [he], and [that] I do nothing of myself; but as my Father hath taught me, I speak these things."],"42.8.29":["那差我來的是與我同在；他沒有撇下我獨自在這裡，因為我常做他所喜悅的事。","那差我来的是与我同在；他没有撇下我独自在这里，因为我常做他所喜悦的事。","And he that sent me is with me: the Father hath not left me alone; for I do always those things that please him."],"53.1.17":["但願尊貴、榮耀歸與那不能朽壞、不能看見、永世的君王、獨一的神，直到永永遠遠。阿們！","但愿尊贵、荣耀归与那不能朽坏、不能看见、永世的君王、独一的神，直到永永远远。阿们！","Now unto the King eternal, immortal, invisible, the only wise God, [be] honour and glory for ever and ever. Amen."],"65.1.4":["約翰寫信給亞西亞的七個教會。但願從那昔在、今在、以後永在的神，和他寶座前的七靈，","约翰写信给亚西亚的七个教会。但愿从那昔在、今在、以后永在的神，和他宝座前的七灵，","John to the seven churches which are in Asia: Grace [be] unto you, and peace, from him which is, and which was, and which is to come; and from the seven Spirits which are before his throne;"],"65.1.8":["主神說：我是阿拉法，我是俄梅戛（阿拉法，俄梅戛：是希利尼字母首末二字），是昔在、今在、以後永在的全能者。","主神说：我是阿拉法，我是俄梅戛（阿拉法，俄梅戛：是希利尼字母首末二字），是昔在、今在、以后永在的全能者。","I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty."],"65.21.6":["他又對我說：都成了！我是阿拉法，我是俄梅戛；我是初，我是終。我要將生命泉的水白白賜給那口渴的人喝。","他又对我说：都成了！我是阿拉法，我是俄梅戛；我是初，我是终。我要将生命泉的水白白赐给那口渴的人喝。","And he said unto me, It is done. I am Alpha and Omega, the beginning and the end. I will give unto him that is athirst of the fountain of the water of life freely."],"4.33.27":["永生的神是你的居所；他永久的膀臂在你以下。他在你前面攆出仇敵，說：毀滅吧。","永生的神是你的居所；他永久的膀臂在你以下。他在你前面撵出仇敌，说：毁灭吧。","The eternal God [is thy] refuge, and underneath [are] the everlasting arms: and he shall thrust out the enemy from before thee; and shall say, Destroy [them]."],"0.17.1":["亞伯蘭年九十九歲的時候，耶和華向他顯現，對他說：我是全能的神。你當在我面前作完全人，","亚伯兰年九十九岁的时候，耶和华向他显现，对他说：我是全能的神。你当在我面前作完全人，","And when Abram was ninety years old and nine, the LORD appeared to Abram, and said unto him, I [am] the Almighty God; walk before me, and be thou perfect."],"23.32.17":["主耶和華啊，你曾用大能和伸出來的膀臂創造天地，在你沒有難成的事。","主耶和华啊，你曾用大能和伸出来的膀臂创造天地，在你没有难成的事。","Ah Lord GOD! behold, thou hast made the heaven and the earth by thy great power and stretched out arm, [and] there is nothing too hard for thee:"],"23.32.27":["我是耶和華，是凡有血氣者的神，豈有我難成的事嗎？","我是耶和华，是凡有血气者的神，岂有我难成的事吗？","Behold, I [am] the LORD, the God of all flesh: is there any thing too hard for me?"],"61.4.8":["沒有愛心的，就不認識神，因為神就是愛。","没有爱心的，就不认识神，因为神就是爱。","He that loveth not knoweth not God; for God is love."],"61.4.16":["神愛我們的心，我們也知道也信。神就是愛；住在愛裡面的，就是住在神裡面，神也住在他裡面。","神爱我们的心，我们也知道也信。神就是爱；住在爱里面的，就是住在神里面，神也住在他里面。","And we have known and believed the love that God hath to us. God is love; and he that dwelleth in love dwelleth in God, and God in him."],"18.89.14":["公義和公平是你寶座的根基；慈愛和誠實行在你前面。","公义和公平是你宝座的根基；慈爱和诚实行在你前面。","Justice and judgment [are] the habitation of thy throne: mercy and truth shall go before thy face."],"44.15.33":["願賜平安的神常和你們眾人同在。阿們！","愿赐平安的神常和你们众人同在。阿们！","Now the God of peace [be] with you all. Amen."],"44.16.20":["賜平安的神快要將撒但踐踏在你們腳下。願我主耶穌基督的恩常和你們同在！","赐平安的神快要将撒但践踏在你们脚下。愿我主耶稣基督的恩常和你们同在！","And the God of peace shall bruise Satan under your feet shortly. The grace of our Lord Jesus Christ [be] with you. Amen."],"45.14.33":["因為神不是叫人混亂，乃是叫人安靜。","因为神不是叫人混乱，乃是叫人安静。","For God is not [the author] of confusion, but of peace, as in all churches of the saints."],"18.18.35":["你把你的救恩給我作盾牌；你的右手扶持我；你的溫和使我為大。","你把你的救恩给我作盾牌；你的右手扶持我；你的温和使我为大。","Thou hast also given me the shield of thy salvation: and thy right hand hath holden me up, and thy gentleness hath made me great."],"44.11.33":["深哉，神豐富的智慧和知識！他的判斷何其難測！他的蹤跡何其難尋！","深哉，神丰富的智能和知识！他的判断何其难测！他的踪迹何其难寻！","O the depth of the riches both of the wisdom and knowledge of God! how unsearchable [are] his judgments, and his ways past finding out!"],"61.3.20":["我們的心若責備我們，神比我們的心大，一切事沒有不知道的。","我们的心若责备我们，神比我们的心大，一切事没有不知道的。","For if our heart condemn us, God is greater than our heart, and knoweth all things."],"18.139.3":["我行路，我躺臥，你都細察；你也深知我一切所行的。","我行路，我躺卧，你都细察；你也深知我一切所行的。","Thou compassest my path and my lying down, and art acquainted [with] all my ways."],"18.139.4":["耶和華啊，我舌頭上的話，你沒有一句不知道的。","耶和华啊，我舌头上的话，你没有一句不知道的。","For [there is] not a word in my tongue, [but], lo, O LORD, thou knowest it altogether."],"18.139.5":["你在我前後環繞我，按手在我身上。","你在我前后环绕我，按手在我身上。","Thou hast beset me behind and before, and laid thine hand upon me."],"18.96.10":["人在列邦中要說：耶和華作王！世界就堅定，不得動搖；他要按公正審判眾民。","人在列邦中要说：耶和华作王！世界就坚定，不得动摇；他要按公正审判众民。","Say among the heathen [that] the LORD reigneth: the world also shall be established that it shall not be moved: he shall judge the people righteously."],"18.96.13":["因為他來了，他來要審判全地。他要按公義審判世界，按他的信實審判萬民。","因为他来了，他来要审判全地。他要按公义审判世界，按他的信实审判万民。","Before the LORD: for he cometh, for he cometh to judge the earth: he shall judge the world with righteousness, and the people with his truth."],"18.23.1":["（大衛的詩。）耶和華是我的牧者，我必不致缺乏。","（大卫的诗。）耶和华是我的牧者，我必不致缺乏。","A Psalm of David. The LORD [is] my shepherd; I shall not want."],"18.23.2":["他使我躺臥在青草地上，領我在可安歇的水邊。","他使我躺卧在青草地上，领我在可安歇的水边。","He maketh me to lie down in green pastures: he leadeth me beside the still waters."],"18.121.3":["他必不叫你的腳搖動；保護你的必不打盹！","他必不叫你的脚摇动；保护你的必不打盹！","He will not suffer thy foot to be moved: he that keepeth thee will not slumber."],"18.121.4":["保護以色列的，也不打盹也不睡覺。","保护以色列的，也不打盹也不睡觉。","Behold, he that keepeth Israel shall neither slumber nor sleep."],"18.121.5":["保護你的是耶和華；耶和華在你右邊蔭庇你。","保护你的是耶和华；耶和华在你右边荫庇你。","The LORD [is] thy keeper: the LORD [is] thy shade upon thy right hand."],"18.121.6":["白日，太陽必不傷你；夜間，月亮必不害你。","白日，太阳必不伤你；夜间，月亮必不害你。","The sun shall not smite thee by day, nor the moon by night."],"18.121.7":["耶和華要保護你，免受一切的災害；他要保護你的性命。","耶和华要保护你，免受一切的灾害；他要保护你的性命。","The LORD shall preserve thee from all evil: he shall preserve thy soul."],"18.121.8":["你出你入，耶和華要保護你，從今時直到永遠。","你出你入，耶和华要保护你，从今时直到永远。","The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore."],"32.5.2":["伯利恆、以法他啊，你在猶大諸城中為小，將來必有一位從你那裡出來，在以色列中為我作掌權的；他的根源從亙古，從太初就有。","伯利恒、以法他啊，你在犹大诸城中为小，将来必有一位从你那里出来，在以色列中为我作掌权的；他的根源从亘古，从太初就有。","But thou, Bethlehem Ephratah, [though] thou be little among the thousands of Judah, [yet] out of thee shall he come forth unto me [that is] to be ruler in Israel; whose goings forth [have been] from of old, from everlasting."],"42.8.58":["耶穌說：我實實在在的告訴你們，還沒有亞伯拉罕就有了我。","耶稣说：我实实在在的告诉你们，还没有亚伯拉罕就有了我。","Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am."],"42.17.5":["父啊，現在求你使我同你享榮耀，就是未有世界以先，我同你所有的榮耀。","父啊，现在求你使我同你享荣耀，就是未有世界以先，我同你所有的荣耀。","And now, O Father, glorify thou me with thine own self with the glory which I had with thee before the world was."],"50.1.12":["又感謝父，叫我們能與眾聖徒在光明中同得基業。","又感谢父，叫我们能与众圣徒在光明中同得基业。","Giving thanks unto the Father, which hath made us meet to be partakers of the inheritance of the saints in light:"],"50.1.13":["他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡；","他救了我们脱离黑暗的权势，把我们迁到他爱子的国里；","Who hath delivered us from the power of darkness, and hath translated [us] into the kingdom of his dear Son:"],"48.3.9":["又使眾人都明白，這歷代以來隱藏在創造萬物之神裡的奧祕是如何安排的，","又使众人都明白，这历代以来隐藏在创造万物之神里的奥秘是如何安排的，","And to make all [men] see what [is] the fellowship of the mystery, which from the beginning of the world hath been hid in God, who created all things by Jesus Christ:"],"22.7.14":["因此，主自己要給你們一個兆頭，必有童女懷孕生子，給他起名叫以馬內利（就是神與我們同在的意思）。","因此，主自己要给你们一个兆头，必有童女怀孕生子，给他起名叫以马内利（就是神与我们同在的意思）。","Therefore the Lord himself shall give you a sign; Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel."],"22.9.6":["因有一嬰孩為我們而生；有一子賜給我們。政權必擔在他的肩頭上；他名稱為奇妙策士、全能的神、永在的父、和平的君。","因有一婴孩为我们而生；有一子赐给我们。政权必担在他的肩头上；他名称为奇妙策士、全能的神、永在的父、和平的君。","For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace."],"57.2.16":["他並不救拔天使，乃是救拔亞伯拉罕的後裔。","他并不救拔天使，乃是救拔亚伯拉罕的后裔。","For verily he took not on [him the nature of] angels; but he took on [him] the seed of Abraham."],"41.1.26":["到了第六個月，天使加百列奉神的差遣往加利利的一座城去，這城名叫拿撒勒，","到了第六个月，天使加百列奉神的差遣往加利利的一座城去，这城名叫拿撒勒，","And in the sixth month the angel Gabriel was sent from God unto a city of Galilee, named Nazareth,"],"41.1.27":["到一個童女那裡，是已經許配大衛家的一個人，名叫約瑟。童女的名字叫馬利亞；","到一个童女那里，是已经许配大卫家的一个人，名叫约瑟。童女的名字叫马利亚；","To a virgin espoused to a man whose name was Joseph, of the house of David; and the virgin's name [was] Mary."],"41.1.28":["天使進去，對他說：蒙大恩的女子，我問你安，主和你同在了！","天使进去，对他说：蒙大恩的女子，我问你安，主和你同在了！","And the angel came in unto her, and said, Hail, [thou that art] highly favoured, the Lord [is] with thee: blessed [art] thou among women."],"41.1.29":["馬利亞因這話就很驚慌，又反覆思想這樣問安是什麼意思。","马利亚因这话就很惊慌，又反复思想这样问安是什么意思。","And when she saw [him], she was troubled at his saying, and cast in her mind what manner of salutation this should be."],"41.1.30":["天使對他說：馬利亞，不要怕！你在神面前已經蒙恩了。","天使对他说：马利亚，不要怕！你在神面前已经蒙恩了。","And the angel said unto her, Fear not, Mary: for thou hast found favour with God."],"41.1.31":["你要懷孕生子，可以給他起名叫耶穌。","你要怀孕生子，可以给他起名叫耶稣。","And, behold, thou shalt conceive in thy womb, and bring forth a son, and shalt call his name JESUS."],"41.1.32":["他要為大，稱為至高者的兒子；主神要把他祖大衛的位給他。","他要为大，称为至高者的儿子；主神要把他祖大卫的位给他。","He shall be great, and shall be called the Son of the Highest: and the Lord God shall give unto him the throne of his father David:"],"41.1.33":["他要作雅各家的王，直到永遠；他的國也沒有窮盡。","他要作雅各家的王，直到永远；他的国也没有穷尽。","And he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end."],"41.1.34":["馬利亞對天使說：我沒有出嫁，怎麼有這事呢？","马利亚对天使说：我没有出嫁，怎么有这事呢？","Then said Mary unto the angel, How shall this be, seeing I know not a man?"],"41.1.35":["天使回答說：聖靈要臨到你身上，至高者的能力要蔭庇你，因此所要生的聖者必稱為神的兒子（或作：所要生的，必稱為聖，稱為神的兒子）。","天使回答说：圣灵要临到你身上，至高者的能力要荫庇你，因此所要生的圣者必称为神的儿子（或作：所要生的，必称为圣，称为神的儿子）。","And the angel answered and said unto her, The Holy Ghost shall come upon thee, and the power of the Highest shall overshadow thee: therefore also that holy thing which shall be born of thee shall be called the Son of God."],"39.1.18":["耶穌基督降生的事記在下面：他母親馬利亞已經許配了約瑟，還沒有迎娶，馬利亞就從聖靈懷了孕。","耶稣基督降生的事记在下面：他母亲马利亚已经许配了约瑟，还没有迎娶，马利亚就从圣灵怀了孕。","Now the birth of Jesus Christ was on this wise: When as his mother Mary was espoused to Joseph, before they came together, she was found with child of the Holy Ghost."],"39.1.19":["他丈夫約瑟是個義人，不願意明明的羞辱他，想要暗暗的把他休了。","他丈夫约瑟是个义人，不愿意明明的羞辱他，想要暗暗的把他休了。","Then Joseph her husband, being a just [man], and not willing to make her a publick example, was minded to put her away privily."],"39.1.20":["正思念這事的時候，有主的使者向他夢中顯現，說：大衛的子孫約瑟，不要怕！只管娶過你的妻子馬利亞來，因他所懷的孕是從聖靈來的。","正思念这事的时候，有主的使者向他梦中显现，说：大卫的子孙约瑟，不要怕！只管娶过你的妻子马利亚来，因他所怀的孕是从圣灵来的。","But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream, saying, Joseph, thou son of David, fear not to take unto thee Mary thy wife: for that which is conceived in her is of the Holy Ghost."],"39.1.21":["他將要生一個兒子，你要給他起名叫耶穌，因他要將自己的百姓從罪惡裡救出來。","他将要生一个儿子，你要给他起名叫耶稣，因他要将自己的百姓从罪恶里救出来。","And she shall bring forth a son, and thou shalt call his name JESUS: for he shall save his people from their sins."],"39.1.22":["這一切的事成就是要應驗主藉先知所說的話，","这一切的事成就是要应验主藉先知所说的话，","Now all this was done, that it might be fulfilled which was spoken of the Lord by the prophet, saying,"],"39.1.23":["說：必有童女懷孕生子；人要稱他的名為以馬內利。（以馬內利翻出來就是神與我們同在。）","说：必有童女怀孕生子；人要称他的名为以马内利。（以马内利翻出来就是神与我们同在。）","Behold, a virgin shall be with child, and shall bring forth a son, and they shall call his name Emmanuel, which being interpreted is, God with us."],"39.1.24":["約瑟醒了，起來，就遵著主使者的吩咐把妻子娶過來；","约瑟醒了，起来，就遵着主使者的吩咐把妻子娶过来；","Then Joseph being raised from sleep did as the angel of the Lord had bidden him, and took unto him his wife:"],"39.1.25":["只是沒有和他同房，等他生了兒子（有古卷：等他生了頭胎的兒子），就給他起名叫耶穌。","只是没有和他同房，等他生了儿子（有古卷：等他生了头胎的儿子），就给他起名叫耶稣。","And knew her not till she had brought forth her firstborn son: and he called his name JESUS."],"39.2.1":["當希律王的時候，耶穌生在猶太的伯利恆。有幾個博士從東方來到耶路撒冷，說：","当希律王的时候，耶稣生在犹太的伯利恒。有几个博士从东方来到耶路撒冷，说：","Now when Jesus was born in Bethlehem of Judaea in the days of Herod the king, behold, there came wise men from the east to Jerusalem,"],"39.2.2":["那生下來作猶太人之王的在哪裡？我們在東方看見他的星，特來拜他。","那生下来作犹太人之王的在哪里？我们在东方看见他的星，特来拜他。","Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him."],"39.2.3":["希律王聽見了，就心裡不安；耶路撒冷合城的人也都不安。","希律王听见了，就心里不安；耶路撒冷合城的人也都不安。","When Herod the king had heard [these things], he was troubled, and all Jerusalem with him."],"39.2.4":["他就召齊了祭司長和民間的文士，問他們說：基督當生在何處？","他就召齐了祭司长和民间的文士，问他们说：基督当生在何处？","And when he had gathered all the chief priests and scribes of the people together, he demanded of them where Christ should be born."],"39.2.5":["他們回答說：在猶太的伯利恆。因為有先知記著，說：","他们回答说：在犹太的伯利恒。因为有先知记着，说：","And they said unto him, In Bethlehem of Judaea: for thus it is written by the prophet,"],"39.2.6":["猶大地的伯利恆啊，你在猶大諸城中並不是最小的；因為將來有一位君王要從你那裡出來，牧養我以色列民。","犹大地的伯利恒啊，你在犹大诸城中并不是最小的；因为将来有一位君王要从你那里出来，牧养我以色列民。","And thou Bethlehem, [in] the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel."],"39.2.7":["當下，希律暗暗的召了博士來，細問那星是什麼時候出現的，","当下，希律暗暗的召了博士来，细问那星是什么时候出现的，","Then Herod, when he had privily called the wise men, enquired of them diligently what time the star appeared."],"39.2.8":["就差他們往伯利恆去，說：你們去仔細尋訪那小孩子，尋到了，就來報信，我也好去拜他。","就差他们往伯利恒去，说：你们去仔细寻访那小孩子，寻到了，就来报信，我也好去拜他。","And he sent them to Bethlehem, and said, Go and search diligently for the young child; and when ye have found [him], bring me word again, that I may come and worship him also."],"39.2.9":["他們聽見王的話就去了。在東方所看見的那星忽然在他們前頭行，直行到小孩子的地方，就在上頭停住了。","他们听见王的话就去了。在东方所看见的那星忽然在他们前头行，直行到小孩子的地方，就在上头停住了。","When they had heard the king, they departed; and, lo, the star, which they saw in the east, went before them, till it came and stood over where the young child was."],"39.2.10":["他們看見那星，就大大的歡喜；","他们看见那星，就大大的欢喜；","When they saw the star, they rejoiced with exceeding great joy."],"39.2.11":["進了房子，看見小孩子和他母親馬利亞，就俯伏拜那小孩子，揭開寶盒，拿黃金、乳香、沒藥為禮物獻給他。","进了房子，看见小孩子和他母亲马利亚，就俯伏拜那小孩子，揭开宝盒，拿黄金、乳香、没药为礼物献给他。","And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh."],"39.2.12":["博士因為在夢中被主指示不要回去見希律，就從別的路回本地去了。","博士因为在梦中被主指示不要回去见希律，就从别的路回本地去了。","And being warned of God in a dream that they should not return to Herod, they departed into their own country another way."],"39.2.13":["他們去後，有主的使者向約瑟夢中顯現，說：起來！帶著小孩子同他母親逃往埃及，住在那裡，等我吩咐你；因為希律必尋找小孩子，要除滅他。","他们去后，有主的使者向约瑟梦中显现，说：起来！带着小孩子同他母亲逃往埃及，住在那里，等我吩咐你；因为希律必寻找小孩子，要除灭他。","And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him."],"39.2.14":["約瑟就起來，夜間帶著小孩子和他母親往埃及去，","约瑟就起来，夜间带着小孩子和他母亲往埃及去，","When he arose, he took the young child and his mother by night, and departed into Egypt:"],"39.2.15":["住在那裡，直到希律死了。這是要應驗主藉先知所說的話，說：我從埃及召出我的兒子來。","住在那里，直到希律死了。这是要应验主藉先知所说的话，说：我从埃及召出我的儿子来。","And was there until the death of Herod: that it might be fulfilled which was spoken of the Lord by the prophet, saying, Out of Egypt have I called my son."],"39.2.16":["希律見自己被博士愚弄，就大大發怒，差人將伯利恆城裡並四境所有的男孩，照著他向博士仔細查問的時候，凡兩歲以裡的，都殺盡了。","希律见自己被博士愚弄，就大大发怒，差人将伯利恒城里并四境所有的男孩，照着他向博士仔细查问的时候，凡两岁以里的，都杀尽了。","Then Herod, when he saw that he was mocked of the wise men, was exceeding wroth, and sent forth, and slew all the children that were in Bethlehem, and in all the coasts thereof, from two years old and under, according to the time which he had diligently enquired of the wise men."],"39.2.17":["這就應了先知耶利米的話，說：","这就应了先知耶利米的话，说：","Then was fulfilled that which was spoken by Jeremy the prophet, saying,"],"39.2.18":["在拉瑪聽見號咷大哭的聲音，是拉結哭他兒女，不肯受安慰，因為他們都不在了。","在拉玛听见号咷大哭的声音，是拉结哭他儿女，不肯受安慰，因为他们都不在了。","In Rama was there a voice heard, lamentation, and weeping, and great mourning, Rachel weeping [for] her children, and would not be comforted, because they are not."],"39.2.19":["希律死了以後，有主的使者在埃及向約瑟夢中顯現，說：","希律死了以后，有主的使者在埃及向约瑟梦中显现，说：","But when Herod was dead, behold, an angel of the Lord appeareth in a dream to Joseph in Egypt,"],"39.2.20":["起來！帶著小孩子和他母親往以色列地去，因為要害小孩子性命的人已經死了。","起来！带着小孩子和他母亲往以色列地去，因为要害小孩子性命的人已经死了。","Saying, Arise, and take the young child and his mother, and go into the land of Israel: for they are dead which sought the young child's life."],"39.2.21":["約瑟就起來，把小孩子和他母親帶到以色列地去；","约瑟就起来，把小孩子和他母亲带到以色列地去；","And he arose, and took the young child and his mother, and came into the land of Israel."],"39.2.22":["只因聽見亞基老接著他父親希律作了猶太王，就怕往那裡去，又在夢中被主指示，便往加利利境內去了，","只因听见亚基老接着他父亲希律作了犹太王，就怕往那里去，又在梦中被主指示，便往加利利境内去了，","But when he heard that Archelaus did reign in Judaea in the room of his father Herod, he was afraid to go thither: notwithstanding, being warned of God in a dream, he turned aside into the parts of Galilee:"],"39.2.23":["到了一座城，名叫拿撒勒，就住在那裡。這是要應驗先知所說，他將稱為拿撒勒人的話了。","到了一座城，名叫拿撒勒，就住在那里。这是要应验先知所说，他将称为拿撒勒人的话了。","And he came and dwelt in a city called Nazareth: that it might be fulfilled which was spoken by the prophets, He shall be called a Nazarene."],"41.2.40":["孩子漸漸長大，強健起來，充滿智慧，又有神的恩在他身上。","孩子渐渐长大，强健起来，充满智能，又有神的恩在他身上。","And the child grew, and waxed strong in spirit, filled with wisdom: and the grace of God was upon him."],"41.2.41":["每年到逾越節，他父母就上耶路撒冷去。","每年到逾越节，他父母就上耶路撒冷去。","Now his parents went to Jerusalem every year at the feast of the passover."],"41.2.42":["當他十二歲的時候，他們按著節期的規矩上去。","当他十二岁的时候，他们按着节期的规矩上去。","And when he was twelve years old, they went up to Jerusalem after the custom of the feast."],"41.2.43":["守滿了節期，他們回去，孩童耶穌仍舊在耶路撒冷。他的父母並不知道，","守满了节期，他们回去，孩童耶稣仍旧在耶路撒冷。他的父母并不知道，","And when they had fulfilled the days, as they returned, the child Jesus tarried behind in Jerusalem; and Joseph and his mother knew not [of it]."],"41.2.44":["以為他在同行的人中間，走了一天的路程，就在親族和熟識的人中找他，","以为他在同行的人中间，走了一天的路程，就在亲族和熟识的人中找他，","But they, supposing him to have been in the company, went a day's journey; and they sought him among [their] kinsfolk and acquaintance."],"41.2.45":["既找不著，就回耶路撒冷去找他。","既找不着，就回耶路撒冷去找他。","And when they found him not, they turned back again to Jerusalem, seeking him."],"41.2.46":["過了三天，就遇見他在殿裡，坐在教師中間，一面聽，一面問。","过了三天，就遇见他在殿里，坐在教师中间，一面听，一面问。","And it came to pass, that after three days they found him in the temple, sitting in the midst of the doctors, both hearing them, and asking them questions."],"41.2.47":["凡聽見他的，都希奇他的聰明和他的應對。","凡听见他的，都希奇他的聪明和他的应对。","And all that heard him were astonished at his understanding and answers."],"41.2.48":["他父母看見就很希奇。他母親對他說：我兒！為什麼向我們這樣行呢？看哪！你父親和我傷心來找你！","他父母看见就很希奇。他母亲对他说：我儿！为什么向我们这样行呢？看哪！你父亲和我伤心来找你！","And when they saw him, they were amazed: and his mother said unto him, Son, why hast thou thus dealt with us? behold, thy father and I have sought thee sorrowing."],"41.2.49":["耶穌說：為什麼找我呢？豈不知我應當以我父的事為念嗎（或作：豈不知我應當在我父的家裡嗎）？","耶稣说：为什么找我呢？岂不知我应当以我父的事为念吗（或作：岂不知我应当在我父的家里吗）？","And he said unto them, How is it that ye sought me? wist ye not that I must be about my Father's business?"],"41.2.50":["他所說的這話，他們不明白。","他所说的这话，他们不明白。","And they understood not the saying which he spake unto them."],"41.2.51":["他就同他們下去，回到拿撒勒，並且順從他們。他母親把這一切的事都存在心裡。","他就同他们下去，回到拿撒勒，并且顺从他们。他母亲把这一切的事都存在心里。","And he went down with them, and came to Nazareth, and was subject unto them: but his mother kept all these sayings in her heart."],"41.2.52":["耶穌的智慧和身量（或作：年紀），並神和人喜愛他的心，都一齊增長。","耶稣的智能和身量（或作：年纪），并神和人喜爱他的心，都一齐增长。","And Jesus increased in wisdom and stature, and in favour with God and man."],"39.3.13":["當下耶穌從加利利來到約但河，見了約翰，要受他的洗。","当下耶稣从加利利来到约但河，见了约翰，要受他的洗。","Then cometh Jesus from Galilee to Jordan unto John, to be baptized of him."],"39.3.14":["約翰想要攔住他，說：我當受你的洗，你反倒上我這裡來嗎？","约翰想要拦住他，说：我当受你的洗，你反倒上我这里来吗？","But John forbad him, saying, I have need to be baptized of thee, and comest thou to me?"],"39.3.15":["耶穌回答說：你暫且許我，因為我們理當這樣盡諸般的義（或作：禮）。於是約翰許了他。","耶稣回答说：你暂且许我，因为我们理当这样尽诸般的义（或作：礼）。于是约翰许了他。","And Jesus answering said unto him, Suffer [it to be so] now: for thus it becometh us to fulfil all righteousness. Then he suffered him."],"40.1.9":["那時，耶穌從加利利的拿撒勒來，在約但河裡受了約翰的洗。","那时，耶稣从加利利的拿撒勒来，在约但河里受了约翰的洗。","And it came to pass in those days, that Jesus came from Nazareth of Galilee, and was baptized of John in Jordan."],"40.1.10":["他從水裡一上來，就看見天裂開了，聖靈彷彿鴿子，降在他身上。","他从水里一上来，就看见天裂开了，圣灵仿佛鸽子，降在他身上。","And straightway coming up out of the water, he saw the heavens opened, and the Spirit like a dove descending upon him:"],"40.1.11":["又有聲音從天上來，說：你是我的愛子，我喜悅你。","又有声音从天上来，说：你是我的爱子，我喜悦你。","And there came a voice from heaven, [saying], Thou art my beloved Son, in whom I am well pleased."],"39.4.12":["耶穌聽見約翰下了監，就退到加利利去；","耶稣听见约翰下了监，就退到加利利去；","Now when Jesus had heard that John was cast into prison, he departed into Galilee;"],"39.4.13":["後又離開拿撒勒，往迦百農去，就住在那裡。那地方靠海，在西布倫和拿弗他利的邊界上。","后又离开拿撒勒，往迦百农去，就住在那里。那地方靠海，在西布伦和拿弗他利的边界上。","And leaving Nazareth, he came and dwelt in Capernaum, which is upon the sea coast, in the borders of Zabulon and Nephthalim:"],"39.4.14":["這是要應驗先知以賽亞的話，","这是要应验先知以赛亚的话，","That it might be fulfilled which was spoken by Esaias the prophet, saying,"],"39.4.15":["說：西布倫地，拿弗他利地，就是沿海的路，約但河外，外邦人的加利利地。","说：西布伦地，拿弗他利地，就是沿海的路，约但河外，外邦人的加利利地。","The land of Zabulon, and the land of Nephthalim, [by] the way of the sea, beyond Jordan, Galilee of the Gentiles;"],"39.4.16":["那坐在黑暗裡的百姓看見了大光；坐在死蔭之地的人有光發現照著他們。","那坐在黑暗里的百姓看见了大光；坐在死荫之地的人有光发现照着他们。","The people which sat in darkness saw great light; and to them which sat in the region and shadow of death light is sprung up."],"39.4.17":["從那時候，耶穌就傳起道來，說：天國近了，你們應當悔改！","从那时候，耶稣就传起道来，说：天国近了，你们应当悔改！","From that time Jesus began to preach, and to say, Repent: for the kingdom of heaven is at hand."],"40.6.2":["到了安息日，他在會堂裡教訓人。眾人聽見，就甚希奇，說：這人從哪裡有這些事呢？所賜給他的是什麼智慧？他手所做的是何等的異能呢？","到了安息日，他在会堂里教训人。众人听见，就甚希奇，说：这人从哪里有这些事呢？所赐给他的是什么智能？他手所做的是何等的异能呢？","And when the sabbath day was come, he began to teach in the synagogue: and many hearing [him] were astonished, saying, From whence hath this [man] these things? and what wisdom [is] this which is given unto him, that even such mighty works are wrought by his hands?"],"40.6.3":["這不是那木匠嗎？不是馬利亞的兒子雅各、約西、猶大、西門的長兄嗎？他妹妹們不也是在我們這裡嗎？他們就厭棄他（厭棄他：原文是因他跌倒）。","这不是那木匠吗？不是马利亚的儿子雅各、约西、犹大、西门的长兄吗？他妹妹们不也是在我们这里吗？他们就厌弃他（厌弃他：原文是因他跌倒）。","Is not this the carpenter, the son of Mary, the brother of James, and Joses, and of Juda, and Simon? and are not his sisters here with us? And they were offended at him."],"40.6.4":["耶穌對他們說：大凡先知，除了本地、親屬、本家之外，沒有不被人尊敬的。","耶稣对他们说：大凡先知，除了本地、亲属、本家之外，没有不被人尊敬的。","But Jesus said unto them, A prophet is not without honour, but in his own country, and among his own kin, and in his own house."],"39.9.35":["耶穌走遍各城各鄉，在會堂裡教訓人，宣講天國的福音，又醫治各樣的病症。","耶稣走遍各城各乡，在会堂里教训人，宣讲天国的福音，又医治各样的病症。","And Jesus went about all the cities and villages, teaching in their synagogues, and preaching the gospel of the kingdom, and healing every sickness and every disease among the people."],"39.9.36":["他看見許多的人，就憐憫他們；因為他們困苦流離，如同羊沒有牧人一般。","他看见许多的人，就怜悯他们；因为他们困苦流离，如同羊没有牧人一般。","But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd."],"39.9.37":["於是對門徒說：要收的莊稼多，做工的人少。","于是对门徒说：要收的庄稼多，做工的人少。","Then saith he unto his disciples, The harvest truly [is] plenteous, but the labourers [are] few;"],"39.9.38":["所以，你們當求莊稼的主打發工人出去收他的莊稼。","所以，你们当求庄稼的主打发工人出去收他的庄稼。","Pray ye therefore the Lord of the harvest, that he will send forth labourers into his harvest."],"39.17.1":["過了六天，耶穌帶著彼得、雅各，和雅各的兄弟約翰，暗暗的上了高山，","过了六天，耶稣带着彼得、雅各，和雅各的兄弟约翰，暗暗的上了高山，","And after six days Jesus taketh Peter, James, and John his brother, and bringeth them up into an high mountain apart,"],"39.17.2":["就在他們面前變了形像，臉面明亮如日頭，衣裳潔白如光。","就在他们面前变了形像，脸面明亮如日头，衣裳洁白如光。","And was transfigured before them: and his face did shine as the sun, and his raiment was white as the light."],"39.17.3":["忽然，有摩西、以利亞向他們顯現，同耶穌說話。","忽然，有摩西、以利亚向他们显现，同耶稣说话。","And, behold, there appeared unto them Moses and Elias talking with him."],"39.17.4":["彼得對耶穌說：主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。","彼得对耶稣说：主啊，我们在这里真好！你若愿意，我就在这里搭三座棚，一座为你，一座为摩西，一座为以利亚。","Then answered Peter, and said unto Jesus, Lord, it is good for us to be here: if thou wilt, let us make here three tabernacles; one for thee, and one for Moses, and one for Elias."],"39.17.5":["說話之間，忽然有一朵光明的雲彩遮蓋他們，且有聲音從雲彩裡出來，說：這是我的愛子，我所喜悅的。你們要聽他！","说话之间，忽然有一朵光明的云彩遮盖他们，且有声音从云彩里出来，说：这是我的爱子，我所喜悦的。你们要听他！","While he yet spake, behold, a bright cloud overshadowed them: and behold a voice out of the cloud, which said, This is my beloved Son, in whom I am well pleased; hear ye him."],"39.17.6":["門徒聽見，就俯伏在地，極其害怕。","门徒听见，就俯伏在地，极其害怕。","And when the disciples heard [it], they fell on their face, and were sore afraid."],"39.17.7":["耶穌進前來，摸他們，說：起來，不要害怕！","耶稣进前来，摸他们，说：起来，不要害怕！","And Jesus came and touched them, and said, Arise, and be not afraid."],"39.17.8":["他們舉目不見一人，只見耶穌在那裡。","他们举目不见一人，只见耶稣在那里。","And when they had lifted up their eyes, they saw no man, save Jesus only."],"40.9.2":["過了六天，耶穌帶著彼得、雅各、約翰暗暗的上了高山，就在他們面前變了形像，","过了六天，耶稣带着彼得、雅各、约翰暗暗的上了高山，就在他们面前变了形像，","And after six days Jesus taketh [with him] Peter, and James, and John, and leadeth them up into an high mountain apart by themselves: and he was transfigured before them."],"40.9.3":["衣服放光，極其潔白，地上漂布的，沒有一個能漂得那樣白。","衣服放光，极其洁白，地上漂布的，没有一个能漂得那样白。","And his raiment became shining, exceeding white as snow; so as no fuller on earth can white them."],"40.9.4":["忽然，有以利亞同摩西向他們顯現，並且和耶穌說話。","忽然，有以利亚同摩西向他们显现，并且和耶稣说话。","And there appeared unto them Elias with Moses: and they were talking with Jesus."],"40.9.5":["彼得對耶穌說：拉比（就是夫子），我們在這裡真好！可以搭三座棚，一座為你，一座為摩西，一座為以利亞。","彼得对耶稣说：拉比（就是夫子），我们在这里真好！可以搭三座棚，一座为你，一座为摩西，一座为以利亚。","And Peter answered and said to Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias."],"40.9.6":["彼得不知道說什麼才好，因為他們甚是懼怕。","彼得不知道说什么才好，因为他们甚是惧怕。","For he wist not what to say; for they were sore afraid."],"40.9.7":["有一朵雲彩來遮蓋他們；也有聲音從雲彩裡出來，說：這是我的愛子，你們要聽他。","有一朵云彩来遮盖他们；也有声音从云彩里出来，说：这是我的爱子，你们要听他。","And there was a cloud that overshadowed them: and a voice came out of the cloud, saying, This is my beloved Son: hear him."],"40.9.8":["門徒忽然周圍一看，不再見一人，只見耶穌同他們在那裡。","门徒忽然周围一看，不再见一人，只见耶稣同他们在那里。","And suddenly, when they had looked round about, they saw no man any more, save Jesus only with themselves."],"41.9.28":["說了這話以後約有八天，耶穌帶著彼得、約翰、雅各上山去禱告。","说了这话以后约有八天，耶稣带着彼得、约翰、雅各上山去祷告。","And it came to pass about an eight days after these sayings, he took Peter and John and James, and went up into a mountain to pray."],"41.9.29":["正禱告的時候，他的面貌就改變了，衣服潔白放光。","正祷告的时候，他的面貌就改变了，衣服洁白放光。","And as he prayed, the fashion of his countenance was altered, and his raiment [was] white [and] glistering."],"41.9.30":["忽然有摩西、以利亞兩個人同耶穌說話；","忽然有摩西、以利亚两个人同耶稣说话；","And, behold, there talked with him two men, which were Moses and Elias:"],"41.9.31":["他們在榮光裡顯現，談論耶穌去世的事，就是他在耶路撒冷將要成的事。","他们在荣光里显现，谈论耶稣去世的事，就是他在耶路撒冷将要成的事。","Who appeared in glory, and spake of his decease which he should accomplish at Jerusalem."],"41.9.32":["彼得和他的同伴都打盹，既清醒了，就看見耶穌的榮光，並同他站著的那兩個人。","彼得和他的同伴都打盹，既清醒了，就看见耶稣的荣光，并同他站着的那两个人。","But Peter and they that were with him were heavy with sleep: and when they were awake, they saw his glory, and the two men that stood with him."],"41.9.33":["二人正要和耶穌分離的時候，彼得對耶穌說：夫子，我們在這裡真好！可以搭三座棚，一座為你，一座為摩西，一座為以利亞。他卻不知道所說的是什麼。","二人正要和耶稣分离的时候，彼得对耶稣说：夫子，我们在这里真好！可以搭三座棚，一座为你，一座为摩西，一座为以利亚。他却不知道所说的是什么。","And it came to pass, as they departed from him, Peter said unto Jesus, Master, it is good for us to be here: and let us make three tabernacles; one for thee, and one for Moses, and one for Elias: not knowing what he said."],"41.9.34":["說這話的時候，有一朵雲彩來遮蓋他們；他們進入雲彩裡就懼怕。","说这话的时候，有一朵云彩来遮盖他们；他们进入云彩里就惧怕。","While he thus spake, there came a cloud, and overshadowed them: and they feared as they entered into the cloud."],"41.9.35":["有聲音從雲彩裡出來，說：這是我的兒子，我所揀選的（有古卷：這是我的愛子），你們要聽他。","有声音从云彩里出来，说：这是我的儿子，我所拣选的（有古卷：这是我的爱子），你们要听他。","And there came a voice out of the cloud, saying, This is my beloved Son: hear him."],"41.9.36":["聲音住了，只見耶穌一人在那裡。當那些日子，門徒不提所看見的事，一樣也不告訴人。","声音住了，只见耶稣一人在那里。当那些日子，门徒不提所看见的事，一样也不告诉人。","And when the voice was past, Jesus was found alone. And they kept [it] close, and told no man in those days any of those things which they had seen."],"49.2.5":["你們當以基督耶穌的心為心：","你们当以基督耶稣的心为心：","Let this mind be in you, which was also in Christ Jesus:"],"49.2.6":["他本有神的形像，不以自己與神同等為強奪的；","他本有神的形像，不以自己与神同等为强夺的；","Who, being in the form of God, thought it not robbery to be equal with God:"],"49.2.7":["反倒虛己，取了奴僕的形像，成為人的樣式；","反倒虚己，取了奴仆的形像，成为人的样式；","But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of men:"],"49.2.8":["既有人的樣子，就自己卑微，存心順服，以至於死，且死在十字架上。","既有人的样子，就自己卑微，存心顺服，以至于死，且死在十字架上。","And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the cross."],"49.2.9":["所以，神將他升為至高，又賜給他那超乎萬名之上的名，","所以，神将他升为至高，又赐给他那超乎万名之上的名，","Wherefore God also hath highly exalted him, and given him a name which is above every name:"],"49.2.10":["叫一切在天上的、地上的，和地底下的，因耶穌的名無不屈膝，","叫一切在天上的、地上的，和地底下的，因耶稣的名无不屈膝，","That at the name of Jesus every knee should bow, of [things] in heaven, and [things] in earth, and [things] under the earth;"],"49.2.11":["無不口稱耶穌基督為主，使榮耀歸與父神。","无不口称耶稣基督为主，使荣耀归与父神。","And [that] every tongue should confess that Jesus Christ [is] Lord, to the glory of God the Father."],"42.17.1":["耶穌說了這話，就舉目望天，說：父啊，時候到了，願你榮耀你的兒子，使兒子也榮耀你；","耶稣说了这话，就举目望天，说：父啊，时候到了，愿你荣耀你的儿子，使儿子也荣耀你；","These words spake Jesus, and lifted up his eyes to heaven, and said, Father, the hour is come; glorify thy Son, that thy Son also may glorify thee:"],"42.17.2":["正如你曾賜給他權柄管理凡有血氣的，叫他將永生賜給你所賜給他的人。","正如你曾赐给他权柄管理凡有血气的，叫他将永生赐给你所赐给他的人。","As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him."],"42.17.3":["認識你─獨一的真神，並且認識你所差來的耶穌基督，這就是永生。","认识你─独一的真神，并且认识你所差来的耶稣基督，这就是永生。","And this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent."],"42.17.4":["我在地上已經榮耀你，你所託付我的事，我已成全了。","我在地上已经荣耀你，你所托付我的事，我已成全了。","I have glorified thee on the earth: I have finished the work which thou gavest me to do."],"42.17.6":["你從世上賜給我的人，我已將你的名顯明與他們。他們本是你的，你將他們賜給我，他們也遵守了你的道。","你从世上赐给我的人，我已将你的名显明与他们。他们本是你的，你将他们赐给我，他们也遵守了你的道。","I have manifested thy name unto the men which thou gavest me out of the world: thine they were, and thou gavest them me; and they have kept thy word."],"42.17.7":["如今他們知道，凡你所賜給我的，都是從你那裡來的；","如今他们知道，凡你所赐给我的，都是从你那里来的；","Now they have known that all things whatsoever thou hast given me are of thee."],"42.17.8":["因為你所賜給我的道，我已經賜給他們，他們也領受了，又確實知道，我是從你出來的，並且信你差了我來。","因为你所赐给我的道，我已经赐给他们，他们也领受了，又确实知道，我是从你出来的，并且信你差了我来。","For I have given unto them the words which thou gavest me; and they have received [them], and have known surely that I came out from thee, and they have believed that thou didst send me."],"42.17.9":["我為他們祈求，不為世人祈求，卻為你所賜給我的人祈求，因他們本是你的。","我为他们祈求，不为世人祈求，却为你所赐给我的人祈求，因他们本是你的。","I pray for them: I pray not for the world, but for them which thou hast given me; for they are thine."],"42.17.10":["凡是我的，都是你的；你的也是我的，並且我因他們得了榮耀。","凡是我的，都是你的；你的也是我的，并且我因他们得了荣耀。","And all mine are thine, and thine are mine; and I am glorified in them."],"42.17.11":["從今以後，我不在世上，他們卻在世上；我往你那裡去。聖父啊，求你因你所賜給我的名保守他們，叫他們合而為一像我們一樣。","从今以后，我不在世上，他们却在世上；我往你那里去。圣父啊，求你因你所赐给我的名保守他们，叫他们合而为一像我们一样。","And now I am no more in the world, but these are in the world, and I come to thee. Holy Father, keep through thine own name those whom thou hast given me, that they may be one, as we [are]."],"42.17.12":["我與他們同在的時候，因你所賜給我的名保守了他們，我也護衛了他們；其中除了那滅亡之子，沒有一個滅亡的，好叫經上的話得應驗。","我与他们同在的时候，因你所赐给我的名保守了他们，我也护卫了他们；其中除了那灭亡之子，没有一个灭亡的，好叫经上的话得应验。","While I was with them in the world, I kept them in thy name: those that thou gavest me I have kept, and none of them is lost, but the son of perdition; that the scripture might be fulfilled."],"42.17.13":["現在我往你那裡去，我還在世上說這話，是叫他們心裡充滿我的喜樂。","现在我往你那里去，我还在世上说这话，是叫他们心里充满我的喜乐。","And now come I to thee; and these things I speak in the world, that they might have my joy fulfilled in themselves."],"42.17.14":["我已將你的道賜給他們。世界又恨他們；因為他們不屬世界，正如我不屬世界一樣。","我已将你的道赐给他们。世界又恨他们；因为他们不属世界，正如我不属世界一样。","I have given them thy word; and the world hath hated them, because they are not of the world, even as I am not of the world."],"42.17.15":["我不求你叫他們離開世界，只求你保守他們脫離那惡者（或作：脫離罪惡）。","我不求你叫他们离开世界，只求你保守他们脱离那恶者（或作：脱离罪恶）。","I pray not that thou shouldest take them out of the world, but that thou shouldest keep them from the evil."],"42.17.16":["他們不屬世界，正如我不屬世界一樣。","他们不属世界，正如我不属世界一样。","They are not of the world, even as I am not of the world."],"42.17.18":["你怎樣差我到世上，我也照樣差他們到世上。","你怎样差我到世上，我也照样差他们到世上。","As thou hast sent me into the world, even so have I also sent them into the world."],"42.17.19":["我為他們的緣故，自己分別為聖，叫他們也因真理成聖。","我为他们的缘故，自己分别为圣，叫他们也因真理成圣。","And for their sakes I sanctify myself, that they also might be sanctified through the truth."],"42.17.20":["我不但為這些人祈求，也為那些因他們的話信我的人祈求，","我不但为这些人祈求，也为那些因他们的话信我的人祈求，","Neither pray I for these alone, but for them also which shall believe on me through their word;"],"42.17.21":["使他們都合而為一。正如你父在我裡面，我在你裡面，使他們也在我們裡面，叫世人可以信你差了我來。","使他们都合而为一。正如你父在我里面，我在你里面，使他们也在我们里面，叫世人可以信你差了我来。","That they all may be one; as thou, Father, [art] in me, and I in thee, that they also may be one in us: that the world may believe that thou hast sent me."],"42.17.22":["你所賜給我的榮耀，我已賜給他們，使他們合而為一，像我們合而為一。","你所赐给我的荣耀，我已赐给他们，使他们合而为一，像我们合而为一。","And the glory which thou gavest me I have given them; that they may be one, even as we are one:"],"42.17.23":["我在他們裡面，你在我裡面，使他們完完全全的合而為一，叫世人知道你差了我來，也知道你愛他們如同愛我一樣。","我在他们里面，你在我里面，使他们完完全全的合而为一，叫世人知道你差了我来，也知道你爱他们如同爱我一样。","I in them, and thou in me, that they may be made perfect in one; and that the world may know that thou hast sent me, and hast loved them, as thou hast loved me."],"42.17.24":["父啊，我在哪裡，願你所賜給我的人也同我在那裡，叫他們看見你所賜給我的榮耀；因為創立世界以前，你已經愛我了。","父啊，我在哪里，愿你所赐给我的人也同我在那里，叫他们看见你所赐给我的荣耀；因为创立世界以前，你已经爱我了。","Father, I will that they also, whom thou hast given me, be with me where I am; that they may behold my glory, which thou hast given me: for thou lovedst me before the foundation of the world."],"42.17.25":["公義的父啊，世人未曾認識你，我卻認識你；這些人也知道你差了我來。","公义的父啊，世人未曾认识你，我却认识你；这些人也知道你差了我来。","O righteous Father, the world hath not known thee: but I have known thee, and these have known that thou hast sent me."],"42.17.26":["我已將你的名指示他們，還要指示他們，使你所愛我的愛在他們裡面，我也在他們裡面。","我已将你的名指示他们，还要指示他们，使你所爱我的爱在他们里面，我也在他们里面。","And I have declared unto them thy name, and will declare [it]: that the love wherewith thou hast loved me may be in them, and I in them."],"40.14.10":["十二門徒之中，有一個加略人猶大去見祭司長，要把耶穌交給他們。","十二门徒之中，有一个加略人犹大去见祭司长，要把耶稣交给他们。","And Judas Iscariot, one of the twelve, went unto the chief priests, to betray him unto them."],"40.14.11":["他們聽見就歡喜，又應許給他銀子；他就尋思如何得便把耶穌交給他們。","他们听见就欢喜，又应许给他银子；他就寻思如何得便把耶稣交给他们。","And when they heard [it], they were glad, and promised to give him money. And he sought how he might conveniently betray him."],"40.14.12":["除酵節的第一天，就是宰逾越羊羔的那一天，門徒對耶穌說：你吃逾越節的筵席要我們往哪裡去預備呢？","除酵节的第一天，就是宰逾越羊羔的那一天，门徒对耶稣说：你吃逾越节的筵席要我们往哪里去预备呢？","And the first day of unleavened bread, when they killed the passover, his disciples said unto him, Where wilt thou that we go and prepare that thou mayest eat the passover?"],"40.14.13":["耶穌就打發兩個門徒，對他們說：你們進城去，必有人拿著一瓶水迎面而來，你們就跟著他。","耶稣就打发两个门徒，对他们说：你们进城去，必有人拿着一瓶水迎面而来，你们就跟着他。","And he sendeth forth two of his disciples, and saith unto them, Go ye into the city, and there shall meet you a man bearing a pitcher of water: follow him."],"40.14.14":["他進哪家去，你們就對那家的主人說：夫子說：客房在哪裡？我與門徒好在那裡吃逾越節的筵席。","他进哪家去，你们就对那家的主人说：夫子说：客房在哪里？我与门徒好在那里吃逾越节的筵席。","And wheresoever he shall go in, say ye to the goodman of the house, The Master saith, Where is the guestchamber, where I shall eat the passover with my disciples?"],"40.14.15":["他必指給你們擺設整齊的一間大樓，你們就在那裡為我們預備。","他必指给你们摆设整齐的一间大楼，你们就在那里为我们预备。","And he will shew you a large upper room furnished [and] prepared: there make ready for us."],"40.14.16":["門徒出去，進了城，所遇見的正如耶穌所說的。他們就預備了逾越節的筵席。","门徒出去，进了城，所遇见的正如耶稣所说的。他们就预备了逾越节的筵席。","And his disciples went forth, and came into the city, and found as he had said unto them: and they made ready the passover."],"40.14.17":["到了晚上，耶穌和十二個門徒都來了。","到了晚上，耶稣和十二个门徒都来了。","And in the evening he cometh with the twelve."],"40.14.18":["他們坐席正吃的時候，耶穌說：我實在告訴你們，你們中間有一個與我同吃的人要賣我了。","他们坐席正吃的时候，耶稣说：我实在告诉你们，你们中间有一个与我同吃的人要卖我了。","And as they sat and did eat, Jesus said, Verily I say unto you, One of you which eateth with me shall betray me."],"40.14.19":["他們就憂愁起來，一個一個的問他說：是我嗎？","他们就忧愁起来，一个一个的问他说：是我吗？","And they began to be sorrowful, and to say unto him one by one, [Is] it I? and another [said,][ Is] it I?"],"40.14.20":["耶穌對他們說：是十二個門徒中同我蘸手在盤子裡的那個人。","耶稣对他们说：是十二个门徒中同我蘸手在盘子里的那个人。","And he answered and said unto them, [It is] one of the twelve, that dippeth with me in the dish."],"40.14.21":["人子必要去世，正如經上指著他所寫的；但賣人子的人有禍了！那人不生在世上倒好。","人子必要去世，正如经上指着他所写的；但卖人子的人有祸了！那人不生在世上倒好。","The Son of man indeed goeth, as it is written of him: but woe to that man by whom the Son of man is betrayed! good were it for that man if he had never been born."],"40.14.22":["他們吃的時候，耶穌拿起餅來，祝了福，就擘開，遞給他們，說：你們拿著吃，這是我的身體；","他们吃的时候，耶稣拿起饼来，祝了福，就擘开，递给他们，说：你们拿着吃，这是我的身体；","And as they did eat, Jesus took bread, and blessed, and brake [it], and gave to them, and said, Take, eat: this is my body."],"40.14.23":["又拿起杯來，祝謝了，遞給他們；他們都喝了。","又拿起杯来，祝谢了，递给他们；他们都喝了。","And he took the cup, and when he had given thanks, he gave [it] to them: and they all drank of it."],"40.14.24":["耶穌說：這是我立約的血，為多人流出來的。","耶稣说：这是我立约的血，为多人流出来的。","And he said unto them, This is my blood of the new testament, which is shed for many."],"40.14.25":["我實在告訴你們，我不再喝這葡萄汁，直到我在神的國裡喝新的那日子。","我实在告诉你们，我不再喝这葡萄汁，直到我在神的国里喝新的那日子。","Verily I say unto you, I will drink no more of the fruit of the vine, until that day that I drink it new in the kingdom of God."],"40.14.26":["他們唱了詩，就出來，往橄欖山去。","他们唱了诗，就出来，往橄榄山去。","And when they had sung an hymn, they went out into the mount of Olives."],"40.14.27":["耶穌對他們說：你們都要跌倒了，因為經上記著說：我要擊打牧人，羊就分散了。","耶稣对他们说：你们都要跌倒了，因为经上记着说：我要击打牧人，羊就分散了。","And Jesus saith unto them, All ye shall be offended because of me this night: for it is written, I will smite the shepherd, and the sheep shall be scattered."],"40.14.28":["但我復活以後，要在你們以先往加利利去。","但我复活以后，要在你们以先往加利利去。","But after that I am risen, I will go before you into Galilee."],"40.14.29":["彼得說：眾人雖然跌倒，我總不能。","彼得说：众人虽然跌倒，我总不能。","But Peter said unto him, Although all shall be offended, yet [will] not I."],"40.14.30":["耶穌對他說：我實在告訴你，就在今天夜裡，雞叫兩遍以先，你要三次不認我。","耶稣对他说：我实在告诉你，就在今天夜里，鸡叫两遍以先，你要三次不认我。","And Jesus saith unto him, Verily I say unto thee, That this day, [even] in this night, before the cock crow twice, thou shalt deny me thrice."],"40.14.31":["彼得卻極力的說：我就是必須和你同死，也總不能不認你。眾門徒都是這樣說。","彼得却极力的说：我就是必须和你同死，也总不能不认你。众门徒都是这样说。","But he spake the more vehemently, If I should die with thee, I will not deny thee in any wise. Likewise also said they all."],"40.14.32":["他們來到一個地方，名叫客西馬尼。耶穌對門徒說：你們坐在這裡，等我禱告。","他们来到一个地方，名叫客西马尼。耶稣对门徒说：你们坐在这里，等我祷告。","And they came to a place which was named Gethsemane: and he saith to his disciples, Sit ye here, while I shall pray."],"40.14.33":["於是帶著彼得、雅各、約翰同去，就驚恐起來，極其難過，","于是带着彼得、雅各、约翰同去，就惊恐起来，极其难过，","And he taketh with him Peter and James and John, and began to be sore amazed, and to be very heavy;"],"40.14.34":["對他們說：我心裡甚是憂傷，幾乎要死；你們在這裡等候，警醒。","对他们说：我心里甚是忧伤，几乎要死；你们在这里等候，警醒。","And saith unto them, My soul is exceeding sorrowful unto death: tarry ye here, and watch."],"40.14.35":["他就稍往前走，俯伏在地，禱告說：倘若可行，便叫那時候過去。","他就稍往前走，俯伏在地，祷告说：倘若可行，便叫那时候过去。","And he went forward a little, and fell on the ground, and prayed that, if it were possible, the hour might pass from him."],"40.14.36":["他說：阿爸！父啊！在你凡事都能；求你將這杯撤去。然而，不要從我的意思，只要從你的意思。","他说：阿爸！父啊！在你凡事都能；求你将这杯撤去。然而，不要从我的意思，只要从你的意思。","And he said, Abba, Father, all things [are] possible unto thee; take away this cup from me: nevertheless not what I will, but what thou wilt."],"40.14.37":["耶穌回來，見他們睡著了，就對彼得說：西門，你睡覺嗎？不能警醒片時嗎？","耶稣回来，见他们睡着了，就对彼得说：西门，你睡觉吗？不能警醒片时吗？","And he cometh, and findeth them sleeping, and saith unto Peter, Simon, sleepest thou? couldest not thou watch one hour?"],"40.14.38":["總要警醒禱告，免得入了迷惑。你們心靈固然願意，肉體卻軟弱了。","总要警醒祷告，免得入了迷惑。你们心灵固然愿意，肉体却软弱了。","Watch ye and pray, lest ye enter into temptation. The spirit truly [is] ready, but the flesh [is] weak."],"40.14.39":["耶穌又去禱告，說的話還是與先前一樣，","耶稣又去祷告，说的话还是与先前一样，","And again he went away, and prayed, and spake the same words."],"40.14.40":["又來見他們睡著了，因為他們的眼睛甚是困倦；他們也不知道怎麼回答。","又来见他们睡着了，因为他们的眼睛甚是困倦；他们也不知道怎么回答。","And when he returned, he found them asleep again, (for their eyes were heavy,) neither wist they what to answer him."],"40.14.41":["第三次來，對他們說：現在你們仍然睡覺安歇吧（或作嗎？）！夠了，時候到了。看哪，人子被賣在罪人手裡了。","第三次来，对他们说：现在你们仍然睡觉安歇吧（或作吗？）！够了，时候到了。看哪，人子被卖在罪人手里了。","And he cometh the third time, and saith unto them, Sleep on now, and take [your] rest: it is enough, the hour is come; behold, the Son of man is betrayed into the hands of sinners."],"40.14.42":["起來！我們走吧。看哪，那賣我的人近了。","起来！我们走吧。看哪，那卖我的人近了。","Rise up, let us go; lo, he that betrayeth me is at hand."],"40.14.43":["說話之間，忽然那十二個門徒裡的猶大來了，並有許多人帶著刀棒，從祭司長和文士並長老那裡與他同來。","说话之间，忽然那十二个门徒里的犹大来了，并有许多人带着刀棒，从祭司长和文士并长老那里与他同来。","And immediately, while he yet spake, cometh Judas, one of the twelve, and with him a great multitude with swords and staves, from the chief priests and the scribes and the elders."],"40.14.44":["賣耶穌的人曾給他們一個暗號，說：我與誰親嘴，誰就是他。你們把他拿住，牢牢靠靠的帶去。","卖耶稣的人曾给他们一个暗号，说：我与谁亲嘴，谁就是他。你们把他拿住，牢牢靠靠的带去。","And he that betrayed him had given them a token, saying, Whomsoever I shall kiss, that same is he; take him, and lead [him] away safely."],"40.14.45":["猶大來了，隨即到耶穌跟前，說：拉比，便與他親嘴。","犹大来了，随即到耶稣跟前，说：拉比，便与他亲嘴。","And as soon as he was come, he goeth straightway to him, and saith, Master, master; and kissed him."],"40.14.46":["他們就下手拿住他。","他们就下手拿住他。","And they laid their hands on him, and took him."],"40.14.53":["他們把耶穌帶到大祭司那裡，又有眾祭司長和長老並文士都來和大祭司一同聚集。","他们把耶稣带到大祭司那里，又有众祭司长和长老并文士都来和大祭司一同聚集。","And they led Jesus away to the high priest: and with him were assembled all the chief priests and the elders and the scribes."],"40.14.54":["彼得遠遠的跟著耶穌，一直進入大祭司的院裡，和差役一同坐在火光裡烤火。","彼得远远的跟着耶稣，一直进入大祭司的院里，和差役一同坐在火光里烤火。","And Peter followed him afar off, even into the palace of the high priest: and he sat with the servants, and warmed himself at the fire."],"40.14.55":["祭司長和全公會尋找見證控告耶穌，要治死他，卻尋不著。","祭司长和全公会寻找见证控告耶稣，要治死他，却寻不着。","And the chief priests and all the council sought for witness against Jesus to put him to death; and found none."],"40.14.56":["因為有好些人作假見證告他，只是他們的見證各不相合。","因为有好些人作假见证告他，只是他们的见证各不相合。","For many bare false witness against him, but their witness agreed not together."],"40.14.57":["又有幾個人站起來作假見證告他，說：","又有几个人站起来作假见证告他，说：","And there arose certain, and bare false witness against him, saying,"],"40.14.58":["我們聽見他說：我要拆毀這人手所造的殿，三日內就另造一座不是人手所造的。","我们听见他说：我要拆毁这人手所造的殿，三日内就另造一座不是人手所造的。","We heard him say, I will destroy this temple that is made with hands, and within three days I will build another made without hands."],"40.14.59":["他們就是這麼作見證，也是各不相合。","他们就是这么作见证，也是各不相合。","But neither so did their witness agree together."],"40.14.60":["大祭司起來站在中間，問耶穌說：你什麼都不回答嗎？這些人作見證告你的是什麼呢？","大祭司起来站在中间，问耶稣说：你什么都不回答吗？这些人作见证告你的是什么呢？","And the high priest stood up in the midst, and asked Jesus, saying, Answerest thou nothing? what [is it which] these witness against thee?"],"40.14.61":["耶穌卻不言語，一句也不回答。大祭司又問他說：你是那當稱頌者的兒子基督不是？","耶稣却不言语，一句也不回答。大祭司又问他说：你是那当称颂者的儿子基督不是？","But he held his peace, and answered nothing. Again the high priest asked him, and said unto him, Art thou the Christ, the Son of the Blessed?"],"40.14.62":["耶穌說：我是。你們必看見人子坐在那權能者的右邊，駕著天上的雲降臨。","耶稣说：我是。你们必看见人子坐在那权能者的右边，驾着天上的云降临。","And Jesus said, I am: and ye shall see the Son of man sitting on the right hand of power, and coming in the clouds of heaven."],"40.14.63":["大祭司就撕開衣服，說：我們何必再用見證人呢？","大祭司就撕开衣服，说：我们何必再用见证人呢？","Then the high priest rent his clothes, and saith, What need we any further witnesses?"],"40.14.64":["你們已經聽見他這僭妄的話了。你們的意見如何？他們都定他該死的罪。","你们已经听见他这僭妄的话了。你们的意见如何？他们都定他该死的罪。","Ye have heard the blasphemy: what think ye? And they all condemned him to be guilty of death."],"40.14.65":["就有人吐唾沫在他臉上，又蒙著他的臉，用拳頭打他，對他說：你說預言吧！差役接過他來，用手掌打他。","就有人吐唾沫在他脸上，又蒙着他的脸，用拳头打他，对他说：你说预言吧！差役接过他来，用手掌打他。","And some began to spit on him, and to cover his face, and to buffet him, and to say unto him, Prophesy: and the servants did strike him with the palms of their hands."],"40.15.1":["一到早晨，祭司長和長老、文士、全公會的人大家商議，就把耶穌捆綁，解去交給彼拉多。","一到早晨，祭司长和长老、文士、全公会的人大家商议，就把耶稣捆绑，解去交给彼拉多。","And straightway in the morning the chief priests held a consultation with the elders and scribes and the whole council, and bound Jesus, and carried [him] away, and delivered [him] to Pilate."],"40.15.2":["彼拉多問他說：你是猶太人的王嗎？耶穌回答說：你說的是。","彼拉多问他说：你是犹太人的王吗？耶稣回答说：你说的是。","And Pilate asked him, Art thou the King of the Jews? And he answering said unto him, Thou sayest [it]."],"40.15.3":["祭司長告他許多的事。","祭司长告他许多的事。","And the chief priests accused him of many things: but he answered nothing."],"40.15.4":["彼拉多又問他說：你看，他們告你這麼多的事，你什麼都不回答嗎？","彼拉多又问他说：你看，他们告你这么多的事，你什么都不回答吗？","And Pilate asked him again, saying, Answerest thou nothing? behold how many things they witness against thee."],"40.15.5":["耶穌仍不回答，以致彼拉多覺得希奇。","耶稣仍不回答，以致彼拉多觉得希奇。","But Jesus yet answered nothing; so that Pilate marvelled."],"40.15.6":["每逢這節期，巡撫照眾人所求的，釋放一個囚犯給他們。","每逢这节期，巡抚照众人所求的，释放一个囚犯给他们。","Now at [that] feast he released unto them one prisoner, whomsoever they desired."],"40.15.7":["有一個人名叫巴拉巴，和作亂的人一同捆綁。他們作亂的時候，曾殺過人。","有一个人名叫巴拉巴，和作乱的人一同捆绑。他们作乱的时候，曾杀过人。","And there was [one] named Barabbas, [which lay] bound with them that had made insurrection with him, who had committed murder in the insurrection."],"40.15.8":["眾人上去求巡撫，照常例給他們辦。","众人上去求巡抚，照常例给他们办。","And the multitude crying aloud began to desire [him to do] as he had ever done unto them."],"40.15.9":["彼拉多說：你們要我釋放猶太人的王給你們嗎？","彼拉多说：你们要我释放犹太人的王给你们吗？","But Pilate answered them, saying, Will ye that I release unto you the King of the Jews?"],"40.15.10":["他原曉得，祭司長是因為嫉妒才把耶穌解了來。","他原晓得，祭司长是因为嫉妒才把耶稣解了来。","For he knew that the chief priests had delivered him for envy."],"40.15.11":["只是祭司長挑唆眾人，寧可釋放巴拉巴給他們。","只是祭司长挑唆众人，宁可释放巴拉巴给他们。","But the chief priests moved the people, that he should rather release Barabbas unto them."],"40.15.12":["彼拉多又說：那麼樣，你們所稱為猶太人的王，我怎麼辦他呢？","彼拉多又说：那么样，你们所称为犹太人的王，我怎么办他呢？","And Pilate answered and said again unto them, What will ye then that I shall do [unto him] whom ye call the King of the Jews?"],"40.15.13":["他們又喊著說：把他釘十字架！","他们又喊着说：把他钉十字架！","And they cried out again, Crucify him."],"40.15.14":["彼拉多說：為什麼呢？他做了什麼惡事呢？他們便極力的喊著說：把他釘十字架！","彼拉多说：为什么呢？他做了什么恶事呢？他们便极力的喊着说：把他钉十字架！","Then Pilate said unto them, Why, what evil hath he done? And they cried out the more exceedingly, Crucify him."],"40.15.15":["彼拉多要叫眾人喜悅，就釋放巴拉巴給他們，將耶穌鞭打了，交給人釘十字架。","彼拉多要叫众人喜悦，就释放巴拉巴给他们，将耶稣鞭打了，交给人钉十字架。","And [so] Pilate, willing to content the people, released Barabbas unto them, and delivered Jesus, when he had scourged [him], to be crucified."],"40.15.16":["兵丁把耶穌帶進衙門院裡，叫齊了全營的兵。","兵丁把耶稣带进衙门院里，叫齐了全营的兵。","And the soldiers led him away into the hall, called Praetorium; and they call together the whole band."],"40.15.17":["他們給他穿上紫袍，又用荊棘編做冠冕給他戴上，","他们给他穿上紫袍，又用荆棘编做冠冕给他戴上，","And they clothed him with purple, and platted a crown of thorns, and put it about his [head],"],"40.15.18":["就慶賀他說：恭喜，猶太人的王啊！","就庆贺他说：恭喜，犹太人的王啊！","And began to salute him, Hail, King of the Jews!"],"40.15.19":["又拿一根葦子打他的頭，吐唾沫在他臉上，屈膝拜他。","又拿一根苇子打他的头，吐唾沫在他脸上，屈膝拜他。","And they smote him on the head with a reed, and did spit upon him, and bowing [their] knees worshipped him."],"40.15.20":["戲弄完了，就給他脫了紫袍，仍穿上他自己的衣服，帶他出去，要釘十字架。","戏弄完了，就给他脱了紫袍，仍穿上他自己的衣服，带他出去，要钉十字架。","And when they had mocked him, they took off the purple from him, and put his own clothes on him, and led him out to crucify him."],"40.15.21":["有一個古利奈人西門，就是亞力山大和魯孚的父親，從鄉下來，經過那地方，他們就勉強他同去，好背著耶穌的十字架。","有一个古利奈人西门，就是亚力山大和鲁孚的父亲，从乡下来，经过那地方，他们就勉强他同去，好背着耶稣的十字架。","And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross."],"40.15.22":["他們帶耶穌到了各各他地方（各各他翻出來就是髑髏地），","他们带耶稣到了各各他地方（各各他翻出来就是髑髅地），","And they bring him unto the place Golgotha, which is, being interpreted, The place of a skull."],"40.15.23":["拿沒藥調和的酒給耶穌，他卻不受。","拿没药调和的酒给耶稣，他却不受。","And they gave him to drink wine mingled with myrrh: but he received [it] not."],"40.15.24":["於是將他釘在十字架上，拈鬮分他的衣服，看是誰得什麼。","于是将他钉在十字架上，拈阄分他的衣服，看是谁得什么。","And when they had crucified him, they parted his garments, casting lots upon them, what every man should take."],"40.15.25":["釘他在十字架上是巳初的時候。","钉他在十字架上是巳初的时候。","And it was the third hour, and they crucified him."],"18.22.16":["犬類圍著我，惡黨環繞我；他們扎了我的手，我的腳。","犬类围着我，恶党环绕我；他们扎了我的手，我的脚。","For dogs have compassed me: the assembly of the wicked have inclosed me: they pierced my hands and my feet."],"18.22.17":["我的骨頭，我都能數過；他們瞪著眼看我。","我的骨头，我都能数过；他们瞪着眼看我。","I may tell all my bones: they look [and] stare upon me."],"18.22.18":["他們分我的外衣，為我的裡衣拈鬮。","他们分我的外衣，为我的里衣拈阄。","They part my garments among them, and cast lots upon my vesture."],"42.19.38":["這些事以後，有亞利馬太人約瑟，是耶穌的門徒，只因怕猶太人，就暗暗的作門徒。他來求彼拉多，要把耶穌的身體領去。彼拉多允准，他就把耶穌的身體領去了。","这些事以后，有亚利马太人约瑟，是耶稣的门徒，只因怕犹太人，就暗暗的作门徒。他来求彼拉多，要把耶稣的身体领去。彼拉多允准，他就把耶稣的身体领去了。","And after this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave [him] leave. He came therefore, and took the body of Jesus."],"42.19.39":["又有尼哥底母，就是先前夜裡去見耶穌的，帶著沒藥和沉香約有一百斤前來。","又有尼哥底母，就是先前夜里去见耶稣的，带着没药和沉香约有一百斤前来。","And there came also Nicodemus, which at the first came to Jesus by night, and brought a mixture of myrrh and aloes, about an hundred pound [weight]."],"42.19.40":["他們就照猶太人殯葬的規矩，把耶穌的身體用細麻布加上香料裹好了。","他们就照犹太人殡葬的规矩，把耶稣的身体用细麻布加上香料裹好了。","Then took they the body of Jesus, and wound it in linen clothes with the spices, as the manner of the Jews is to bury."],"42.19.41":["在耶穌釘十字架的地方有一個園子，園子裡有一座新墳墓，是從來沒有葬過人的。","在耶稣钉十字架的地方有一个园子，园子里有一座新坟墓，是从来没有葬过人的。","Now in the place where he was crucified there was a garden; and in the garden a new sepulchre, wherein was never man yet laid."],"42.19.42":["只因是猶太人的預備日，又因那墳墓近，他們就把耶穌安放在那裡。","只因是犹太人的预备日，又因那坟墓近，他们就把耶稣安放在那里。","There laid they Jesus therefore because of the Jews' preparation [day]; for the sepulchre was nigh at hand."],"41.23.52":["這人去見彼拉多，求耶穌的身體，","这人去见彼拉多，求耶稣的身体，","This [man] went unto Pilate, and begged the body of Jesus."],"41.23.53":["就取下來，用細麻布裹好，安放在石頭鑿成的墳墓裡；那裡頭從來沒有葬過人。","就取下来，用细麻布裹好，安放在石头凿成的坟墓里；那里头从来没有葬过人。","And he took it down, and wrapped it in linen, and laid it in a sepulchre that was hewn in stone, wherein never man before was laid."],"39.28.1":["安息日將盡，七日的頭一日，天快亮的時候，抹大拉的馬利亞和那個馬利亞來看墳墓。","安息日将尽，七日的头一日，天快亮的时候，抹大拉的马利亚和那个马利亚来看坟墓。","In the end of the sabbath, as it began to dawn toward the first [day] of the week, came Mary Magdalene and the other Mary to see the sepulchre."],"39.28.2":["忽然，地大震動；因為有主的使者從天上下來，把石頭滾開，坐在上面。","忽然，地大震动；因为有主的使者从天上下来，把石头滚开，坐在上面。","And, behold, there was a great earthquake: for the angel of the Lord descended from heaven, and came and rolled back the stone from the door, and sat upon it."],"39.28.3":["他的像貌如同閃電，衣服潔白如雪。","他的像貌如同闪电，衣服洁白如雪。","His countenance was like lightning, and his raiment white as snow:"],"39.28.4":["看守的人就因他嚇得渾身亂戰，甚至和死人一樣。","看守的人就因他吓得浑身乱战，甚至和死人一样。","And for fear of him the keepers did shake, and became as dead [men]."],"39.28.5":["天使對婦女說：不要害怕！我知道你們是尋找那釘十字架的耶穌。","天使对妇女说：不要害怕！我知道你们是寻找那钉十字架的耶稣。","And the angel answered and said unto the women, Fear not ye: for I know that ye seek Jesus, which was crucified."],"39.28.6":["他不在這裡，照他所說的，已經復活了。你們來看安放主的地方。","他不在这里，照他所说的，已经复活了。你们来看安放主的地方。","He is not here: for he is risen, as he said. Come, see the place where the Lord lay."],"39.28.7":["快去告訴他的門徒，說他從死裡復活了，並且在你們以先往加利利去，在那裡你們要見他。看哪，我已經告訴你們了。","快去告诉他的门徒，说他从死里复活了，并且在你们以先往加利利去，在那里你们要见他。看哪，我已经告诉你们了。","And go quickly, and tell his disciples that he is risen from the dead; and, behold, he goeth before you into Galilee; there shall ye see him: lo, I have told you."],"39.28.8":["婦女們就急忙離開墳墓，又害怕，又大大的歡喜，跑去要報給他的門徒。","妇女们就急忙离开坟墓，又害怕，又大大的欢喜，跑去要报给他的门徒。","And they departed quickly from the sepulchre with fear and great joy; and did run to bring his disciples word."],"40.16.1":["過了安息日，抹大拉的馬利亞和雅各的母親馬利亞並撒羅米，買了香膏要去膏耶穌的身體。","过了安息日，抹大拉的马利亚和雅各的母亲马利亚并撒罗米，买了香膏要去膏耶稣的身体。","And when the sabbath was past, Mary Magdalene, and Mary the [mother] of James, and Salome, had bought sweet spices, that they might come and anoint him."],"40.16.2":["七日的第一日清早，出太陽的時候，他們來到墳墓那裡，","七日的第一日清早，出太阳的时候，他们来到坟墓那里，","And very early in the morning the first [day] of the week, they came unto the sepulchre at the rising of the sun."],"42.14.1":["你們心裡不要憂愁；你們信神，也當信我。","你们心里不要忧愁；你们信神，也当信我。","Let not your heart be troubled: ye believe in God, believe also in me."],"42.14.2":["在我父的家裡有許多住處；若是沒有，我就早已告訴你們了。我去原是為你們預備地方去。","在我父的家里有许多住处；若是没有，我就早已告诉你们了。我去原是为你们预备地方去。","In my Father's house are many mansions: if [it were] not [so], I would have told you. I go to prepare a place for you."],"42.14.3":["我若去為你們預備了地方，就必再來接你們到我那裡去，我在哪裡，叫你們也在那裡。","我若去为你们预备了地方，就必再来接你们到我那里去，我在哪里，叫你们也在那里。","And if I go and prepare a place for you, I will come again, and receive you unto myself; that where I am, [there] ye may be also."],"40.16.19":["主耶穌和他們說完了話，後來被接到天上，坐在神的右邊。","主耶稣和他们说完了话，后来被接到天上，坐在神的右边。","So then after the Lord had spoken unto them, he was received up into heaven, and sat on the right hand of God."],"39.18.19":["我又告訴你們，若是你們中間有兩個人在地上同心合意的求什麼事，我在天上的父必為他們成全。","我又告诉你们，若是你们中间有两个人在地上同心合意的求什么事，我在天上的父必为他们成全。","Again I say unto you, That if two of you shall agree on earth as touching any thing that they shall ask, it shall be done for them of my Father which is in heaven."],"39.8.20":["耶穌說：狐狸有洞，天空的飛鳥有窩，人子卻沒有枕頭的地方。","耶稣说：狐狸有洞，天空的飞鸟有窝，人子却没有枕头的地方。","And Jesus saith unto him, The foxes have holes, and the birds of the air [have] nests; but the Son of man hath not where to lay [his] head."],"42.5.18":["所以猶太人越發想要殺他；因他不但犯了安息日，並且稱神為他的父，將自己和神當作平等。","所以犹太人越发想要杀他；因他不但犯了安息日，并且称神为他的父，将自己和神当作平等。","Therefore the Jews sought the more to kill him, because he not only had broken the sabbath, but said also that God was his Father, making himself equal with God."],"42.5.19":["耶穌對他們說：我實實在在的告訴你們，子憑著自己不能做什麼，惟有看見父所做的，子才能做；父所做的事，子也照樣做。","耶稣对他们说：我实实在在的告诉你们，子凭着自己不能做什么，惟有看见父所做的，子才能做；父所做的事，子也照样做。","Then answered Jesus and said unto them, Verily, verily, I say unto you, The Son can do nothing of himself, but what he seeth the Father do: for what things soever he doeth, these also doeth the Son likewise."],"42.5.20":["父愛子，將自己所做的一切事指給他看，還要將比這更大的事指給他看，叫你們希奇。","父爱子，将自己所做的一切事指给他看，还要将比这更大的事指给他看，叫你们希奇。","For the Father loveth the Son, and sheweth him all things that himself doeth: and he will shew him greater works than these, that ye may marvel."],"42.20.31":["但記這些事要叫你們信耶穌是基督，是神的兒子，並且叫你們信了他，就可以因他的名得生命。","但记这些事要叫你们信耶稣是基督，是神的儿子，并且叫你们信了他，就可以因他的名得生命。","But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name."],"57.1.3":["他是神榮耀所發的光輝，是神本體的真像，常用他權能的命令托住萬有。他洗淨了人的罪，就坐在高天至大者的右邊。","他是神荣耀所发的光辉，是神本体的真像，常用他权能的命令托住万有。他洗净了人的罪，就坐在高天至大者的右边。","Who being the brightness of [his] glory, and the express image of his person, and upholding all things by the word of his power, when he had by himself purged our sins, sat down on the right hand of the Majesty on high;"],"57.1.4":["他所承受的名，既比天使的名更尊貴，就遠超過天使。","他所承受的名，既比天使的名更尊贵，就远超过天使。","Being made so much better than the angels, as he hath by inheritance obtained a more excellent name than they."],"57.1.5":["所有的天使，神從來對哪一個說，你是我的兒子，我今日生你？又指著哪一個說：我要作他的父，他要作我的子？","所有的天使，神从来对哪一个说，你是我的儿子，我今日生你？又指着哪一个说：我要作他的父，他要作我的子？","For unto which of the angels said he at any time, Thou art my Son, this day have I begotten thee? And again, I will be to him a Father, and he shall be to me a Son?"],"57.1.6":["再者，神使長子到世上來的時候（或作：神再使長子到世上來的時候），就說：神的使者都要拜他。","再者，神使长子到世上来的时候（或作：神再使长子到世上来的时候），就说：神的使者都要拜他。","And again, when he bringeth in the firstbegotten into the world, he saith, And let all the angels of God worship him."],"57.1.7":["論到使者，又說：神以風為使者，以火焰為僕役；","论到使者，又说：神以风为使者，以火焰为仆役；","And of the angels he saith, Who maketh his angels spirits, and his ministers a flame of fire."],"57.1.8":["論到子卻說：神啊，你的寶座是永永遠遠的；你的國權是正直的。","论到子却说：神啊，你的宝座是永永远远的；你的国权是正直的。","But unto the Son [he saith], Thy throne, O God, [is] for ever and ever: a sceptre of righteousness [is] the sceptre of thy kingdom."],"57.1.9":["你喜愛公義，恨惡罪惡；所以神，就是你的神，用喜樂油膏你，勝過膏你的同伴；","你喜爱公义，恨恶罪恶；所以神，就是你的神，用喜乐油膏你，胜过膏你的同伴；","Thou hast loved righteousness, and hated iniquity; therefore God, [even] thy God, hath anointed thee with the oil of gladness above thy fellows."],"60.1.16":["我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。","我们从前将我们主耶稣基督的大能和他降临的事告诉你们，并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣。","For we have not followed cunningly devised fables, when we made known unto you the power and coming of our Lord Jesus Christ, but were eyewitnesses of his majesty."],"60.1.17":["他從父神得尊貴榮耀的時候，從極大榮光之中有聲音出來，向他說：這是我的愛子，我所喜悅的。","他从父神得尊贵荣耀的时候，从极大荣光之中有声音出来，向他说：这是我的爱子，我所喜悦的。","For he received from God the Father honour and glory, when there came such a voice to him from the excellent glory, This is my beloved Son, in whom I am well pleased."],"39.28.18":["耶穌進前來，對他們說：天上地下所有的權柄都賜給我了。","耶稣进前来，对他们说：天上地下所有的权柄都赐给我了。","And Jesus came and spake unto them, saying, All power is given unto me in heaven and in earth."],"42.6.32":["耶穌說：我實實在在的告訴你們，那從天上來的糧不是摩西賜給你們的，乃是我父將天上來的真糧賜給你們。","耶稣说：我实实在在的告诉你们，那从天上来的粮不是摩西赐给你们的，乃是我父将天上来的真粮赐给你们。","Then Jesus said unto them, Verily, verily, I say unto you, Moses gave you not that bread from heaven; but my Father giveth you the true bread from heaven."],"42.6.33":["因為神的糧就是那從天上降下來、賜生命給世界的。","因为神的粮就是那从天上降下来、赐生命给世界的。","For the bread of God is he which cometh down from heaven, and giveth life unto the world."],"42.6.47":["我實實在在的告訴你們，信的人有永生。","我实实在在的告诉你们，信的人有永生。","Verily, verily, I say unto you, He that believeth on me hath everlasting life."],"42.6.48":["我就是生命的糧。","我就是生命的粮。","I am that bread of life."],"42.6.49":["你們的祖宗在曠野吃過嗎哪，還是死了。","你们的祖宗在旷野吃过吗哪，还是死了。","Your fathers did eat manna in the wilderness, and are dead."],"42.6.50":["這是從天上降下來的糧，叫人吃了就不死。","这是从天上降下来的粮，叫人吃了就不死。","This is the bread which cometh down from heaven, that a man may eat thereof, and not die."],"42.6.51":["我是從天上降下來生命的糧；人若吃這糧，就必永遠活著。我所要賜的糧就是我的肉，為世人之生命所賜的。","我是从天上降下来生命的粮；人若吃这粮，就必永远活着。我所要赐的粮就是我的肉，为世人之生命所赐的。","I am the living bread which came down from heaven: if any man eat of this bread, he shall live for ever: and the bread that I will give is my flesh, which I will give for the life of the world."],"42.6.52":["因此，猶太人彼此爭論說：這個人怎能把他的肉給我們吃呢？","因此，犹太人彼此争论说：这个人怎能把他的肉给我们吃呢？","The Jews therefore strove among themselves, saying, How can this man give us [his] flesh to eat?"],"42.6.53":["耶穌說：我實實在在的告訴你們，你們若不吃人子的肉，不喝人子的血，就沒有生命在你們裡面。","耶稣说：我实实在在的告诉你们，你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面。","Then Jesus said unto them, Verily, verily, I say unto you, Except ye eat the flesh of the Son of man, and drink his blood, ye have no life in you."],"42.6.54":["吃我肉、喝我血的人就有永生，在末日我要叫他復活。","吃我肉、喝我血的人就有永生，在末日我要叫他复活。","Whoso eateth my flesh, and drinketh my blood, hath eternal life; and I will raise him up at the last day."],"42.6.55":["我的肉真是可吃的，我的血真是可喝的。","我的肉真是可吃的，我的血真是可喝的。","For my flesh is meat indeed, and my blood is drink indeed."],"42.6.56":["吃我肉、喝我血的人常在我裡面，我也常在他裡面。","吃我肉、喝我血的人常在我里面，我也常在他里面。","He that eateth my flesh, and drinketh my blood, dwelleth in me, and I in him."],"42.6.57":["永活的父怎樣差我來，我又因父活著；照樣，吃我肉的人也要因我活著。","永活的父怎样差我来，我又因父活着；照样，吃我肉的人也要因我活着。","As the living Father hath sent me, and I live by the Father: so he that eateth me, even he shall live by me."],"42.6.58":["這就是從天上降下來的糧。吃這糧的人就永遠活著，不像你們的祖宗吃過嗎哪還是死了。","这就是从天上降下来的粮。吃这粮的人就永远活着，不像你们的祖宗吃过吗哪还是死了。","This is that bread which came down from heaven: not as your fathers did eat manna, and are dead: he that eateth of this bread shall live for ever."],"42.14.6":["耶穌說我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。","耶稣说我就是道路、真理、生命；若不借着我，没有人能到父那里去。","Jesus saith unto him, I am the way, the truth, and the life: no man cometh unto the Father, but by me."],"53.1.15":["基督耶穌降世，為要拯救罪人。這話是可信的，是十分可佩服的。在罪人中我是個罪魁。","基督耶稣降世，为要拯救罪人。这话是可信的，是十分可佩服的。在罪人中我是个罪魁。","This [is] a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners; of whom I am chief."],"44.8.34":["誰能定他們的罪呢？有基督耶穌已經死了，而且從死裡復活，現今在神的右邊，也替我們祈求（有基督....或作是已經死了，而且從死裡復活，現今在神的右邊，也替我們祈求的基督耶穌嗎）","谁能定他们的罪呢？有基督耶稣已经死了，而且从死里复活，现今在神的右边，也替我们祈求（有基督....或作是已经死了，而且从死里复活，现今在神的右边，也替我们祈求的基督耶稣吗）","Who [is] he that condemneth? [It is] Christ that died, yea rather, that is risen again, who is even at the right hand of God, who also maketh intercession for us."],"53.2.5":["因為只有一位神，在神和人中間，只有一位中保，乃是降世為人的基督耶穌；","因为只有一位神，在神和人中间，只有一位中保，乃是降世为人的基督耶稣；","For [there is] one God, and one mediator between God and men, the man Christ Jesus;"],"42.5.22":["父不審判什麼人，乃將審判的事全交與子，","父不审判什么人，乃将审判的事全交与子，","For the Father judgeth no man, but hath committed all judgment unto the Son:"],"42.5.30":["我憑著自己不能做什麼，我怎麼聽見就怎麼審判。我的審判也是公平的；因為我不求自己的意思，只求那差我來者的意思。","我凭着自己不能做什么，我怎么听见就怎么审判。我的审判也是公平的；因为我不求自己的意思，只求那差我来者的意思。","I can of mine own self do nothing: as I hear, I judge: and my judgment is just; because I seek not mine own will, but the will of the Father which hath sent me."],"43.1.11":["加利利人哪，你們為什麼站著望天呢？這離開你們被接升天的耶穌，你們見他怎樣往天上去，他還要怎樣來。","加利利人哪，你们为什么站着望天呢？这离开你们被接升天的耶稣，你们见他怎样往天上去，他还要怎样来。","Which also said, Ye men of Galilee, why stand ye gazing up into heaven? this same Jesus, which is taken up from you into heaven, shall so come in like manner as ye have seen him go into heaven."],"39.24.36":["但那日子，那時辰，沒有人知道，連天上的使者也不知道，子也不知道，惟獨父知道。","但那日子，那时辰，没有人知道，连天上的使者也不知道，子也不知道，惟独父知道。","But of that day and hour knoweth no [man], no, not the angels of heaven, but my Father only."],"60.3.10":["但主的日子要像賊來到一樣。那日，天必大有響聲廢去，有形質的都要被烈火銷化，地和其上的物都要燒盡了。","但主的日子要像贼来到一样。那日，天必大有响声废去，有形质的都要被烈火销化，地和其上的物都要烧尽了。","But the day of the Lord will come as a thief in the night; in the which the heavens shall pass away with a great noise, and the elements shall melt with fervent heat, the earth also and the works that are therein shall be burned up."],"65.1.7":["看哪，他駕雲降臨！眾目要看見他，連刺他的人也要看見他；地上的萬族都要因他哀哭。這話是真實的。阿們！","看哪，他驾云降临！众目要看见他，连刺他的人也要看见他；地上的万族都要因他哀哭。这话是真实的。阿们！","Behold, he cometh with clouds; and every eye shall see him, and they [also] which pierced him: and all kindreds of the earth shall wail because of him. Even so, Amen."],"39.16.27":["人子要在他父的榮耀裡，同著眾使者降臨；那時候，他要照各人的行為報應各人。","人子要在他父的荣耀里，同着众使者降临；那时候，他要照各人的行为报应各人。","For the Son of man shall come in the glory of his Father with his angels; and then he shall reward every man according to his works."],"39.25.31":["當人子在他榮耀裡、同著眾天使降臨的時候，要坐在他榮耀的寶座上。","当人子在他荣耀里、同着众天使降临的时候，要坐在他荣耀的宝座上。","When the Son of man shall come in his glory, and all the holy angels with him, then shall he sit upon the throne of his glory:"],"39.8.2":["有一個長大痲瘋的來拜他，說：主若肯，必能叫我潔淨了。","有一个长大痲疯的来拜他，说：主若肯，必能叫我洁净了。","And, behold, there came a leper and worshipped him, saying, Lord, if thou wilt, thou canst make me clean."],"39.8.3":["耶穌伸手摸他，說：我肯，你潔淨了吧！他的大痲瘋立刻就潔淨了。","耶稣伸手摸他，说：我肯，你洁净了吧！他的大痲疯立刻就洁净了。","And Jesus put forth [his] hand, and touched him, saying, I will; be thou clean. And immediately his leprosy was cleansed."],"41.7.12":["將近城門，有一個死人被擡出來。這人是他母親獨生的兒子；他母親又是寡婦。有城裡的許多人同著寡婦送殯。","将近城门，有一个死人被擡出来。这人是他母亲独生的儿子；他母亲又是寡妇。有城里的许多人同着寡妇送殡。","Now when he came nigh to the gate of the city, behold, there was a dead man carried out, the only son of his mother, and she was a widow: and much people of the city was with her."],"41.7.13":["主看見那寡婦，就憐憫他，對他說：不要哭！","主看见那寡妇，就怜悯他，对他说：不要哭！","And when the Lord saw her, he had compassion on her, and said unto her, Weep not."],"41.7.14":["於是進前按著槓，擡的人就站住了。耶穌說：少年人，我吩咐你，起來！","于是进前按着杠，擡的人就站住了。耶稣说：少年人，我吩咐你，起来！","And he came and touched the bier: and they that bare [him] stood still. And he said, Young man, I say unto thee, Arise."],"41.7.15":["那死人就坐起，並且說話。耶穌便把他交給他母親。","那死人就坐起，并且说话。耶稣便把他交给他母亲。","And he that was dead sat up, and began to speak. And he delivered him to his mother."],"39.8.23":["耶穌上了船，門徒跟著他。","耶稣上了船，门徒跟着他。","And when he was entered into a ship, his disciples followed him."],"39.8.24":["海裡忽然起了暴風，甚至船被波浪掩蓋；耶穌卻睡著了。","海里忽然起了暴风，甚至船被波浪掩盖；耶稣却睡着了。","And, behold, there arose a great tempest in the sea, insomuch that the ship was covered with the waves: but he was asleep."],"39.8.25":["門徒來叫醒了他，說：主啊，救我們，我們喪命啦！","门徒来叫醒了他，说：主啊，救我们，我们丧命啦！","And his disciples came to [him], and awoke him, saying, Lord, save us: we perish."],"39.8.26":["耶穌說：你們這小信的人哪，為什麼膽怯呢？於是起來，斥責風和海，風和海就大大的平靜了。","耶稣说：你们这小信的人哪，为什么胆怯呢？于是起来，斥责风和海，风和海就大大的平静了。","And he saith unto them, Why are ye fearful, O ye of little faith? Then he arose, and rebuked the winds and the sea; and there was a great calm."],"39.9.18":["耶穌說這話的時候，有一個管會堂的來拜他，說：我女兒剛才死了，求你去按手在他身上，他就必活了。","耶稣说这话的时候，有一个管会堂的来拜他，说：我女儿刚才死了，求你去按手在他身上，他就必活了。","While he spake these things unto them, behold, there came a certain ruler, and worshipped him, saying, My daughter is even now dead: but come and lay thy hand upon her, and she shall live."],"39.9.23":["耶穌到了管會堂的家裡，看見有吹手，又有許多人亂嚷，","耶稣到了管会堂的家里，看见有吹手，又有许多人乱嚷，","And when Jesus came into the ruler's house, and saw the minstrels and the people making a noise,"],"39.9.24":["就說：退去吧！這閨女不是死了，是睡著了。他們就嗤笑他。","就说：退去吧！这闺女不是死了，是睡着了。他们就嗤笑他。","He said unto them, Give place: for the maid is not dead, but sleepeth. And they laughed him to scorn."],"39.9.25":["眾人既被攆出，耶穌就進去，拉著閨女的手，閨女便起來了。","众人既被撵出，耶稣就进去，拉着闺女的手，闺女便起来了。","But when the people were put forth, he went in, and took her by the hand, and the maid arose."],"39.14.15":["天將晚的時候，門徒進前來，說：這是野地，時候已經過了，請叫眾人散開，他們好往村子裡去，自己買吃的。","天将晚的时候，门徒进前来，说：这是野地，时候已经过了，请叫众人散开，他们好往村子里去，自己买吃的。","And when it was evening, his disciples came to him, saying, This is a desert place, and the time is now past; send the multitude away, that they may go into the villages, and buy themselves victuals."],"39.14.16":["耶穌說：不用他們去，你們給他們吃吧！","耶稣说：不用他们去，你们给他们吃吧！","But Jesus said unto them, They need not depart; give ye them to eat."],"39.14.17":["門徒說：我們這裡只有五個餅，兩條魚。","门徒说：我们这里只有五个饼，两条鱼。","And they say unto him, We have here but five loaves, and two fishes."],"39.14.18":["耶穌說：拿過來給我。","耶稣说：拿过来给我。","He said, Bring them hither to me."],"39.14.19":["於是吩咐眾人坐在草地上，就拿著這五個餅，兩條魚，望著天祝福，擘開餅，遞給門徒，門徒又遞給眾人。","于是吩咐众人坐在草地上，就拿着这五个饼，两条鱼，望着天祝福，擘开饼，递给门徒，门徒又递给众人。","And he commanded the multitude to sit down on the grass, and took the five loaves, and the two fishes, and looking up to heaven, he blessed, and brake, and gave the loaves to [his] disciples, and the disciples to the multitude."],"39.14.20":["他們都吃，並且吃飽了；把剩下的零碎收拾起來，裝滿了十二個籃子。","他们都吃，并且吃饱了；把剩下的零碎收拾起来，装满了十二个篮子。","And they did all eat, and were filled: and they took up of the fragments that remained twelve baskets full."],"39.14.14":["耶穌出來，見有許多的人，就憐憫他們，治好了他們的病人。","耶稣出来，见有许多的人，就怜悯他们，治好了他们的病人。","And Jesus went forth, and saw a great multitude, and was moved with compassion toward them, and he healed their sick."],"39.14.25":["夜裡四更天，耶穌在海面上走，往門徒那裡去。","夜里四更天，耶稣在海面上走，往门徒那里去。","And in the fourth watch of the night Jesus went unto them, walking on the sea."],"39.14.26":["門徒看見他在海面上走，就驚慌了，說：是個鬼怪！便害怕，喊叫起來。","门徒看见他在海面上走，就惊慌了，说：是个鬼怪！便害怕，喊叫起来。","And when the disciples saw him walking on the sea, they were troubled, saying, It is a spirit; and they cried out for fear."],"39.14.27":["耶穌連忙對他們說：你們放心！是我，不要怕！","耶稣连忙对他们说：你们放心！是我，不要怕！","But straightway Jesus spake unto them, saying, Be of good cheer; it is I; be not afraid."],"39.14.28":["彼得說：主，如果是你，請叫我從水面上走到你那裡去。","彼得说：主，如果是你，请叫我从水面上走到你那里去。","And Peter answered him and said, Lord, if it be thou, bid me come unto thee on the water."],"39.14.29":["耶穌說：你來吧。彼得就從船上下去，在水面上走，要到耶穌那裡去；","耶稣说：你来吧。彼得就从船上下去，在水面上走，要到耶稣那里去；","And he said, Come. And when Peter was come down out of the ship, he walked on the water, to go to Jesus."],"39.14.30":["只因見風甚大，就害怕，將要沉下去，便喊著說：主啊，救我！","只因见风甚大，就害怕，将要沉下去，便喊着说：主啊，救我！","But when he saw the wind boisterous, he was afraid; and beginning to sink, he cried, saying, Lord, save me."],"39.14.31":["耶穌趕緊伸手拉住他，說：你這小信的人哪，為什麼疑惑呢？","耶稣赶紧伸手拉住他，说：你这小信的人哪，为什么疑惑呢？","And immediately Jesus stretched forth [his] hand, and caught him, and said unto him, O thou of little faith, wherefore didst thou doubt?"],"39.14.32":["他們上了船，風就住了。","他们上了船，风就住了。","And when they were come into the ship, the wind ceased."],"39.14.33":["在船上的人都拜他，說：你真是神的兒子了。","在船上的人都拜他，说：你真是神的儿子了。","Then they that were in the ship came and worshipped him, saying, Of a truth thou art the Son of God."],"41.17.11":["耶穌往耶路撒冷去，經過撒瑪利亞和加利利。","耶稣往耶路撒冷去，经过撒玛利亚和加利利。","And it came to pass, as he went to Jerusalem, that he passed through the midst of Samaria and Galilee."],"41.17.12":["進入一個村子，有十個長大痲瘋的，迎面而來，遠遠的站著，","进入一个村子，有十个长大痲疯的，迎面而来，远远的站着，","And as he entered into a certain village, there met him ten men that were lepers, which stood afar off:"],"41.17.13":["高聲說：耶穌，夫子，可憐我們吧！","高声说：耶稣，夫子，可怜我们吧！","And they lifted up [their] voices, and said, Jesus, Master, have mercy on us."],"41.17.14":["耶穌看見，就對他們說：你們去把身體給祭司察看。他們去的時候就潔淨了。","耶稣看见，就对他们说：你们去把身体给祭司察看。他们去的时候就洁净了。","And when he saw [them], he said unto them, Go shew yourselves unto the priests. And it came to pass, that, as they went, they were cleansed."],"41.17.15":["內中有一個見自己已經好了，就回來大聲歸榮耀與神，","内中有一个见自己已经好了，就回来大声归荣耀与神，","And one of them, when he saw that he was healed, turned back, and with a loud voice glorified God,"],"41.17.16":["又俯伏在耶穌腳前感謝他；這人是撒瑪利亞人。","又俯伏在耶稣脚前感谢他；这人是撒玛利亚人。","And fell down on [his] face at his feet, giving him thanks: and he was a Samaritan."],"41.17.17":["耶穌說：潔淨了的不是十個人嗎？那九個在哪裡呢？","耶稣说：洁净了的不是十个人吗？那九个在哪里呢？","And Jesus answering said, Were there not ten cleansed? but where [are] the nine?"],"41.17.18":["除了這外族人，再沒有別人回來歸榮耀與神嗎？","除了这外族人，再没有别人回来归荣耀与神吗？","There are not found that returned to give glory to God, save this stranger."],"41.17.19":["就對那人說：起來，走吧！你的信救了你了。","就对那人说：起来，走吧！你的信救了你了。","And he said unto him, Arise, go thy way: thy faith hath made thee whole."],"42.11.39":["耶穌說：你們把石頭挪開。那死人的姊姊馬大對他說：主啊，他現在必是臭了，因為他死了已經四天了。","耶稣说：你们把石头挪开。那死人的姊姊马大对他说：主啊，他现在必是臭了，因为他死了已经四天了。","Jesus said, Take ye away the stone. Martha, the sister of him that was dead, saith unto him, Lord, by this time he stinketh: for he hath been [dead] four days."],"42.11.40":["耶穌說：我不是對你說過，你若信，就必看見神的榮耀嗎？","耶稣说：我不是对你说过，你若信，就必看见神的荣耀吗？","Jesus saith unto her, Said I not unto thee, that, if thou wouldest believe, thou shouldest see the glory of God?"],"42.11.41":["他們就把石頭挪開。耶穌舉目望天，說：父啊，我感謝你，因為你已經聽我。","他们就把石头挪开。耶稣举目望天，说：父啊，我感谢你，因为你已经听我。","Then they took away the stone [from the place] where the dead was laid. And Jesus lifted up [his] eyes, and said, Father, I thank thee that thou hast heard me."],"42.11.42":["我也知道你常聽我，但我說這話是為周圍站著的眾人，叫他們信是你差了我來。","我也知道你常听我，但我说这话是为周围站着的众人，叫他们信是你差了我来。","And I knew that thou hearest me always: but because of the people which stand by I said [it], that they may believe that thou hast sent me."],"42.11.43":["說了這話，就大聲呼叫說：拉撒路出來！","说了这话，就大声调用说：拉撒路出来！","And when he thus had spoken, he cried with a loud voice, Lazarus, come forth."],"42.11.44":["那死人就出來了，手腳裹著布，臉上包著手巾。耶穌對他們說，解開，叫他走！","那死人就出来了，手脚裹着布，脸上包着手巾。耶稣对他们说，解开，叫他走！","And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go."],"42.11.45":["那些來看馬利亞的猶太人見了耶穌所做的事，就多有信他的；","那些来看马利亚的犹太人见了耶稣所做的事，就多有信他的；","Then many of the Jews which came to Mary, and had seen the things which Jesus did, believed on him."],"45.11.23":["我當日傳給你們的，原是從主領受的，就是主耶穌被賣的那一夜，拿起餅來，","我当日传给你们的，原是从主领受的，就是主耶稣被卖的那一夜，拿起饼来，","For I have received of the Lord that which also I delivered unto you, That the Lord Jesus the [same] night in which he was betrayed took bread:"],"45.11.24":["祝謝了，就擘開，說：這是我的身體，為你們捨（有古卷：擘開）的，你們應當如此行，為的是記念我。","祝谢了，就擘开，说：这是我的身体，为你们舍（有古卷：擘开）的，你们应当如此行，为的是记念我。","And when he had given thanks, he brake [it], and said, Take, eat: this is my body, which is broken for you: this do in remembrance of me."],"45.11.25":["飯後，也照樣拿起杯來，說：這杯是用我的血所立的新約，你們每逢喝的時候，要如此行，為的是記念我。","饭后，也照样拿起杯来，说：这杯是用我的血所立的新约，你们每逢喝的时候，要如此行，为的是记念我。","After the same manner also [he took] the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as oft as ye drink [it], in remembrance of me."],"45.11.26":["你們每逢吃這餅，喝這杯，是表明主的死，直等到他來。","你们每逢吃这饼，喝这杯，是表明主的死，直等到他来。","For as often as ye eat this bread, and drink this cup, ye do shew the Lord's death till he come."],"45.11.27":["所以，無論何人，不按理吃主的餅，喝主的杯，就是干犯主的身、主的血了。","所以，无论何人，不按理吃主的饼，喝主的杯，就是干犯主的身、主的血了。","Wherefore whosoever shall eat this bread, and drink [this] cup of the Lord, unworthily, shall be guilty of the body and blood of the Lord."],"45.11.28":["人應當自己省察，然後吃這餅、喝這杯。","人应当自己省察，然后吃这饼、喝这杯。","But let a man examine himself, and so let him eat of [that] bread, and drink of [that] cup."],"45.11.29":["因為人吃喝，若不分辨是主的身體，就是吃喝自己的罪了。","因为人吃喝，若不分辨是主的身体，就是吃喝自己的罪了。","For he that eateth and drinketh unworthily, eateth and drinketh damnation to himself, not discerning the Lord's body."],"59.1.2":["就是照父神的先見被揀選、藉著聖靈得成聖潔，以致順服耶穌基督，又蒙他血所灑的人。願恩惠、平安多多的加給你們。","就是照父神的先见被拣选、借着圣灵得成圣洁，以致顺服耶稣基督，又蒙他血所洒的人。愿恩惠、平安多多的加给你们。","Elect according to the foreknowledge of God the Father, through sanctification of the Spirit, unto obedience and sprinkling of the blood of Jesus Christ: Grace unto you, and peace, be multiplied."],"42.16.7":["然而，我將真情告訴你們，我去是於你們有益的；我若不去，保惠師就不到你們這裡來；我若去，就差他來。","然而，我将真情告诉你们，我去是于你们有益的；我若不去，保惠师就不到你们这里来；我若去，就差他来。","Nevertheless I tell you the truth; It is expedient for you that I go away: for if I go not away, the Comforter will not come unto you; but if I depart, I will send him unto you."],"42.16.8":["他既來了，就要叫世人為罪、為義、為審判，自己責備自己。","他既来了，就要叫世人为罪、为义、为审判，自己责备自己。","And when he is come, he will reprove the world of sin, and of righteousness, and of judgment:"],"42.16.9":["為罪，是因他們不信我；","为罪，是因他们不信我；","Of sin, because they believe not on me;"],"42.16.10":["為義，是因我往父那裡去，你們就不再見我；","为义，是因我往父那里去，你们就不再见我；","Of righteousness, because I go to my Father, and ye see me no more;"],"42.16.11":["為審判，是因這世界的王受了審判。","为审判，是因这世界的王受了审判。","Of judgment, because the prince of this world is judged."],"44.8.14":["因為凡被神的靈引導的，都是神的兒子。","因为凡被神的灵引导的，都是神的儿子。","For as many as are led by the Spirit of God, they are the sons of God."],"44.8.26":["況且我們的軟弱有聖靈幫助，我們本不曉得當怎樣禱告，只是聖靈親自用說不出來的歎息替我們禱告。","况且我们的软弱有圣灵帮助，我们本不晓得当怎样祷告，只是圣灵亲自用说不出来的叹息替我们祷告。","Likewise the Spirit also helpeth our infirmities: for we know not what we should pray for as we ought: but the Spirit itself maketh intercession for us with groanings which cannot be uttered."],"44.8.27":["鑒察人心的，曉得聖靈的意思，因為聖靈照著神的旨意替聖徒祈求。","鉴察人心的，晓得圣灵的意思，因为圣灵照着神的旨意替圣徒祈求。","And he that searcheth the hearts knoweth what [is] the mind of the Spirit, because he maketh intercession for the saints according to [the will of] God."],"47.5.23":["溫柔、節制。這樣的事沒有律法禁止。","温柔、节制。这样的事没有律法禁止。","Meekness, temperance: against such there is no law."],"44.8.9":["如果神的靈住在你們心裡，你們就不屬肉體，乃屬聖靈了。人若沒有基督的靈，就不是屬基督的。","如果神的灵住在你们心里，你们就不属肉体，乃属圣灵了。人若没有基督的灵，就不是属基督的。","But ye are not in the flesh, but in the Spirit, if so be that the Spirit of God dwell in you. Now if any man have not the Spirit of Christ, he is none of his."],"4
