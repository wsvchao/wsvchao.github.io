3.5.32":["我們為這事作見證；神賜給順從之人的聖靈也為這事作見證。","我们为这事作见证；神赐给顺从之人的圣灵也为这事作见证。","And we are his witnesses of these things; and [so is] also the Holy Ghost, whom God hath given to them that obey him."],"44.15.13":["但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心，使你們藉著聖靈的能力大有盼望。","但愿使人有盼望的神，因信将诸般的喜乐、平安充满你们的心，使你们借着圣灵的能力大有盼望。","Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost."],"22.61.1":["主耶和華的靈在我身上；因為耶和華用膏膏我，叫我傳好信息給謙卑的人（或譯：傳福音給貧窮的人），差遣我醫好傷心的人，報告被擄的得釋放，被囚的出監牢；","主耶和华的灵在我身上；因为耶和华用膏膏我，叫我传好信息给谦卑的人（或译：传福音给贫穷的人），差遣我医好伤心的人，报告被掳的得释放，被囚的出监牢；","The Spirit of the Lord GOD [is] upon me; because the LORD hath anointed me to preach good tidings unto the meek; he hath sent me to bind up the brokenhearted, to proclaim liberty to the captives, and the opening of the prison to [them that are] bound;"],"22.61.2":["報告耶和華的恩年，和我們神報仇的日子；安慰一切悲哀的人，","报告耶和华的恩年，和我们神报仇的日子；安慰一切悲哀的人，","To proclaim the acceptable year of the LORD, and the day of vengeance of our God; to comfort all that mourn;"],"41.2.9":["有主的使者站在他們旁邊，主的榮光四面照著他們；牧羊的人就甚懼怕。","有主的使者站在他们旁边，主的荣光四面照着他们；牧羊的人就甚惧怕。","And, lo, the angel of the Lord came upon them, and the glory of the Lord shone round about them: and they were sore afraid."],"41.2.10":["那天使對他們說：不要懼怕！我報給你們大喜的信息，是關乎萬民的；","那天使对他们说：不要惧怕！我报给你们大喜的信息，是关乎万民的；","And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people."],"41.2.11":["因今天在大衛的城裡，為你們生了救主，就是主基督。","因今天在大卫的城里，为你们生了救主，就是主基督。","For unto you is born this day in the city of David a Saviour, which is Christ the Lord."],"41.2.12":["你們要看見一個嬰孩，包著布，臥在馬槽裡，那就是記號了。","你们要看见一个婴孩，包着布，卧在马槽里，那就是记号了。","And this [shall be] a sign unto you; Ye shall find the babe wrapped in swaddling clothes, lying in a manger."],"41.2.13":["忽然，有一大隊天兵同那天使讚美神說：","忽然，有一大队天兵同那天使赞美神说：","And suddenly there was with the angel a multitude of the heavenly host praising God, and saying,"],"41.2.14":["在至高之處榮耀歸與神！在地上平安歸與他所喜悅的人（有古卷作：喜悅歸與人）！","在至高之处荣耀归与神！在地上平安归与他所喜悦的人（有古卷作：喜悦归与人）！","Glory to God in the highest, and on earth peace, good will toward men."],"41.2.15":["眾天使離開他們，升天去了。牧羊的人彼此說：我們往伯利恆去，看看所成的事，就是主所指示我們的。","众天使离开他们，升天去了。牧羊的人彼此说：我们往伯利恒去，看看所成的事，就是主所指示我们的。","And it came to pass, as the angels were gone away from them into heaven, the shepherds said one to another, Let us now go even unto Bethlehem, and see this thing which is come to pass, which the Lord hath made known unto us."],"43.1.9":["說了這話，他們正看的時候，他就被取上升，有一朵雲彩把他接去，便看不見他了。","说了这话，他们正看的时候，他就被取上升，有一朵云彩把他接去，便看不见他了。","And when he had spoken these things, while they beheld, he was taken up; and a cloud received him out of their sight."],"43.1.10":["當他往上去，他們定睛望天的時候，忽然有兩個人身穿白衣，站在旁邊，說：","当他往上去，他们定睛望天的时候，忽然有两个人身穿白衣，站在旁边，说：","And while they looked stedfastly toward heaven as he went up, behold, two men stood by them in white apparel;"],"17.38.4":["我立大地根基的時候，你在哪裡呢？你若有聰明，只管說吧！","我立大地根基的时候，你在哪里呢？你若有聪明，只管说吧！","Where wast thou when I laid the foundations of the earth? declare, if thou hast understanding."],"17.38.5":["你若曉得就說，是誰定地的尺度？是誰把準繩拉在其上？","你若晓得就说，是谁定地的尺度？是谁把准绳拉在其上？","Who hath laid the measures thereof, if thou knowest? or who hath stretched the line upon it?"],"17.38.6":["地的根基安置在何處？地的角石是誰安放的？","地的根基安置在何处？地的角石是谁安放的？","Whereupon are the foundations thereof fastened? or who laid the corner stone thereof;"],"17.38.7":["那時，晨星一同歌唱；神的眾子也都歡呼。","那时，晨星一同歌唱；神的众子也都欢呼。","When the morning stars sang together, and all the sons of God shouted for joy?"],"65.5.11":["我又看見且聽見，寶座與活物並長老的周圍有許多天使的聲音；他們的數目有千千萬萬，","我又看见且听见，宝座与活物并长老的周围有许多天使的声音；他们的数目有千千万万，","And I beheld, and I heard the voice of many angels round about the throne and the beasts and the elders: and the number of them was ten thousand times ten thousand, and thousands of thousands;"],"57.1.13":["所有的天使，神從來對哪一個說：你坐在我的右邊，等我使你仇敵作你的腳凳？","所有的天使，神从来对哪一个说：你坐在我的右边，等我使你仇敌作你的脚凳？","But to which of the angels said he at any time, Sit on my right hand, until I make thine enemies thy footstool?"],"57.1.14":["天使豈不都是服役的靈、奉差遣為那將要承受救恩的人效力嗎？","天使岂不都是服役的灵、奉差遣为那将要承受救恩的人效力吗？","Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?"],"18.148.2":["他的眾使者都要讚美他！他的諸軍都要讚美他！","他的众使者都要赞美他！他的诸军都要赞美他！","Praise ye him, all his angels: praise ye him, all his hosts."],"18.148.5":["願這些都讚美耶和華的名！因他一吩咐便都造成。","愿这些都赞美耶和华的名！因他一吩咐便都造成。","Let them praise the name of the LORD: for he commanded, and they were created."],"39.13.41":["人子要差遣使者，把一切叫人跌倒的和作惡的，從他國裡挑出來，","人子要差遣使者，把一切叫人跌倒的和作恶的，从他国里挑出来，","The Son of man shall send forth his angels, and they shall gather out of his kingdom all things that offend, and them which do iniquity;"],"18.103.20":["聽從他命令、成全他旨意、有大能的天使，都要稱頌耶和華！","听从他命令、成全他旨意、有大能的天使，都要称颂耶和华！","Bless the LORD, ye his angels, that excel in strength, that do his commandments, hearkening unto the voice of his word."],"43.8.26":["有主的一個使者對腓利說：起來！向南走，往那從耶路撒冷下迦薩的路上去。那路是曠野。","有主的一个使者对腓利说：起来！向南走，往那从耶路撒冷下迦萨的路上去。那路是旷野。","And the angel of the Lord spake unto Philip, saying, Arise, and go toward the south unto the way that goeth down from Jerusalem unto Gaza, which is desert."],"43.12.23":["希律不歸榮耀給神，所以主的使者立刻罰他，他被蟲所咬，氣就絕了。","希律不归荣耀给神，所以主的使者立刻罚他，他被虫所咬，气就绝了。","And immediately the angel of the Lord smote him, because he gave not God the glory: and he was eaten of worms, and gave up the ghost."],"18.34.7":["耶和華的使者在敬畏他的人四圍安營，搭救他們。","耶和华的使者在敬畏他的人四围安营，搭救他们。","The angel of the LORD encampeth round about them that fear him, and delivereth them."],"18.91.11":["因他要為你吩咐他的使者，在你行的一切道路上保護你。","因他要为你吩咐他的使者，在你行的一切道路上保护你。","For he shall give his angels charge over thee, to keep thee in all thy ways."],"18.91.12":["他們要用手托著你，免得你的腳碰在石頭上。","他们要用手托着你，免得你的脚碰在石头上。","They shall bear thee up in [their] hands, lest thou dash thy foot against a stone."],"39.18.10":["你們要小心，不可輕看這小子裡的一個；我告訴你們，他們的使者在天上，常見我天父的面。（有古卷在此有","你们要小心，不可轻看这小子里的一个；我告诉你们，他们的使者在天上，常见我天父的面。（有古卷在此有","Take heed that ye despise not one of these little ones; for I say unto you, That in heaven their angels do always behold the face of my Father which is in heaven."],"57.2.6":["但有人在經上某處證明說：人算什麼，你竟顧念他？世人算什麼，你竟眷顧他？","但有人在经上某处证明说：人算什么，你竟顾念他？世人算什么，你竟眷顾他？","But one in a certain place testified, saying, What is man, that thou art mindful of him? or the son of man, that thou visitest him?"],"65.12.10":["我聽見在天上有大聲音說：我神的救恩、能力、國度、並他基督的權柄，現在都來到了！因為那在我們神面前晝夜控告我們弟兄的，已經被摔下去了。","我听见在天上有大声音说：我神的救恩、能力、国度、并他基督的权柄，现在都来到了！因为那在我们神面前昼夜控告我们弟兄的，已经被摔下去了。","And I heard a loud voice saying in heaven, Now is come salvation, and strength, and the kingdom of our God, and the power of his Christ: for the accuser of our brethren is cast down, which accused them before our God day and night."],"65.12.11":["弟兄勝過他，是因羔羊的血和自己所見證的道。他們雖至於死，也不愛惜性命。","弟兄胜过他，是因羔羊的血和自己所见证的道。他们虽至于死，也不爱惜性命。","And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death."],"65.12.12":["所以，諸天和住在其中的，你們都快樂吧！只是地與海有禍了！因為魔鬼知道自己的時候不多，就氣忿忿的下到你們那裡去了。","所以，诸天和住在其中的，你们都快乐吧！只是地与海有祸了！因为魔鬼知道自己的时候不多，就气忿忿的下到你们那里去了。","Therefore rejoice, [ye] heavens, and ye that dwell in them. Woe to the inhabiters of the earth and of the sea! for the devil is come down unto you, having great wrath, because he knoweth that he hath but a short time."],"65.12.13":["龍見自己被摔在地上，就逼迫那生男孩子的婦人。","龙见自己被摔在地上，就逼迫那生男孩子的妇人。","And when the dragon saw that he was cast unto the earth, he persecuted the woman which brought forth the man [child]."],"65.12.14":["於是有大鷹的兩個翅膀賜給婦人，叫他能飛到曠野，到自己的地方，躲避那蛇；他在那裡被養活一載二載半載。","于是有大鹰的两个翅膀赐给妇人，叫他能飞到旷野，到自己的地方，躲避那蛇；他在那里被养活一载二载半载。","And to the woman were given two wings of a great eagle, that she might fly into the wilderness, into her place, where she is nourished for a time, and times, and half a time, from the face of the serpent."],"65.12.15":["蛇就在婦人身後，從口中吐出水來，像河一樣，要將婦人沖去。","蛇就在妇人身后，从口中吐出水来，像河一样，要将妇人冲去。","And the serpent cast out of his mouth water as a flood after the woman, that he might cause her to be carried away of the flood."],"65.12.16":["地卻幫助婦人，開口吞了從龍口吐出來的水（原文作河）。","地却帮助妇人，开口吞了从龙口吐出来的水（原文作河）。","And the earth helped the woman, and the earth opened her mouth, and swallowed up the flood which the dragon cast out of his mouth."],"64.1.6":["又有不守本位、離開自己住處的天使，主用鎖鍊把他們永遠拘留在黑暗裡，等候大日的審判。","又有不守本位、离开自己住处的天使，主用锁链把他们永远拘留在黑暗里，等候大日的审判。","And the angels which kept not their first estate, but left their own habitation, he hath reserved in everlasting chains under darkness unto the judgment of the great day."],"45.6.11":["你們中間也有人從前是這樣；但如今你們奉主耶穌基督的名，並藉著我們神的靈，已經洗淨，成聖，稱義了。","你们中间也有人从前是这样；但如今你们奉主耶稣基督的名，并借着我们神的灵，已经洗净，成圣，称义了。","And such were some of you: but ye are washed, but ye are sanctified, but ye are justified in the name of the Lord Jesus, and by the Spirit of our God."],"44.5.18":["如此說來，因一次的過犯，眾人都被定罪；照樣，因一次的義行，眾人也就被稱義得生命了。","如此说来，因一次的过犯，众人都被定罪；照样，因一次的义行，众人也就被称义得生命了。","Therefore as by the offence of one [judgment came] upon all men to condemnation; even so by the righteousness of one [the free gift came] upon all men unto justification of life."],"55.3.7":["好叫我們因他的恩得稱為義，可以憑著永生的盼望成為後嗣（或作：可以憑著盼望承受永生）。","好叫我们因他的恩得称为义，可以凭着永生的盼望成为后嗣（或作：可以凭着盼望承受永生）。","That being justified by his grace, we should be made heirs according to the hope of eternal life."],"47.3.24":["這樣，律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。","这样，律法是我们训蒙的师傅，引我们到基督那里，使我们因信称义。","Wherefore the law was our schoolmaster [to bring us] unto Christ, that we might be justified by faith."],"44.3.24":["如今卻蒙神的恩典，因基督耶穌的救贖，就白白的稱義。","如今却蒙神的恩典，因基督耶稣的救赎，就白白的称义。","Being justified freely by his grace through the redemption that is in Christ Jesus:"],"44.3.25":["神設立耶穌作挽回祭，是憑著耶穌的血，藉著人的信，要顯明神的義；因為他用忍耐的心寬容人先時所犯的罪，","神设立耶稣作挽回祭，是凭着耶稣的血，借着人的信，要显明神的义；因为他用忍耐的心宽容人先时所犯的罪，","Whom God hath set forth [to be] a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past, through the forbearance of God;"],"44.3.26":["好在今時顯明他的義，使人知道他自己為義，也稱信耶穌的人為義。","好在今时显明他的义，使人知道他自己为义，也称信耶稣的人为义。","To declare, [I say], at this time his righteousness: that he might be just, and the justifier of him which believeth in Jesus."],"44.2.13":["（原來在神面前，不是聽律法的為義，乃是行律法的稱義。","（原来在神面前，不是听律法的为义，乃是行律法的称义。","(For not the hearers of the law [are] just before God, but the doers of the law shall be justified."],"58.2.24":["這樣看來，人稱義是因著行為，不是單因著信。","这样看来，人称义是因着行为，不是单因着信。","Ye see then how that by works a man is justified, and not by faith only."],"44.3.20":["所以凡有血氣的，沒有一個因行律法能在神面前稱義，因為律法本是叫人知罪。","所以凡有血气的，没有一个因行律法能在神面前称义，因为律法本是叫人知罪。","Therefore by the deeds of the law there shall no flesh be justified in his sight: for by the law [is] the knowledge of sin."],"44.4.2":["倘若亞伯拉罕是因行為稱義，就有可誇的；只是在神面前並無可誇。","倘若亚伯拉罕是因行为称义，就有可夸的；只是在神面前并无可夸。","For if Abraham were justified by works, he hath [whereof] to glory; but not before God."],"44.4.3":["經上說什麼呢？說：亞伯拉罕信神，這就算為他的義。","经上说什么呢？说：亚伯拉罕信神，这就算为他的义。","For what saith the scripture? Abraham believed God, and it was counted unto him for righteousness."],"44.4.4":["做工的得工價，不算恩典，乃是該得的；","做工的得工价，不算恩典，乃是该得的；","Now to him that worketh is the reward not reckoned of grace, but of debt."],"48.2.9":["也不是出於行為，免得有人自誇。","也不是出于行为，免得有人自夸。","Not of works, lest any man should boast."],"42.10.25":["耶穌回答說：我已經告訴你們，你們不信。我奉我父之名所行的事可以為我作見證；","耶稣回答说：我已经告诉你们，你们不信。我奉我父之名所行的事可以为我作见证；","Jesus answered them, I told you, and ye believed not: the works that I do in my Father's name, they bear witness of me."],"42.15.8":["你們多結果子，我父就因此得榮耀，你們也就是我的門徒了。","你们多结果子，我父就因此得荣耀，你们也就是我的门徒了。","Herein is my Father glorified, that ye bear much fruit; so shall ye be my disciples."],"39.7.21":["凡稱呼我主啊，主啊的人不能都進天國；惟獨遵行我天父旨意的人才能進去。","凡称呼我主啊，主啊的人不能都进天国；惟独遵行我天父旨意的人才能进去。","Not every one that saith unto me, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven."],"44.10.13":["因為凡求告主名的，就必得救。","因为凡求告主名的，就必得救。","For whosoever shall call upon the name of the Lord shall be saved."],"59.5.6":["所以，你們要自卑，服在神大能的手下，到了時候他必叫你們升高。","所以，你们要自卑，服在神大能的手下，到了时候他必叫你们升高。","Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time:"],"59.5.7":["你們要將一切的憂慮卸給神，因為他顧念你們。","你们要将一切的忧虑卸给神，因为他顾念你们。","Casting all your care upon him; for he careth for you."],"54.4.7":["那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。","那美好的仗我已经打过了，当跑的路我已经跑尽了，所信的道我已经守住了。","I have fought a good fight, I have finished [my] course, I have kept the faith:"],"54.4.8":["從此以後，有公義的冠冕為我存留，就是按著公義審判的主到了那日要賜給我的；不但賜給我，也賜給凡愛慕他顯現的人。","从此以后，有公义的冠冕为我存留，就是按着公义审判的主到了那日要赐给我的；不但赐给我，也赐给凡爱慕他显现的人。","Henceforth there is laid up for me a crown of righteousness, which the Lord, the righteous judge, shall give me at that day: and not to me only, but unto all them also that love his appearing."],"44.2.6":["他必照各人的行為報應各人。","他必照各人的行为报应各人。","Who will render to every man according to his deeds:"],"61.3.22":["並且我們一切所求的，就從他得著；因為我們遵守他的命令，行他所喜悅的事。","并且我们一切所求的，就从他得着；因为我们遵守他的命令，行他所喜悦的事。","And whatsoever we ask, we receive of him, because we keep his commandments, and do those things that are pleasing in his sight."],"65.22.12":["看哪，我必快來！賞罰在我，要照各人所行的報應他。","看哪，我必快来！赏罚在我，要照各人所行的报应他。","And, behold, I come quickly; and my reward [is] with me, to give every man according as his work shall be."],"42.14.23":["耶穌回答說：人若愛我，就必遵守我的道；我父也必愛他，並且我們要到他那裡去，與他同住。","耶稣回答说：人若爱我，就必遵守我的道；我父也必爱他，并且我们要到他那里去，与他同住。","Jesus answered and said unto him, If a man love me, he will keep my words: and my Father will love him, and we will come unto him, and make our abode with him."],"42.14.24":["不愛我的人就不遵守我的道。你們所聽見的道不是我的，乃是差我來之父的道。","不爱我的人就不遵守我的道。你们所听见的道不是我的，乃是差我来之父的道。","He that loveth me not keepeth not my sayings: and the word which ye hear is not mine, but the Father's which sent me."],"42.14.25":["我還與你們同住的時候，已將這些話對你們說了。","我还与你们同住的时候，已将这些话对你们说了。","These things have I spoken unto you, being [yet] present with you."],"58.1.22":["只是你們要行道，不要單單聽道，自己欺哄自己。","只是你们要行道，不要单单听道，自己欺哄自己。","But be ye doers of the word, and not hearers only, deceiving your own selves."],"61.2.3":["我們若遵守他的誡命，就曉得是認識他。","我们若遵守他的诫命，就晓得是认识他。","And hereby we do know that we know him, if we keep his commandments."],"61.2.4":["人若說我認識他，卻不遵守他的誡命，便是說謊話的，真理也不在他心裡了。","人若说我认识他，却不遵守他的诫命，便是说谎话的，真理也不在他心里了。","He that saith, I know him, and keepeth not his commandments, is a liar, and the truth is not in him."],"4.6.25":["我們若照耶和華─我們神所吩咐的一切誡命謹守遵行，這就是我們的義了。","我们若照耶和华─我们神所吩咐的一切诫命谨守遵行，这就是我们的义了。","And it shall be our righteousness, if we observe to do all these commandments before the LORD our God, as he hath commanded us."],"41.13.24":["耶穌對眾人說：你們要努力進窄門。我告訴你們，將來有許多人想要進去，卻是不能。","耶稣对众人说：你们要努力进窄门。我告诉你们，将来有许多人想要进去，却是不能。","Strive to enter in at the strait gate: for many, I say unto you, will seek to enter in, and shall not be able."],"42.6.28":["眾人問他說：我們當行什麼，才算做神的工呢？","众人问他说：我们当行什么，才算做神的工呢？","Then said they unto him, What shall we do, that we might work the works of God?"],"42.6.29":["耶穌回答說：信神所差來的，這就是做神的工。","耶稣回答说：信神所差来的，这就是做神的工。","Jesus answered and said unto them, This is the work of God, that ye believe on him whom he hath sent."],"41.6.27":["只是我告訴你們這聽道的人，你們的仇敵，要愛他！恨你們的，要待他好！","只是我告诉你们这听道的人，你们的仇敌，要爱他！恨你们的，要待他好！","But I say unto you which hear, Love your enemies, do good to them which hate you,"],"49.2.14":["凡所行的，都不要發怨言，起爭論，","凡所行的，都不要发怨言，起争论，","Do all things without murmurings and disputings:"],"49.2.15":["使你們無可指摘，誠實無偽，在這彎曲悖謬的世代作神無瑕疵的兒女。你們顯在這世代中，好像明光照耀，","使你们无可指摘，诚实无伪，在这弯曲悖谬的世代作神无瑕疵的儿女。你们显在这世代中，好像明光照耀，","That ye may be blameless and harmless, the sons of God, without rebuke, in the midst of a crooked and perverse nation, among whom ye shine as lights in the world;"],"49.2.16":["將生命的道表明出來，叫我在基督的日子好誇我沒有空跑，也沒有徒勞。","将生命的道表明出来，叫我在基督的日子好夸我没有空跑，也没有徒劳。","Holding forth the word of life; that I may rejoice in the day of Christ, that I have not run in vain, neither laboured in vain."],"41.6.36":["你們要慈悲，像你們的父慈悲一樣。","你们要慈悲，像你们的父慈悲一样。","Be ye therefore merciful, as your Father also is merciful."],"49.2.13":["因為你們立志行事都是神在你們心裡運行，為要成就他的美意。","因为你们立志行事都是神在你们心里运行，为要成就他的美意。","For it is God which worketh in you both to will and to do of [his] good pleasure."],"45.9.27":["我是攻克己身，叫身服我，恐怕我傳福音給別人，自己反被棄絕了。","我是攻克己身，叫身服我，恐怕我传福音给别人，自己反被弃绝了。","But I keep under my body, and bring [it] into subjection: lest that by any means, when I have preached to others, I myself should be a castaway."],"19.25.28":["人不制伏自己的心，好像毀壞的城邑沒有牆垣。","人不制伏自己的心，好像毁坏的城邑没有墙垣。","He that [hath] no rule over his own spirit [is like] a city [that is] broken down, [and] without walls."],"57.13.21":["在各樣善事上成全你們，叫你們遵行他的旨意；又藉著耶穌基督在你們心裡行他所喜悅的事。願榮耀歸給他，直到永永遠遠。阿們！","在各样善事上成全你们，叫你们遵行他的旨意；又借着耶稣基督在你们心里行他所喜悦的事。愿荣耀归给他，直到永永远远。阿们！","Make you perfect in every good work to do his will, working in you that which is wellpleasing in his sight, through Jesus Christ; to whom [be] glory for ever and ever. Amen."],"46.12.9":["他對我說：我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。所以，我更喜歡誇自己的軟弱，好叫基督的能力覆庇我。","他对我说：我的恩典够你用的，因为我的能力是在人的软弱上显得完全。所以，我更喜欢夸自己的软弱，好叫基督的能力覆庇我。","And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me."],"43.15.11":["我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的。","我们得救乃是因主耶稣的恩，和他们一样，这是我们所信的。","But we believe that through the grace of the Lord Jesus Christ we shall be saved, even as they."],"48.1.7":["我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。","我们藉这爱子的血得蒙救赎，过犯得以赦免，乃是照他丰富的恩典。","In whom we have redemption through his blood, the forgiveness of sins, according to the riches of his grace;"],"44.6.14":["罪必不能作你們的主，因你們不在律法之下，乃在恩典之下。","罪必不能作你们的主，因你们不在律法之下，乃在恩典之下。","For sin shall not have dominion over you: for ye are not under the law, but under grace."],"44.6.15":["這卻怎麼樣呢？我們在恩典之下，不在律法之下，就可以犯罪嗎？斷乎不可！","这却怎么样呢？我们在恩典之下，不在律法之下，就可以犯罪吗？断乎不可！","What then? shall we sin, because we are not under the law, but under grace? God forbid."],"44.5.20":["律法本是外添的，叫過犯顯多；只是罪在哪裡顯多，恩典就更顯多了。","律法本是外添的，叫过犯显多；只是罪在哪里显多，恩典就更显多了。","Moreover the law entered, that the offence might abound. But where sin abounded, grace did much more abound:"],"55.2.11":["因為神救眾人的恩典已經顯明出來，","因为神救众人的恩典已经显明出来，","For the grace of God that bringeth salvation hath appeared to all men,"],"54.1.9":["神救了我們，以聖召召我們，不是按我們的行為，乃是按他的旨意和恩典；這恩典是萬古之先，在基督耶穌裡賜給我們的，","神救了我们，以圣召召我们，不是按我们的行为，乃是按他的旨意和恩典；这恩典是万古之先，在基督耶稣里赐给我们的，","Who hath saved us, and called [us] with an holy calling, not according to our works, but according to his own purpose and grace, which was given us in Christ Jesus before the world began,"],"23.31.1":["耶和華說：那時，我必作以色列各家的神；他們必作我的子民。","耶和华说：那时，我必作以色列各家的神；他们必作我的子民。","At the same time, saith the LORD, will I be the God of all the families of Israel, and they shall be my people."],"23.31.2":["耶和華如此說：脫離刀劍的就是以色列人。我使他享安息的時候，他曾在曠野蒙恩。","耶和华如此说：脱离刀剑的就是以色列人。我使他享安息的时候，他曾在旷野蒙恩。","Thus saith the LORD, The people [which were] left of the sword found grace in the wilderness; [even] Israel, when I went to cause him to rest."],"23.31.3":["古時（或譯：從遠方）耶和華向以色列（原文是我）顯現，說：我以永遠的愛愛你，因此我以慈愛吸引你。","古时（或译：从远方）耶和华向以色列（原文是我）显现，说：我以永远的爱爱你，因此我以慈爱吸引你。","The LORD hath appeared of old unto me, [saying], Yea, I have loved thee with an everlasting love: therefore with lovingkindness have I drawn thee."],"42.1.17":["律法本是藉著摩西傳的；恩典和真理都是由耶穌基督來的。","律法本是借着摩西传的；恩典和真理都是由耶稣基督来的。","For the law was given by Moses, [but] grace and truth came by Jesus Christ."],"48.4.7":["我們各人蒙恩，都是照基督所量給各人的恩賜。","我们各人蒙恩，都是照基督所量给各人的恩赐。","But unto every one of us is given grace according to the measure of the gift of Christ."],"54.2.1":["我兒啊，你要在基督耶穌的恩典上剛強起來。","我儿啊，你要在基督耶稣的恩典上刚强起来。","Thou therefore, my son, be strong in the grace that is in Christ Jesus."],"57.4.16":["所以，我們只管坦然無懼的來到施恩的寶座前，為要得憐恤，蒙恩惠，作隨時的幫助。","所以，我们只管坦然无惧的来到施恩的宝座前，为要得怜恤，蒙恩惠，作随时的帮助。","Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need."],"39.6.5":["你們禱告的時候，不可像那假冒為善的人，愛站在會堂裡和十字路口上禱告，故意叫人看見。我實在告訴你們，他們已經得了他們的賞賜。","你们祷告的时候，不可像那假冒为善的人，爱站在会堂里和十字路口上祷告，故意叫人看见。我实在告诉你们，他们已经得了他们的赏赐。","And when thou prayest, thou shalt not be as the hypocrites [are]: for they love to pray standing in the synagogues and in the corners of the streets, that they may be seen of men. Verily I say unto you, They have their reward."],"39.6.6":["你禱告的時候，要進你的內屋，關上門，禱告你在暗中的父；你父在暗中察看，必然報答你。","你祷告的时候，要进你的内屋，关上门，祷告你在暗中的父；你父在暗中察看，必然报答你。","But thou, when thou prayest, enter into thy closet, and when thou hast shut thy door, pray to thy Father which is in secret; and thy Father which seeth in secret shall reward thee openly."],"39.6.7":["你們禱告，不可像外邦人，用許多重複話，他們以為話多了必蒙垂聽。","你们祷告，不可像外邦人，用许多重复话，他们以为话多了必蒙垂听。","But when ye pray, use not vain repetitions, as the heathen [do]: for they think that they shall be heard for their much speaking."],"39.6.8":["你們不可效法他們；因為你們沒有祈求以先，你們所需用的，你們的父早已知道了。","你们不可效法他们；因为你们没有祈求以先，你们所需用的，你们的父早已知道了。","Be not ye therefore like unto them: for your Father knoweth what things ye have need of, before ye ask him."],"39.14.23":["散了眾人以後，他就獨自上山去禱告。到了晚上，只有他一人在那裡。","散了众人以后，他就独自上山去祷告。到了晚上，只有他一人在那里。","And when he had sent the multitudes away, he went up into a mountain apart to pray: and when the evening was come, he was there alone."],"61.5.14":["我們若照他的旨意求什麼，他就聽我們，這是我們向他所存坦然無懼的心。","我们若照他的旨意求什么，他就听我们，这是我们向他所存坦然无惧的心。","And this is the confidence that we have in him, that, if we ask any thing according to his will, he heareth us:"],"40.11.24":["所以我告訴你們，凡你們禱告祈求的，無論是什麼，只要信是得著的，就必得著。","所以我告诉你们，凡你们祷告祈求的，无论是什么，只要信是得着的，就必得着。","Therefore I say unto you, What things soever ye desire, when ye pray, believe that ye receive [them], and ye shall have [them]."],"42.14.13":["你們奉我的名無論求什麼，我必成就，叫父因兒子得榮耀。","你们奉我的名无论求什么，我必成就，叫父因儿子得荣耀。","And whatsoever ye shall ask in my name, that will I do, that the Father may be glorified in the Son."],"48.3.20":["神能照著運行在我們心裡的大力充充足足的成就一切，超過我們所求所想的。","神能照着运行在我们心里的大力充充足足的成就一切，超过我们所求所想的。","Now unto him that is able to do exceeding abundantly above all that we ask or think, according to the power that worketh in us,"],"49.4.19":["我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。","我的神必照他荣耀的丰富，在基督耶稣里，使你们一切所需用的都充足。","But my God shall supply all your need according to his riches in glory by Christ Jesus."],"50.4.2":["你們要恆切禱告，在此警醒感恩。","你们要恒切祷告，在此警醒感恩。","Continue in prayer, and watch in the same with thanksgiving;"],"49.4.6":["應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。","应当一无挂虑，只要凡事借着祷告、祈求，和感谢，将你们所要的告诉神。","Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God."],"58.5.14":["你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。","你们中间有病了的呢，他就该请教会的长老来；他们可以奉主的名用油抹他，为他祷告。","Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:"],"58.5.15":["出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。","出于信心的祈祷要救那病人，主必叫他起来；他若犯了罪，也必蒙赦免。","And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him."],"58.5.16":["所以你們要彼此認罪，互相代求，使你們可以得醫治。義人祈禱所發的力量是大有功效的。","所以你们要彼此认罪，互相代求，使你们可以得医治。义人祈祷所发的力量是大有功效的。","Confess [your] faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much."],"19.28.9":["轉耳不聽律法的，他的祈禱也為可憎。","转耳不听律法的，他的祈祷也为可憎。","He that turneth away his ear from hearing the law, even his prayer [shall be] abomination."],"18.95.6":["來啊，我們要屈身敬拜，在造我們的耶和華面前跪下。","来啊，我们要屈身敬拜，在造我们的耶和华面前跪下。","O come, let us worship and bow down: let us kneel before the LORD our maker."],"40.11.25":["你們站著禱告的時候，若想起有人得罪你們，就當饒恕他，好叫你們在天上的父也饒恕你們的過犯。","你们站着祷告的时候，若想起有人得罪你们，就当饶恕他，好叫你们在天上的父也饶恕你们的过犯。","And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses."],"22.38.1":["那時希西家病得要死，亞摩斯的兒子先知以賽亞去見他，對他說：耶和華如此說：你當留遺命與你的家，因為你必死不能活了。","那时希西家病得要死，亚摩斯的儿子先知以赛亚去见他，对他说：耶和华如此说：你当留遗命与你的家，因为你必死不能活了。","In those days was Hezekiah sick unto death. And Isaiah the prophet the son of Amoz came unto him, and said unto him, Thus saith the LORD, Set thine house in order: for thou shalt die, and not live."],"22.38.2":["希西家就轉臉朝牆，禱告耶和華說：","希西家就转脸朝墙，祷告耶和华说：","Then Hezekiah turned his face toward the wall, and prayed unto the LORD,"],"18.86.5":["主啊，你本為良善，樂意饒恕人，有豐盛的慈愛賜給凡求告你的人。","主啊，你本为良善，乐意饶恕人，有丰盛的慈爱赐给凡求告你的人。","For thou, Lord, [art] good, and ready to forgive; and plenteous in mercy unto all them that call upon thee."],"22.55.7":["惡人當離棄自己的道路；不義的人當除掉自己的意念。歸向耶和華，耶和華就必憐恤他；當歸向我們的神，因為神必廣行赦免。","恶人当离弃自己的道路；不义的人当除掉自己的意念。归向耶和华，耶和华就必怜恤他；当归向我们的神，因为神必广行赦免。","Let the wicked forsake his way, and the unrighteous man his thoughts: and let him return unto the LORD, and he will have mercy upon him; and to our God, for he will abundantly pardon."],"39.18.21":["那時，彼得進前來，對耶穌說：主啊，我弟兄得罪我，我當饒恕他幾次呢？到七次可以嗎？","那时，彼得进前来，对耶稣说：主啊，我弟兄得罪我，我当饶恕他几次呢？到七次可以吗？","Then came Peter to him, and said, Lord, how oft shall my brother sin against me, and I forgive him? till seven times?"],"39.18.22":["耶穌說：我對你說，不是到七次，乃是到七十個七次。","耶稣说：我对你说，不是到七次，乃是到七十个七次。","Jesus saith unto him, I say not unto thee, Until seven times: but, Until seventy times seven."],"41.23.34":["當下耶穌說：父啊！赦免他們；因為他們所做的，他們不曉得。兵丁就拈鬮分他的衣服。","当下耶稣说：父啊！赦免他们；因为他们所做的，他们不晓得。兵丁就拈阄分他的衣服。","Then said Jesus, Father, forgive them; for they know not what they do. And they parted his raiment, and cast lots."],"41.6.37":["你們不要論斷人，就不被論斷；你們不要定人的罪，就不被定罪；你們要饒恕人，就必蒙饒恕（饒恕：原文作釋放）；","你们不要论断人，就不被论断；你们不要定人的罪，就不被定罪；你们要饶恕人，就必蒙饶恕（饶恕：原文作释放）；","Judge not, and ye shall not be judged: condemn not, and ye shall not be condemned: forgive, and ye shall be forgiven:"],"48.4.32":["並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。","并要以恩慈相待，存怜悯的心，彼此饶恕，正如神在基督里饶恕了你们一样。","And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ's sake hath forgiven you."],"43.3.19":["所以，你們當悔改歸正，使你們的罪得以塗抹，這樣，那安舒的日子就必從主面前來到；","所以，你们当悔改归正，使你们的罪得以涂抹，这样，那安舒的日子就必从主面前来到；","Repent ye therefore, and be converted, that your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord;"],"43.3.20":["主也必差遣所預定給你們的基督耶穌降臨。","主也必差遣所预定给你们的基督耶稣降临。","And he shall send Jesus Christ, which before was preached unto you:"],"32.7.19":["必再憐憫我們，將我們的罪孽踏在腳下，又將我們的一切罪投於深海。","必再怜悯我们，将我们的罪孽踏在脚下，又将我们的一切罪投于深海。","He will turn again, he will have compassion upon us; he will subdue our iniquities; and thou wilt cast all their sins into the depths of the sea."],"22.44.22":["我塗抹了你的過犯，像厚雲消散；我塗抹了你的罪惡，如薄雲滅沒。你當歸向我，因我救贖了你。","我涂抹了你的过犯，像厚云消散；我涂抹了你的罪恶，如薄云灭没。你当归向我，因我救赎了你。","I have blotted out, as a thick cloud, thy transgressions, and, as a cloud, thy sins: return unto me; for I have redeemed thee."],"18.103.12":["東離西有多遠，他叫我們的過犯離我們也有多遠！","东离西有多远，他叫我们的过犯离我们也有多远！","As far as the east is from the west, [so] far hath he removed our transgressions from us."],"22.1.18":["耶和華說：你們來，我們彼此辯論。你們的罪雖像硃紅，必變成雪白；雖紅如丹顏，必白如羊毛。","耶和华说：你们来，我们彼此辩论。你们的罪虽像朱红，必变成雪白；虽红如丹颜，必白如羊毛。","Come now, and let us reason together, saith the LORD: though your sins be as scarlet, they shall be as white as snow; though they be red like crimson, they shall be as wool."],"47.4.3":["我們為孩童的時候，受管於世俗小學之下，也是如此。","我们为孩童的时候，受管于世俗小学之下，也是如此。","Even so we, when we were children, were in bondage under the elements of the world:"],"47.4.7":["可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣。","可见，从此以后，你不是奴仆，乃是儿子了；既是儿子，就靠着神为后嗣。","Wherefore thou art no more a servant, but a son; and if a son, then an heir of God through Christ."],"41.19.10":["人子來，為要尋找，拯救失喪的人。","人子来，为要寻找，拯救失丧的人。","For the Son of man is come to seek and to save that which was lost."],"48.2.4":["然而，神既有豐富的憐憫，因他愛我們的大愛，","然而，神既有丰富的怜悯，因他爱我们的大爱，","But God, who is rich in mercy, for his great love wherewith he loved us,"],"48.2.5":["當我們死在過犯中的時候，便叫我們與基督一同活過來。你們得救是本乎恩。","当我们死在过犯中的时候，便叫我们与基督一同活过来。你们得救是本乎恩。","Even when we were dead in sins, hath quickened us together with Christ, (by grace ye are saved;)"],"48.2.6":["他又叫我們與基督耶穌一同復活，一同坐在天上，","他又叫我们与基督耶稣一同复活，一同坐在天上，","And hath raised [us] up together, and made [us] sit together in heavenly [places] in Christ Jesus:"],"48.2.7":["要將他極豐富的恩典，就是他在基督耶穌裡向我們所施的恩慈，顯明給後來的世代看。","要将他极丰富的恩典，就是他在基督耶稣里向我们所施的恩慈，显明给后来的世代看。","That in the ages to come he might shew the exceeding riches of his grace in [his] kindness toward us through Christ Jesus."],"43.4.12":["除他以外，別無拯救；因為在天下人間，沒有賜下別的名，我們可以靠著得救。","除他以外，别无拯救；因为在天下人间，没有赐下别的名，我们可以靠着得救。","Neither is there salvation in any other: for there is none other name under heaven given among men, whereby we must be saved."],"53.4.16":["你要謹慎自己和自己的教訓，要在這些事上恆心；因為這樣行，又能救自己，又能救聽你的人。","你要谨慎自己和自己的教训，要在这些事上恒心；因为这样行，又能救自己，又能救听你的人。","Take heed unto thyself, and unto the doctrine; continue in them: for in doing this thou shalt both save thyself, and them that hear thee."],"22.55.6":["當趁耶和華可尋找的時候尋找他，相近的時候求告他。","当趁耶和华可寻找的时候寻找他，相近的时候求告他。","Seek ye the LORD while he may be found, call ye upon him while he is near:"],"39.19.16":["有一個人來見耶穌，說：夫子（有古卷：良善的夫子），我該做什麼善事才能得永生？","有一个人来见耶稣，说：夫子（有古卷：良善的夫子），我该做什么善事才能得永生？","And, behold, one came and said unto him, Good Master, what good thing shall I do, that I may have eternal life?"],"39.19.17":["耶穌對他說：你為什麼以善事問我呢？只有一位是善的（有古卷：你為什麼稱我是良善的？除了神以外，沒有一個良善的）。你若要進入永生，就當遵守誡命。","耶稣对他说：你为什么以善事问我呢？只有一位是善的（有古卷：你为什么称我是良善的？除了神以外，没有一个良善的）。你若要进入永生，就当遵守诫命。","And he said unto him, Why callest thou me good? [there is] none good but one, [that is], God: but if thou wilt enter into life, keep the commandments."],"39.19.18":["他說：什麼誡命？耶穌說：就是不可殺人；不可姦淫；不可偷盜；不可作假見證；","他说：什么诫命？耶稣说：就是不可杀人；不可奸淫；不可偷盗；不可作假见证；","He saith unto him, Which? Jesus said, Thou shalt do no murder, Thou shalt not commit adultery, Thou shalt not steal, Thou shalt not bear false witness,"],"39.19.19":["當孝敬父母，又當愛人如己。","当孝敬父母，又当爱人如己。","Honour thy father and [thy] mother: and, Thou shalt love thy neighbour as thyself."],"39.24.13":["惟有忍耐到底的，必然得救。","惟有忍耐到底的，必然得救。","But he that shall endure unto the end, the same shall be saved."],"57.3.6":["但基督為兒子，治理神的家；我們若將可誇的盼望和膽量堅持到底，便是他的家了。","但基督为儿子，治理神的家；我们若将可夸的盼望和胆量坚持到底，便是他的家了。","But Christ as a son over his own house; whose house are we, if we hold fast the confidence and the rejoicing of the hope firm unto the end."],"57.3.14":["我們若將起初確實的信心堅持到底，就在基督裡有分了。","我们若将起初确实的信心坚持到底，就在基督里有分了。","For we are made partakers of Christ, if we hold the beginning of our confidence stedfast unto the end;"],"57.10.38":["只是義人（有古卷：我的義人）必因信得生。他若退後，我心裡就不喜歡他。","只是义人（有古卷：我的义人）必因信得生。他若退后，我心里就不喜欢他。","Now the just shall live by faith: but if [any man] draw back, my soul shall have no pleasure in him."],"45.10.12":["所以，自己以為站得穩的，須要謹慎，免得跌倒。","所以，自己以为站得稳的，须要谨慎，免得跌倒。","Wherefore let him that thinketh he standeth take heed lest he fall."],"44.13.11":["再者，你們曉得現今就是該趁早睡醒的時候；因為我們得救，現今比初信的時候更近了。","再者，你们晓得现今就是该趁早睡醒的时候；因为我们得救，现今比初信的时候更近了。","And that, knowing the time, that now [it is] high time to awake out of sleep: for now [is] our salvation nearer than when we believed."],"51.4.3":["神的旨意就是要你們成為聖潔，遠避淫行；","神的旨意就是要你们成为圣洁，远避淫行；","For this is the will of God, [even] your sanctification, that ye should abstain from fornication:"],"53.4.5":["都因神的道和人的祈求成為聖潔了。","都因神的道和人的祈求成为圣洁了。","For it is sanctified by the word of God and prayer."],"51.5.23":["願賜平安的神親自使你們全然成聖！又願你們的靈與魂與身子得蒙保守，在我主耶穌基督降臨的時候，完全無可指摘！","愿赐平安的神亲自使你们全然成圣！又愿你们的灵与魂与身子得蒙保守，在我主耶稣基督降临的时候，完全无可指摘！","And the very God of peace sanctify you wholly; and [I pray God] your whole spirit and soul and body be preserved blameless unto the coming of our Lord Jesus Christ."],"57.2.11":["因那使人成聖的和那些得以成聖的，都是出於一。所以，他稱他們為弟兄也不以為恥，","因那使人成圣的和那些得以成圣的，都是出于一。所以，他称他们为弟兄也不以为耻，","For both he that sanctifieth and they who are sanctified [are] all of one: for which cause he is not ashamed to call them brethren,"],"44.12.4":["正如我們一個身子上有好些肢體，肢體也不都是一樣的用處。","正如我们一个身子上有好些肢体，肢体也不都是一样的用处。","For as we have many members in one body, and all members have not the same office:"],"44.12.5":["我們這許多人，在基督裡成為一身，互相聯絡作肢體，也是如此。","我们这许多人，在基督里成为一身，互相联系作肢体，也是如此。","So we, [being] many, are one body in Christ, and every one members one of another."],"44.12.7":["或作執事，就當專一執事；或作教導的，就當專一教導；","或作执事，就当专一执事；或作教导的，就当专一教导；","Or ministry, [let us wait] on [our] ministering: or he that teacheth, on teaching;"],"44.12.8":["或作勸化的，就當專一勸化；施捨的，就當誠實；治理的，就當殷勤；憐憫人的，就當甘心。","或作劝化的，就当专一劝化；施舍的，就当诚实；治理的，就当殷勤；怜悯人的，就当甘心。","Or he that exhorteth, on exhortation: he that giveth, [let him do it] with simplicity; he that ruleth, with diligence; he that sheweth mercy, with cheerfulness."],"44.12.11":["殷勤不可懶惰。要心裡火熱，常常服事主。","殷勤不可懒惰。要心里火热，常常服事主。","Not slothful in business; fervent in spirit; serving the Lord;"],"44.12.12":["在指望中要喜樂，在患難中要忍耐，禱告要恆切。","在指望中要喜乐，在患难中要忍耐，祷告要恒切。","Rejoicing in hope; patient in tribulation; continuing instant in prayer;"],"44.12.13":["聖徒缺乏要幫補；客要一味的款待。","圣徒缺乏要帮补；客要一味的款待。","Distributing to the necessity of saints; given to hospitality."],"44.12.14":["逼迫你們的，要給他們祝福；只要祝福，不可咒詛。","逼迫你们的，要给他们祝福；只要祝福，不可咒诅。","Bless them which persecute you: bless, and curse not."],"44.12.15":["與喜樂的人要同樂；與哀哭的人要同哭。","与喜乐的人要同乐；与哀哭的人要同哭。","Rejoice with them that do rejoice, and weep with them that weep."],"44.12.16":["要彼此同心；不要志氣高大，倒要俯就卑微的人（人：或作事）；不要自以為聰明。","要彼此同心；不要志气高大，倒要俯就卑微的人（人：或作事）；不要自以为聪明。","[Be] of the same mind one toward another. Mind not high things, but condescend to men of low estate. Be not wise in your own conceits."],"44.12.17":["不要以惡報惡；眾人以為美的事要留心去做。","不要以恶报恶；众人以为美的事要留心去做。","Recompense to no man evil for evil. Provide things honest in the sight of all men."],"44.12.18":["若是能行，總要盡力與眾人和睦。","若是能行，总要尽力与众人和睦。","If it be possible, as much as lieth in you, live peaceably with all men."],"44.12.19":["親愛的弟兄，不要自己伸冤，寧可讓步，聽憑主怒（或作：讓人發怒）；因為經上記著：主說：伸冤在我；我必報應。","亲爱的弟兄，不要自己伸冤，宁可让步，听凭主怒（或作：让人发怒）；因为经上记着：主说：伸冤在我；我必报应。","Dearly beloved, avenge not yourselves, but [rather] give place unto wrath: for it is written, Vengeance [is] mine; I will repay, saith the Lord."],"44.12.20":["所以，你的仇敵若餓了，就給他吃，若渴了，就給他喝；因為你這樣行就是把炭火堆在他的頭上。","所以，你的仇敌若饿了，就给他吃，若渴了，就给他喝；因为你这样行就是把炭火堆在他的头上。","Therefore if thine enemy hunger, feed him; if he thirst, give him drink: for in so doing thou shalt heap coals of fire on his head."],"44.12.21":["你不可為惡所勝，反要以善勝惡。","你不可为恶所胜，反要以善胜恶。","Be not overcome of evil, but overcome evil with good."],"44.13.2":["所以，抗拒掌權的就是抗拒神的命；抗拒的必自取刑罰。","所以，抗拒掌权的就是抗拒神的命；抗拒的必自取刑罚。","Whosoever therefore resisteth the power, resisteth the ordinance of God: and they that resist shall receive to themselves damnation."],"44.13.3":["作官的原不是叫行善的懼怕，乃是叫作惡的懼怕。你願意不懼怕掌權的嗎？你只要行善，就可得他的稱讚；","作官的原不是叫行善的惧怕，乃是叫作恶的惧怕。你愿意不惧怕掌权的吗？你只要行善，就可得他的称赞；","For rulers are not a terror to good works, but to the evil. Wilt thou then not be afraid of the power? do that which is good, and thou shalt have praise of the same:"],"44.13.5":["所以你們必須順服，不但是因為刑罰，也是因為良心。","所以你们必须顺服，不但是因为刑罚，也是因为良心。","Wherefore [ye] must needs be subject, not only for wrath, but also for conscience sake."],"44.13.6":["你們納糧，也為這個緣故；因他們是神的差役，常常特管這事。","你们纳粮，也为这个缘故；因他们是神的差役，常常特管这事。","For for this cause pay ye tribute also: for they are God's ministers, attending continually upon this very thing."],"44.13.9":["像那不可姦淫，不可殺人，不可偷盜，不可貪婪，或有別的誡命，都包在愛人如己這一句話之內了。","像那不可奸淫，不可杀人，不可偷盗，不可贪婪，或有别的诫命，都包在爱人如己这一句话之内了。","For this, Thou shalt not commit adultery, Thou shalt not kill, Thou shalt not steal, Thou shalt not bear false witness, Thou shalt not covet; and if [there be] any other commandment, it is briefly comprehended in this saying, namely, Thou shalt love thy neighbour as thyself."],"44.13.10":["愛是不加害與人的，所以愛就完全了律法。","爱是不加害与人的，所以爱就完全了律法。","Love worketh no ill to his neighbour: therefore love [is] the fulfilling of the law."],"44.13.12":["黑夜已深，白晝將近；我們就當脫去暗昧的行為，帶上光明的兵器。","黑夜已深，白昼将近；我们就当脱去暗昧的行为，带上光明的兵器。","The night is far spent, the day is at hand: let us therefore cast off the works of darkness, and let us put on the armour of light."],"44.13.13":["行事為人要端正，好像行在白晝。不可荒宴醉酒，不可好色邪蕩，不可爭競嫉妒；","行事为人要端正，好像行在白昼。不可荒宴醉酒，不可好色邪荡，不可争竞嫉妒；","Let us walk honestly, as in the day; not in rioting and drunkenness, not in chambering and wantonness, not in strife and envying."],"44.13.14":["總要披戴主耶穌基督，不要為肉體安排，去放縱私慾。","总要披戴主耶稣基督，不要为肉体安排，去放纵私欲。","But put ye on the Lord Jesus Christ, and make not provision for the flesh, to [fulfil] the lusts [thereof]."],"58.3.17":["惟獨從上頭來的智慧，先是清潔，後是和平，溫良柔順，滿有憐憫，多結善果，沒有偏見，沒有假冒。","惟独从上头来的智能，先是清洁，后是和平，温良柔顺，满有怜悯，多结善果，没有偏见，没有假冒。","But the wisdom that is from above is first pure, then peaceable, gentle, [and] easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy."],"58.3.18":["並且使人和平的，是用和平所栽種的義果。","并且使人和平的，是用和平所栽种的义果。","And the fruit of righteousness is sown in peace of them that make peace."],"44.10.4":["律法的總結就是基督，使凡信他的都得著義。","律法的总结就是基督，使凡信他的都得着义。","For Christ [is] the end of the law for righteousness to every one that believeth."],"44.10.5":["摩西寫著說：人若行那出於律法的義，就必因此活著。","摩西写着说：人若行那出于律法的义，就必因此活着。","For Moses describeth the righteousness which is of the law, That the man which doeth those things shall live by them."],"44.10.6":["惟有出於信心的義如此說：你不要心裡說：誰要升到天上去呢？就是要領下基督來；","惟有出于信心的义如此说：你不要心里说：谁要升到天上去呢？就是要领下基督来；","But the righteousness which is of faith speaketh on this wise, Say not in thine heart, Who shall ascend into heaven? (that is, to bring Christ down [from above]:)"],"44.10.7":["誰要下到陰間去呢？就是要領基督從死裡上來。","谁要下到阴间去呢？就是要领基督从死里上来。","Or, Who shall descend into the deep? (that is, to bring up Christ again from the dead.)"],"44.10.8":["他到底怎麼說呢？他說：這道離你不遠，正在你口裡，在你心裡。（就是我們所傳信主的道。）","他到底怎么说呢？他说：这道离你不远，正在你口里，在你心里。（就是我们所传信主的道。）","But what saith it? The word is nigh thee, [even] in thy mouth, and in thy heart: that is, the word of faith, which we preach;"],"44.10.9":["你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救。","你若口里认耶稣为主，心里信神叫他从死里复活，就必得救。","That if thou shalt confess with thy mouth the Lord Jesus, and shalt believe in thine heart that God hath raised him from the dead, thou shalt be saved."],"44.6.18":["你們既從罪裡得了釋放，就作了義的奴僕。","你们既从罪里得了释放，就作了义的奴仆。","Being then made free from sin, ye became the servants of righteousness."],"44.6.19":["我因你們肉體的軟弱，就照人的常話對你們說。你們從前怎樣將肢體獻給不潔不法作奴僕，以至於不法；現今也要照樣將肢體獻給義作奴僕，以至於成聖。","我因你们肉体的软弱，就照人的常话对你们说。你们从前怎样将肢体献给不洁不法作奴仆，以至于不法；现今也要照样将肢体献给义作奴仆，以至于成圣。","I speak after the manner of men because of the infirmity of your flesh: for as ye have yielded your members servants to uncleanness and to iniquity unto iniquity; even so now yield your members servants to righteousness unto holiness."],"44.6.20":["因為你們作罪之奴僕的時候，就不被義約束了。","因为你们作罪之奴仆的时候，就不被义约束了。","For when ye were the servants of sin, ye were free from righteousness."],"18.103.1":["（大衛的詩。）我的心哪，你要稱頌耶和華！凡在我裡面的，也要稱頌他的聖名！","（大卫的诗。）我的心哪，你要称颂耶和华！凡在我里面的，也要称颂他的圣名！","[A Psalm] of David. Bless the LORD, O my soul: and all that is within me, [bless] his holy name."],"18.103.2":["我的心哪，你要稱頌耶和華！不可忘記他的一切恩惠！","我的心哪，你要称颂耶和华！不可忘记他的一切恩惠！","Bless the LORD, O my soul, and forget not all his benefits:"],"18.103.3":["他赦免你的一切罪孽，醫治你的一切疾病。","他赦免你的一切罪孽，医治你的一切疾病。","Who forgiveth all thine iniquities; who healeth all thy diseases;"],"18.103.4":["他救贖你的命脫離死亡，以仁愛和慈悲為你的冠冕。","他救赎你的命脱离死亡，以仁爱和慈悲为你的冠冕。","Who redeemeth thy life from destruction; who crowneth thee with lovingkindness and tender mercies;"],"18.103.5":["他用美物使你所願的得以知足，以致你如鷹返老還童。","他用美物使你所愿的得以知足，以致你如鹰返老还童。","Who satisfieth thy mouth with good [things; so that] thy youth is renewed like the eagle's."],"18.103.6":["耶和華施行公義，為一切受屈的人伸冤。","耶和华施行公义，为一切受屈的人伸冤。","The LORD executeth righteousness and judgment for all that are oppressed."],"60.3.13":["但我們照他的應許，盼望新天新地，有義居在其中。","但我们照他的应许，盼望新天新地，有义居在其中。","Nevertheless we, according to his promise, look for new heavens and a new earth, wherein dwelleth righteousness."],"44.14.17":["因為神的國不在乎吃喝，只在乎公義、和平，並聖靈中的喜樂。","因为神的国不在乎吃喝，只在乎公义、和平，并圣灵中的喜乐。","For the kingdom of God is not meat and drink; but righteousness, and peace, and joy in the Holy Ghost."],"22.61.10":["我因耶和華大大歡喜；我的心靠神快樂。因他以拯救為衣給我穿上，以公義為袍給我披上，好像新郎戴上華冠，又像新婦佩戴妝飾。","我因耶和华大大欢喜；我的心靠神快乐。因他以拯救为衣给我穿上，以公义为袍给我披上，好像新郎戴上华冠，又像新妇佩戴妆饰。","I will greatly rejoice in the LORD, my soul shall be joyful in my God; for he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness, as a bridegroom decketh [himself] with ornaments, and as a bride adorneth [herself] with her jewels."],"22.64.6":["我們都像不潔淨的人；所有的義都像污穢的衣服。我們都像葉子漸漸枯乾；我們的罪孽好像風把我們吹去。","我们都像不洁净的人；所有的义都像污秽的衣服。我们都像叶子渐渐枯干；我们的罪孽好像风把我们吹去。","But we are all as an unclean [thing], and all our righteousnesses [are] as filthy rags; and we all do fade as a leaf; and our iniquities, like the wind, have taken us away."],"49.3.9":["並且得以在他裡面，不是有自己因律法而得的義，乃是有信基督的義，就是因信神而來的義，","并且得以在他里面，不是有自己因律法而得的义，乃是有信基督的义，就是因信神而来的义，","And be found in him, not having mine own righteousness, which is of the law, but that which is through the faith of Christ, the righteousness which is of God by faith:"],"44.10.2":["我可以證明他們向神有熱心，但不是按著真知識；","我可以证明他们向神有热心，但不是按着真知识；","For I bear them record that they have a zeal of God, but not according to knowledge."],"39.5.20":["我告訴你們，你們的義若不勝於文士和法利賽人的義，斷不能進天國。","我告诉你们，你们的义若不胜于文士和法利赛人的义，断不能进天国。","For I say unto you, That except your righteousness shall exceed [the righteousness] of the scribes and Pharisees, ye shall in no case enter into the kingdom of heaven."],"47.2.21":["我不廢掉神的恩；義若是藉著律法得的，基督就是徒然死了。","我不废掉神的恩；义若是借着律法得的，基督就是徒然死了。","I do not frustrate the grace of God: for if righteousness [come] by the law, then Christ is dead in vain."],"42.15.13":["人為朋友捨命，人的愛心沒有比這個大的。","人为朋友舍命，人的爱心没有比这个大的。","Greater love hath no man than this, that a man lay down his life for his friends."],"61.4.10":["不是我們愛神，乃是神愛我們，差他的兒子為我們的罪作了挽回祭，這就是愛了。","不是我们爱神，乃是神爱我们，差他的儿子为我们的罪作了挽回祭，这就是爱了。","Herein is love, not that we loved God, but that he loved us, and sent his Son [to be] the propitiation for our sins."],"61.4.17":["這樣，愛在我們裡面得以完全，我們就可以在審判的日子坦然無懼。因為他如何，我們在這世上也如何。","这样，爱在我们里面得以完全，我们就可以在审判的日子坦然无惧。因为他如何，我们在这世上也如何。","Herein is our love made perfect, that we may have boldness in the day of judgment: because as he is, so are we in this world."],"61.4.18":["愛裡沒有懼怕；愛既完全，就把懼怕除去。因為懼怕裡含著刑罰，懼怕的人在愛裡未得完全。","爱里没有惧怕；爱既完全，就把惧怕除去。因为惧怕里含着刑罚，惧怕的人在爱里未得完全。","There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love."],"42.15.9":["我愛你們，正如父愛我一樣；你們要常在我的愛裡。","我爱你们，正如父爱我一样；你们要常在我的爱里。","As the Father hath loved me, so have I loved you: continue ye in my love."],"42.15.12":["你們要彼此相愛，像我愛你們一樣；這就是我的命令。","你们要彼此相爱，像我爱你们一样；这就是我的命令。","This is my commandment, That ye love one another, as I have loved you."],"65.1.5":["並那誠實作見證的、從死裡首先復活、為世上君王元首的耶穌基督，有恩惠、平安歸與你們！他愛我們，用自己的血使我們脫離（有古卷作：洗去）罪惡，","并那诚实作见证的、从死里首先复活、为世上君王元首的耶稣基督，有恩惠、平安归与你们！他爱我们，用自己的血使我们脱离（有古卷作：洗去）罪恶，","And from Jesus Christ, [who is] the faithful witness, [and] the first begotten of the dead, and the prince of the kings of the earth. Unto him that loved us, and washed us from our sins in his own blood,"],"44.8.35":["誰能使我們與基督的愛隔絕呢？難道是患難嗎？是困苦嗎？是逼迫嗎？是飢餓嗎？是赤身露體嗎？是危險嗎？是刀劍嗎？","谁能使我们与基督的爱隔绝呢？难道是患难吗？是困苦吗？是逼迫吗？是饥饿吗？是赤身露体吗？是危险吗？是刀剑吗？","Who shall separate us from the love of Christ? [shall] tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword?"],"44.8.36":["如經上所記：我們為你的緣故終日被殺；人看我們如將宰的羊。","如经上所记：我们为你的缘故终日被杀；人看我们如将宰的羊。","As it is written, For thy sake we are killed all the day long; we are accounted as sheep for the slaughter."],"44.8.37":["然而，靠著愛我們的主，在這一切的事上已經得勝有餘了。","然而，靠着爱我们的主，在这一切的事上已经得胜有余了。","Nay, in all these things we are more than conquerors through him that loved us."],"44.8.38":["因為我深信無論是死，是生，是天使，是掌權的，是有能的，是現在的事，是將來的事，","因为我深信无论是死，是生，是天使，是掌权的，是有能的，是现在的事，是将来的事，","For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come,"],"44.8.39":["是高處的，是低處的，是別的受造之物，都不能叫我們與神的愛隔絕；這愛是在我們的主基督耶穌裡的。","是高处的，是低处的，是别的受造之物，都不能叫我们与神的爱隔绝；这爱是在我们的主基督耶稣里的。","Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord."],"41.7.47":["所以我告訴你，他許多的罪都赦免了，因為他的愛多；但那赦免少的，他的愛就少。","所以我告诉你，他许多的罪都赦免了，因为他的爱多；但那赦免少的，他的爱就少。","Wherefore I say unto thee, Her sins, which are many, are forgiven; for she loved much: but to whom little is forgiven, [the same] loveth little."],"42.10.14":["我是好牧人；我認識我的羊，我的羊也認識我，","我是好牧人；我认识我的羊，我的羊也认识我，","I am the good shepherd, and know my [sheep], and am known of mine."],"42.10.15":["正如父認識我，我也認識父一樣；並且我為羊捨命。","正如父认识我，我也认识父一样；并且我为羊舍命。","As the Father knoweth me, even so know I the Father: and I lay down my life for the sheep."],"42.10.17":["我父愛我；因我將命捨去，好再取回來。","我父爱我；因我将命舍去，好再取回来。","Therefore doth my Father love me, because I lay down my life, that I might take it again."],"61.5.1":["凡信耶穌是基督的，都是從神而生，凡愛生他之神的，也必愛從神生的。","凡信耶稣是基督的，都是从神而生，凡爱生他之神的，也必爱从神生的。","Whosoever believeth that Jesus is the Christ is born of God: and every one that loveth him that begat loveth him also that is begotten of him."],"61.5.2":["我們若愛神，又遵守他的誡命，從此就知道我們愛神的兒女。","我们若爱神，又遵守他的诫命，从此就知道我们爱神的儿女。","By this we know that we love the children of God, when we love God, and keep his commandments."],"42.15.17":["我這樣吩咐你們，是要叫你們彼此相愛。","我这样吩咐你们，是要叫你们彼此相爱。","These things I command you, that ye love one another."],"61.4.11":["親愛的弟兄啊，神既是這樣愛我們，我們也當彼此相愛。","亲爱的弟兄啊，神既是这样爱我们，我们也当彼此相爱。","Beloved, if God so loved us, we ought also to love one another."],"39.10.37":["愛父母過於愛我的，不配作我的門徒；愛兒女過於愛我的，不配作我的門徒；","爱父母过于爱我的，不配作我的门徒；爱儿女过于爱我的，不配作我的门徒；","He that loveth father or mother more than me is not worthy of me: and he that loveth son or daughter more than me is not worthy of me."],"4.6.5":["你要盡心、盡性、盡力愛耶和華─你的神。","你要尽心、尽性、尽力爱耶和华─你的神。","And thou shalt love the LORD thy God with all thine heart, and with all thy soul, and with all thy might."],"61.3.1":["你看父賜給我們是何等的慈愛，使我們得稱為神的兒女；我們也真是他的兒女。世人所以不認識我們，是因未曾認識他。","你看父赐给我们是何等的慈爱，使我们得称为神的儿女；我们也真是他的儿女。世人所以不认识我们，是因未曾认识他。","Behold, what manner of love the Father hath bestowed upon us, that we should be called the sons of God: therefore the world knoweth us not, because it knew him not."],"61.3.2":["親愛的弟兄啊，我們現在是神的兒女，將來如何，還未顯明，但我們知道，主若顯現，我們必要像他、因為必得見他的真體。","亲爱的弟兄啊，我们现在是神的儿女，将来如何，还未显明，但我们知道，主若显现，我们必要像他、因为必得见他的真体。","Beloved, now are we the sons of God, and it doth not yet appear what we shall be: but we know that, when he shall appear, we shall be like him; for we shall see him as he is."],"61.4.19":["我們愛，因為神先愛我們。","我们爱，因为神先爱我们。","We love him, because he first loved us."],"61.4.20":["人若說我愛神，卻恨他的弟兄，就是說謊話的；不愛他所看見的弟兄，就不能愛沒有看見的神（有古卷作：怎能愛沒有看見的神呢）。","人若说我爱神，却恨他的弟兄，就是说谎话的；不爱他所看见的弟兄，就不能爱没有看见的神（有古卷作：怎能爱没有看见的神呢）。","If a man say, I love God, and hateth his brother, he is a liar: for he that loveth not his brother whom he hath seen, how can he love God whom he hath not seen?"],"61.4.21":["愛神的，也當愛弟兄，這是我們從神所受的命令。","爱神的，也当爱弟兄，这是我们从神所受的命令。","And this commandment have we from him, That he who loveth God love his brother also."],"48.5.26":["要用水藉著道把教會洗淨，成為聖潔，","要用水借着道把教会洗净，成为圣洁，","That he might sanctify and cleanse it with the washing of water by the word,"],"2.19.18":["不可報仇，也不可埋怨你本國的子民，卻要愛人如己。我是耶和華。","不可报仇，也不可埋怨你本国的子民，却要爱人如己。我是耶和华。","Thou shalt not avenge, nor bear any grudge against the children of thy people, but thou shalt love thy neighbour as thyself: I [am] the LORD."],"48.4.15":["惟用愛心說誠實話，凡事長進，連於元首基督，","惟用爱心说诚实话，凡事长进，连于元首基督，","But speaking the truth in love, may grow up into him in all things, which is the head, [even] Christ:"],"19.3.12":["因為耶和華所愛的，他必責備，正如父親責備所喜愛的兒子。","因为耶和华所爱的，他必责备，正如父亲责备所喜爱的儿子。","For whom the LORD loveth he correcteth; even as a father the son [in whom] he delighteth."],"57.12.6":["因為主所愛的，他必管教，又鞭打凡所收納的兒子。","因为主所爱的，他必管教，又鞭打凡所收纳的儿子。","For whom the Lord loveth he chasteneth, and scourgeth every son whom he receiveth."],"1.20.1":["神吩咐這一切的話說：","神吩咐这一切的话说：","And God spake all these words, saying,"],"1.32.16":["是神的工作，字是神寫的，刻在版上。","是神的工作，字是神写的，刻在版上。","And the tables [were] the work of God, and the writing [was] the writing of God, graven upon the tables."],"44.7.12":["這樣看來，律法是聖潔的，誡命也是聖潔、公義、良善的。","这样看来，律法是圣洁的，诫命也是圣洁、公义、良善的。","Wherefore the law [is] holy, and the commandment holy, and just, and good."],"39.22.36":["夫子，律法上的誡命，哪一條是最大的呢？","夫子，律法上的诫命，哪一条是最大的呢？","Master, which [is] the great commandment in the law?"],"39.22.37":["耶穌對他說：你要盡心、盡性、盡意愛主─你的神。","耶稣对他说：你要尽心、尽性、尽意爱主─你的神。","Jesus said unto him, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind."],"39.22.38":["這是誡命中的第一，且是最大的。","这是诫命中的第一，且是最大的。","This is the first and great commandment."],"39.22.39":["其次也相倣，就是要愛人如己。","其次也相倣，就是要爱人如己。","And the second [is] like unto it, Thou shalt love thy neighbour as thyself."],"39.22.40":["這兩條誡命是律法和先知一切道理的總綱。","这两条诫命是律法和先知一切道理的总纲。","On these two commandments hang all the law and the prophets."],"41.16.16":["律法和先知到約翰為止，從此神國的福音傳開了，人人努力要進去。","律法和先知到约翰为止，从此神国的福音传开了，人人努力要进去。","The law and the prophets [were] until John: since that time the kingdom of God is preached, and every man presseth into it."],"41.16.17":["天地廢去較比律法的一點一畫落空還容易。","天地废去较比律法的一点一画落空还容易。","And it is easier for heaven and earth to pass, than one tittle of the law to fail."],"41.16.18":["凡休妻另娶的就是犯姦淫；娶被休之妻的也是犯姦淫。","凡休妻另娶的就是犯奸淫；娶被休之妻的也是犯奸淫。","Whosoever putteth away his wife, and marrieth another, committeth adultery: and whosoever marrieth her that is put away from [her] husband committeth adultery."],"61.3.23":["神的命令就是叫我們信他兒子耶穌基督的名，且照他所賜給我們的命令彼此相愛。","神的命令就是叫我们信他儿子耶稣基督的名，且照他所赐给我们的命令彼此相爱。","And this is his commandment, That we should believe on the name of his Son Jesus Christ, and love one another, as he gave us commandment."],"4.7.9":["所以，你要知道耶和華─你的神，他是神，是信實的神；向愛他、守他誡命的人守約，施慈愛，直到千代；","所以，你要知道耶和华─你的神，他是神，是信实的神；向爱他、守他诫命的人守约，施慈爱，直到千代；","Know therefore that the LORD thy God, he [is] God, the faithful God, which keepeth covenant and mercy with them that love him and keep his commandments to a thousand generations;"],"42.14.21":["有了我的命令又遵守的，這人就是愛我的；愛我的必蒙我父愛他，我也要愛他，並且要向他顯現。","有了我的命令又遵守的，这人就是爱我的；爱我的必蒙我父爱他，我也要爱他，并且要向他显现。","He that hath my commandments, and keepeth them, he it is that loveth me: and he that loveth me shall be loved of my Father, and I will love him, and will manifest myself to him."],"44.3.31":["這樣，我們因信廢了律法嗎？斷乎不是！更是堅固律法。","这样，我们因信废了律法吗？断乎不是！更是坚固律法。","Do we then make void the law through faith? God forbid: yea, we establish the law."],"42.15.10":["你們若遵守我的命令，就常在我的愛裡，正如我遵守了我父的命令，常在他的愛裡。","你们若遵守我的命令，就常在我的爱里，正如我遵守了我父的命令，常在他的爱里。","If ye keep my commandments, ye shall abide in my love; even as I have kept my Father's commandments, and abide in his love."],"42.15.11":["這些事我已經對你們說了，是要叫我的喜樂存在你們心裡，並叫你們的喜樂可以滿足。","这些事我已经对你们说了，是要叫我的喜乐存在你们心里，并叫你们的喜乐可以满足。","These things have I spoken unto you, that my joy might remain in you, and [that] your joy might be full."],"42.15.14":["你們若遵行我所吩咐的，就是我的朋友了。","你们若遵行我所吩咐的，就是我的朋友了。","Ye are my friends, if ye do whatsoever I command you."],"42.15.15":["以後我不再稱你們為僕人，因僕人不知道主人所做的事。我乃稱你們為朋友；因我從我父所聽見的，已經都告訴你們了。","以后我不再称你们为仆人，因仆人不知道主人所做的事。我乃称你们为朋友；因我从我父所听见的，已经都告诉你们了。","Henceforth I call you not servants; for the servant knoweth not what his lord doeth: but I have called you friends; for all things that I have heard of my Father I have made known unto you."],"42.15.16":["不是你們揀選了我，是我揀選了你們，並且分派你們去結果子，叫你們的果子常存，使你們奉我的名，無論向父求什麼，他就賜給你們。","不是你们拣选了我，是我拣选了你们，并且分派你们去结果子，叫你们的果子常存，使你们奉我的名，无论向父求什么，他就赐给你们。","Ye have not chosen me, but I have chosen you, and ordained you, that ye should go and bring forth fruit, and [that] your fruit should remain: that whatsoever ye shall ask of the Father in my name, he may give it you."],"39.5.17":["莫想我來要廢掉律法和先知。我來不是要廢掉，乃是要成全。","莫想我来要废掉律法和先知。我来不是要废掉，乃是要成全。","Think not that I am come to destroy the law, or the prophets: I am not come to destroy, but to fulfil."],"39.5.18":["我實在告訴你們，就是到天地都廢去了，律法的一點一畫也不能廢去，都要成全。","我实在告诉你们，就是到天地都废去了，律法的一点一画也不能废去，都要成全。","For verily I say unto you, Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law, till all be fulfilled."],"39.5.19":["所以，無論何人廢掉這誡命中最小的一條，又教訓人這樣做，他在天國要稱為最小的。但無論何人遵行這誡命，又教訓人遵行，他在天國要稱為大的。","所以，无论何人废掉这诫命中最小的一条，又教训人这样做，他在天国要称为最小的。但无论何人遵行这诫命，又教训人遵行，他在天国要称为大的。","Whosoever therefore shall break one of these least commandments, and shall teach men so, he shall be called the least in the kingdom of heaven: but whosoever shall do and teach [them], the same shall be called great in the kingdom of heaven."],"57.8.11":["他們不用各人教導自己的鄉鄰和自己的弟兄，說：你該認識主；因為他們從最小的到至大的，都必認識我。","他们不用各人教导自己的乡邻和自己的弟兄，说：你该认识主；因为他们从最小的到至大的，都必认识我。","And they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest."],"57.8.12":["我要寬恕他們的不義，不再記念他們的罪愆。","我要宽恕他们的不义，不再记念他们的罪愆。","For I will be merciful to their unrighteousness, and their sins and their iniquities will I remember no more."],"57.8.13":["既說新約。就以前約為舊了；但那漸舊漸衰的，就必快歸無有了。","既说新约。就以前约为旧了；但那渐旧渐衰的，就必快归无有了。","In that he saith, A new [covenant], he hath made the first old. Now that which decayeth and waxeth old [is] ready to vanish away."],"18.103.21":["你們作他的諸軍，作他的僕役，行他所喜悅的，都要稱頌耶和華！","你们作他的诸军，作他的仆役，行他所喜悦的，都要称颂耶和华！","Bless ye the LORD, all [ye] his hosts; [ye] ministers of his, that do his pleasure."],"18.103.22":["你們一切被他造的，在他所治理的各處，都要稱頌耶和華！我的心哪，你要稱頌耶和華！","你们一切被他造的，在他所治理的各处，都要称颂耶和华！我的心哪，你要称颂耶和华！","Bless the LORD, all his works in all places of his dominion: bless the LORD, O my soul."],"61.1.3":["我們將所看見、所聽見的傳給你們，使你們與我們相交。我們乃是與父並他兒子耶穌基督相交的。","我们将所看见、所听见的传给你们，使你们与我们相交。我们乃是与父并他儿子耶稣基督相交的。","That which we have seen and heard declare we unto you, that ye also may have fellowship with us: and truly our fellowship [is] with the Father, and with his Son Jesus Christ."],"20.12.13":["這些事都已聽見了，總意就是：敬畏神，謹守他的誡命，這是人所當盡的本分（或譯：這是眾人的本分）。","这些事都已听见了，总意就是：敬畏神，谨守他的诫命，这是人所当尽的本分（或译：这是众人的本分）。","Let us hear the conclusion of the whole matter: Fear God, and keep his commandments: for this [is] the whole [duty] of man."],"4.4.2":["所吩咐你們的話，你們不可加添，也不可刪減，好叫你們遵守我所吩咐的，就是耶和華─你們神的命令。","所吩咐你们的话，你们不可加添，也不可删减，好叫你们遵守我所吩咐的，就是耶和华─你们神的命令。","Ye shall not add unto the word which I command you, neither shall ye diminish [ought] from it, that ye may keep the commandments of the LORD your God which I command you."],"39.15.8":["這百姓用嘴唇尊敬我，心卻遠離我；","这百姓用嘴唇尊敬我，心却远离我；","This people draweth nigh unto me with their mouth, and honoureth me with [their] lips; but their heart is far from me."],"39.15.9":["他們將人的吩咐當作道理教導人，所以拜我也是枉然。","他们将人的吩咐当作道理教导人，所以拜我也是枉然。","But in vain they do worship me, teaching [for] doctrines the commandments of men."],"39.15.3":["耶穌回答說：你們為什麼因著你們的遺傳犯神的誡命呢？","耶稣回答说：你们为什么因着你们的遗传犯神的诫命呢？","But he answered and said unto them, Why do ye also transgress the commandment of God by your tradition?"],"42.12.50":["我也知道他的命令就是永生。故此，我所講的話正是照著父對我所說的。","我也知道他的命令就是永生。故此，我所讲的话正是照着父对我所说的。","And I know that his commandment is life everlasting: whatsoever I speak therefore, even as the Father said unto me, so I speak."],"44.7.22":["因為按著我裡面的意思（原文是人），我是喜歡神的律；","因为按着我里面的意思（原文是人），我是喜欢神的律；","For I delight in the law of God after the inward man:"],"47.3.13":["基督既為我們受（原文是成）了咒詛，就贖出我們脫離律法的咒詛；因為經上記著：凡掛在木頭上都是被咒詛的。","基督既为我们受（原文是成）了咒诅，就赎出我们脱离律法的咒诅；因为经上记着：凡挂在木头上都是被咒诅的。","Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed [is] every one that hangeth on a tree:"],"44.7.6":["但我們既然在捆我們的律法上死了，現今就脫離了律法，叫我們服事主，要按著心靈（心靈：或作聖靈）的新樣，不按著儀文的舊樣。","但我们既然在捆我们的律法上死了，现今就脱离了律法，叫我们服事主，要按着心灵（心灵：或作圣灵）的新样，不按着仪文的旧样。","But now we are delivered from the law, that being dead wherein we were held; that we should serve in newness of spirit, and not [in] the oldness of the letter."],"18.103.17":["但耶和華的慈愛歸於敬畏他的人，從亙古到永遠；他的公義也歸於子子孫孫","但耶和华的慈爱归于敬畏他的人，从亘古到永远；他的公义也归于子子孙孙","But the mercy of the LORD [is] from everlasting to everlasting upon them that fear him, and his righteousness unto children's children;"],"18.103.18":["就是那些遵守他的約、記念他的訓詞而遵行的人。","就是那些遵守他的约、记念他的训词而遵行的人。","To such as keep his covenant, and to those that remember his commandments to do them."],"18.103.19":["耶和華在天上立定寶座；他的權柄（原文是國）統管萬有。","耶和华在天上立定宝座；他的权柄（原文是国）统管万有。","The LORD hath prepared his throne in the heavens; and his kingdom ruleth over all."],"39.19.20":["那少年人說：這一切我都遵守了，還缺少什麼呢？","那少年人说：这一切我都遵守了，还缺少什么呢？","The young man saith unto him, All these things have I kept from my youth up: what lack I yet?"],"19.4.4":["父親教訓我說：你心要存記我的言語，遵守我的命令，便得存活。","父亲教训我说：你心要存记我的言语，遵守我的命令，便得存活。","He taught me also, and said unto me, Let thine heart retain my words: keep my commandments, and live."],"42.20.1":["七日的第一日清早，天還黑的時候，抹大拉的馬利亞來到墳墓那裡，看見石頭從墳墓挪開了，","七日的第一日清早，天还黑的时候，抹大拉的马利亚来到坟墓那里，看见石头从坟墓挪开了，","The first [day] of the week cometh Mary Magdalene early, when it was yet dark, unto the sepulchre, and seeth the stone taken away from the sepulchre."],"40.16.9":["在七日的第一日清早，耶穌復活了，就先向抹大拉的馬利亞顯現。耶穌從他身上曾趕出七個鬼。","在七日的第一日清早，耶稣复活了，就先向抹大拉的马利亚显现。耶稣从他身上曾赶出七个鬼。","Now when [Jesus] was risen early the first [day] of the week, he appeared first to Mary Magdalene, out of whom he had cast seven devils."],"41.24.1":["七日的頭一日，黎明的時候，那些婦女帶著所預備的香料來到墳墓前，","七日的头一日，黎明的时候，那些妇女带着所预备的香料来到坟墓前，","Now upon the first [day] of the week, very early in the morning, they came unto the sepulchre, bringing the spices which they had prepared, and certain [others] with them."],"43.20.7":["七日的第一日，我們聚會擘餅的時候，保羅因為要次日起行，就與他們講論，直講到半夜。","七日的第一日，我们聚会擘饼的时候，保罗因为要次日起行，就与他们讲论，直讲到半夜。","And upon the first [day] of the week, when the disciples came together to break bread, Paul preached unto them, ready to depart on the morrow; and continued his speech until midnight."],"45.16.2":["每逢七日的第一日，各人要照自己的進項抽出來留著，免得我來的時候現湊。","每逢七日的第一日，各人要照自己的进项抽出来留着，免得我来的时候现凑。","Upon the first [day] of the week let every one of you lay by him in store, as [God] hath prospered him, that there be no gatherings when I come."],"65.1.10":["當主日，我被聖靈感動，聽見在我後面有大聲音如吹號，說：","当主日，我被圣灵感动，听见在我后面有大声音如吹号，说：","I was in the Spirit on the Lord's day, and heard behind me a great voice, as of a trumpet,"],"40.2.28":["所以，人子也是安息日的主。","所以，人子也是安息日的主。","Therefore the Son of man is Lord also of the sabbath."],"1.16.4":["耶和華對摩西說：我要將糧食從天降給你們。百姓可以出去，每天收每天的分，我好試驗他們遵不遵我的法度。","耶和华对摩西说：我要将粮食从天降给你们。百姓可以出去，每天收每天的分，我好试验他们遵不遵我的法度。","Then said the LORD unto Moses, Behold, I will rain bread from heaven for you; and the people shall go out and gather a certain rate every day, that I may prove them, whether they will walk in my law, or no."],"1.16.5":["到第六天，他們要把所收進來的預備好了，比每天所收的多一倍。","到第六天，他们要把所收进来的预备好了，比每天所收的多一倍。","And it shall come to pass, that on the sixth day they shall prepare [that] which they bring in; and it shall be twice as much as they gather daily."],"1.16.14":["露水上升之後，不料，野地面上有如白霜的小圓物。","露水上升之后，不料，野地面上有如白霜的小圆物。","And when the dew that lay was gone up, behold, upon the face of the wilderness [there lay] a small round thing, [as] small as the hoar frost on the ground."],"1.16.15":["以色列人看見，不知道是什麼，就彼此對問說：這是什麼呢？摩西對他們說：這就是耶和華給你們吃的食物。","以色列人看见，不知道是什么，就彼此对问说：这是什么呢？摩西对他们说：这就是耶和华给你们吃的食物。","And when the children of Israel saw [it], they said one to another, It [is] manna: for they wist not what it [was]. And Moses said unto them, This [is] the bread which the LORD hath given you to eat."],"1.16.16":["耶和華所吩咐的是這樣：你們要按著各人的飯量，為帳棚裡的人，按著人數收起來，各拿一俄梅珥。","耶和华所吩咐的是这样：你们要按着各人的饭量，为帐棚里的人，按着人数收起来，各拿一俄梅珥。","This [is] the thing which the LORD hath commanded, Gather of it every man according to his eating, an omer for every man, [according to] the number of your persons; take ye every man for [them] which [are] in his tents."],"1.16.17":["以色列人就這樣行；有多收的，有少收的。","以色列人就这样行；有多收的，有少收的。","And the children of Israel did so, and gathered, some more, some less."],"1.16.18":["及至用俄梅珥量一量，多收的也沒有餘，少收的也沒有缺；各人按著自己的飯量收取。","及至用俄梅珥量一量，多收的也没有余，少收的也没有缺；各人按着自己的饭量收取。","And when they did mete [it] with an omer, he that gathered much had nothing over, and he that gathered little had no lack; they gathered every man according to his eating."],"1.16.19":["摩西對他們說：所收的，不許什麼人留到早晨。","摩西对他们说：所收的，不许什么人留到早晨。","And Moses said, Let no man leave of it till the morning."],"1.16.20":["然而他們不聽摩西的話，內中有留到早晨的，就生蟲變臭了；摩西便向他們發怒。","然而他们不听摩西的话，内中有留到早晨的，就生虫变臭了；摩西便向他们发怒。","Notwithstanding they hearkened not unto Moses; but some of them left of it until the morning, and it bred worms, and stank: and Moses was wroth with them."],"1.16.21":["他們每日早晨，按著各人的飯量收取，日頭一發熱，就消化了。","他们每日早晨，按着各人的饭量收取，日头一发热，就消化了。","And they gathered it every morning, every man according to his eating: and when the sun waxed hot, it melted."],"1.16.22":["到第六天，他們收了雙倍的食物，每人兩俄梅珥。會眾的官長來告訴摩西；","到第六天，他们收了双倍的食物，每人两俄梅珥。会众的官长来告诉摩西；","And it came to pass, [that] on the sixth day they gathered twice as much bread, two omers for one [man]: and all the rulers of the congregation came and told Moses."],"1.16.23":["摩西對他們說：耶和華這樣說：明天是聖安息日，是向耶和華守的聖安息日。你們要烤的就烤了，要煮的就煮了，所剩下的都留到早晨。","摩西对他们说：耶和华这样说：明天是圣安息日，是向耶和华守的圣安息日。你们要烤的就烤了，要煮的就煮了，所剩下的都留到早晨。","And he said unto them, This [is that] which the LORD hath said, To morrow [is] the rest of the holy sabbath unto the LORD: bake [that] which ye will bake [to day], and seethe that ye will seethe; and that which remaineth over lay up for you to be kept until the morning."],"1.16.24":["他們就照摩西的吩咐留到早晨，也不臭，裡頭也沒有蟲子。","他们就照摩西的吩咐留到早晨，也不臭，里头也没有虫子。","And they laid it up till the morning, as Moses bade: and it did not stink, neither was there any worm therein."],"1.16.25":["摩西說：你們今天吃這個吧！因為今天是向耶和華守的安息日；你們在田野必找不著了。","摩西说：你们今天吃这个吧！因为今天是向耶和华守的安息日；你们在田野必找不着了。","And Moses said, Eat that to day; for to day [is] a sabbath unto the LORD: to day ye shall not find it in the field."],"1.16.26":["六天可以收取，第七天乃是安息日，那一天必沒有了。","六天可以收取，第七天乃是安息日，那一天必没有了。","Six days ye shall gather it; but on the seventh day, [which is] the sabbath, in it there shall be none."],"1.16.27":["第七天，百姓中有人出去收，什麼也找不著。","第七天，百姓中有人出去收，什么也找不着。","And it came to pass, [that] there went out [some] of the people on the seventh day for to gather, and they found none."],"1.16.28":["耶和華對摩西說：你們不肯守我的誡命和律法，要到幾時呢？","耶和华对摩西说：你们不肯守我的诫命和律法，要到几时呢？","And the LORD said unto Moses, How long refuse ye to keep my commandments and my laws?"],"1.16.29":["你們看！耶和華既將安息日賜給你們，所以第六天他賜給你們兩天的食物，第七天各人要住在自己的地方，不許什麼人出去。","你们看！耶和华既将安息日赐给你们，所以第六天他赐给你们两天的食物，第七天各人要住在自己的地方，不许什么人出去。","See, for that the LORD hath given you the sabbath, therefore he giveth you on the sixth day the bread of two days; abide ye every man in his place, let no man go out of his place on the seventh day."],"1.16.30":["於是百姓第七天安息了。","于是百姓第七天安息了。","So the people rested on the seventh day."],"1.16.31":["這食物，以色列家叫嗎哪；樣子像芫荽子，顏色是白的，滋味如同攙蜜的薄餅。","这食物，以色列家叫吗哪；样子像芫荽子，颜色是白的，滋味如同搀蜜的薄饼。","And the house of Israel called the name thereof Manna: and it [was] like coriander seed, white; and the taste of it [was] like wafers [made] with honey."],"1.16.32":["摩西說：耶和華所吩咐的是這樣：要將一滿俄梅珥（俄梅珥就是伊法十分之一）嗎哪留到世世代代，使後人可以看見我當日將你們領出埃及地，在曠野所給你們吃的食物。","摩西说：耶和华所吩咐的是这样：要将一满俄梅珥（俄梅珥就是伊法十分之一）吗哪留到世世代代，使后人可以看见我当日将你们领出埃及地，在旷野所给你们吃的食物。","And Moses said, This [is] the thing which the LORD commandeth, Fill an omer of it to be kept for your generations; that they may see the bread wherewith I have fed you in the wilderness, when I brought you forth from the land of Egypt."],"1.16.33":["摩西對亞倫說：你拿一個罐子，盛一滿俄梅珥嗎哪，存在耶和華面前，要留到世世代代。","摩西对亚伦说：你拿一个罐子，盛一满俄梅珥吗哪，存在耶和华面前，要留到世世代代。","And Moses said unto Aaron, Take a pot, and put an omer full of manna therein, and lay it up before the LORD, to be kept for your generations."],"1.16.34":["耶和華怎麼吩咐摩西，亞倫就怎麼行，把嗎哪放在法櫃前存留。","耶和华怎么吩咐摩西，亚伦就怎么行，把吗哪放在法柜前存留。","As the LORD commanded Moses, so Aaron laid it up before the Testimony, to be kept."],"1.16.35":["以色列人吃嗎哪共四十年，直到進了有人居住之地，就是迦南的境界。","以色列人吃吗哪共四十年，直到进了有人居住之地，就是迦南的境界。","And the children of Israel did eat manna forty years, until they came to a land inhabited; they did eat manna, until they came unto the borders of the land of Canaan."],"1.16.36":["（俄梅珥就是伊法十分之一。）","（俄梅珥就是伊法十分之一。）","Now an omer [is] the tenth [part] of an ephah."],"1.31.12":["耶和華曉諭摩西說：","耶和华晓谕摩西说：","And the LORD spake unto Moses, saying,"],"1.31.13":["你要吩咐以色列人說：你們務要守我的安息日；因為這是你我之間世世代代的證據，使你們知道我─耶和華是叫你們成為聖的。","你要吩咐以色列人说：你们务要守我的安息日；因为这是你我之间世世代代的证据，使你们知道我─耶和华是叫你们成为圣的。","Speak thou also unto the children of Israel, saying, Verily my sabbaths ye shall keep: for it [is] a sign between me and you throughout your generations; that [ye] may know that I [am] the LORD that doth sanctify you."],"1.31.14":["所以你們要守安息日，以為聖日。凡干犯這日的，必要把他治死；凡在這日做工的，必從民中剪除。","所以你们要守安息日，以为圣日。凡干犯这日的，必要把他治死；凡在这日做工的，必从民中剪除。","Ye shall keep the sabbath therefore; for it [is] holy unto you: every one that defileth it shall surely be put to death: for whosoever doeth [any] work therein, that soul shall be cut off from among his people."],"1.31.15":["六日要做工，但第七日是安息聖日，是向耶和華守為聖的。凡在安息日做工的，必要把他治死。","六日要做工，但第七日是安息圣日，是向耶和华守为圣的。凡在安息日做工的，必要把他治死。","Six days may work be done; but in the seventh [is] the sabbath of rest, holy to the LORD: whosoever doeth [any] work in the sabbath day, he shall surely be put to death."],"1.31.16":["故此，以色列人要世世代代守安息日為永遠的約。","故此，以色列人要世世代代守安息日为永远的约。","Wherefore the children of Israel shall keep the sabbath, to observe the sabbath throughout their generations, [for] a perpetual covenant."],"1.31.17":["這是我和以色列人永遠的證據；因為六日之內耶和華造天地，第七日便安息舒暢。","这是我和以色列人永远的证据；因为六日之内耶和华造天地，第七日便安息舒畅。","It [is] a sign between me and the children of Israel for ever: for [in] six days the LORD made heaven and earth, and on the seventh day he rested, and was refreshed."],"4.5.12":["當照耶和華─你神所吩咐的守安息日為聖日。","当照耶和华─你神所吩咐的守安息日为圣日。","Keep the sabbath day to sanctify it, as the LORD thy God hath commanded thee."],"4.5.13":["六日要勞碌做你一切的工，","六日要劳碌做你一切的工，","Six days thou shalt labour, and do all thy work:"],"4.5.14":["但第七日是向耶和華─你神當守的安息日。這一日，你和你的兒女、僕婢、牛、驢、牲畜，並在你城裡寄居的客旅，無論何工都不可做，使你的僕婢可以和你一樣安息。","但第七日是向耶和华─你神当守的安息日。这一日，你和你的儿女、仆婢、牛、驴、牲畜，并在你城里寄居的客旅，无论何工都不可做，使你的仆婢可以和你一样安息。","But the seventh day [is] the sabbath of the LORD thy God: [in it] thou shalt not do any work, thou, nor thy son, nor thy daughter, nor thy manservant, nor thy maidservant, nor thine ox, nor thine ass, nor any of thy cattle, nor thy stranger that [is] within thy gates; that thy manservant and thy maidservant may rest as well as thou."],"4.5.15":["你也要記念你在埃及地作過奴僕；耶和華─你神用大能的手和伸出來的膀臂將你從那裡領出來。因此，耶和華─你的神吩咐你守安息日。","你也要记念你在埃及地作过奴仆；耶和华─你神用大能的手和伸出来的膀臂将你从那里领出来。因此，耶和华─你的神吩咐你守安息日。","And remember that thou wast a servant in the land of Egypt, and [that] the LORD thy God brought thee out thence through a mighty hand and by a stretched out arm: therefore the LORD thy God commanded thee to keep the sabbath day."],"40.1.21":["到了迦百農，耶穌就在安息日進了會堂教訓人。","到了迦百农，耶稣就在安息日进了会堂教训人。","And they went into Capernaum; and straightway on the sabbath day he entered into the synagogue, and taught."],"41.4.16":["耶穌來到拿撒勒，就是他長大的地方。在安息日，照他平常的規矩進了會堂，站起來要念聖經。","耶稣来到拿撒勒，就是他长大的地方。在安息日，照他平常的规矩进了会堂，站起来要念圣经。","And he came to Nazareth, where he had been brought up: and, as his custom was, he went into the synagogue on the sabbath day, and stood up for to read."],"41.13.11":["有一個女人被鬼附著，病了十八年，腰彎得一點直不起來。","有一个女人被鬼附着，病了十八年，腰弯得一点直不起来。","And, behold, there was a woman which had a spirit of infirmity eighteen years, and was bowed together, and could in no wise lift up [herself]."],"41.13.12":["耶穌看見，便叫過他來，對他說：女人，你脫離這病了！","耶稣看见，便叫过他来，对他说：女人，你脱离这病了！","And when Jesus saw her, he called [her to him], and said unto her, Woman, thou art loosed from thine infirmity."],"41.13.13":["於是用兩隻手按著他；他立刻直起腰來，就歸榮耀與神。","于是用两只手按着他；他立刻直起腰来，就归荣耀与神。","And he laid [his] hands on her: and immediately she was made straight, and glorified God."],"41.13.14":["管會堂的因為耶穌在安息日治病，就氣忿忿的對眾人說：有六日應當做工；那六日之內可以來求醫，在安息日卻不可。","管会堂的因为耶稣在安息日治病，就气忿忿的对众人说：有六日应当做工；那六日之内可以来求医，在安息日却不可。","And the ruler of the synagogue answered with indignation, because that Jesus had healed on the sabbath day, and said unto the people, There are six days in which men ought to work: in them therefore come and be healed, and not on the sabbath day."],"41.13.15":["主說：假冒為善的人哪，難道你們各人在安息日不解開槽上的牛、驢，牽去飲嗎？","主说：假冒为善的人哪，难道你们各人在安息日不解开槽上的牛、驴，牵去饮吗？","The Lord then answered him, and said, [Thou] hypocrite, doth not each one of you on the sabbath loose his ox or [his] ass from the stall, and lead [him] away to watering?"],"41.13.16":["況且這女人本是亞伯拉罕的後裔，被撒但捆綁了這十八年，不當在安息日解開他的綁嗎？","况且这女人本是亚伯拉罕的后裔，被撒但捆绑了这十八年，不当在安息日解开他的绑吗？","And ought not this woman, being a daughter of Abraham, whom Satan hath bound, lo, these eighteen years, be loosed from this bond on the sabbath day?"],"41.13.17":["耶穌說這話，他的敵人都慚愧了；眾人因他所行一切榮耀的事，就都歡喜了。","耶稣说这话，他的敌人都惭愧了；众人因他所行一切荣耀的事，就都欢喜了。","And when he had said these things, all his adversaries were ashamed: and all the people rejoiced for all the glorious things that were done by him."],"43.13.14":["他們離了別加往前行，來到彼西底的安提阿，在安息日進會堂坐下。","他们离了别加往前行，来到彼西底的安提阿，在安息日进会堂坐下。","But when they departed from Perga, they came to Antioch in Pisidia, and went into the synagogue on the sabbath day, and sat down."],"43.18.4":["每逢安息日，保羅在會堂裡辯論，勸化猶太人和希利尼人。","每逢安息日，保罗在会堂里辩论，劝化犹太人和希利尼人。","And he reasoned in the synagogue every sabbath, and persuaded the Jews and the Greeks."],"43.16.13":["當安息日，我們出城門，到了河邊，知道那裡有一個禱告的地方，我們就坐下對那聚會的婦女講道。","当安息日，我们出城门，到了河边，知道那里有一个祷告的地方，我们就坐下对那聚会的妇女讲道。","And on the sabbath we went out of the city by a river side, where prayer was wont to be made; and we sat down, and spake unto the women which resorted [thither]."],"2.23.1":["耶和華對摩西說：","耶和华对摩西说：","And the LORD spake unto Moses, saying,"],"2.23.2":["你曉諭以色列人說：耶和華的節期，你們要宣告為聖會的節期。","你晓谕以色列人说：耶和华的节期，你们要声明为圣会的节期。","Speak unto the children of Israel, and say unto them, [Concerning] the feasts of the LORD, which ye shall proclaim [to be] holy convocations, [even] these [are] my feasts."],"2.23.3":["六日要做工，第七日是聖安息日，當有聖會；你們什麼工都不可做。這是在你們一切的住處向耶和華守的安息日。","六日要做工，第七日是圣安息日，当有圣会；你们什么工都不可做。这是在你们一切的住处向耶和华守的安息日。","Six days shall work be done: but the seventh day [is] the sabbath of rest, an holy convocation; ye shall do no work [therein]: it [is] the sabbath of the LORD in all your dwellings."],"2.23.32":["你們要守這日為聖安息日，並要刻苦己心。從這月初九日晚上到次日晚上，要守為安息日。","你们要守这日为圣安息日，并要刻苦己心。从这月初九日晚上到次日晚上，要守为安息日。","It [shall be] unto you a sabbath of rest, and ye shall afflict your souls: in the ninth [day] of the month at even, from even unto even, shall ye celebrate your sabbath."],"40.1.32":["天晚日落的時候，有人帶著一切害病的，和被鬼附的，來到耶穌跟前。","天晚日落的时候，有人带着一切害病的，和被鬼附的，来到耶稣跟前。","And at even, when the sun did set, they brought unto him all that were diseased, and them that were possessed with devils."],"40.15.42":["到了晚上，因為這是預備日，就是安息日的前一日，","到了晚上，因为这是预备日，就是安息日的前一日，","And now when the even was come, because it was the preparation, that is, the day before the sabbath,"],"40.15.43":["有亞利馬太的約瑟前來，他是尊貴的議士，也是等候神國的。他放膽進去見彼拉多，求耶穌的身體；","有亚利马太的约瑟前来，他是尊贵的议士，也是等候神国的。他放胆进去见彼拉多，求耶稣的身体；","Joseph of Arimathaea, an honourable counsellor, which also waited for the kingdom of God, came, and went in boldly unto Pilate, and craved the body of Jesus."],"40.15.44":["彼拉多詫異耶穌已經死了，便叫百夫長來，問他耶穌死了久不久。","彼拉多诧异耶稣已经死了，便叫百夫长来，问他耶稣死了久不久。","And Pilate marvelled if he were already dead: and calling [unto him] the centurion, he asked him whether he had been any while dead."],"40.15.45":["既從百夫長得知實情，就把耶穌的屍首賜給約瑟。","既从百夫长得知实情，就把耶稣的尸首赐给约瑟。","And when he knew [it] of the centurion, he gave the body to Joseph."],"40.15.46":["約瑟買了細麻布，把耶穌取下來，用細麻布裹好，安放在磐石中鑿出來的墳墓裡，又滾過一塊石頭來擋住墓門。","约瑟买了细麻布，把耶稣取下来，用细麻布裹好，安放在磐石中凿出来的坟墓里，又滚过一块石头来挡住墓门。","And he bought fine linen, and took him down, and wrapped him in the linen, and laid him in a sepulchre which was hewn out of a rock, and rolled a stone unto the door of the sepulchre."],"41.23.54":["那日是預備日，安息日也快到了。","那日是预备日，安息日也快到了。","And that day was the preparation, and the sabbath drew on."],"41.23.55":["那些從加利利和耶穌同來的婦女跟在後面，看見了墳墓和他的身體怎樣安放。","那些从加利利和耶稣同来的妇女跟在后面，看见了坟墓和他的身体怎样安放。","And the women also, which came with him from Galilee, followed after, and beheld the sepulchre, and how his body was laid."],"41.23.56":["他們就回去，預備了香料香膏。他們在安息日，便遵著誡命安息了。","他们就回去，预备了香料香膏。他们在安息日，便遵着诫命安息了。","And they returned, and prepared spices and ointments; and rested the sabbath day according to the commandment."],"41.24.2":["看見石頭已經從墳墓滾開了，","看见石头已经从坟墓滚开了，","And they found the stone rolled away from the sepulchre."],"41.24.3":["他們就進去，只是不見主耶穌的身體。","他们就进去，只是不见主耶稣的身体。","And they entered in, and found not the body of the Lord Jesus."],"22.56.1":["耶和華如此說：你們當守公平，行公義；因我的救恩臨近，我的公義將要顯現。","耶和华如此说：你们当守公平，行公义；因我的救恩临近，我的公义将要显现。","Thus saith the LORD, Keep ye judgment, and do justice: for my salvation [is] near to come, and my righteousness to be revealed."],"22.56.2":["謹守安息日而不干犯，禁止己手而不作惡；如此行、如此持守的人便為有福。","谨守安息日而不干犯，禁止己手而不作恶；如此行、如此持守的人便为有福。","Blessed [is] the man [that] doeth this, and the son of man [that] layeth hold on it; that keepeth the sabbath from polluting it, and keepeth his hand from doing any evil."],"22.56.3":["與耶和華聯合的外邦人不要說：耶和華必定將我從他民中分別出來。太監也不要說：我是枯樹。","与耶和华联合的外邦人不要说：耶和华必定将我从他民中分别出来。太监也不要说：我是枯树。","Neither let the son of the stranger, that hath joined himself to the LORD, speak, saying, The LORD hath utterly separated me from his people: neither let the eunuch say, Behold, I [am] a dry tree."],"22.56.4":["因為耶和華如此說：那些謹守我的安息日，揀選我所喜悅的事，持守我約的太監，","因为耶和华如此说：那些谨守我的安息日，拣选我所喜悦的事，持守我约的太监，","For thus saith the LORD unto the eunuchs that keep my sabbaths, and choose [the things] that please me, and take hold of my covenant;"],"22.56.5":["我必使他們在我殿中，在我牆內，有記念，有名號，比有兒女的更美。我必賜他們永遠的名，不能剪除。","我必使他们在我殿中，在我墙内，有记念，有名号，比有儿女的更美。我必赐他们永远的名，不能剪除。","Even unto them will I give in mine house and within my walls a place and a name better than of sons and of daughters: I will give them an everlasting name, that shall not be cut off."],"22.56.6":["還有那些與耶和華聯合的外邦人，要事奉他，要愛耶和華的名，要作他的僕人─就是凡守安息日不干犯，又持守他（原文是我）約的人。","还有那些与耶和华联合的外邦人，要事奉他，要爱耶和华的名，要作他的仆人─就是凡守安息日不干犯，又持守他（原文是我）约的人。","Also the sons of the stranger, that join themselves to the LORD, to serve him, and to love the name of the LORD, to be his servants, every one that keepeth the sabbath from polluting it, and taketh hold of my covenant;"],"22.56.7":["我必領他們到我的聖山，使他們在禱告我的殿中喜樂。他們的燔祭和平安祭，在我壇上必蒙悅納，因我的殿必稱為萬民禱告的殿。","我必领他们到我的圣山，使他们在祷告我的殿中喜乐。他们的燔祭和平安祭，在我坛上必蒙悦纳，因我的殿必称为万民祷告的殿。","Even them will I bring to my holy mountain, and make them joyful in my house of prayer: their burnt offerings and their sacrifices [shall be] accepted upon mine altar; for mine house shall be called an house of prayer for all people."],"57.4.1":["我們既蒙留下，有進入他安息的應許，就當畏懼，免得我們（原文是你們）中間或有人似乎是趕不上了。","我们既蒙留下，有进入他安息的应许，就当畏惧，免得我们（原文是你们）中间或有人似乎是赶不上了。","Let us therefore fear, lest, a promise being left [us] of entering into his rest, any of you should seem to come short of it."],"57.4.2":["因為有福音傳給我們，像傳給他們一樣；只是所聽見的道於他們無益，因為他們沒有信心與所聽見的道調和。","因为有福音传给我们，像传给他们一样；只是所听见的道于他们无益，因为他们没有信心与所听见的道调和。","For unto us was the gospel preached, as well as unto them: but the word preached did not profit them, not being mixed with faith in them that heard [it]."],"57.4.3":["但我們已經相信的人得以進入那安息，正如神所說：我在怒中起誓說：他們斷不可進入我的安息！其實造物之工，從創世以來已經成全了。","但我们已经相信的人得以进入那安息，正如神所说：我在怒中起誓说：他们断不可进入我的安息！其实造物之工，从创世以来已经成全了。","For we which have believed do enter into rest, as he said, As I have sworn in my wrath, if they shall enter into my rest: although the works were finished from the foundation of the world."],"57.4.4":["論到第七日，有一處說，到第七日神就歇了他一切的工。","论到第七日，有一处说，到第七日神就歇了他一切的工。","For he spake in a certain place of the seventh [day] on this wise, And God did rest the seventh day from all his works."],"57.4.5":["又有一處說：他們斷不可進入我的安息！","又有一处说：他们断不可进入我的安息！","And in this [place] again, If they shall enter into my rest."],"57.4.6":["既有必進安息的人，那先前聽見福音的，因為不信從，不得進去。","既有必进安息的人，那先前听见福音的，因为不信从，不得进去。","Seeing therefore it remaineth that some must enter therein, and they to whom it was first preached entered not in because of unbelief:"],"57.4.7":["所以過了多年，就在大衛的書上，又限定一日，如以上所引的說：你們今日若聽他的話，就不可硬著心。","所以过了多年，就在大卫的书上，又限定一日，如以上所引的说：你们今日若听他的话，就不可硬着心。","Again, he limiteth a certain day, saying in David, To day, after so long a time; as it is said, To day if ye will hear his voice, harden not your hearts."],"57.4.8":["若是約書亞已叫他們享了安息，後來神就不再提別的日子了。","若是约书亚已叫他们享了安息，后来神就不再提别的日子了。","For if Jesus had given them rest, then would he not afterward have spoken of another day."],"57.4.9":["這樣看來，必另有一安息日的安息為神的子民存留。","这样看来，必另有一安息日的安息为神的子民存留。","There remaineth therefore a rest to the people of God."],"57.4.10":["因為那進入安息的，乃是歇了自己的工，正如神歇了他的工一樣。","因为那进入安息的，乃是歇了自己的工，正如神歇了他的工一样。","For he that is entered into his rest, he also hath ceased from his own works, as God [did] from his."],"57.4.11":["所以，我們務必竭力進入那安息，免得有人學那不信從的樣子跌倒了。","所以，我们务必竭力进入那安息，免得有人学那不信从的样子跌倒了。","Let us labour therefore to enter into that rest, lest any man fall after the same example of unbelief."],"22.58.13":["你若在安息日掉轉（或譯：謹慎）你的腳步，在我聖日不以操作為喜樂，稱安息日為可喜樂的，稱耶和華的聖日為可尊重的；而且尊敬這日，不辦自己的私事，不隨自己的私意，不說自己的私話，","你若在安息日掉转（或译：谨慎）你的脚步，在我圣日不以操作为喜乐，称安息日为可喜乐的，称耶和华的圣日为可尊重的；而且尊敬这日，不办自己的私事，不随自己的私意，不说自己的私话，","If thou turn away thy foot from the sabbath, [from] doing thy pleasure on my holy day; and call the sabbath a delight, the holy of the LORD, honourable; and shalt honour him, not doing thine own ways, nor finding thine own pleasure, nor speaking [thine own] words:"],"22.58.14":["你就以耶和華為樂。耶和華要使你乘駕地的高處，又以你祖雅各的產業養育你。這是耶和華親口說的。","你就以耶和华为乐。耶和华要使你乘驾地的高处，又以你祖雅各的产业养育你。这是耶和华亲口说的。","Then shalt thou delight thyself in the LORD; and I will cause thee to ride upon the high places of the earth, and feed thee with the heritage of Jacob thy father: for the mouth of the LORD hath spoken [it]."],"25.20.12":["又將我的安息日賜給他們，好在我與他們中間為證據，使他們知道我─耶和華是叫他們成為聖的。","又将我的安息日赐给他们，好在我与他们中间为证据，使他们知道我─耶和华是叫他们成为圣的。","Moreover also I gave them my sabbaths, to be a sign between me and them, that they might know that I [am] the LORD that sanctify them."],"25.20.20":["且以我的安息日為聖。這日在我與你們中間為證據，使你們知道我是耶和華─你們的神。","且以我的安息日为圣。这日在我与你们中间为证据，使你们知道我是耶和华─你们的神。","And hallow my sabbaths; and they shall be a sign between me and you, that ye may know that I [am] the LORD your God."],"39.12.12":["人比羊何等貴重呢！所以，在安息日做善事是可以的。","人比羊何等贵重呢！所以，在安息日做善事是可以的。","How much then is a man better than a sheep? Wherefore it is lawful to do well on the sabbath days."],"39.24.20":["你們應當祈求，叫你們逃走的時候，不遇見冬天或是安息日。","你们应当祈求，叫你们逃走的时候，不遇见冬天或是安息日。","But pray ye that your flight be not in the winter, neither on the sabbath day:"],"40.2.27":["又對他們說：安息日是為人設立的，人不是為安息日設立的。","又对他们说：安息日是为人设立的，人不是为安息日设立的。","And he said unto them, The sabbath was made for man, and not man for the sabbath:"],"22.66.23":["每逢月朔、安息日，凡有血氣的必來在我面前下拜。這是耶和華說的。","每逢月朔、安息日，凡有血气的必来在我面前下拜。这是耶和华说的。","And it shall come to pass, [that] from one new moon to another, and from one sabbath to another, shall all flesh come to worship before me, saith the LORD."],"39.5.14":["你們是世上的光。城造在山上是不能隱藏的。","你们是世上的光。城造在山上是不能隐藏的。","Ye are the light of the world. A city that is set on an hill cannot be hid."],"51.5.22":["各樣的惡事要禁戒不做。","各样的恶事要禁戒不做。","Abstain from all appearance of evil."],"43.10.38":["神怎樣以聖靈和能力膏拿撒勒人耶穌，這都是你們知道的。他周流四方，行善事，醫好凡被魔鬼壓制的人，因為神與他同在。","神怎样以圣灵和能力膏拿撒勒人耶稣，这都是你们知道的。他周流四方，行善事，医好凡被魔鬼压制的人，因为神与他同在。","How God anointed Jesus of Nazareth with the Holy Ghost and with power: who went about doing good, and healing all that were oppressed of the devil; for God was with him."],"43.10.39":["他在猶太人之地，並耶路撒冷所行的一切事，有我們作見證。他們竟把他掛在木頭上殺了。","他在犹太人之地，并耶路撒冷所行的一切事，有我们作见证。他们竟把他挂在木头上杀了。","And we are witnesses of all things which he did both in the land of the Jews, and in Jerusalem; whom they slew and hanged on a tree:"],"43.10.40":["第三日，神叫他復活，顯現出來；","第三日，神叫他复活，显现出来；","Him God raised up the third day, and shewed him openly;"],"43.10.41":["不是顯現給眾人看，乃是顯現給神預先所揀選為他作見證的人看，就是我們這些在他從死裡復活以後和他同吃同喝的人。","不是显现给众人看，乃是显现给神预先所拣选为他作见证的人看，就是我们这些在他从死里复活以后和他同吃同喝的人。","Not to all the people, but unto witnesses chosen before of God, [even] to us, who did eat and drink with him after he rose from the dead."],"43.10.42":["他吩咐我們傳道給眾人，證明他是神所立定的，要作審判活人、死人的主。","他吩咐我们传道给众人，证明他是神所立定的，要作审判活人、死人的主。","And he commanded us to preach unto the people, and to testify that it is he which was ordained of God [to be] the Judge of quick and dead."],"43.10.43":["眾先知也為他作見證說：凡信他的人必因他的名得蒙赦罪。","众先知也为他作见证说：凡信他的人必因他的名得蒙赦罪。","To him give all the prophets witness, that through his name whosoever believeth in him shall receive remission of sins."],"59.2.9":["惟有你們是被揀選的族類，是有君尊的祭司，是聖潔的國度，是屬神的子民，要叫你們宣揚那召你們出黑暗入奇妙光明者的美德。","惟有你们是被拣选的族类，是有君尊的祭司，是圣洁的国度，是属神的子民，要叫你们宣扬那召你们出黑暗入奇妙光明者的美德。","But ye [are] a chosen generation, a royal priesthood, an holy nation, a peculiar people; that ye should shew forth the praises of him who hath called you out of darkness into his marvellous light:"],"43.4.33":["使徒大有能力，見證主耶穌復活；眾人也都蒙大恩。","使徒大有能力，见证主耶稣复活；众人也都蒙大恩。","And with great power gave the apostles witness of the resurrection of the Lord Jesus: and great grace was upon them all."],"18.103.7":["他使摩西知道他的法則，叫以色列人曉得他的作為。","他使摩西知道他的法则，叫以色列人晓得他的作为。","He made known his ways unto Moses, his acts unto the children of Israel."],"18.103.8":["耶和華有憐憫，有恩典，不輕易發怒，且有豐盛的慈愛。","耶和华有怜悯，有恩典，不轻易发怒，且有丰盛的慈爱。","The LORD [is] merciful and gracious, slow to anger, and plenteous in mercy."],"18.103.9":["他不長久責備，也不永遠懷怒。","他不长久责备，也不永远怀怒。","He will not always chide: neither will he keep [his anger] for ever."],"18.103.10":["他沒有按我們的罪過待我們，也沒有照我們的罪孽報應我們。","他没有按我们的罪过待我们，也没有照我们的罪孽报应我们。","He hath not dealt with us after our sins; nor rewarded us according to our iniquities."],"18.103.11":["天離地何等的高，他的慈愛向敬畏他的人也是何等的大！","天离地何等的高，他的慈爱向敬畏他的人也是何等的大！","For as the heaven is high above the earth, [so] great is his mercy toward
