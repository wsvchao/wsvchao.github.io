er] not in marriage doeth better."],"45.7.39":["丈夫活著的時候，妻子是被約束的；丈夫若死了，妻子就可以自由，隨意再嫁，只是要嫁這在主裡面的人。","丈夫活着的时候，妻子是被约束的；丈夫若死了，妻子就可以自由，随意再嫁，只是要嫁这在主里面的人。","The wife is bound by the law as long as her husband liveth; but if her husband be dead, she is at liberty to be married to whom she will; only in the Lord."],"45.7.40":["然而按我的意見，若常守節更有福氣。我也想自己是被神的靈感動了。","然而按我的意见，若常守节更有福气。我也想自己是被神的灵感动了。","But she is happier if she so abide, after my judgment: and I think also that I have the Spirit of God."],"46.6.14":["你們和不信的原不相配，不要同負一軛。義和不義有什麼相交呢？光明和黑暗有什麼相通呢？","你们和不信的原不相配，不要同负一轭。义和不义有什么相交呢？光明和黑暗有什么相通呢？","Be ye not unequally yoked together with unbelievers: for what fellowship hath righteousness with unrighteousness? and what communion hath light with darkness?"],"39.5.27":["你們聽見有話說：不可姦淫。","你们听见有话说：不可奸淫。","Ye have heard that it was said by them of old time, Thou shalt not commit adultery:"],"39.5.28":["只是我告訴你們，凡看見婦女就動淫念的，這人心裡已經與他犯姦淫了。","只是我告诉你们，凡看见妇女就动淫念的，这人心里已经与他犯奸淫了。","But I say unto you, That whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart."],"39.5.29":["若是你的右眼叫你跌倒，就剜出來丟掉，寧可失去百體中的一體，不叫全身丟在地獄裡。","若是你的右眼叫你跌倒，就剜出来丢掉，宁可失去百体中的一体，不叫全身丢在地狱里。","And if thy right eye offend thee, pluck it out, and cast [it] from thee: for it is profitable for thee that one of thy members should perish, and not [that] thy whole body should be cast into hell."],"39.5.30":["若是右手叫你跌倒，就砍下來丟掉，寧可失去百體中的一體，不叫全身下入地獄。","若是右手叫你跌倒，就砍下来丢掉，宁可失去百体中的一体，不叫全身下入地狱。","And if thy right hand offend thee, cut it off, and cast [it] from thee: for it is profitable for thee that one of thy members should perish, and not [that] thy whole body should be cast into hell."],"39.5.31":["又有話說：人若休妻，就當給他休書。","又有话说：人若休妻，就当给他休书。","It hath been said, Whosoever shall put away his wife, let him give her a writing of divorcement:"],"39.5.32":["只是我告訴你們，凡休妻的，若不是為淫亂的緣故，就是叫他作淫婦了；人若娶這被休的婦人，也是犯姦淫了。","只是我告诉你们，凡休妻的，若不是为淫乱的缘故，就是叫他作淫妇了；人若娶这被休的妇人，也是犯奸淫了。","But I say unto you, That whosoever shall put away his wife, saving for the cause of fornication, causeth her to commit adultery: and whosoever shall marry her that is divorced committeth adultery."],"39.19.9":["我告訴你們，凡休妻另娶的，若不是為淫亂的緣故，就是犯姦淫了；有人娶那被休的婦人，也是犯姦淫了。","我告诉你们，凡休妻另娶的，若不是为淫乱的缘故，就是犯奸淫了；有人娶那被休的妇人，也是犯奸淫了。","And I say unto you, Whosoever shall put away his wife, except [it be] for fornication, and shall marry another, committeth adultery: and whoso marrieth her which is put away doth commit adultery."],"40.10.2":["有法利賽人來問他說：人休妻可以不可以？意思要試探他。","有法利赛人来问他说：人休妻可以不可以？意思要试探他。","And the Pharisees came to him, and asked him, Is it lawful for a man to put away [his] wife? tempting him."],"40.10.11":["耶穌對他們說：凡休妻另娶的，就是犯姦淫，辜負他的妻子；","耶稣对他们说：凡休妻另娶的，就是犯奸淫，辜负他的妻子；","And he saith unto them, Whosoever shall put away his wife, and marry another, committeth adultery against her."],"42.8.3":["文士和法利賽人帶著一個行淫時被拿的婦人來，叫他站在當中，","文士和法利赛人带着一个行淫时被拿的妇人来，叫他站在当中，","And the scribes and Pharisees brought unto him a woman taken in adultery; and when they had set her in the midst,"],"42.8.4":["就對耶穌說：夫子，這婦人是正行淫之時被拿的。","就对耶稣说：夫子，这妇人是正行淫之时被拿的。","They say unto him, Master, this woman was taken in adultery, in the very act."],"42.8.5":["摩西在律法上吩咐我們把這樣的婦人用石頭打死。你說該把他怎麼樣呢？","摩西在律法上吩咐我们把这样的妇人用石头打死。你说该把他怎么样呢？","Now Moses in the law commanded us, that such should be stoned: but what sayest thou?"],"42.8.6":["他們說這話，乃試探耶穌，要得著告他的把柄。耶穌卻彎著腰，用指頭在地上畫字。","他们说这话，乃试探耶稣，要得着告他的把柄。耶稣却弯着腰，用指头在地上画字。","This they said, tempting him, that they might have to accuse him. But Jesus stooped down, and with [his] finger wrote on the ground, [as though he heard][ them not]."],"42.8.7":["他們還是不住的問他，耶穌就直起腰來，對他們說：你們中間誰是沒有罪的，誰就可以先拿石頭打他。","他们还是不住的问他，耶稣就直起腰来，对他们说：你们中间谁是没有罪的，谁就可以先拿石头打他。","So when they continued asking him, he lifted up himself, and said unto them, He that is without sin among you, let him first cast a stone at her."],"42.8.8":["於是又彎著腰，用指頭在地上畫字。","于是又弯着腰，用指头在地上画字。","And again he stooped down, and wrote on the ground."],"42.8.9":["他們聽見這話，就從老到少，一個一個的都出去了，只剩下耶穌一人，還有那婦人仍然站在當中。","他们听见这话，就从老到少，一个一个的都出去了，只剩下耶稣一人，还有那妇人仍然站在当中。","And they which heard [it], being convicted by [their own] conscience, went out one by one, beginning at the eldest, [even] unto the last: and Jesus was left alone, and the woman standing in the midst."],"42.8.10":["耶穌就直起腰來，對他說：婦人，那些人在哪裡呢？沒有人定你的罪嗎？","耶稣就直起腰来，对他说：妇人，那些人在哪里呢？没有人定你的罪吗？","When Jesus had lifted up himself, and saw none but the woman, he said unto her, Woman, where are those thine accusers? hath no man condemned thee?"],"42.8.11":["他說：主啊，沒有。耶穌說：我也不定你的罪。去吧，從此不要再犯罪了！","他说：主啊，没有。耶稣说：我也不定你的罪。去吧，从此不要再犯罪了！","She said, No man, Lord. And Jesus said unto her, Neither do I condemn thee: go, and sin no more."],"39.22.30":["當復活的時候，人也不娶也不嫁，乃像天上的使者一樣。","当复活的时候，人也不娶也不嫁，乃像天上的使者一样。","For in the resurrection they neither marry, nor are given in marriage, but are as the angels of God in heaven."],"40.12.25":["人從死裡復活，也不娶也不嫁，乃像天上的使者一樣。","人从死里复活，也不娶也不嫁，乃像天上的使者一样。","For when they shall rise from the dead, they neither marry, nor are given in marriage; but are as the angels which are in heaven."],"39.12.36":["我又告訴你們，凡人所說的閒話，當審判的日子，必要句句供出來；","我又告诉你们，凡人所说的闲话，当审判的日子，必要句句供出来；","But I say unto you, That every idle word that men shall speak, they shall give account thereof in the day of judgment."],"46.5.10":["因為我們眾人必要在基督臺前顯露出來，叫各人按著本身所行的，或善或惡受報。","因为我们众人必要在基督台前显露出来，叫各人按着本身所行的，或善或恶受报。","For we must all appear before the judgment seat of Christ; that every one may receive the things [done] in [his] body, according to that he hath done, whether [it be] good or bad."],"46.9.6":["少種的少收，多種的多收，這話是真的。","少种的少收，多种的多收，这话是真的。","But this [I say], He which soweth sparingly shall reap also sparingly; and he which soweth bountifully shall reap also bountifully."],"46.9.7":["各人要隨本心所酌定的，不要作難，不要勉強，因為捐得樂意的人是神所喜愛的。","各人要随本心所酌定的，不要作难，不要勉强，因为捐得乐意的人是神所喜爱的。","Every man according as he purposeth in his heart, [so let him give]; not grudgingly, or of necessity: for God loveth a cheerful giver."],"46.9.8":["神能將各樣的恩惠多多的加給你們，使你們凡事常常充足，能多行各樣善事。","神能将各样的恩惠多多的加给你们，使你们凡事常常充足，能多行各样善事。","And God [is] able to make all grace abound toward you; that ye, always having all sufficiency in all [things], may abound to every good work:"],"39.23.23":["你們這假冒為善的文士和法利賽人有禍了！因為你們將薄荷、茴香、芹菜，獻上十分之一，那律法上更重的事，就是公義、憐憫、信實，反倒不行了。這更重的是你們當行的；那也是不可不行的。","你们这假冒为善的文士和法利赛人有祸了！因为你们将薄荷、茴香、芹菜，献上十分之一，那律法上更重的事，就是公义、怜悯、信实，反倒不行了。这更重的是你们当行的；那也是不可不行的。","Woe unto you, scribes and Pharisees, hypocrites! for ye pay tithe of mint and anise and cummin, and have omitted the weightier [matters] of the law, judgment, mercy, and faith: these ought ye to have done, and not to leave the other undone."],"44.13.1":["在上有權柄的，人人當順服他，因為沒有權柄不是出於神的。凡掌權的都是神所命的。","在上有权柄的，人人当顺服他，因为没有权柄不是出于神的。凡掌权的都是神所命的。","Let every soul be subject unto the higher powers. For there is no power but of God: the powers that be are ordained of God."],"39.22.21":["他們說：是該撒的。耶穌說：這樣，該撒的物當歸給該撒；神的物當歸給神。","他们说：是该撒的。耶稣说：这样，该撒的物当归给该撒；神的物当归给神。","They say unto him, Caesar's. Then saith he unto them, Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's."],"44.13.7":["凡人所當得的，就給他。當得糧的，給他納糧；當得稅的，給他上稅；當懼怕的，懼怕他；當恭敬的，恭敬他。","凡人所当得的，就给他。当得粮的，给他纳粮；当得税的，给他上税；当惧怕的，惧怕他；当恭敬的，恭敬他。","Render therefore to all their dues: tribute to whom tribute [is due]; custom to whom custom; fear to whom fear; honour to whom honour."],"44.13.4":["因為他是神的用人，是於你有益的。你若作惡，卻當懼怕；因為他不是空空的佩劍，他是神的用人，是伸冤的，刑罰那作惡的。","因为他是神的用人，是于你有益的。你若作恶，却当惧怕；因为他不是空空的佩剑，他是神的用人，是伸冤的，刑罚那作恶的。","For he is the minister of God to thee for good. But if thou do that which is evil, be afraid; for he beareth not the sword in vain: for he is the minister of God, a revenger to [execute] wrath upon him that doeth evil."],"59.5.5":["你們年幼的，也要順服年長的。就是你們眾人也都要以謙卑束腰，彼此順服；因為神阻擋驕傲的人，賜恩給謙卑的人。","你们年幼的，也要顺服年长的。就是你们众人也都要以谦卑束腰，彼此顺服；因为神阻挡骄傲的人，赐恩给谦卑的人。","Likewise, ye younger, submit yourselves unto the elder. Yea, all [of you] be subject one to another, and be clothed with humility: for God resisteth the proud, and giveth grace to the humble."],"44.12.9":["愛人不可虛假；惡要厭惡，善要親近。","爱人不可虚假；恶要厌恶，善要亲近。","[Let] love be without dissimulation. Abhor that which is evil; cleave to that which is good."],"44.12.10":["愛弟兄，要彼此親熱；恭敬人，要彼此推讓。","爱弟兄，要彼此亲热；恭敬人，要彼此推让。","[Be] kindly affectioned one to another with brotherly love; in honour preferring one another;"],"44.15.1":["我們堅固的人應該擔代不堅固人的軟弱，不求自己的喜悅。","我们坚固的人应该担代不坚固人的软弱，不求自己的喜悦。","We then that are strong ought to bear the infirmities of the weak, and not to please ourselves."],"57.13.5":["你們存心不可貪愛錢財，要以自己所有的為足；因為主曾說：我總不撇下你，也不丟棄你。","你们存心不可贪爱钱财，要以自己所有的为足；因为主曾说：我总不撇下你，也不丢弃你。","[Let your] conversation [be] without covetousness; [and be] content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee."],"58.1.19":["我親愛的弟兄們，這是你們所知道的，但你們各人要快快的聽，慢慢的說，慢慢的動怒，","我亲爱的弟兄们，这是你们所知道的，但你们各人要快快的听，慢慢的说，慢慢的动怒，","Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath:"],"57.13.1":["你們務要常存弟兄相愛的心。","你们务要常存弟兄相爱的心。","Let brotherly love continue."],"44.13.8":["凡事都不可虧欠人，惟有彼此相愛要常以為虧欠；因為愛人的，就完全了律法。","凡事都不可亏欠人，惟有彼此相爱要常以为亏欠；因为爱人的，就完全了律法。","Owe no man any thing, but to love one another: for he that loveth another hath fulfilled the law."],"39.5.44":["只是我告訴你們，要愛你們的仇敵，為那逼迫你們的禱告。","只是我告诉你们，要爱你们的仇敌，为那逼迫你们的祷告。","But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you;"],"57.13.2":["不可忘記用愛心接待客旅；因為曾有接待客旅的，不知不覺就接待了天使。","不可忘记用爱心接待客旅；因为曾有接待客旅的，不知不觉就接待了天使。","Be not forgetful to entertain strangers: for thereby some have entertained angels unawares."],"2.19.33":["若有外人在你們國中和你同居，就不可欺負他。","若有外人在你们国中和你同居，就不可欺负他。","And if a stranger sojourn with thee in your land, ye shall not vex him."],"29.3.7":["主耶和華若不將奧祕指示他的僕人─眾先知，就一無所行。","主耶和华若不将奥秘指示他的仆人─众先知，就一无所行。","Surely the Lord GOD will do nothing, but he revealeth his secret unto his servants the prophets."],"51.5.20":["不要藐視先知的講論。","不要藐视先知的讲论。","Despise not prophesyings."],"13.20.20":["次日清早，眾人起來往提哥亞的曠野去。出去的時候，約沙法站著說：猶大人和耶路撒冷的居民哪，要聽我說：信耶和華─你們的神就必立穩；信他的先知就必亨通。","次日清早，众人起来往提哥亚的旷野去。出去的时候，约沙法站着说：犹大人和耶路撒冷的居民哪，要听我说：信耶和华─你们的神就必立稳；信他的先知就必亨通。","And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper."],"48.4.11":["他所賜的，有使徒，有先知，有傳福音的，有牧師和教師，","他所赐的，有使徒，有先知，有传福音的，有牧师和教师，","And he gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers;"],"48.4.12":["為要成全聖徒，各盡其職，建立基督的身體，","为要成全圣徒，各尽其职，创建基督的身体，","For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ:"],"44.12.6":["按我們所得的恩賜，各有不同。或說預言，就當照著信心的程度說預言，","按我们所得的恩赐，各有不同。或说预言，就当照着信心的程度说预言，","Having then gifts differing according to the grace that is given to us, whether prophecy, [let us prophesy] according to the proportion of faith;"],"65.1.9":["我─約翰就是你們的弟兄，和你們在耶穌的患難、國度、忍耐裡一同有分，為神的道，並為給耶穌作的見證，曾在那名叫拔摩的海島上。","我─约翰就是你们的弟兄，和你们在耶稣的患难、国度、忍耐里一同有分，为神的道，并为给耶稣作的见证，曾在那名叫拔摩的海岛上。","I John, who also am your brother, and companion in tribulation, and in the kingdom and patience of Jesus Christ, was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ."],"43.2.16":["這正是先知約珥所說的：","这正是先知约珥所说的：","But this is that which was spoken by the prophet Joel;"],"43.2.17":["神說：在末後的日子，我要將我的靈澆灌凡有血氣的。你們的兒女要說預言；你們的少年人要見異象；老年人要做異夢。","神说：在末后的日子，我要将我的灵浇灌凡有血气的。你们的儿女要说预言；你们的少年人要见异象；老年人要做异梦。","And it shall come to pass in the last days, saith God, I will pour out of my Spirit upon all flesh: and your sons and your daughters shall prophesy, and your young men shall see visions, and your old men shall dream dreams:"],"43.2.18":["在那些日子，我要將我的靈澆灌我的僕人和使女，他們就要說預言。","在那些日子，我要将我的灵浇灌我的仆人和使女，他们就要说预言。","And on my servants and on my handmaidens I will pour out in those days of my Spirit; and they shall prophesy:"],"45.1.4":["我常為你們感謝我的神，因神在基督耶穌裡所賜給你們的恩惠；","我常为你们感谢我的神，因神在基督耶稣里所赐给你们的恩惠；","I thank my God always on your behalf, for the grace of God which is given you by Jesus Christ;"],"45.1.5":["又因你們在他裡面凡事富足，口才、知識都全備，","又因你们在他里面凡事富足，口才、知识都全备，","That in every thing ye are enriched by him, in all utterance, and [in] all knowledge;"],"45.1.6":["正如我為基督作的見證，在你們心裡得以堅固，","正如我为基督作的见证，在你们心里得以坚固，","Even as the testimony of Christ was confirmed in you:"],"45.1.7":["以致你們在恩賜上沒有一樣不及人的，等候我們的主耶穌基督顯現。","以致你们在恩赐上没有一样不及人的，等候我们的主耶稣基督显现。","So that ye come behind in no gift; waiting for the coming of our Lord Jesus Christ:"],"45.1.8":["他也必堅固你們到底，叫你們在我們主耶穌基督的日子無可責備。","他也必坚固你们到底，叫你们在我们主耶稣基督的日子无可责备。","Who shall also confirm you unto the end, [that ye may be] blameless in the day of our Lord Jesus Christ."],"60.1.21":["因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。","因为预言从来没有出于人意的，乃是人被圣灵感动，说出神的话来。","For the prophecy came not in old time by the will of man: but holy men of God spake [as they were] moved by the Holy Ghost."],"3.12.6":["耶和華說：你們且聽我的話：你們中間若有先知，我─耶和華必在異象中向他顯現，在夢中與他說話。","耶和华说：你们且听我的话：你们中间若有先知，我─耶和华必在异象中向他显现，在梦中与他说话。","And he said, Hear now my words: If there be a prophet among you, [I] the LORD will make myself known unto him in a vision, [and] will speak unto him in a dream."],"61.4.1":["親愛的弟兄啊，一切的靈，你們不可都信，總要試驗那些靈是出於神的不是，因為世上有許多假先知已經出來了。","亲爱的弟兄啊，一切的灵，你们不可都信，总要试验那些灵是出于神的不是，因为世上有许多假先知已经出来了。","Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world."],"22.8.19":["有人對你們說：當求問那些交鬼的和行巫術的，就是聲音綿蠻，言語微細的。你們便回答說：百姓不當求問自己的神嗎？豈可為活人求問死人呢？","有人对你们说：当求问那些交鬼的和行巫术的，就是声音绵蛮，言语微细的。你们便回答说：百姓不当求问自己的神吗？岂可为活人求问死人呢？","And when they shall say unto you, Seek unto them that have familiar spirits, and unto wizards that peep, and that mutter: should not a people seek unto their God? for the living to the dead?"],"22.8.20":["人當以訓誨和法度為標準；他們所說的，若不與此相符，必不得見晨光。","人当以训诲和法度为标准；他们所说的，若不与此相符，必不得见晨光。","To the law and to the testimony: if they speak not according to this word, [it is] because [there is] no light in them."],"39.7.15":["你們要防備假先知。他們到你們這裡來，外面披著羊皮，裡面卻是殘暴的狼。","你们要防备假先知。他们到你们这里来，外面披着羊皮，里面却是残暴的狼。","Beware of false prophets, which come to you in sheep's clothing, but inwardly they are ravening wolves."],"39.7.16":["憑著他們的果子，就可以認出他們來。荊棘上豈能摘葡萄呢？蒺藜裡豈能摘無花果呢？","凭着他们的果子，就可以认出他们来。荆棘上岂能摘葡萄呢？蒺藜里岂能摘无花果呢？","Ye shall know them by their fruits. Do men gather grapes of thorns, or figs of thistles?"],"39.7.17":["這樣，凡好樹都結好果子，惟獨壞樹結壞果子。","这样，凡好树都结好果子，惟独坏树结坏果子。","Even so every good tree bringeth forth good fruit; but a corrupt tree bringeth forth evil fruit."],"39.7.18":["好樹不能結壞果子；壞樹不能結好果子。","好树不能结坏果子；坏树不能结好果子。","A good tree cannot bring forth evil fruit, neither [can] a corrupt tree bring forth good fruit."],"39.7.19":["凡不結好果子的樹就砍下來，丟在火裡。","凡不结好果子的树就砍下来，丢在火里。","Every tree that bringeth not forth good fruit is hewn down, and cast into the fire."],"39.7.20":["所以，憑著他們的果子就可以認出他們來。","所以，凭着他们的果子就可以认出他们来。","Wherefore by their fruits ye shall know them."],"26.10.8":["只剩下我一人。我見了這大異象便渾身無力，面貌失色，毫無氣力。","只剩下我一人。我见了这大异象便浑身无力，面貌失色，毫无气力。","Therefore I was left alone, and saw this great vision, and there remained no strength in me: for my comeliness was turned in me into corruption, and I retained no strength."],"26.10.18":["有一位形狀像人的又摸我，使我有力量。","有一位形状像人的又摸我，使我有力量。","Then there came again and touched me [one] like the appearance of a man, and he strengthened me,"],"26.10.17":["我主的僕人怎能與我主說話呢？我一見異象就渾身無力，毫無氣息。","我主的仆人怎能与我主说话呢？我一见异象就浑身无力，毫无气息。","For how can the servant of this my lord talk with this my lord? for as for me, straightway there remained no strength in me, neither is there breath left in me."],"3.24.16":["得聽神的言語，明白至高者的意旨，看見全能者的異象，眼目睜開而仆倒的人說：","得听神的言语，明白至高者的意旨，看见全能者的异象，眼目睁开而仆倒的人说：","He hath said, which heard the words of God, and knew the knowledge of the most High, [which] saw the vision of the Almighty, falling [into a trance], but having his eyes open:"],"39.24.23":["那時，若有人對你們說：基督在這裡，或說：基督在那裡，你們不要信！","那时，若有人对你们说：基督在这里，或说：基督在那里，你们不要信！","Then if any man shall say unto you, Lo, here [is] Christ, or there; believe [it] not."],"39.24.24":["因為假基督、假先知將要起來，顯大神蹟、大奇事，倘若能行，連選民也就迷惑了。","因为假基督、假先知将要起来，显大神迹、大奇事，倘若能行，连选民也就迷惑了。","For there shall arise false Christs, and false prophets, and shall shew great signs and wonders; insomuch that, if [it were] possible, they shall deceive the very elect."],"39.24.25":["看哪，我預先告訴你們了。","看哪，我预先告诉你们了。","Behold, I have told you before."],"39.24.26":["若有人對你們說：看哪，基督在曠野裡，你們不要出去！或說：看哪，基督在內屋中，你們不要信！","若有人对你们说：看哪，基督在旷野里，你们不要出去！或说：看哪，基督在内屋中，你们不要信！","Wherefore if they shall say unto you, Behold, he is in the desert; go not forth: behold, [he is] in the secret chambers; believe [it] not."],"39.24.27":["閃電從東邊發出，直照到西邊。人子降臨，也要這樣。","闪电从东边发出，直照到西边。人子降临，也要这样。","For as the lightning cometh out of the east, and shineth even unto the west; so shall also the coming of the Son of man be."],"23.23.9":["論到那些先知，我心在我裡面憂傷，我骨頭都發顫；因耶和華和他的聖言，我像醉酒的人，像被酒所勝的人。","论到那些先知，我心在我里面忧伤，我骨头都发颤；因耶和华和他的圣言，我像醉酒的人，像被酒所胜的人。","Mine heart within me is broken because of the prophets; all my bones shake; I am like a drunken man, and like a man whom wine hath overcome, because of the LORD, and because of the words of his holiness."],"23.23.10":["地滿了行淫的人！因妄自賭咒，地就悲哀；曠野的草場都枯乾了。他們所行的道乃是惡的；他們的勇力使得不正。","地满了行淫的人！因妄自赌咒，地就悲哀；旷野的草场都枯干了。他们所行的道乃是恶的；他们的勇力使得不正。","For the land is full of adulterers; for because of swearing the land mourneth; the pleasant places of the wilderness are dried up, and their course is evil, and their force [is] not right."],"23.23.11":["連先知帶祭司都是褻瀆的，就是在我殿中我也看見他們的惡。這是耶和華說的。","连先知带祭司都是亵渎的，就是在我殿中我也看见他们的恶。这是耶和华说的。","For both prophet and priest are profane; yea, in my house have I found their wickedness, saith the LORD."],"23.23.12":["因此，他們的道路必像黑暗中的滑地，他們必被追趕，在這路中仆倒；因為當追討之年，我必使災禍臨到他們。這是耶和華說的。","因此，他们的道路必像黑暗中的滑地，他们必被追赶，在这路中仆倒；因为当追讨之年，我必使灾祸临到他们。这是耶和华说的。","Wherefore their way shall be unto them as slippery [ways] in the darkness: they shall be driven on, and fall therein: for I will bring evil upon them, [even] the year of their visitation, saith the LORD."],"23.23.13":["我在撒瑪利亞的先知中曾見愚妄；他們藉巴力說預言，使我的百姓以色列走錯了路。","我在撒玛利亚的先知中曾见愚妄；他们藉巴力说预言，使我的百姓以色列走错了路。","And I have seen folly in the prophets of Samaria; they prophesied in Baal, and caused my people Israel to err."],"23.23.14":["我在耶路撒冷的先知中曾見可憎惡的事；他們行姦淫，做事虛妄，又堅固惡人的手，甚至無人回頭離開他的惡。他們在我面前都像所多瑪；耶路撒冷的居民都像蛾摩拉。","我在耶路撒冷的先知中曾见可憎恶的事；他们行奸淫，做事虚妄，又坚固恶人的手，甚至无人回头离开他的恶。他们在我面前都像所多玛；耶路撒冷的居民都像蛾摩拉。","I have seen also in the prophets of Jerusalem an horrible thing: they commit adultery, and walk in lies: they strengthen also the hands of evildoers, that none doth return from his wickedness: they are all of them unto me as Sodom, and the inhabitants thereof as Gomorrah."],"23.23.15":["所以萬軍之耶和華論到先知如此說：我必將茵蔯給他們吃，又將苦膽水給他們喝；因為褻瀆的事出於耶路撒冷的先知，流行遍地。","所以万军之耶和华论到先知如此说：我必将茵𫈟给他们吃，又将苦胆水给他们喝；因为亵渎的事出于耶路撒冷的先知，流行遍地。","Therefore thus saith the LORD of hosts concerning the prophets; Behold, I will feed them with wormwood, and make them drink the water of gall: for from the prophets of Jerusalem is profaneness gone forth into all the land."],"23.23.16":["萬軍之耶和華如此說：這些先知向你們說預言，你們不要聽他們的話。他們以虛空教訓你們，所說的異象是出於自己的心，不是出於耶和華的口。","万军之耶和华如此说：这些先知向你们说预言，你们不要听他们的话。他们以虚空教训你们，所说的异象是出于自己的心，不是出于耶和华的口。","Thus saith the LORD of hosts, Hearken not unto the words of the prophets that prophesy unto you: they make you vain: they speak a vision of their own heart, [and] not out of the mouth of the LORD."],"23.23.17":["他們常對藐視我的人說：耶和華說：你們必享平安；又對一切按自己頑梗之心而行的人說：必沒有災禍臨到你們。","他们常对藐视我的人说：耶和华说：你们必享平安；又对一切按自己顽梗之心而行的人说：必没有灾祸临到你们。","They say still unto them that despise me, The LORD hath said, Ye shall have peace; and they say unto every one that walketh after the imagination of his own heart, No evil shall come upon you."],"23.23.18":["有誰站在耶和華的會中得以聽見並會悟他的話呢？有誰留心聽他的話呢？","有谁站在耶和华的会中得以听见并会悟他的话呢？有谁留心听他的话呢？","For who hath stood in the counsel of the LORD, and hath perceived and heard his word? who hath marked his word, and heard [it]?"],"23.23.19":["看哪！耶和華的忿怒好像暴風，已經發出；是暴烈的旋風，必轉到惡人的頭上。","看哪！耶和华的忿怒好像暴风，已经发出；是暴烈的旋风，必转到恶人的头上。","Behold, a whirlwind of the LORD is gone forth in fury, even a grievous whirlwind: it shall fall grievously upon the head of the wicked."],"23.23.20":["耶和華的怒氣必不轉消，直到他心中所擬定的成就了。末後的日子你們要全然明白。","耶和华的怒气必不转消，直到他心中所拟定的成就了。末后的日子你们要全然明白。","The anger of the LORD shall not return, until he have executed, and till he have performed the thoughts of his heart: in the latter days ye shall consider it perfectly."],"23.23.21":["我沒有打發那些先知，他們竟自奔跑；我沒有對他們說話，他們竟自預言。","我没有打发那些先知，他们竟自奔跑；我没有对他们说话，他们竟自预言。","I have not sent these prophets, yet they ran: I have not spoken to them, yet they prophesied."],"23.23.22":["他們若是站在我的會中，就必使我的百姓聽我的話，又使他們回頭離開惡道和他們所行的惡。","他们若是站在我的会中，就必使我的百姓听我的话，又使他们回头离开恶道和他们所行的恶。","But if they had stood in my counsel, and had caused my people to hear my words, then they should have turned them from their evil way, and from the evil of their doings."],"23.23.23":["耶和華說：我豈為近處的神呢？不也為遠處的神嗎？","耶和华说：我岂为近处的神呢？不也为远处的神吗？","[Am] I a God at hand, saith the LORD, and not a God afar off?"],"23.23.24":["耶和華說：人豈能在隱密處藏身，使我看不見他呢？耶和華說：我豈不充滿天地嗎？","耶和华说：人岂能在隐密处藏身，使我看不见他呢？耶和华说：我岂不充满天地吗？","Can any hide himself in secret places that I shall not see him? saith the LORD. Do not I fill heaven and earth? saith the LORD."],"23.23.25":["我已聽見那些先知所說的，就是託我名說的假預言，他們說：我做了夢！我做了夢！","我已听见那些先知所说的，就是托我名说的假预言，他们说：我做了梦！我做了梦！","I have heard what the prophets said, that prophesy lies in my name, saying, I have dreamed, I have dreamed."],"23.23.26":["說假預言的先知，就是預言本心詭詐的先知，他們這樣存心要到幾時呢？","说假预言的先知，就是预言本心诡诈的先知，他们这样存心要到几时呢？","How long shall [this] be in the heart of the prophets that prophesy lies? yea, [they are] prophets of the deceit of their own heart;"],"23.23.27":["他們各人將所做的夢對鄰舍述說，想要使我的百姓忘記我的名，正如他們列祖因巴力忘記我的名一樣。","他们各人将所做的梦对邻舍述说，想要使我的百姓忘记我的名，正如他们列祖因巴力忘记我的名一样。","Which think to cause my people to forget my name by their dreams which they tell every man to his neighbour, as their fathers have forgotten my name for Baal."],"23.23.28":["得夢的先知可以述說那夢；得我話的人可以誠實講說我的話。糠粃怎能與麥子比較呢？這是耶和華說的。","得梦的先知可以述说那梦；得我话的人可以诚实讲说我的话。糠粃怎能与麦子比较呢？这是耶和华说的。","The prophet that hath a dream, let him tell a dream; and he that hath my word, let him speak my word faithfully. What [is] the chaff to the wheat? saith the LORD."],"23.23.29":["耶和華說：我的話豈不像火，又像能打碎磐石的大錘嗎？","耶和华说：我的话岂不像火，又像能打碎磐石的大锤吗？","[Is] not my word like as a fire? saith the LORD; and like a hammer [that] breaketh the rock in pieces?"],"23.23.30":["耶和華說：那些先知各從鄰舍偷竊我的言語，因此我必與他們反對。","耶和华说：那些先知各从邻舍偷窃我的言语，因此我必与他们反对。","Therefore, behold, I [am] against the prophets, saith the LORD, that steal my words every one from his neighbour."],"23.23.31":["耶和華說：那些先知用舌頭，說是耶和華說的；我必與他們反對。","耶和华说：那些先知用舌头，说是耶和华说的；我必与他们反对。","Behold, I [am] against the prophets, saith the LORD, that use their tongues, and say, He saith."],"23.23.32":["耶和華說：那些以幻夢為預言，又述說這夢，以謊言和矜誇使我百姓走錯了路的，我必與他們反對。我沒有打發他們，也沒有吩咐他們。他們於這百姓毫無益處。這是耶和華說的。","耶和华说：那些以幻梦为预言，又述说这梦，以谎言和矜夸使我百姓走错了路的，我必与他们反对。我没有打发他们，也没有吩咐他们。他们于这百姓毫无益处。这是耶和华说的。","Behold, I [am] against them that prophesy false dreams, saith the LORD, and do tell them, and cause my people to err by their lies, and by their lightness; yet I sent them not, nor commanded them: therefore they shall not profit this people at all, saith the LORD."],"26.12.4":["但以理啊，你要隱藏這話，封閉這書，直到末時。必有多人來往奔跑（或譯：切心研究），知識就必增長。","但以理啊，你要隐藏这话，封闭这书，直到末时。必有多人来往奔跑（或译：切心研究），知识就必增长。","But thou, O Daniel, shut up the words, and seal the book, [even] to the time of the end: many shall run to and fro, and knowledge shall be increased."],"39.24.3":["耶穌在橄欖山上坐著，門徒暗暗的來說：請告訴我們，什麼時候有這些事？你降臨和世界的末了有什麼預兆呢？","耶稣在橄榄山上坐着，门徒暗暗的来说：请告诉我们，什么时候有这些事？你降临和世界的末了有什么预兆呢？","And as he sat upon the mount of Olives, the disciples came unto him privately, saying, Tell us, when shall these things be? and what [shall be] the sign of thy coming, and of the end of the world?"],"39.24.4":["耶穌回答說：你們要謹慎，免得有人迷惑你們。","耶稣回答说：你们要谨慎，免得有人迷惑你们。","And Jesus answered and said unto them, Take heed that no man deceive you."],"39.24.5":["因為將來有好些人冒我的名來，說：我是基督，並且要迷惑許多人。","因为将来有好些人冒我的名来，说：我是基督，并且要迷惑许多人。","For many shall come in my name, saying, I am Christ; and shall deceive many."],"39.24.6":["你們也要聽見打仗和打仗的風聲，總不要驚慌；因為這些事是必須有的，只是末期還沒有到。","你们也要听见打仗和打仗的风声，总不要惊慌；因为这些事是必须有的，只是末期还没有到。","And ye shall hear of wars and rumours of wars: see that ye be not troubled: for all [these things] must come to pass, but the end is not yet."],"39.24.7":["民要攻打民，國要攻打國；多處必有饑荒、地震。","民要攻打民，国要攻打国；多处必有饥荒、地震。","For nation shall rise against nation, and kingdom against kingdom: and there shall be famines, and pestilences, and earthquakes, in divers places."],"41.21.25":["日、月、星辰要顯出異兆，地上的邦國也有困苦；因海中波浪的響聲，就慌慌不定。","日、月、星辰要显出异兆，地上的邦国也有困苦；因海中波浪的响声，就慌慌不定。","And there shall be signs in the sun, and in the moon, and in the stars; and upon the earth distress of nations, with perplexity; the sea and the waves roaring;"],"41.21.26":["天勢都要震動，人想起那將要臨到世界的事，就都嚇得魂不附體。","天势都要震动，人想起那将要临到世界的事，就都吓得魂不附体。","Men's hearts failing them for fear, and for looking after those things which are coming on the earth: for the powers of heaven shall be shaken."],"41.21.27":["那時，他們要看見人子有能力，有大榮耀駕雲降臨。","那时，他们要看见人子有能力，有大荣耀驾云降临。","And then shall they see the Son of man coming in a cloud with power and great glory."],"41.21.28":["一有這些事，你們就當挺身昂首，因為你們得贖的日子近了。","一有这些事，你们就当挺身昂首，因为你们得赎的日子近了。","And when these things begin to come to pass, then look up, and lift up your heads; for your redemption draweth nigh."],"39.24.37":["挪亞的日子怎樣，人子降臨也要怎樣。","挪亚的日子怎样，人子降临也要怎样。","But as the days of Noe [were], so shall also the coming of the Son of man be."],"39.24.38":["當洪水以前的日子，人照常吃喝嫁娶，直到挪亞進方舟的那日；","当洪水以前的日子，人照常吃喝嫁娶，直到挪亚进方舟的那日；","For as in the days that were before the flood they were eating and drinking, marrying and giving in marriage, until the day that Noe entered into the ark,"],"39.24.39":["不知不覺洪水來了，把他們全都沖去。人子降臨也要這樣。","不知不觉洪水来了，把他们全都冲去。人子降临也要这样。","And knew not until the flood came, and took them all away; so shall also the coming of the Son of man be."],"43.2.19":["在天上、我要顯出奇事；在地下、我要顯出神蹟；有血，有火，有煙霧。","在天上、我要显出奇事；在地下、我要显出神迹；有血，有火，有烟雾。","And I will shew wonders in heaven above, and signs in the earth beneath; blood, and fire, and vapour of smoke:"],"43.2.20":["日頭要變為黑暗，月亮要變為血；這都在主大而明顯的日子未到以前。","日头要变为黑暗，月亮要变为血；这都在主大而明显的日子未到以前。","The sun shall be turned into darkness, and the moon into blood, before that great and notable day of the Lord come:"],"43.2.21":["到那時候，凡求告主名的，就必得救。","到那时候，凡求告主名的，就必得救。","And it shall come to pass, [that] whosoever shall call on the name of the Lord shall be saved."],"54.3.1":["你該知道，末世必有危險的日子來到。","你该知道，末世必有危险的日子来到。","This know also, that in the last days perilous times shall come."],"54.3.2":["因為那時人要專顧自己、貪愛錢財、自誇、狂傲、謗讟、違背父母、忘恩負義、心不聖潔、","因为那时人要专顾自己、贪爱钱财、自夸、狂傲、谤讟、违背父母、忘恩负义、心不圣洁、","For men shall be lovers of their own selves, covetous, boasters, proud, blasphemers, disobedient to parents, unthankful, unholy,"],"54.3.3":["無親情、不解怨、好說讒言、不能自約、性情兇暴、不愛良善、","无亲情、不解怨、好说谗言、不能自约、性情凶暴、不爱良善、","Without natural affection, trucebreakers, false accusers, incontinent, fierce, despisers of those that are good,"],"54.3.4":["賣主賣友、任意妄為、自高自大、愛宴樂、不愛神，","卖主卖友、任意妄为、自高自大、爱宴乐、不爱神，","Traitors, heady, highminded, lovers of pleasures more than lovers of God;"],"54.3.5":["有敬虔的外貌，卻背了敬虔的實意；這等人你要躲開。","有敬虔的外貌，却背了敬虔的实意；这等人你要躲开。","Having a form of godliness, but denying the power thereof: from such turn away."],"53.4.1":["聖靈明說，在後來的時候，必有人離棄真道，聽從那引誘人的邪靈和鬼魔的道理。","圣灵明说，在后来的时候，必有人离弃真道，听从那引诱人的邪灵和鬼魔的道理。","Now the Spirit speaketh expressly, that in the latter times some shall depart from the faith, giving heed to seducing spirits, and doctrines of devils;"],"39.24.11":["且有好些假先知起來，迷惑多人。","且有好些假先知起来，迷惑多人。","And many false prophets shall rise, and shall deceive many."],"54.4.1":["我在神面前，並在將來審判活人死人的基督耶穌面前，憑著他的顯現和他的國度囑咐你：","我在神面前，并在将来审判活人死人的基督耶稣面前，凭着他的显现和他的国度嘱咐你：","I charge [thee] therefore before God, and the Lord Jesus Christ, who shall judge the quick and the dead at his appearing and his kingdom;"],"54.4.2":["務要傳道，無論得時不得時，總要專心；並用百般的忍耐，各樣的教訓，責備人、警戒人、勸勉人。","务要传道，无论得时不得时，总要专心；并用百般的忍耐，各样的教训，责备人、警戒人、劝勉人。","Preach the word; be instant in season, out of season; reprove, rebuke, exhort with all longsuffering and doctrine."],"54.4.3":["因為時候要到，人必厭煩純正的道理，耳朵發癢，就隨從自己的情慾，增添好些師傅，","因为时候要到，人必厌烦纯正的道理，耳朵发痒，就随从自己的情欲，增添好些师傅，","For the time will come when they will not endure sound doctrine; but after their own lusts shall they heap to themselves teachers, having itching ears;"],"54.4.4":["並且掩耳不聽真道，偏向荒渺的言語。","并且掩耳不听真道，偏向荒渺的言语。","And they shall turn away [their] ears from the truth, and shall be turned unto fables."],"26.7.25":["他必向至高者說誇大的話，必折磨至高者的聖民，必想改變節期和律法。聖民必交付他手一載、二載、半載。","他必向至高者说夸大的话，必折磨至高者的圣民，必想改变节期和律法。圣民必交付他手一载、二载、半载。","And he shall speak [great] words against the most High, and shall wear out the saints of the most High, and think to change times and laws: and they shall be given into his hand until a time and times and the dividing of time."],"43.2.1":["五旬節到了，門徒都聚集在一處。","五旬节到了，门徒都聚集在一处。","And when the day of Pentecost was fully come, they were all with one accord in one place."],"43.2.2":["忽然，從天上有響聲下來，好像一陣大風吹過，充滿了他們所坐的屋子，","忽然，从天上有响声下来，好像一阵大风吹过，充满了他们所坐的屋子，","And suddenly there came a sound from heaven as of a rushing mighty wind, and it filled all the house where they were sitting."],"43.2.3":["又有舌頭如火焰顯現出來，分開落在他們各人頭上。","又有舌头如火焰显现出来，分开落在他们各人头上。","And there appeared unto them cloven tongues like as of fire, and it sat upon each of them."],"43.2.4":["他們就都被聖靈充滿，按著聖靈所賜的口才說起別國的話來。","他们就都被圣灵充满，按着圣灵所赐的口才说起别国的话来。","And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance."],"43.2.5":["那時，有虔誠的猶太人從天下各國來，住在耶路撒冷。","那时，有虔诚的犹太人从天下各国来，住在耶路撒冷。","And there were dwelling at Jerusalem Jews, devout men, out of every nation under heaven."],"43.2.6":["這聲音一響，眾人都來聚集，各人聽見門徒用眾人的鄉談說話，就甚納悶；","这声音一响，众人都来聚集，各人听见门徒用众人的乡谈说话，就甚纳闷；","Now when this was noised abroad, the multitude came together, and were confounded, because that every man heard them speak in his own language."],"43.2.7":["都驚訝希奇說：看哪，這說話的不都是加利利人嗎？","都惊讶希奇说：看哪，这说话的不都是加利利人吗？","And they were all amazed and marvelled, saying one to another, Behold, are not all these which speak Galilaeans?"],"43.2.8":["我們各人，怎麼聽見他們說我們生來所用的鄉談呢？","我们各人，怎么听见他们说我们生来所用的乡谈呢？","And how hear we every man in our own tongue, wherein we were born?"],"43.2.9":["我們帕提亞人、瑪代人、以攔人，和住在米所波大米、猶太、加帕多家、本都、亞西亞、","我们帕提亚人、玛代人、以拦人，和住在米所波大米、犹太、加帕多家、本都、亚西亚、","Parthians, and Medes, and Elamites, and the dwellers in Mesopotamia, and in Judaea, and Cappadocia, in Pontus, and Asia,"],"43.2.10":["弗呂家、旁非利亞、埃及的人，並靠近古利奈的呂彼亞一帶地方的人，從羅馬來的客旅中，或是猶太人，或是進猶太教的人，","弗吕家、旁非利亚、埃及的人，并靠近古利奈的吕彼亚一带地方的人，从罗马来的客旅中，或是犹太人，或是进犹太教的人，","Phrygia, and Pamphylia, in Egypt, and in the parts of Libya about Cyrene, and strangers of Rome, Jews and proselytes,"],"43.2.11":["革哩底和亞拉伯人，都聽見他們用我們的鄉談，講說神的大作為。","革哩底和亚拉伯人，都听见他们用我们的乡谈，讲说神的大作为。","Cretes and Arabians, we do hear them speak in our tongues the wonderful works of God."],"45.14.39":["所以我弟兄們，你們要切慕作先知講道，也不要禁止說方言。","所以我弟兄们，你们要切慕作先知讲道，也不要禁止说方言。","Wherefore, brethren, covet to prophesy, and forbid not to speak with tongues."],"45.12.28":["神在教會所設立的：第一是使徒，第二是先知，第三是教師，其次是行異能的，再次是得恩賜醫病的，幫助人的，治理事的，說方言的。","神在教会所设立的：第一是使徒，第二是先知，第三是教师，其次是行异能的，再次是得恩赐医病的，帮助人的，治理事的，说方言的。","And God hath set some in the church, first apostles, secondarily prophets, thirdly teachers, after that miracles, then gifts of healings, helps, governments, diversities of tongues."],"45.12.29":["豈都是使徒嗎？豈都是先知嗎？豈都是教師嗎？豈都是行異能的嗎？","岂都是使徒吗？岂都是先知吗？岂都是教师吗？岂都是行异能的吗？","[Are] all apostles? [are] all prophets? [are] all teachers? [are] all workers of miracles?"],"45.12.30":["豈都是得恩賜醫病的嗎？豈都是說方言的嗎？豈都是翻方言的嗎？","岂都是得恩赐医病的吗？岂都是说方言的吗？岂都是翻方言的吗？","Have all the gifts of healing? do all speak with tongues? do all interpret?"],"45.12.31":["你們要切切的求那更大的恩賜。我現今把最妙的道指示你們。","你们要切切的求那更大的恩赐。我现今把最妙的道指示你们。","But covet earnestly the best gifts: and yet shew I unto you a more excellent way."],"45.12.7":["聖靈顯在各人身上，是叫人得益處。","圣灵显在各人身上，是叫人得益处。","But the manifestation of the Spirit is given to every man to profit withal."],"45.12.8":["這人蒙聖靈賜他智慧的言語，那人也蒙這位聖靈賜他知識的言語，","这人蒙圣灵赐他智能的言语，那人也蒙这位圣灵赐他知识的言语，","For to one is given by the Spirit the word of wisdom; to another the word of knowledge by the same Spirit;"],"45.12.9":["又有一人蒙這位聖靈賜他信心，還有一人蒙這位聖靈賜他醫病的恩賜，","又有一人蒙这位圣灵赐他信心，还有一人蒙这位圣灵赐他医病的恩赐，","To another faith by the same Spirit; to another the gifts of healing by the same Spirit;"],"45.12.10":["又叫一人能行異能，又叫一人能作先知，又叫一人能辨別諸靈，又叫一人能說方言，又叫一人能翻方言。","又叫一人能行异能，又叫一人能作先知，又叫一人能辨别诸灵，又叫一人能说方言，又叫一人能翻方言。","To another the working of miracles; to another prophecy; to another discerning of spirits; to another [divers] kinds of tongues; to another the interpretation of tongues:"],"45.12.11":["這一切都是這位聖靈所運行、隨己意分給各人的。","这一切都是这位圣灵所运行、随己意分给各人的。","But all these worketh that one and the selfsame Spirit, dividing to every man severally as he will."],"45.14.2":["那說方言的，原不是對人說，乃是對神說，因為沒有人聽出來。然而，他在心靈裡卻是講說各樣的奧祕。","那说方言的，原不是对人说，乃是对神说，因为没有人听出来。然而，他在心灵里却是讲说各样的奥秘。","For he that speaketh in an [unknown] tongue speaketh not unto men, but unto God: for no man understandeth [him]; howbeit in the spirit he speaketh mysteries."],"45.14.4":["說方言的，是造就自己；作先知講道的，乃是造就教會。","说方言的，是造就自己；作先知讲道的，乃是造就教会。","He that speaketh in an [unknown] tongue edifieth himself; but he that prophesieth edifieth the church."],"45.14.5":["我願意你們都說方言，更願意你們作先知講道；因為說方言的，若不翻出來，使教會被造就，那作先知講道的，就比他強了。","我愿意你们都说方言，更愿意你们作先知讲道；因为说方言的，若不翻出来，使教会被造就，那作先知讲道的，就比他强了。","I would that ye all spake with tongues, but rather that ye prophesied: for greater [is] he that prophesieth than he that speaketh with tongues, except he interpret, that the church may receive edifying."],"45.14.23":["所以，全教會聚在一處的時候，若都說方言，偶然有不通方言的，或是不信的人進來，豈不說你們癲狂了嗎？","所以，全教会聚在一处的时候，若都说方言，偶然有不通方言的，或是不信的人进来，岂不说你们癫狂了吗？","If therefore the whole church be come together into one place, and all speak with tongues, and there come in [those that are] unlearned, or unbelievers, will they not say that ye are mad?"],"45.14.6":["弟兄們，我到你們那裡去，若只說方言，不用啟示，或知識，或預言，或教訓，給你們講解，我於你們有什麼益處呢？","弟兄们，我到你们那里去，若只说方言，不用启示，或知识，或预言，或教训，给你们讲解，我于你们有什么益处呢？","Now, brethren, if I come unto you speaking with tongues, what shall I profit you, except I shall speak to you either by revelation, or by knowledge, or by prophesying, or by doctrine?"],"45.14.7":["就是那有聲無氣的物，或簫，或琴，若發出來的聲音沒有分別，怎能知道所吹所彈的是什麼呢？","就是那有声无气的物，或箫，或琴，若发出来的声音没有分别，怎能知道所吹所弹的是什么呢？","And even things without life giving sound, whether pipe or harp, except they give a distinction in the sounds, how shall it be known what is piped or harped?"],"45.14.8":["若吹無定的號聲，誰能預備打仗呢？","若吹无定的号声，谁能预备打仗呢？","For if the trumpet give an uncertain sound, who shall prepare himself to the battle?"],"45.14.9":["你們也是如此。舌頭若不說容易明白的話，怎能知道所說的是什麼呢？這就是向空說話了。","你们也是如此。舌头若不说容易明白的话，怎能知道所说的是什么呢？这就是向空说话了。","So likewise ye, except ye utter by the tongue words easy to be understood, how shall it be known what is spoken? for ye shall speak into the air."],"45.14.10":["世上的聲音，或者甚多，卻沒有一樣是無意思的。","世上的声音，或者甚多，却没有一样是无意思的。","There are, it may be, so many kinds of voices in the world, and none of them [is] without signification."],"45.14.11":["我若不明白那聲音的意思，這說話的人必以我為化外之人，我也以他為化外之人。","我若不明白那声音的意思，这说话的人必以我为化外之人，我也以他为化外之人。","Therefore if I know not the meaning of the voice, I shall be unto him that speaketh a barbarian, and he that speaketh [shall be] a barbarian unto me."],"45.14.13":["所以那說方言的，就當求著能翻出來。","所以那说方言的，就当求着能翻出来。","Wherefore let him that speaketh in an [unknown] tongue pray that he may interpret."],"45.14.14":["我若用方言禱告，是我的靈禱告，但我的悟性沒有果效。","我若用方言祷告，是我的灵祷告，但我的悟性没有果效。","For if I pray in an [unknown] tongue, my spirit prayeth, but my understanding is unfruitful."],"45.14.15":["這卻怎麼樣呢？我要用靈禱告，也要用悟性禱告；我要用靈歌唱，也要用悟性歌唱。","这却怎么样呢？我要用灵祷告，也要用悟性祷告；我要用灵歌唱，也要用悟性歌唱。","What is it then? I will pray with the spirit, and I will pray with the understanding also: I will sing with the spirit, and I will sing with the understanding also."],"45.14.16":["不然，你用靈祝謝，那在座不通方言的人，既然不明白你的話，怎能在你感謝的時候說阿們呢？","不然，你用灵祝谢，那在座不通方言的人，既然不明白你的话，怎能在你感谢的时候说阿们呢？","Else when thou shalt bless with the spirit, how shall he that occupieth the room of the unlearned say Amen at thy giving of thanks, seeing he understandeth not what thou sayest?"],"45.14.18":["我感謝神，我說方言比你們眾人還多。","我感谢神，我说方言比你们众人还多。","I thank my God, I speak with tongues more than ye all:"],"45.14.19":["但在教會中，寧可用悟性說五句教導人的話，強如說萬句方言。","但在教会中，宁可用悟性说五句教导人的话，强如说万句方言。","Yet in the church I had rather speak five words with my understanding, that [by my voice] I might teach others also, than ten thousand words in an [unknown] tongue."],"45.14.27":["若有說方言的，只好兩個人，至多三個人，且要輪流著說，也要一個人翻出來。","若有说方言的，只好两个人，至多三个人，且要轮流着说，也要一个人翻出来。","If any man speak in an [unknown] tongue, [let it be] by two, or at the most [by] three, and [that] by course; and let one interpret."],"45.14.28":["若沒有人翻，就當在會中閉口，只對自己和神說就是了。","若没有人翻，就当在会中闭口，只对自己和神说就是了。","But if there be no interpreter, let him keep silence in the church; and let him speak to himself, and to God."],"18.77.13":["神啊，你的作為是潔淨的；有何神大如神呢？","神啊，你的作为是洁净的；有何神大如神呢？","Thy way, O God, [is] in the sanctuary: who [is so] great a God as [our] God?"],"57.8.5":["他們供奉的事本是天上事的形狀和影像，正如摩西將要造帳幕的時候，蒙神警戒他，說：你要謹慎，作各樣的物件都要照著在山上指示你的樣式。","他们供奉的事本是天上事的形状和影像，正如摩西将要造帐幕的时候，蒙神警戒他，说：你要谨慎，作各样的对象都要照着在山上指示你的样式。","Who serve unto the example and shadow of heavenly things, as Moses was admonished of God when he was about to make the tabernacle: for, See, saith he, [that] thou make all things according to the pattern shewed to thee in the mount."],"1.15.17":["你要將他們領進去，栽於你產業的山上─耶和華啊，就是你為自己所造的住處；主啊，就是你手所建立的聖所。","你要将他们领进去，栽于你产业的山上─耶和华啊，就是你为自己所造的住处；主啊，就是你手所创建的圣所。","Thou shalt bring them in, and plant them in the mountain of thine inheritance, [in] the place, O LORD, [which] thou hast made for thee to dwell in, [in] the Sanctuary, O Lord, [which] thy hands have established."],"1.25.8":["又當為我造聖所，使我可以住在他們中間。","又当为我造圣所，使我可以住在他们中间。","And let them make me a sanctuary; that I may dwell among them."],"1.25.9":["製造帳幕和其中的一切器具都要照我所指示你的樣式。","制造帐幕和其中的一切器具都要照我所指示你的样式。","According to all that I shew thee, [after] the pattern of the tabernacle, and the pattern of all the instruments thereof, even so shall ye make [it]."],"1.40.38":["日間，耶和華的雲彩是在帳幕以上；夜間，雲中有火，在以色列全家的眼前。在他們所行的路上都是這樣。","日间，耶和华的云彩是在帐幕以上；夜间，云中有火，在以色列全家的眼前。在他们所行的路上都是这样。","For the cloud of the LORD [was] upon the tabernacle by day, and fire was on it by night, in the sight of all the house of Israel, throughout all their journeys."],"1.26.18":["帳幕的南面要做板二十塊。","帐幕的南面要做板二十块。","And thou shalt make the boards for the tabernacle, twenty boards on the south side southward."],"1.26.20":["帳幕第二面，就是北面，也要做板二十塊","帐幕第二面，就是北面，也要做板二十块","And for the second side of the tabernacle on the north side [there shall be] twenty boards:"],"1.26.22":["帳幕的後面，就是西面，要做板六塊。","帐幕的后面，就是西面，要做板六块。","And for the sides of the tabernacle westward thou shalt make six boards."],"25.8.16":["他又領我到耶和華殿的內院。誰知，在耶和華的殿門口、廊子和祭壇中間，約有二十五個人背向耶和華的殿，面向東方拜日頭。","他又领我到耶和华殿的内院。谁知，在耶和华的殿门口、廊子和祭坛中间，约有二十五个人背向耶和华的殿，面向东方拜日头。","And he brought me into the inner court of the LORD'S house, and, behold, at the door of the temple of the LORD, between the porch and the altar, [were] about five and twenty men, with their backs toward the temple of the LORD, and their faces toward the east; and they worshipped the sun toward the east."],"57.8.1":["我們所講的事，其中第一要緊的，就是我們有這樣的大祭司，已經坐在天上至大者寶座的右邊，","我们所讲的事，其中第一要紧的，就是我们有这样的大祭司，已经坐在天上至大者宝座的右边，","Now of the things which we have spoken [this is] the sum: We have such an high priest, who is set on the right hand of the throne of the Majesty in the heavens;"],"57.8.2":["在聖所，就是真帳幕裡，作執事；這帳幕是主所支的，不是人所支的。","在圣所，就是真帐幕里，作执事；这帐幕是主所支的，不是人所支的。","A minister of the sanctuary, and of the true tabernacle, which the Lord pitched, and not man."],"57.9.11":["但現在基督已經來到，作了將來美事的大祭司，經過那更大更全備的帳幕，不是人手所造、也不是屬乎這世界的；","但现在基督已经来到，作了将来美事的大祭司，经过那更大更全备的帐幕，不是人手所造、也不是属乎这世界的；","But Christ being come an high priest of good things to come, by a greater and more perfect tabernacle, not made with hands, that is to say, not of this building;"],"65.15.5":["此後，我看見在天上那存法櫃的殿開了。","此后，我看见在天上那存法柜的殿开了。","And after that I looked, and, behold, the temple of the tabernacle of the testimony in heaven was opened:"],"57.9.1":["原來前約有禮拜的條例和屬世界的聖幕。","原来前约有礼拜的条例和属世界的圣幕。","Then verily the first [covenant] had also ordinances of divine service, and a worldly sanctuary."],"57.9.2":["因為有預備的帳幕，頭一層叫做聖所，裡面有燈臺、桌子，和陳設餅。","因为有预备的帐幕，头一层叫做圣所，里面有灯台、桌子，和陈设饼。","For there was a tabernacle made; the first, wherein [was] the candlestick, and the table, and the shewbread; which is called the sanctuary."],"57.9.3":["第二幔子後又有一層帳幕，叫做至聖所，","第二幔子后又有一层帐幕，叫做至圣所，","And after the second veil, the tabernacle which is called the Holiest of all;"],"65.4.1":["此後，我觀看，見天上有門開了。我初次聽見好像吹號的聲音，對我說：你上到這裡來，我要將以後必成的事指示你。","此后，我观看，见天上有门开了。我初次听见好像吹号的声音，对我说：你上到这里来，我要将以后必成的事指示你。","After this I looked, and, behold, a door [was] opened in heaven: and the first voice which I heard [was] as it were of a trumpet talking with me; which said, Come up hither, and I will shew thee things which must be hereafter."],"65.4.2":["我立刻被聖靈感動，見有一個寶座安置在天上，又有一位坐在寶座上。","我立刻被圣灵感动，见有一个宝座安置在天上，又有一位坐在宝座上。","And immediately I was in the spirit: and, behold, a throne was set in heaven, and [one] sat on the throne."],"65.4.3":["看那坐著的，好像碧玉和紅寶石；又有虹圍著寶座，好像綠寶石。","看那坐着的，好像碧玉和红宝石；又有虹围着宝座，好像绿宝石。","And he that sat was to look upon like a jasper and a sardine stone: and [there was] a rainbow round about the throne, in sight like unto an emerald."],"65.4.4":["寶座的周圍又有二十四個座位；其上坐著二十四位長老，身穿白衣，頭上戴著金冠冕。","宝座的周围又有二十四个座位；其上坐着二十四位长老，身穿白衣，头上戴着金冠冕。","And round about the throne [were] four and twenty seats: and upon the seats I saw four and twenty elders sitting, clothed in white raiment; and they had on their heads crowns of gold."],"65.4.5":["有閃電、聲音、雷轟從寶座中發出；又有七盞火燈在寶座前點著；這七燈就是神的七靈。","有闪电、声音、雷轰从宝座中发出；又有七盏火灯在宝座前点着；这七灯就是神的七灵。","And out of the throne proceeded lightnings and thunderings and voices: and [there were] seven lamps of fire burning before the throne, which are the seven Spirits of God."],"65.8.3":["另有一位天使，拿著金香爐來，站在祭壇旁邊。有許多香賜給他，要和眾聖徒的祈禱一同獻在寶座前的金壇上。","另有一位天使，拿着金香炉来，站在祭坛旁边。有许多香赐给他，要和众圣徒的祈祷一同献在宝座前的金坛上。","And another angel came and stood at the altar, having a golden censer; and there was given unto him much incense, that he should offer [it] with the prayers of all saints upon the golden altar which was before the throne."],"65.11.19":["當時，神天上的殿開了，在他殿中現出他的約櫃。隨後有閃電、聲音、雷轟、地震、大雹。","当时，神天上的殿开了，在他殿中现出他的约柜。随后有闪电、声音、雷轰、地震、大雹。","And the temple of God was opened in heaven, and there was seen in his temple the ark of his testament: and there were lightnings, and voices, and thunderings, and an earthquake, and great hail."],"1.25.16":["必將我所要賜給你的法版放在櫃裡。","必将我所要赐给你的法版放在柜里。","And thou shalt put into the ark the testimony which I shall give thee."],"1.25.21":["要將施恩座安在櫃的上邊，又將我所要賜給你的法版放在櫃裡。","要将施恩座安在柜的上边，又将我所要赐给你的法版放在柜里。","And thou shalt put the mercy seat above upon the ark; and in the ark thou shalt put the testimony that I shall give thee."],"1.31.18":["耶和華在西乃山和摩西說完了話，就把兩塊法版交給他，是神用指頭寫的石版。","耶和华在西乃山和摩西说完了话，就把两块法版交给他，是神用指头写的石版。","And he gave unto Moses, when he had made an end of communing with him upon mount Sinai, two tables of testimony, tables of stone, written with the finger of God."],"1.25.22":["我要在那裡與你相會，又要從法櫃施恩座上二基路伯中間，和你說我所要吩咐你傳給以色列人的一切事。","我要在那里与你相会，又要从法柜施恩座上二基路伯中间，和你说我所要吩咐你传给以色列人的一切事。","And there I will meet with thee, and I will commune with thee from above the mercy seat, from between the two cherubims which [are] upon the ark of the testimony, of all [things] which I will give thee in commandment unto the children of Israel."],"1.26.34":["又要把施恩座安在至聖所內的法櫃上，","又要把施恩座安在至圣所内的法柜上，","And thou shalt put the mercy seat upon the ark of the testimony in the most holy [place]."],"65.4.6":["寶座前好像一個玻璃海，如同水晶。寶座中和寶座周圍有四個活物，前後遍體都滿了眼睛。","宝座前好像一个玻璃海，如同水晶。宝座中和宝座周围有四个活物，前后遍体都满了眼睛。","And before the throne [there was] a sea of glass like unto crystal: and in the midst of the throne, and round about the throne, [were] four beasts full of eyes before and behind."],"65.4.7":["第一個活物像獅子，第二個像牛犢，第三個臉面像人，第四個像飛鷹。","第一个活物像狮子，第二个像牛犊，第三个脸面像人，第四个像飞鹰。","And the first beast [was] like a lion, and the second beast like a calf, and the third beast had a face as a man, and the fourth beast [was] like a flying eagle."],"65.4.8":["四活物各有六個翅膀，遍體內外都滿了眼睛。他們晝夜不住的說：聖哉！聖哉！聖哉！主神是昔在、今在、以後永在的全能者。","四活物各有六个翅膀，遍体内外都满了眼睛。他们昼夜不住的说：圣哉！圣哉！圣哉！主神是昔在、今在、以后永在的全能者。","And the four beasts had each of them six wings about [him]; and [they were] full of eyes within: and they rest not day and night, saying, Holy, holy, holy, Lord God Almighty, which was, and is, and is to come."],"65.4.9":["每逢四活物將榮耀、尊貴、感謝歸給那坐在寶座上、活到永永遠遠者的時候，","每逢四活物将荣耀、尊贵、感谢归给那坐在宝座上、活到永永远远者的时候，","And when those beasts give glory and honour and thanks to him that sat on the throne, who liveth for ever and ever,"],"65.4.10":["那二十四位長老就俯伏在坐寶座的面前敬拜那活到永永遠遠的，又把他們的冠冕放在寶座前，說：","那二十四位长老就俯伏在坐宝座的面前敬拜那活到永永远远的，又把他们的冠冕放在宝座前，说：","The four and twenty elders fall down before him that sat on the throne, and worship him that liveth for ever and ever, and cast their crowns before the throne, saying,"],"65.4.11":["我們的主，我們的神，你是配得榮耀、尊貴、權柄的；因為你創造了萬物，並且萬物是因你的旨意被創造而有的。","我们的主，我们的神，你是配得荣耀、尊贵、权柄的；因为你创造了万物，并且万物是因你的旨意被创造而有的。","Thou art worthy, O Lord, to receive glory and honour and power: for thou hast created all things, and for thy pleasure they are and were created."],"1.40.12":["要使亞倫和他兒子到會幕門口來，用水洗身。","要使亚伦和他儿子到会幕门口来，用水洗身。","And thou shalt bring Aaron and his sons unto the door of the tabernacle of the congregation, and wash them with water."],"1.40.13":["要給亞倫穿上聖衣，又膏他，使他成聖，可以給我供祭司的職分；","要给亚伦穿上圣衣，又膏他，使他成圣，可以给我供祭司的职分；","And thou shalt put upon Aaron the holy garments, and anoint him, and sanctify him; that he may minister unto me in the priest's office."],"1.40.14":["又要使他兒子來，給他們穿上內袍。","又要使他儿子来，给他们穿上内袍。","And thou shalt bring his sons, and clothe them with coats:"],"1.40.15":["怎樣膏他們的父親，也要照樣膏他們，使他們給我供祭司的職分。他們世世代代凡受膏的，就永遠當祭司的職任。","怎样膏他们的父亲，也要照样膏他们，使他们给我供祭司的职分。他们世世代代凡受膏的，就永远当祭司的职任。","And thou shalt anoint them, as thou didst anoint their father, that they may minister unto me in the priest's office: for their anointing shall surely be an everlasting priesthood throughout their generations."],"2.1.5":["他要在耶和華面前宰公牛；亞倫子孫作祭司的，要奉上血，把血灑在會幕門口、壇的周圍。","他要在耶和华面前宰公牛；亚伦子孙作祭司的，要奉上血，把血洒在会幕门口、坛的周围。","And he shall kill the bullock before the LORD: and the priests, Aaron's sons, shall bring the blood, and sprinkle the blood round about upon the altar that [is by] the door of the tabernacle of the congregation."],"2.1.6":["那人要剝去燔祭牲的皮，把燔祭牲切成塊子。","那人要剥去燔祭牲的皮，把燔祭牲切成块子。","And he shall flay the burnt offering, and cut it into his pieces."],"2.1.7":["祭司亞倫的子孫要把火放在壇上，把柴擺在火上。","祭司亚伦的子孙要把火放在坛上，把柴摆在火上。","And the sons of Aaron the priest shall put fire upon the altar, and lay the wood in order upon the fire:"],"2.1.8":["亞倫子孫作祭司的，要把肉塊和頭並脂油擺在壇上火的柴上。","亚伦子孙作祭司的，要把肉块和头并脂油摆在坛上火的柴上。","And the priests, Aaron's sons, shall lay the parts, the head, and the fat, in order upon the wood that [is] on the fire which [is] upon the altar:"],"2.1.9":["但燔祭的臟腑與腿要用水洗。祭司就要把一切全燒在壇上，當作燔祭，獻與耶和華為馨香的火祭。","但燔祭的脏腑与腿要用水洗。祭司就要把一切全烧在坛上，当作燔祭，献与耶和华为馨香的火祭。","But his inwards and his legs shall he wash in water: and the priest shall burn all on the altar, [to be] a burnt sacrifice, an offering made by fire, of a sweet savour unto the LORD."],"57.3.1":["同蒙天召的聖潔弟兄啊，你們應當思想我們所認為使者、為大祭司的耶穌。","同蒙天召的圣洁弟兄啊，你们应当思想我们所认为使者、为大祭司的耶稣。","Wherefore, holy brethren, partakers of the heavenly calling, consider the Apostle and High Priest of our profession, Christ Jesus;"],"57.4.14":["我們既然有一位已經升入高天尊榮的大祭司，就是神的兒子耶穌，便當持定所承認的道。","我们既然有一位已经升入高天尊荣的大祭司，就是神的儿子耶稣，便当持定所承认的道。","Seeing then that we have a great high priest, that is passed into the heavens, Jesus the Son of God, let us hold fast [our] profession."],"57.7.25":["凡靠著他進到神面前的人，他都能拯救到底；因為他是長遠活著，替他們祈求。","凡靠着他进到神面前的人，他都能拯救到底；因为他是长远活着，替他们祈求。","Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them."],"57.7.27":["他不像那些大祭司，每日必須先為自己的罪，後為百姓的罪獻祭；因為他只一次將自己獻上，就把這事成全了。","他不像那些大祭司，每日必须先为自己的罪，后为百姓的罪献祭；因为他只一次将自己献上，就把这事成全了。","Who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people's: for this he did once, when he offered up himself."],"57.7.28":["律法本是立軟弱的人為大祭司；但在律法以後起誓的話，是立兒子為大祭司，乃是成全到永遠的。","律法本是立软弱的人为大祭司；但在律法以后起誓的话，是立儿子为大祭司，乃是成全到永远的。","For the law maketh men high priests which have infirmity; but the word of the oath, which was since the law, [maketh] the Son, who is consecrated for evermore."],"2.4.3":["或是受膏的祭司犯罪，使百姓陷在罪裡，就當為他所犯的罪把沒有殘疾的公牛犢獻給耶和華為贖罪祭。","或是受膏的祭司犯罪，使百姓陷在罪里，就当为他所犯的罪把没有残疾的公牛犊献给耶和华为赎罪祭。","If the priest that is anointed do sin according to the sin of the people; then let him bring for his sin, which he hath sinned, a young bullock without blemish unto the LORD for a sin offering."],"2.4.4":["他要牽公牛到會幕門口，在耶和華面前按手在牛的頭上，把牛宰於耶和華面前。","他要牵公牛到会幕门口，在耶和华面前按手在牛的头上，把牛宰于耶和华面前。","And he shall bring the bullock unto the door of the tabernacle of the congregation before the LORD; and shall lay his hand upon the bullock's head, and kill the bullock before the LORD."],"2.4.5":["受膏的祭司要取些公牛的血帶到會幕，","受膏的祭司要取些公牛的血带到会幕，","And the priest that is anointed shall take of the bullock's blood, and bring it to the tabernacle of the congregation:"],"2.4.6":["把指頭蘸於血中，在耶和華面前對著聖所的幔子彈血七次，","把指头蘸于血中，在耶和华面前对着圣所的幔子弹血七次，","And the priest shall dip his finger in the blood, and sprinkle of the blood seven times before the LORD, before the vail of the sanctuary."],"2.4.7":["又要把些血抹在會幕內、耶和華面前香壇的四角上，再把公牛所有的血倒在會幕門口、燔祭壇的腳那裡。","又要把些血抹在会幕内、耶和华面前香坛的四角上，再把公牛所有的血倒在会幕门口、燔祭坛的脚那里。","And the priest shall put [some] of the blood upon the horns of the altar of sweet incense before the LORD, which [is] in the tabernacle of the congregation; and shall pour all the blood of the bullock at the bottom of the altar of the burnt offering, which [is at] the door of the tabernacle of the congregation."],"2.4.8":["要把贖罪祭公牛所有的脂油，乃是蓋臟的脂油和臟上所有的脂油，","要把赎罪祭公牛所有的脂油，乃是盖脏的脂油和脏上所有的脂油，","And he shall take off from it all the fat of the bullock for the sin offering; the fat that covereth the inwards, and all the fat that [is] upon the inwards,"],"2.4.9":["並兩個腰子和腰子上的脂油，就是靠腰兩旁的脂油，與肝上的網子和腰子，一概取下，","并两个腰子和腰子上的脂油，就是靠腰两旁的脂油，与肝上的网子和腰子，一概取下，","And the two kidneys, and the fat that [is] upon them, which [is] by the flanks, and the caul above the liver, with the kidneys, it shall he take away,"],"2.4.10":["與平安祭公牛上所取的一樣；祭司要把這些燒在燔祭的壇上。","与平安祭公牛上所取的一样；祭司要把这些烧在燔祭的坛上。","As it was taken off from the bullock of the sacrifice of peace offerings: and the priest shall burn them upon the altar of the burnt offering."],"2.4.11":["公牛的皮和所有的肉，並頭、腿、臟、腑、糞，","公牛的皮和所有的肉，并头、腿、脏、腑、粪，","And the skin of the bullock, and all his flesh, with his head, and with his legs, and his inwards, and his dung,"],"2.4.12":["就是全公牛，要搬到營外潔淨之地、倒灰之所，用火燒在柴上。","就是全公牛，要搬到营外洁净之地、倒灰之所，用火烧在柴上。","Even the whole bullock shall he carry forth without the camp unto a clean place, where the ashes are poured out, and burn him on the wood with fire: where the ashes are poured out shall he be burnt."],"57.5.1":["凡從人間挑選的大祭司，是奉派替人辦理屬神的事，為要獻上禮物和贖罪祭（或作：要為罪獻上禮物和祭物）。","凡从人间挑选的大祭司，是奉派替人办理属神的事，为要献上礼物和赎罪祭（或作：要为罪献上礼物和祭物）。","For every high priest taken from among men is ordained for men in things [pertaining] to God, that he may offer both gifts and sacrifices for sins:"],"57.7.26":["像這樣聖潔、無邪惡、無玷污、遠離罪人、高過諸天的大祭司，原是與我們合宜的。","像这样圣洁、无邪恶、无玷污、远离罪人、高过诸天的大祭司，原是与我们合宜的。","For such an high priest became us, [who is] holy, harmless, undefiled, separate from sinners, and made higher than the heavens;"],"57.4.15":["因我們的大祭司並非不能體恤我們的軟弱。他也曾凡事受過試探，與我們一樣，只是他沒有犯罪。","因我们的大祭司并非不能体恤我们的软弱。他也曾凡事受过试探，与我们一样，只是他没有犯罪。","For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as [we are, yet] without sin."],"61.2.1":["我小子們哪，我將這些話寫給你們，是要叫你們不犯罪。若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。","我小子们哪，我将这些话写给你们，是要叫你们不犯罪。若有人犯罪，在父那里我们有一位中保，就是那义者耶稣基督。","My little children, these things write I unto you, that ye sin not. And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:"],"2.1.1":["耶和華從會幕中呼叫摩西，對他說：","耶和华从会幕中调用摩西，对他说：","And the LORD called unto Moses, and spake unto him out of the tabernacle of the congregation, saying,"],"2.1.2":["你曉諭以色列人說：你們中間若有人獻供物給耶和華，要從牛群羊群中獻牲畜為供物。","你晓谕以色列人说：你们中间若有人献供物给耶和华，要从牛群羊群中献牲畜为供物。","Speak unto the children of Israel, and say unto them, If any man of you bring an offering unto the LORD, ye shall bring your offering of the cattle, [even] of the herd, and of the flock."],"2.1.3":["他的供物若以牛為燔祭，就要在會幕門口獻一隻沒有殘疾的公牛，可以在耶和華面前蒙悅納。","他的供物若以牛为燔祭，就要在会幕门口献一只没有残疾的公牛，可以在耶和华面前蒙悦纳。","If his offering [be] a burnt sacrifice of the herd, let him offer a male without blemish: he shall offer it of his own voluntary will at the door of the tabernacle of the congregation before the LORD."],"2.1.4":["他要按手在燔祭牲的頭上，燔祭便蒙悅納，為他贖罪。","他要按手在燔祭牲的头上，燔祭便蒙悦纳，为他赎罪。","And he shall put his hand upon the head of the burnt offering; and it shall be accepted for him to make atonement for him."],"2.1.10":["人的供物若以綿羊或山羊為燔祭，就要獻上沒有殘疾的公羊。","人的供物若以绵羊或山羊为燔祭，就要献上没有残疾的公羊。","And if his offering [be] of the flocks, [namely], of the sheep, or of the goats, for a burnt sacrifice; he shall bring it a male without blemish."],"2.4.27":["民中若有人行了耶和華所吩咐不可行的什麼事，誤犯了罪，","民中若有人行了耶和华所吩咐不可行的什么事，误犯了罪，","And if any one of the common people sin through ignorance, while he doeth [somewhat against] any of the commandments of the LORD [concerning things] which ought not to be done, and be guilty;"],"2.4.28":["所犯的罪自己知道了，就要為所犯的罪牽一隻沒有殘疾的母山羊為供物，","所犯的罪自己知道了，就要为所犯的罪牵一只没有残疾的母山羊为供物，","Or if his sin, which he hath sinned, come to his knowledge: then he shall bring his offering, a kid of the goats, a female without blemish, for his sin which he hath sinned."],"2.4.29":["按手在贖罪祭牲的頭上，在那宰燔祭牲的地方宰了。","按手在赎罪祭牲的头上，在那宰燔祭牲的地方宰了。","And he shall lay his hand upon the head of the sin offering, and slay the sin offering in the place of the burnt offering."],"2.4.30":["祭司要用指頭蘸些羊的血，抹在燔祭壇的四角上，所有的血都要倒在壇的腳那裡，","祭司要用指头蘸些羊的血，抹在燔祭坛的四角上，所有的血都要倒在坛的脚那里，","And the priest shall take of the blood thereof with his finger, and put [it] upon the horns of the altar of burnt offering, and shall pour out all the blood thereof at the bottom of the altar."],"2.4.31":["又要把羊所有的脂油都取下，正如取平安祭牲的脂油一樣。祭司要在壇上焚燒，在耶和華面前作為馨香的祭，為他贖罪，他必蒙赦免。","又要把羊所有的脂油都取下，正如取平安祭牲的脂油一样。祭司要在坛上焚烧，在耶和华面前作为馨香的祭，为他赎罪，他必蒙赦免。","And he shall take away all the fat thereof, as the fat is taken away from off the sacrifice of peace offerings; and the priest shall burn [it] upon the altar for a sweet savour unto the LORD; and the priest shall make an atonement for him, and it shall be forgiven him."],"2.4.32":["人若牽一隻綿羊羔為贖罪祭的供物，必要牽一隻沒有殘疾的母羊，","人若牵一只绵羊羔为赎罪祭的供物，必要牵一只没有残疾的母羊，","And if he bring a lamb for a sin offering, he shall bring it a female without blemish."],"2.4.33":["按手在贖罪祭牲的頭上，在那宰燔祭牲的地方宰了作贖罪祭。","按手在赎罪祭牲的头上，在那宰燔祭牲的地方宰了作赎罪祭。","And he shall lay his hand upon the head of the sin offering, and slay it for a sin offering in the place where they kill the burnt offering."],"2.4.34":["祭司要用指頭蘸些贖罪祭牲的血，抹在燔祭壇的四角上，所有的血都要倒在壇的腳那裡，","祭司要用指头蘸些赎罪祭牲的血，抹在燔祭坛的四角上，所有的血都要倒在坛的脚那里，","And the priest shall take of the blood of the sin offering with his finger, and put [it] upon the horns of the altar of burnt offering, and shall pour out all the blood thereof at the bottom of the altar:"],"2.4.35":["又要把所有的脂油都取下，正如取平安祭羊羔的脂油一樣。祭司要按獻給耶和華火祭的條例，燒在壇上。至於所犯的罪，祭司要為他贖了，他必蒙赦免。","又要把所有的脂油都取下，正如取平安祭羊羔的脂油一样。祭司要按献给耶和华火祭的条例，烧在坛上。至于所犯的罪，祭司要为他赎了，他必蒙赦免。","And he shall take away all the fat thereof, as the fat of the lamb is taken away from the sacrifice of the peace offerings; and the priest shall burn them upon the altar, according to the offerings made by fire unto the LORD: and the priest shall make an atonement for his sin that he hath committed, and it shall be forgiven him."],"2.17.11":["因為活物的生命是在血中。我把這血賜給你們，可以在壇上為你們的生命贖罪；因血裡有生命，所以能贖罪。","因为活物的生命是在血中。我把这血赐给你们，可以在坛上为你们的生命赎罪；因血里有生命，所以能赎罪。","For the life of the flesh [is] in the blood: and I have given it to you upon the altar to make an atonement for your souls: for it [is] the blood [that] maketh an atonement for the soul."],"2.17.14":["論到一切活物的生命，就在血中。所以我對以色列人說：無論什麼活物的血，你們都不可吃，因為一切活物的血就是他的生命。凡吃了血的，必被剪除。","论到一切活物的生命，就在血中。所以我对以色列人说：无论什么活物的血，你们都不可吃，因为一切活物的血就是他的生命。凡吃了血的，必被剪除。","For [it is] the life of all flesh; the blood of it [is] for the life thereof: therefore I said unto the children of Israel, Ye shall eat the blood of no manner of flesh: for the life of all flesh [is] the blood thereof: whosoever eateth it shall be cut off."],"57.9.12":["並且不用山羊和牛犢的血，乃用自己的血，只一次進入聖所，成了永遠贖罪的事。","并且不用山羊和牛犊的血，乃用自己的血，只一次进入圣所，成了永远赎罪的事。","Neither by the blood of goats and calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption [for us]."],"57.9.13":["若山羊和公牛的血，並母牛犢的灰，灑在不潔的人身上，尚且叫人成聖，身體潔淨，","若山羊和公牛的血，并母牛犊的灰，洒在不洁的人身上，尚且叫人成圣，身体洁净，","For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh:"],"57.9.14":["何況基督藉著永遠的靈，將自己無瑕無疵獻給神，他的血豈不更能洗淨你們的心（原文是良心），除去你們的死行，使你們事奉那永生神嗎？","何况基督借着永远的灵，将自己无瑕无疵献给神，他的血岂不更能洗净你们的心（原文是良心），除去你们的死行，使你们事奉那永生神吗？","How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?"],"2.16.16":["他因以色列人諸般的污穢、過犯，就是他們一切的罪愆，當這樣在聖所行贖罪之禮，並因會幕在他們污穢之中，也要照樣而行。","他因以色列人诸般的污秽、过犯，就是他们一切的罪愆，当这样在圣所行赎罪之礼，并因会幕在他们污秽之中，也要照样而行。","And he shall make an atonement for the holy [place], because of the uncleanness of the children of Israel, and because of their transgressions in all their sins: and so shall he do for the tabernacle of the congregation, that remaineth among them in the midst of their uncleanness."],"2.16.29":["每逢七月初十日，你們要刻苦己心，無論是本地人，是寄居在你們中間的外人，什麼工都不可做；這要作你們永遠的定例。","每逢七月初十日，你们要刻苦己心，无论是本地人，是寄居在你们中间的外人，什么工都不可做；这要作你们永远的定例。","And [this] shall be a statute for ever unto you: [that] in the seventh month, on the tenth [day] of the month, ye shall afflict your souls, and do no work at all, [whether it be] one of your own country, or a stranger that sojourneth among you:"],"2.16.30":["因在這日要為你們贖罪，使你們潔淨。你們要在耶和華面前得以潔淨，脫盡一切的罪愆。","因在这日要为你们赎罪，使你们洁净。你们要在耶和华面前得以洁净，脱尽一切的罪愆。","For on that day shall [the priest] make an atonement for you, to cleanse you, [that] ye may be clean from all your sins before the LORD."],"2.16.31":["這日你們要守為聖安息日，要刻苦己心；這為永遠的定例。","这日你们要守为圣安息日，要刻苦己心；这为永远的定例。","It [shall be] a sabbath of rest unto you, and ye shall afflict your souls, by a statute for ever."],"2.16.32":["那受膏、接續他父親承接聖職的祭司要穿上細麻布的聖衣，行贖罪之禮。","那受膏、接续他父亲承接圣职的祭司要穿上细麻布的圣衣，行赎罪之礼。","And the priest, whom he shall anoint, and whom he shall consecrate to minister in the priest's office in his father's stead, shall make the atonement, and shall put on the linen clothes, [even] the holy garments:"],"2.16.33":["他要在至聖所和會幕與壇行贖罪之禮，並要為眾祭司和會眾的百姓贖罪。","他要在至圣所和会幕与坛行赎罪之礼，并要为众祭司和会众的百姓赎罪。","And he shall make an atonement for the holy sanctuary, and he shall make an atonement for the tabernacle of the congregation, and for the altar, and he shall make an atonement for the priests, and for all the people of the congregation."],"2.16.34":["這要作你們永遠的定例─就是因以色列人一切的罪，要一年一次為他們贖罪。於是，亞倫照耶和華所吩咐摩西的行了。","这要作你们永远的定例─就是因以色列人一切的罪，要一年一次为他们赎罪。于是，亚伦照耶和华所吩咐摩西的行了。","And this shall be an everlasting statute unto you, to make an atonement for the children of Israel for all their sins once a year. And he did as the LORD commanded Moses."],"57.9.7":["至於第二層帳幕，惟有大祭司一年一次獨自進去，沒有不帶著血為自己和百姓的過錯獻上。","至于第二层帐幕，惟有大祭司一年一次独自进去，没有不带着血为自己和百姓的过错献上。","But into the second [went] the high priest alone once every year, not without blood, which he offered for himself, and [for] the errors of the people:"],"57.9.25":["也不是多次將自己獻上，像那大祭司每年帶著牛羊的血（牛羊的血：原文作不是自己的血）進入聖所，","也不是多次将自己献上，像那大祭司每年带着牛羊的血（牛羊的血：原文作不是自己的血）进入圣所，","Nor yet that he should offer himself often, as the high priest entereth into the holy place every year with blood of others;"],"57.9.23":["照著天上樣式作的物件必須用這些祭物去潔淨；但那天上的本物自然當用更美的祭物去潔淨。","照着天上样式作的对象必须用这些祭物去洁净；但那天上的本物自然当用更美的祭物去洁净。","[It was] therefore necessary that the patterns of things in the heavens should be purified with these; but the heavenly things themselves with better sacrifices than these."],"57.9.24":["因為基督並不是進了人手所造的聖所（這不過是真聖所的影像），乃是進了天堂，如今為我們顯在神面前；","因为基督并不是进了人手所造的圣所（这不过是真圣所的影像），乃是进了天堂，如今为我们显在神面前；","For Christ is not entered into the holy places made with hands, [which are] the figures of the true; but into heaven itself, now to appear in the presence of God for us:"],"57.9.26":["如果這樣，他從創世以來，就必多次受苦了。但如今在這末世顯現一次，把自己獻為祭，好除掉罪。","如果这样，他从创世以来，就必多次受苦了。但如今在这末世显现一次，把自己献为祭，好除掉罪。","For then must he often have suffered since the foundation of the world: but now once in the end of the world hath he appeared to put away sin by the sacrifice of himself."],"57.9.27":["按著定命，人人都有一死，死後且有審判。","按着定命，人人都有一死，死后且有审判。","And as it is appointed unto men once to die, but after this the judgment:"],"57.9.28":["像這樣，基督既然一次被獻，擔當了多人的罪，將來要向那等候他的人第二次顯現，並與罪無關，乃是為拯救他們。","像这样，基督既然一次被献，担当了多人的罪，将来要向那等候他的人第二次显现，并与罪无关，乃是为拯救他们。","So Christ was once offered to bear the sins of many; and unto them that look for him shall he appear the second time without sin unto salvation."],"26.8.13":["我聽見有一位聖者說話，又有一位聖者問那說話的聖者說：這除掉常獻的燔祭和施行毀壞的罪過，將聖所與軍旅（或譯：以色列的軍）踐踏的異象，要到幾時才應驗呢？","我听见有一位圣者说话，又有一位圣者问那说话的圣者说：这除掉常献的燔祭和施行毁坏的罪过，将圣所与军旅（或译：以色列的军）践踏的异象，要到几时才应验呢？","Then I heard one saint speaking, and another saint said unto that certain [saint] which spake, How long [shall be] the vision [concerning] the daily [sacrifice], and the transgression of desolation, to give both the sanctuary and the host to be trodden under foot?"],"26.8.14":["他對我說：到二千三百日，聖所就必潔淨。","他对我说：到二千三百日，圣所就必洁净。","And he said unto me, Unto two thousand and three hundred days; then shall the sanctuary be cleansed."],"26.9.25":["你當知道，當明白，從出令重新建造耶路撒冷，直到有受膏君的時候，必有七個七和六十二個七。正在艱難的時候，耶路撒冷城連街帶濠都必重新建造。","你当知道，当明白，从出令重新建造耶路撒冷，直到有受膏君的时候，必有七个七和六十二个七。正在艰难的时候，耶路撒冷城连街带濠都必重新建造。","Know therefore and understand, [that] from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince [shall be] seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times."],"14.4.7":["亞達薛西年間，比施蘭、米特利達、他別，和他們的同黨上本奏告波斯王亞達薛西。本章是用亞蘭文字，亞蘭方言。","亚达薛西年间，比施兰、米特利达、他别，和他们的同党上本奏告波斯王亚达薛西。本章是用亚兰文本，亚兰方言。","And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of their companions, unto Artaxerxes king of Persia; and the writing of the letter [was] written in the Syrian tongue, and interpreted in the Syrian tongue."],"14.4.8":["省長利宏、書記伸帥要控告耶路撒冷人，也上本奏告亞達薛西王。","省长利宏、书记伸帅要控告耶路撒冷人，也上本奏告亚达薛西王。","Rehum the chancellor and Shimshai the scribe wrote a letter against Jerusalem to Artaxerxes the king in this sort:"],"14.4.9":["省長利宏、書記伸帥，和同黨的底拿人、亞法薩提迦人、他毘拉人、亞法撒人、亞基衛人、巴比倫人、書珊迦人、底亥人、以攔人，","省长利宏、书记伸帅，和同党的底拿人、亚法萨提迦人、他毘拉人、亚法撒人、亚基卫人、巴比伦人、书珊迦人、底亥人、以拦人，","Then [wrote] Rehum the chancellor, and Shimshai the scribe, and the rest of their companions; the Dinaites, the Apharsathchites, the Tarpelites, the Apharsites, the Archevites, the Babylonians, the Susanchites, the Dehavites, [and] the Elamites,"],"14.4.10":["和尊大的亞斯那巴所遷移、安置在撒瑪利亞城，並大河西一帶地方的人等，","和尊大的亚斯那巴所迁移、安置在撒玛利亚城，并大河西一带地方的人等，","And the rest of the nations whom the great and noble Asnappar brought over, and set in the cities of Samaria, and the rest [that are] on this side the river, and at such a time."],"14.4.11":["上奏亞達薛西王說：河西的臣民云云：","上奏亚达薛西王说：河西的臣民云云：","This [is] the copy of the letter that they sent unto him, [even] unto Artaxerxes the king; Thy servants the men on this side the river, and at such a time."],"14.4.12":["王該知道，從王那裡上到我們這裡的猶大人，已經到耶路撒冷重建這反叛惡劣的城，築立根基，建造城牆。","王该知道，从王那里上到我们这里的犹大人，已经到耶路撒冷重建这反叛恶劣的城，筑立根基，建造城墙。","Be it known unto the king, that the Jews which came up from thee to us are come unto Jerusalem, building the rebellious and the bad city, and have set up the walls [thereof], and joined the foundations."],"14.4.13":["如今王該知道，他們若建造這城，城牆完畢就不再與王進貢，交課，納稅，終久王必受虧損。","如今王该知道，他们若建造这城，城墙完毕就不再与王进贡，交课，纳税，终久王必受亏损。","Be it known now unto the king, that, if this city be builded, and the walls set up [again, then] will they not pay toll, tribute, and custom, and [so] thou shalt endamage the revenue of the kings."],"14.4.14":["我們既食御鹽，不忍見王吃虧，因此奏告於王。","我们既食御盐，不忍见王吃亏，因此奏告于王。","Now because we have maintenance from [the king's] palace, and it was not meet for us to see the king's dishonour, therefore have we sent and certified the king;"],"14.4.15":["請王考察先王的實錄，必在其上查知這城是反叛的城，與列王和各省有害；自古以來，其中常有悖逆的事，因此這城曾被拆毀。","请王考察先王的实录，必在其上查知这城是反叛的城，与列王和各省有害；自古以来，其中常有悖逆的事，因此这城曾被拆毁。","That search may be made in the book of the records of thy fathers: so shalt thou find in the book of the records, and know that this city [is] a rebellious city, and hurtful unto kings and provinces, and that they have moved sedition within the same of old time: for which cause was this city destroyed."],"3.14.34":["按你們窺探那地的四十日，一年頂一日，你們要擔當罪孽四十年，就知道我與你們疏遠了，","按你们窥探那地的四十日，一年顶一日，你们要担当罪孽四十年，就知道我与你们疏远了，","After the number of the days in which ye searched the land, [even] forty days, each day for a year, shall ye bear your iniquities, [even] forty years, and ye shall know my breach of promise."],"25.4.6":["再者，你滿了這些日子，還要向右側臥，擔當猶大家的罪孽。我給你定規側臥四十日，一日頂一年。","再者，你满了这些日子，还要向右侧卧，担当犹大家的罪孽。我给你定规侧卧四十日，一日顶一年。","And when thou hast accomplished them, lie again on thy right side, and thou shalt bear the iniquity of the house of Judah forty days: I have appointed thee each day for a year."],"26.8.1":["伯沙撒王在位第三年，有異象現與我─但以理，是在先前所見的異象之後。","伯沙撒王在位第三年，有异象现与我─但以理，是在先前所见的异象之后。","In the third year of the reign of king Belshazzar a vision appeared unto me, [even unto] me Daniel, after that which appeared unto me at the first."],"26.8.2":["我見了異象的時候，我以為在以攔省書珊城（或譯：宮）中；我見異象又如在烏萊河邊。","我见了异象的时候，我以为在以拦省书珊城（或译：宫）中；我见异象又如在乌莱河边。","And I saw in a vision; and it came to pass, when I saw, that I [was] at Shushan [in] the palace, which [is] in the province of Elam; and I saw in a vision, and I was by the river of Ulai."],"26.8.3":["我舉目觀看，見有雙角的公綿羊站在河邊，兩角都高。這角高過那角，更高的是後長的。","我举目观看，见有双角的公绵羊站在河边，两角都高。这角高过那角，更高的是后长的。","Then I lifted up mine eyes, and saw, and, behold, there stood before the river a ram which had [two] horns: and the [two] horns [were] high; but one [was] higher than the other, and the higher came up last."],"26.8.4":["我見那公綿羊往西、往北、往南牴觸。獸在他面前都站立不住，也沒有能救護脫離他手的；但他任意而行，自高自大。","我见那公绵羊往西、往北、往南抵触。兽在他面前都站立不住，也没有能救护脱离他手的；但他任意而行，自高自大。","I saw the ram pushing westward, and northward, and southward; so that no beasts might stand before him, neither [was there any] that could deliver out of his hand; but he did according to his will, and became great."],"26.8.5":["我正思想的時候，見有一隻公山羊從西而來，遍行全地，腳不沾塵。這山羊兩眼當中有一非常的角。","我正思想的时候，见有一只公山羊从西而来，遍行全地，脚不沾尘。这山羊两眼当中有一非常的角。","And as I was considering, behold, an he goat came from the west on the face of the whole earth, and touched not the ground: and the goat [had] a notable horn between his eyes."],"26.8.6":["他往我所看見、站在河邊有雙角的公綿羊那裡去，大發忿怒，向他直闖。","他往我所看见、站在河边有双角的公绵羊那里去，大发忿怒，向他直闯。","And he came to the ram that had [two] horns, which I had seen standing before the river, and ran unto him in the fury of his power."],"26.8.7":["我見公山羊就近公綿羊，向他發烈怒，牴觸他，折斷他的兩角。綿羊在他面前站立不住；他將綿羊觸倒在地，用腳踐踏，沒有能救綿羊脫離他手的。","我见公山羊就近公绵羊，向他发烈怒，抵触他，折断他的两角。绵羊在他面前站立不住；他将绵羊触倒在地，用脚践踏，没有能救绵羊脱离他手的。","And I saw him come close unto the ram, and he was moved with choler against him, and smote the ram, and brake his two horns: and there was no power in the ram to stand before him, but he cast him down to the ground, and stamped upon him: and there was none that could deliver the ram out of his hand."],"26.8.8":["這山羊極其自高自大，正強盛的時候，那大角折斷了，又在角根上向天的四方（原文是風）長出四個非常的角來。","这山羊极其自高自大，正强盛的时候，那大角折断了，又在角根上向天的四方（原文是风）长出四个非常的角来。","Therefore the he goat waxed very great: and when he was strong, the great horn was broken; and for it came up four notable ones toward the four winds of heaven."],"26.8.9":["四角之中有一角長出一個小角，向南、向東、向榮美之地，漸漸成為強大。","四角之中有一角长出一个小角，向南、向东、向荣美之地，渐渐成为强大。","And out of one of them came forth a little horn, which waxed exceeding great, toward the south, and toward the east, and toward the pleasant [land]."],"26.8.10":["他漸漸強大，高及天象，將些天象和星宿拋落在地，用腳踐踏。","他渐渐强大，高及天象，将些天象和星宿抛落在地，用脚践踏。","And it waxed great, [even] to the host of heaven; and it cast down [some] of the host and of the stars to the ground, and stamped upon them."],"26.8.11":["並且他自高自大，以為高及天象之君；除掉常獻給君的燔祭，毀壞君的聖所。","并且他自高自大，以为高及天象之君；除掉常献给君的燔祭，毁坏君的圣所。","Yea, he magnified [himself] even to the prince of the host, and by him the daily [sacrifice] was taken away, and the place of his sanctuary was cast down."],"26.8.12":["因罪過的緣故，有軍旅和常獻的燔祭交付他。他將真理拋在地上，任意而行，無不順利。","因罪过的缘故，有军旅和常献的燔祭交付他。他将真理抛在地上，任意而行，无不顺利。","And an host was given [him] against the daily [sacrifice] by reason of transgression, and it cast down the truth to the ground; and it practised, and prospered."],"26.8.15":["我─但以理見了這異象，願意明白其中的意思。忽有一位形狀像人的站在我面前。","我─但以理见了这异象，愿意明白其中的意思。忽有一位形状像人的站在我面前。","And it came to pass, when I, [even] I Daniel, had seen the vision, and sought for the meaning, then, behold, there stood before me as the appearance of a man."],"26.8.16":["我又聽見烏萊河兩岸中有人聲呼叫說：加百列啊，要使此人明白這異象。","我又听见乌莱河两岸中有人声调用说：加百列啊，要使此人明白这异象。","And I heard a man's voice between [the banks of] Ulai, which called, and said, Gabriel, make this [man] to understand the vision."],"26.8.17":["他便來到我所站的地方。他一來，我就驚慌俯伏在地；他對我說：人子啊，你要明白，因為這是關乎末後的異象。","他便来到我所站的地方。他一来，我就惊慌俯伏在地；他对我说：人子啊，你要明白，因为这是关乎末后的异象。","So he came near where I stood: and when he came, I was afraid, and fell upon my face: but he said unto me, Understand, O son of man: for at the time of the end [shall be] the vision."],"26.8.18":["他與我說話的時候，我面伏在地沉睡；他就摸我，扶我站起來，","他与我说话的时候，我面伏在地沉睡；他就摸我，扶我站起来，","Now as he was speaking with me, I was in a deep sleep on my face toward the ground: but he touched me, and set me upright."],"26.8.19":["說：我要指示你惱怒臨完必有的事，因為這是關乎末後的定期。","说：我要指示你恼怒临完必有的事，因为这是关乎末后的定期。","And he said, Behold, I will make thee know what shall be in the last end of the indignation: for at the time appointed the end [shall be]."],"26.8.20":["你所看見雙角的公綿羊，就是瑪代和波斯王。","你所看见双角的公绵羊，就是玛代和波斯王。","The ram which thou sawest having [two] horns [are] the kings of Media and Persia."],"26.8.21":["那公山羊就是希利尼王（希利尼：原文是雅完；下同）；兩眼當中的大角就是頭一王。","那公山羊就是希利尼王（希利尼：原文是雅完；下同）；两眼当中的大角就是头一王。","And the rough goat [is] the king of Grecia: and the great horn that [is] between his eyes [is] the first king."],"26.8.22":["至於那折斷了的角，在其根上又長出四角，這四角就是四國，必從這國裡興起來，只是權勢都不及他。","至于那折断了的角，在其根上又长出四角，这四角就是四国，必从这国里兴起来，只是权势都不及他。","Now that being broken, whereas four stood up for it, four kingdoms shall stand up out of the nation, but not in his power."],"26.8.23":["這四國末時，犯法的人罪惡滿盈，必有一王興起，面貌凶惡，能用雙關的詐語。","这四国末时，犯法的人罪恶满盈，必有一王兴起，面貌凶恶，能用双关的诈语。","And in the latter time of their kingdom, when the transgressors are come to the full, a king of fierce countenance, and understanding dark sentences, shall stand up."],"26.8.24":["他的權柄必大，卻不是因自己的能力；他必行非常的毀滅，事情順利，任意而行；又必毀滅有能力的和聖民。","他的权柄必大，却不是因自己的能力；他必行非常的毁灭，事情顺利，任意而行；又必毁灭有能力的和圣民。","And his power shall be mighty, but not by his own power: and he shall destroy wonderfully, and shall prosper, and practise, and shall destroy the mighty and the holy people."],"26.8.25":["他用權術成就手中的詭計，心裡自高自大，在人坦然無備的時候，毀滅多人；又要站起來攻擊萬君之君，至終卻非因人手而滅亡。","他用权术成就手中的诡计，心里自高自大，在人坦然无备的时候，毁灭多人；又要站起来攻击万君之君，至终却非因人手而灭亡。","And through his policy also he shall cause craft to prosper in his hand; and he shall magnify [himself] in his heart, and by peace shall destroy many: he shall also stand up against the Prince of princes; but he shall be broken without hand."],"26.8.26":["所說二千三百日的異象是真的，但你要將這異象封住，因為關乎後來許多的日子。","所说二千三百日的异象是真的，但你要将这异象封住，因为关乎后来许多的日子。","And the vision of the evening and the morning which was told [is] true: wherefore shut thou up the vision; for it [shall be] for many days."],"26.8.27":["於是我─但以理昏迷不醒，病了數日，然後起來辦理王的事務。我因這異象驚奇，卻無人能明白其中的意思。","于是我─但以理昏迷不醒，病了数日，然后起来办理王的事务。我因这异象惊奇，却无人能明白其中的意思。","And I Daniel fainted, and was sick [certain] days; afterward I rose up, and did the king's business; and I was astonished at the vision, but none understood [it]."],"26.9.1":["瑪代族亞哈隨魯的兒子大利烏立為迦勒底國的王元年，","玛代族亚哈随鲁的儿子大利乌立为迦勒底国的王元年，","In the first year of Darius the son of Ahasuerus, of the seed of the Medes, which was made king over the realm of the Chaldeans;"],"26.9.2":["就是他在位第一年，我但以理從書上得知耶和華的話臨到先知耶利米，論耶路撒冷荒涼的年數，七十年為滿。","就是他在位第一年，我但以理从书上得知耶和华的话临到先知耶利米，论耶路撒冷荒凉的年数，七十年为满。","In the first year of his reign I Daniel understood by books the number of the years, whereof the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem."],"26.9.3":["我便禁食，披麻蒙灰，定意向主神祈禱懇求。","我便禁食，披麻蒙灰，定意向主神祈祷恳求。","And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:"],"26.9.4":["我向耶和華─我的神祈禱、認罪，說：主啊，大而可畏的神，向愛主、守主誡命的人守約施慈愛。","我向耶和华─我的神祈祷、认罪，说：主啊，大而可畏的神，向爱主、守主诫命的人守约施慈爱。","And I prayed unto the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;"],"26.9.5":["我們犯罪作孽，行惡叛逆，偏離你的誡命典章，","我们犯罪作孽，行恶叛逆，偏离你的诫命典章，","We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:"],"26.9.6":["沒有聽從你僕人眾先知奉你名向我們君王、首領、列祖，和國中一切百姓所說的話。","没有听从你仆人众先知奉你名向我们君王、首领、列祖，和国中一切百姓所说的话。","Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land."],"26.9.7":["主啊，你是公義的，我們是臉上蒙羞的；因我們猶大人和耶路撒冷的居民，並以色列眾人，或在近處，或在遠處，被你趕到各國的人，都得罪了你，正如今日一樣。","主啊，你是公义的，我们是脸上蒙羞的；因我们犹大人和耶路撒冷的居民，并以色列众人，或在近处，或在远处，被你赶到各国的人，都得罪了你，正如今日一样。","O Lord, righteousness [belongeth] unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, [that are] near, and [that are] far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed against thee."],"26.9.8":["主啊，我們和我們的君王、首領、列祖因得罪了你，就都臉上蒙羞。","主啊，我们和我们的君王、首领、列祖因得罪了你，就都脸上蒙羞。","O Lord, to us [belongeth] confusion of face, to our kings, to our princes, and to our fathers, because we have sinned against thee."],"26.9.9":["主─我們的神是憐憫饒恕人的，我們卻違背了他，","主─我们的神是怜悯饶恕人的，我们却违背了他，","To the Lord our God [belong] mercies and forgivenesses, though we have rebelled against him;"],"26.9.10":["也沒有聽從耶和華─我們神的話，沒有遵行他藉僕人眾先知向我們所陳明的律法。","也没有听从耶和华─我们神的话，没有遵行他藉仆人众先知向我们所陈明的律法。","Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets."],"26.9.11":["以色列眾人都犯了你的律法，偏行，不聽從你的話；因此，在你僕人摩西律法上所寫的咒詛和誓言都傾在我們身上，因我們得罪了神。","以色列众人都犯了你的律法，偏行，不听从你的话；因此，在你仆人摩西律法上所写的咒诅和誓言都倾在我们身上，因我们得罪了神。","Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that [is] written in the law of Moses the servant of God, because we have sinned against him."],"26.9.12":["他使大災禍臨到我們，成就了警戒我們和審判我們官長的話；原來在普天之下未曾行過像在耶路撒冷所行的。","他使大灾祸临到我们，成就了警戒我们和审判我们官长的话；原来在普天之下未曾行过像在耶路撒冷所行的。","And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven hath not been done as hath been done upon Jerusalem."],"26.9.13":["這一切災禍臨到我們身上是照摩西律法上所寫的，我們卻沒有求耶和華─我們神的恩典，使我們回頭離開罪孽，明白你的真理。","这一切灾祸临到我们身上是照摩西律法上所写的，我们却没有求耶和华─我们神的恩典，使我们回头离开罪孽，明白你的真理。","As [it is] written in the law of Moses, all this evil is come upon us: yet made we not our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth."],"26.9.14":["所以耶和華留意使這災禍臨到我們身上，因為耶和華─我們的神在他所行的事上都是公義；我們並沒有聽從他的話。","所以耶和华留意使这灾祸临到我们身上，因为耶和华─我们的神在他所行的事上都是公义；我们并没有听从他的话。","Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God [is] righteous in all his works which he doeth: for we obeyed not his voice."],"26.9.15":["主─我們的神啊，你曾用大能的手領你的子民出埃及地，使自己得了名，正如今日一樣。我們犯了罪，作了惡。","主─我们的神啊，你曾用大能的手领你的子民出埃及地，使自己得了名，正如今日一样。我们犯了罪，作了恶。","And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly."],"26.9.16":["主啊，求你按你的大仁大義，使你的怒氣和忿怒轉離你的城耶路撒冷，就是你的聖山。耶路撒冷和你的子民，因我們的罪惡和我們列祖的罪孽被四圍的人羞辱。","主啊，求你按你的大仁大义，使你的怒气和忿怒转离你的城耶路撒冷，就是你的圣山。耶路撒冷和你的子民，因我们的罪恶和我们列祖的罪孽被四围的人羞辱。","O Lord, according to all thy righteousness, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins, and for the iniquities of our fathers, Jerusalem and thy people [are become] a reproach to all [that are] about us."],"26.9.17":["我們的神啊，現在求你垂聽僕人的祈禱懇求，為自己使臉光照你荒涼的聖所。","我们的神啊，现在求你垂听仆人的祈祷恳求，为自己使脸光照你荒凉的圣所。","Now therefore, O our God, hear the prayer of thy servant, and his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord's sake."],"26.9.18":["我的神啊，求你側耳而聽，睜眼而看，眷顧我們荒涼之地和稱為你名下的城。我們在你面前懇求，原不是因自己的義，乃因你的大憐憫。","我的神啊，求你侧耳而听，睁眼而看，眷顾我们荒凉之地和称为你名下的城。我们在你面前恳求，原不是因自己的义，乃因你的大怜悯。","O my God, incline thine ear, and hear; open thine eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies."],"26.9.19":["求主垂聽，求主赦免，求主應允而行，為你自己不要遲延。我的神啊，因這城和這民都是稱為你名下的。","求主垂听，求主赦免，求主应允而行，为你自己不要迟延。我的神啊，因这城和这民都是称为你名下的。","O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thine own sake, O my God: for thy city and thy people are called by thy name."],"26.9.20":["我說話，禱告，承認我的罪和本國之民以色列的罪，為我神的聖山，在耶和華─我神面前懇求。","我说话，祷告，承认我的罪和本国之民以色列的罪，为我神的圣山，在耶和华─我神面前恳求。","And whiles I [was] speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;"],"26.9.21":["我正禱告的時候，先前在異象中所見的那位加百列，奉命迅速飛來，約在獻晚祭的時候，按手在我身上。","我正祷告的时候，先前在异象中所见的那位加百列，奉命迅速飞来，约在献晚祭的时候，按手在我身上。","Yea, whiles I [was] speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation."],"26.9.22":["他指教我說：但以理啊，現在我出來要使你有智慧，有聰明。","他指教我说：但以理啊，现在我出来要使你有智能，有聪明。","And he informed [me], and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding."],"26.9.23":["你初懇求的時候，就發出命令，我來告訴你，因你大蒙眷愛；所以你要思想明白這以下的事和異象。","你初恳求的时候，就发出命令，我来告诉你，因你大蒙眷爱；所以你要思想明白这以下的事和异象。","At the beginning of thy supplications the commandment came forth, and I am come to shew [thee]; for thou [art] greatly beloved: therefore understand the matter, and consider the vision."],"26.9.24":["為你本國之民和你聖城，已經定了七十個七。要止住罪過，除淨罪惡，贖盡罪孽，引進（或譯：彰顯）永義，封住異象和預言，並膏至聖者（者：或譯所）。","为你本国之民和你圣城，已经定了七十个七。要止住罪过，除净罪恶，赎尽罪孽，引进（或译：彰显）永义，封住异象和预言，并膏至圣者（者：或译所）。","Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy."],"26.9.26":["過了六十二個七，那（或譯：有）受膏者必被剪除，一無所有；必有一王的民來毀滅這城和聖所，至終必如洪水沖沒。必有爭戰，一直到底，荒涼的事已經定了。","过了六十二个七，那（或译：有）受膏者必被剪除，一无所有；必有一王的民来毁灭这城和圣所，至终必如洪水冲没。必有争战，一直到底，荒凉的事已经定了。","And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof [shall be] with a flood, and unto the end of the war desolations are determined."],"26.9.27":["一七之內，他必與許多人堅定盟約；一七之半，他必使祭祀與供獻止息。那行毀壞可憎的（或譯：使地荒涼的）如飛而來，並且有忿怒傾在那行毀壞的身上（或譯：傾在那荒涼之地），直到所定的結局。","一七之内，他必与许多人坚定盟约；一七之半，他必使祭祀与供献止息。那行毁坏可憎的（或译：使地荒凉的）如飞而来，并且有忿怒倾在那行毁坏的身上（或译：倾在那荒凉之地），直到所定的结局。","And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make [it] desolate, even until the consummation, and that determined shall be poured upon the desolate."],"39.27.50":["耶穌又大聲喊叫，氣就斷了。","耶稣又大声喊叫，气就断了。","Jesus, when he had cried again with a loud voice, yielded up the ghost."],"39.27.51":["忽然，殿裡的幔子從上到下裂為兩半，地也震動，磐石也崩裂，","忽然，殿里的幔子从上到下裂为两半，地也震动，磐石也崩裂，","And, behold, the veil of the temple was rent in twain from the top to the bottom; and the earth did quake, and the rocks rent;"],"40.15.37":["耶穌大聲喊叫，氣就斷了。","耶稣大声喊叫，气就断了。","And Jesus cried with a loud voice, and gave up the ghost."],"40.15.38":["殿裡的幔子從上到下裂為兩半。","殿里的幔子从上到下裂为两半。","And the veil of the temple was rent in twa
