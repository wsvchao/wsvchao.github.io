in from the top to the bottom."],"41.23.45":["日頭變黑了；殿裡的幔子從當中裂為兩半。","日头变黑了；殿里的幔子从当中裂为两半。","And the sun was darkened, and the veil of the temple was rent in the midst."],"41.23.46":["耶穌大聲喊著說：父啊！我將我的靈魂交在你手裡。說了這話，氣就斷了。","耶稣大声喊着说：父啊！我将我的灵魂交在你手里。说了这话，气就断了。","And when Jesus had cried with a loud voice, he said, Father, into thy hands I commend my spirit: and having said thus, he gave up the ghost."],"57.8.3":["凡大祭司都是為獻禮物和祭物設立的，所以這位大祭司也必須有所獻的。","凡大祭司都是为献礼物和祭物设立的，所以这位大祭司也必须有所献的。","For every high priest is ordained to offer gifts and sacrifices: wherefore [it is] of necessity that this man have somewhat also to offer."],"57.9.8":["聖靈用此指明，頭一層帳幕仍存的時候，進入至聖所的路還未顯明。","圣灵用此指明，头一层帐幕仍存的时候，进入至圣所的路还未显明。","The Holy Ghost this signifying, that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing:"],"57.9.9":["那頭一層帳幕作現今的一個表樣，所獻的禮物和祭物，就著良心說，都不能叫禮拜的人得以完全。","那头一层帐幕作现今的一个表样，所献的礼物和祭物，就着良心说，都不能叫礼拜的人得以完全。","Which [was] a figure for the time then present, in which were offered both gifts and sacrifices, that could not make him that did the service perfect, as pertaining to the conscience;"],"57.9.10":["這些事，連那飲食和諸般洗濯的規矩，都不過是屬肉體的條例，命定到振興的時候為止。","这些事，连那饮食和诸般洗濯的规矩，都不过是属肉体的条例，命定到振兴的时候为止。","[Which stood] only in meats and drinks, and divers washings, and carnal ordinances, imposed [on them] until the time of reformation."],"43.5.31":["神且用右手將他高舉（或作：他就是神高舉在自己的右邊），叫他作君王，作救主，將悔改的心和赦罪的恩賜給以色列人。","神且用右手将他高举（或作：他就是神高举在自己的右边），叫他作君王，作救主，将悔改的心和赦罪的恩赐给以色列人。","Him hath God exalted with his right hand [to be] a Prince and a Saviour, for to give repentance to Israel, and forgiveness of sins."],"65.11.18":["外邦發怒，你的忿怒也臨到了；審判死人的時候也到了。你的僕人眾先知和眾聖徒，凡敬畏你名的人，連大帶小得賞賜的時候也到了。你敗壞那些敗壞世界之人的時候也就到了。","外邦发怒，你的忿怒也临到了；审判死人的时候也到了。你的仆人众先知和众圣徒，凡敬畏你名的人，连大带小得赏赐的时候也到了。你败坏那些败坏世界之人的时候也就到了。","And the nations were angry, and thy wrath is come, and the time of the dead, that they should be judged, and that thou shouldest give reward unto thy servants the prophets, and to the saints, and them that fear thy name, small and great; and shouldest destroy them which destroy the earth."],"65.21.1":["我又看見一個新天新地；因為先前的天地已經過去了，海也不再有了。","我又看见一个新天新地；因为先前的天地已经过去了，海也不再有了。","And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea."],"65.21.2":["我又看見聖城新耶路撒冷由神那裡從天而降，預備好了，就如新婦妝飾整齊，等候丈夫。","我又看见圣城新耶路撒冷由神那里从天而降，预备好了，就如新妇妆饰整齐，等候丈夫。","And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband."],"65.21.3":["我聽見有大聲音從寶座出來說：看哪，神的帳幕在人間。他要與人同住，他們要作他的子民。神要親自與他們同在，作他們的神。","我听见有大声音从宝座出来说：看哪，神的帐幕在人间。他要与人同住，他们要作他的子民。神要亲自与他们同在，作他们的神。","And I heard a great voice out of heaven saying, Behold, the tabernacle of God [is] with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, [and be] their God."],"39.5.15":["人點燈，不放在斗底下，是放在燈臺上，就照亮一家的人。","人点灯，不放在斗底下，是放在灯台上，就照亮一家的人。","Neither do men light a candle, and put it under a bushel, but on a candlestick; and it giveth light unto all that are in the house."],"39.5.16":["你們的光也當這樣照在人前，叫他們看見你們的好行為，便將榮耀歸給你們在天上的父。","你们的光也当这样照在人前，叫他们看见你们的好行为，便将荣耀归给你们在天上的父。","Let your light so shine before men, that they may see your good works, and glorify your Father which is in heaven."],"39.24.32":["你們可以從無花果樹學個比方：當樹枝發嫩長葉的時候，你們就知道夏天近了。","你们可以从无花果树学个比方：当树枝发嫩长叶的时候，你们就知道夏天近了。","Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer [is] nigh:"],"39.24.33":["這樣，你們看見這一切的事，也該知道人子近了，正在門口了。","这样，你们看见这一切的事，也该知道人子近了，正在门口了。","So likewise ye, when ye shall see all these things, know that it is near, [even] at the doors."],"39.24.34":["我實在告訴你們，這世代還沒有過去，這些事都要成就。","我实在告诉你们，这世代还没有过去，这些事都要成就。","Verily I say unto you, This generation shall not pass, till all these things be fulfilled."],"39.24.35":["天地要廢去，我的話卻不能廢去。","天地要废去，我的话却不能废去。","Heaven and earth shall pass away, but my words shall not pass away."],"41.11.5":["耶穌又說：你們中間誰有一個朋友半夜到他那裡去，說：朋友！請借給我三個餅；","耶稣又说：你们中间谁有一个朋友半夜到他那里去，说：朋友！请借给我三个饼；","And he said unto them, Which of you shall have a friend, and shall go unto him at midnight, and say unto him, Friend, lend me three loaves;"],"41.11.6":["因為我有一個朋友行路，來到我這裡，我沒有什麼給他擺上。","因为我有一个朋友行路，来到我这里，我没有什么给他摆上。","For a friend of mine in his journey is come to me, and I have nothing to set before him?"],"41.11.7":["那人在裡面回答說：不要攪擾我，門已經關閉，孩子們也同我在床上了，我不能起來給你。","那人在里面回答说：不要搅扰我，门已经关闭，孩子们也同我在床上了，我不能起来给你。","And he from within shall answer and say, Trouble me not: the door is now shut, and my children are with me in bed; I cannot rise and give thee."],"41.11.8":["我告訴你們，雖不因他是朋友起來給他，但因他情詞迫切的直求，就必起來照他所需用的給他。","我告诉你们，虽不因他是朋友起来给他，但因他情词迫切的直求，就必起来照他所需用的给他。","I say unto you, Though he will not rise and give him, because he is his friend, yet because of his importunity he will rise and give him as many as he needeth."],"41.11.9":["我又告訴你們，你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。","我又告诉你们，你们祈求，就给你们；寻找，就寻见；叩门，就给你们开门。","And I say unto you, Ask, and it shall be given you; seek, and ye shall find; knock, and it shall be opened unto you."],"41.11.10":["因為，凡祈求的，就得著；尋找的，就尋見；叩門的，就給他開門。","因为，凡祈求的，就得着；寻找的，就寻见；叩门的，就给他开门。","For every one that asketh receiveth; and he that seeketh findeth; and to him that knocketh it shall be opened."],"41.11.11":["你們中間作父親的，誰有兒子求餅，反給他石頭呢？求魚，反拿蛇當魚給他呢？","你们中间作父亲的，谁有儿子求饼，反给他石头呢？求鱼，反拿蛇当鱼给他呢？","If a son shall ask bread of any of you that is a father, will he give him a stone? or if [he ask] a fish, will he for a fish give him a serpent?"],"41.11.12":["求雞蛋，反給他蠍子呢？","求鸡蛋，反给他蝎子呢？","Or if he shall ask an egg, will he offer him a scorpion?"],"41.11.13":["你們雖然不好，尚且知道拿好東西給兒女；何況天父，豈不更將聖靈給求他的人嗎？","你们虽然不好，尚且知道拿好东西给儿女；何况天父，岂不更将圣灵给求他的人吗？","If ye then, being evil, know how to give good gifts unto your children: how much more shall [your] heavenly Father give the Holy Spirit to them that ask him?"],"41.10.25":["有一個律法師起來試探耶穌，說：夫子！我該做什麼才可以承受永生？","有一个律法师起来试探耶稣，说：夫子！我该做什么才可以承受永生？","And, behold, a certain lawyer stood up, and tempted him, saying, Master, what shall I do to inherit eternal life?"],"41.10.26":["耶穌對他說：律法上寫的是什麼？你念的是怎樣呢？","耶稣对他说：律法上写的是什么？你念的是怎样呢？","He said unto him, What is written in the law? how readest thou?"],"41.10.27":["他回答說：你要盡心、盡性、盡力、盡意愛主─你的神；又要愛鄰舍如同自己。","他回答说：你要尽心、尽性、尽力、尽意爱主─你的神；又要爱邻舍如同自己。","And he answering said, Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy strength, and with all thy mind; and thy neighbour as thyself."],"41.10.28":["耶穌說：你回答的是；你這樣行，就必得永生。","耶稣说：你回答的是；你这样行，就必得永生。","And he said unto him, Thou hast answered right: this do, and thou shalt live."],"41.10.29":["那人要顯明自己有理，就對耶穌說：誰是我的鄰舍呢？","那人要显明自己有理，就对耶稣说：谁是我的邻舍呢？","But he, willing to justify himself, said unto Jesus, And who is my neighbour?"],"41.10.30":["耶穌回答說：有一個人從耶路撒冷下耶利哥去，落在強盜手中。他們剝去他的衣裳，把他打個半死，就丟下他走了。","耶稣回答说：有一个人从耶路撒冷下耶利哥去，落在强盗手中。他们剥去他的衣裳，把他打个半死，就丢下他走了。","And Jesus answering said, A certain [man] went down from Jerusalem to Jericho, and fell among thieves, which stripped him of his raiment, and wounded [him], and departed, leaving [him] half dead."],"41.10.31":["偶然有一個祭司從這條路下來，看見他就從那邊過去了。","偶然有一个祭司从这条路下来，看见他就从那边过去了。","And by chance there came down a certain priest that way: and when he saw him, he passed by on the other side."],"41.10.32":["又有一個利未人來到這地方，看見他，也照樣從那邊過去了。","又有一个利未人来到这地方，看见他，也照样从那边过去了。","And likewise a Levite, when he was at the place, came and looked [on him], and passed by on the other side."],"41.10.33":["惟有一個撒瑪利亞人行路來到那裡，看見他就動了慈心，","惟有一个撒玛利亚人行路来到那里，看见他就动了慈心，","But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion [on him],"],"41.10.34":["上前用油和酒倒在他的傷處，包裹好了，扶他騎上自己的牲口，帶到店裡去照應他。","上前用油和酒倒在他的伤处，包裹好了，扶他骑上自己的牲口，带到店里去照应他。","And went to [him], and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him."],"41.10.35":["第二天拿出二錢銀子來，交給店主，說：你且照應他；此外所費用的，我回來必還你。","第二天拿出二钱银子来，交给店主，说：你且照应他；此外所费用的，我回来必还你。","And on the morrow when he departed, he took out two pence, and gave [them] to the host, and said unto him, Take care of him; and whatsoever thou spendest more, when I come again, I will repay thee."],"41.10.36":["你想，這三個人哪一個是落在強盜手中的鄰舍呢？","你想，这三个人哪一个是落在强盗手中的邻舍呢？","Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves?"],"41.10.37":["他說：是憐憫他的。耶穌說：你去照樣行吧。","他说：是怜悯他的。耶稣说：你去照样行吧。","And he said, He that shewed mercy on him. Then said Jesus unto him, Go, and do thou likewise."],"39.13.44":["天國好像寶貝藏在地裡，人遇見了就把他藏起來，歡歡喜喜的去變賣一切所有的，買這塊地。","天国好像宝贝藏在地里，人遇见了就把他藏起来，欢欢喜喜的去变卖一切所有的，买这块地。","Again, the kingdom of heaven is like unto treasure hid in a field; the which when a man hath found, he hideth, and for joy thereof goeth and selleth all that he hath, and buyeth that field."],"39.7.24":["所以，凡聽見我這話就去行的，好比一個聰明人，把房子蓋在磐石上；","所以，凡听见我这话就去行的，好比一个聪明人，把房子盖在磐石上；","Therefore whosoever heareth these sayings of mine, and doeth them, I will liken him unto a wise man, which built his house upon a rock:"],"39.7.25":["雨淋，水沖，風吹，撞著那房子，房子總不倒塌，因為根基立在磐石上。","雨淋，水冲，风吹，撞着那房子，房子总不倒塌，因为根基立在磐石上。","And the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell not: for it was founded upon a rock."],"39.7.26":["凡聽見我這話不去行的，好比一個無知的人，把房子蓋在沙土上；","凡听见我这话不去行的，好比一个无知的人，把房子盖在沙土上；","And every one that heareth these sayings of mine, and doeth them not, shall be likened unto a foolish man, which built his house upon the sand:"],"39.7.27":["雨淋，水沖，風吹，撞著那房子，房子就倒塌了，並且倒塌得很大。","雨淋，水冲，风吹，撞着那房子，房子就倒塌了，并且倒塌得很大。","And the rain descended, and the floods came, and the winds blew, and beat upon that house; and it fell: and great was the fall of it."],"41.15.8":["或是一個婦人有十塊錢，若失落一塊，豈不點上燈，打掃屋子，細細的找，直到找著嗎？","或是一个妇人有十块钱，若失落一块，岂不点上灯，打扫屋子，细细的找，直到找着吗？","Either what woman having ten pieces of silver, if she lose one piece, doth not light a candle, and sweep the house, and seek diligently till she find [it]?"],"41.15.9":["找著了，就請朋友鄰舍來，對他們說：我失落的那塊錢已經找著了，你們和我一同歡喜吧！","找着了，就请朋友邻舍来，对他们说：我失落的那块钱已经找着了，你们和我一同欢喜吧！","And when she hath found [it], she calleth [her] friends and [her] neighbours together, saying, Rejoice with me; for I have found the piece which I had lost."],"41.15.10":["我告訴你們，一個罪人悔改，在神的使者面前也是這樣為他歡喜。","我告诉你们，一个罪人悔改，在神的使者面前也是这样为他欢喜。","Likewise, I say unto you, there is joy in the presence of the angels of God over one sinner that repenteth."],"41.15.4":["你們中間誰有一百隻羊失去一隻，不把這九十九隻撇在曠野、去找那失去的羊，直到找著呢？","你们中间谁有一百只羊失去一只，不把这九十九只撇在旷野、去找那失去的羊，直到找着呢？","What man of you, having an hundred sheep, if he lose one of them, doth not leave the ninety and nine in the wilderness, and go after that which is lost, until he find it?"],"41.15.5":["找著了，就歡歡喜喜的扛在肩上，回到家裡，","找着了，就欢欢喜喜的扛在肩上，回到家里，","And when he hath found [it], he layeth [it] on his shoulders, rejoicing."],"41.15.6":["就請朋友鄰舍來，對他們說：我失去的羊已經找著了，你們和我一同歡喜吧！","就请朋友邻舍来，对他们说：我失去的羊已经找着了，你们和我一同欢喜吧！","And when he cometh home, he calleth together [his] friends and neighbours, saying unto them, Rejoice with me; for I have found my sheep which was lost."],"41.15.7":["我告訴你們，一個罪人悔改，在天上也要這樣為他歡喜，較比為九十九個不用悔改的義人歡喜更大。","我告诉你们，一个罪人悔改，在天上也要这样为他欢喜，较比为九十九个不用悔改的义人欢喜更大。","I say unto you, that likewise joy shall be in heaven over one sinner that repenteth, more than over ninety and nine just persons, which need no repentance."],"39.13.31":["他又設個比喻對他們說：天國好像一粒芥菜種，有人拿去種在田裡。","他又设个比喻对他们说：天国好像一粒芥菜种，有人拿去种在田里。","Another parable put he forth unto them, saying, The kingdom of heaven is like to a grain of mustard seed, which a man took, and sowed in his field:"],"39.13.32":["這原是百種裡最小的，等到長起來，卻比各樣的菜都大，且成了樹，天上的飛鳥來宿在他的枝上。","这原是百种里最小的，等到长起来，却比各样的菜都大，且成了树，天上的飞鸟来宿在他的枝上。","Which indeed is the least of all seeds: but when it is grown, it is the greatest among herbs, and becometh a tree, so that the birds of the air come and lodge in the branches thereof."],"39.13.47":["天國又好像網撒在海裡，聚攏各樣水族，","天国又好像网撒在海里，聚拢各样水族，","Again, the kingdom of heaven is like unto a net, that was cast into the sea, and gathered of every kind:"],"39.13.48":["網既滿了，人就拉上岸來，坐下，揀好的收在器具裡，將不好的丟棄了。","网既满了，人就拉上岸来，坐下，拣好的收在器具里，将不好的丢弃了。","Which, when it was full, they drew to shore, and sat down, and gathered the good into vessels, but cast the bad away."],"39.13.49":["世界的末了也要這樣。天使要出來，從義人中把惡人分別出來，","世界的末了也要这样。天使要出来，从义人中把恶人分别出来，","So shall it be at the end of the world: the angels shall come forth, and sever the wicked from among the just,"],"39.13.45":["天國又好像買賣人尋找好珠子，","天国又好像买卖人寻找好珠子，","Again, the kingdom of heaven is like unto a merchant man, seeking goodly pearls:"],"39.13.46":["遇見一顆重價的珠子，就去變賣他一切所有的，買了這顆珠子。","遇见一颗重价的珠子，就去变卖他一切所有的，买了这颗珠子。","Who, when he had found one pearl of great price, went and sold all that he had, and bought it."],"41.18.9":["耶穌向那些仗著自己是義人，藐視別人的，設一個比喻，","耶稣向那些仗着自己是义人，藐视别人的，设一个比喻，","And he spake this parable unto certain which trusted in themselves that they were righteous, and despised others:"],"41.18.10":["說：有兩個人上殿裡去禱告：一個是法利賽人，一個是稅吏。","说：有两个人上殿里去祷告：一个是法利赛人，一个是税吏。","Two men went up into the temple to pray; the one a Pharisee, and the other a publican."],"41.18.11":["法利賽人站著，自言自語的禱告說：神啊，我感謝你，我不像別人勒索、不義、姦淫，也不像這個稅吏。","法利赛人站着，自言自语的祷告说：神啊，我感谢你，我不像别人勒索、不义、奸淫，也不像这个税吏。","The Pharisee stood and prayed thus with himself, God, I thank thee, that I am not as other men [are], extortioners, unjust, adulterers, or even as this publican."],"41.18.12":["我一個禮拜禁食兩次，凡我所得的都捐上十分之一。","我一个礼拜禁食两次，凡我所得的都捐上十分之一。","I fast twice in the week, I give tithes of all that I possess."],"41.18.13":["那稅吏遠遠的站著，連舉目望天也不敢，只捶著胸說：神啊，開恩可憐我這個罪人！","那税吏远远的站着，连举目望天也不敢，只捶着胸说：神啊，开恩可怜我这个罪人！","And the publican, standing afar off, would not lift up so much as [his] eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner."],"41.18.14":["我告訴你們，這人回家去比那人倒算為義了；因為，凡自高的，必降為卑；自卑的，必升為高。","我告诉你们，这人回家去比那人倒算为义了；因为，凡自高的，必降为卑；自卑的，必升为高。","I tell you, this man went down to his house justified [rather] than the other: for every one that exalteth himself shall be abased; and he that humbleth himself shall be exalted."],"41.15.11":["耶穌又說：一個人有兩個兒子。","耶稣又说：一个人有两个儿子。","And he said, A certain man had two sons:"],"41.15.12":["小兒子對父親說：父親，請你把我應得的家業分給我。他父親就把產業分給他們。","小儿子对父亲说：父亲，请你把我应得的家业分给我。他父亲就把产业分给他们。","And the younger of them said to [his] father, Father, give me the portion of goods that falleth [to me]. And he divided unto them [his] living."],"41.15.13":["過了不多幾日，小兒子就把他一切所有的都收拾起來，往遠方去了。在那裡任意放蕩，浪費資財。","过了不多几日，小儿子就把他一切所有的都收拾起来，往远方去了。在那里任意放荡，浪费资财。","And not many days after the younger son gathered all together, and took his journey into a far country, and there wasted his substance with riotous living."],"41.15.14":["既耗盡了一切所有的，又遇著那地方大遭饑荒，就窮苦起來。","既耗尽了一切所有的，又遇着那地方大遭饥荒，就穷苦起来。","And when he had spent all, there arose a mighty famine in that land; and he began to be in want."],"41.15.15":["於是去投靠那地方的一個人；那人打發他到田裡去放豬。","于是去投靠那地方的一个人；那人打发他到田里去放猪。","And he went and joined himself to a citizen of that country; and he sent him into his fields to feed swine."],"41.15.16":["他恨不得拿豬所吃的豆莢充飢，也沒有人給他。","他恨不得拿猪所吃的豆荚充饥，也没有人给他。","And he would fain have filled his belly with the husks that the swine did eat: and no man gave unto him."],"41.15.17":["他醒悟過來，就說：我父親有多少的雇工，口糧有餘，我倒在這裡餓死嗎？","他醒悟过来，就说：我父亲有多少的雇工，口粮有余，我倒在这里饿死吗？","And when he came to himself, he said, How many hired servants of my father's have bread enough and to spare, and I perish with hunger!"],"41.15.18":["我要起來，到我父親那裡去，向他說：父親！我得罪了天，又得罪了你；","我要起来，到我父亲那里去，向他说：父亲！我得罪了天，又得罪了你；","I will arise and go to my father, and will say unto him, Father, I have sinned against heaven, and before thee,"],"41.15.19":["從今以後，我不配稱為你的兒子，把我當作一個雇工吧！","从今以后，我不配称为你的儿子，把我当作一个雇工吧！","And am no more worthy to be called thy son: make me as one of thy hired servants."],"41.15.20":["於是起來，往他父親那裡去。相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。","于是起来，往他父亲那里去。相离还远，他父亲看见，就动了慈心，跑去抱着他的颈项，连连与他亲嘴。","And he arose, and came to his father. But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him."],"41.15.21":["兒子說：父親！我得罪了天，又得罪了你；從今以後，我不配稱為你的兒子。","儿子说：父亲！我得罪了天，又得罪了你；从今以后，我不配称为你的儿子。","And the son said unto him, Father, I have sinned against heaven, and in thy sight, and am no more worthy to be called thy son."],"41.15.22":["父親卻吩咐僕人說：把那上好的袍子快拿出來給他穿；把戒指戴在他指頭上；把鞋穿在他腳上；","父亲却吩咐仆人说：把那上好的袍子快拿出来给他穿；把戒指戴在他指头上；把鞋穿在他脚上；","But the father said to his servants, Bring forth the best robe, and put [it] on him; and put a ring on his hand, and shoes on [his] feet:"],"41.15.23":["把那肥牛犢牽來宰了，我們可以吃喝快樂；","把那肥牛犊牵来宰了，我们可以吃喝快乐；","And bring hither the fatted calf, and kill [it]; and let us eat, and be merry:"],"41.15.24":["因為我這個兒子是死而復活，失而又得的。他們就快樂起來。","因为我这个儿子是死而复活，失而又得的。他们就快乐起来。","For this my son was dead, and is alive again; he was lost, and is found. And they began to be merry."],"41.15.25":["那時，大兒子正在田裡。他回來，離家不遠，聽見作樂跳舞的聲音，","那时，大儿子正在田里。他回来，离家不远，听见作乐跳舞的声音，","Now his elder son was in the field: and as he came and drew nigh to the house, he heard musick and dancing."],"41.15.26":["便叫過一個僕人來，問是什麼事。","便叫过一个仆人来，问是什么事。","And he called one of the servants, and asked what these things meant."],"41.15.27":["僕人說：你兄弟來了；你父親因為得他無災無病的回來，把肥牛犢宰了。","仆人说：你兄弟来了；你父亲因为得他无灾无病的回来，把肥牛犊宰了。","And he said unto him, Thy brother is come; and thy father hath killed the fatted calf, because he hath received him safe and sound."],"41.15.28":["大兒子卻生氣，不肯進去；他父親就出來勸他。","大儿子却生气，不肯进去；他父亲就出来劝他。","And he was angry, and would not go in: therefore came his father out, and intreated him."],"41.15.29":["他對父親說：我服事你這多年，從來沒有違背過你的命，你並沒有給我一隻山羊羔，叫我和朋友一同快樂。","他对父亲说：我服事你这多年，从来没有违背过你的命，你并没有给我一只山羊羔，叫我和朋友一同快乐。","And he answering said to [his] father, Lo, these many years do I serve thee, neither transgressed I at any time thy commandment: and yet thou never gavest me a kid, that I might make merry with my friends:"],"41.15.30":["但你這個兒子和娼妓吞盡了你的產業，他一來了，你倒為他宰了肥牛犢。","但你这个儿子和娼妓吞尽了你的产业，他一来了，你倒为他宰了肥牛犊。","But as soon as this thy son was come, which hath devoured thy living with harlots, thou hast killed for him the fatted calf."],"41.15.31":["父親對他說：兒啊！你常和我同在，我一切所有的都是你的；","父亲对他说：儿啊！你常和我同在，我一切所有的都是你的；","And he said unto him, Son, thou art ever with me, and all that I have is thine."],"41.15.32":["只是你這個兄弟是死而復活、失而又得的，所以我們理當歡喜快樂。","只是你这个兄弟是死而复活、失而又得的，所以我们理当欢喜快乐。","It was meet that we should make merry, and be glad: for this thy brother was dead, and is alive again; and was lost, and is found."],"39.25.32":["萬民都要聚集在他面前。他要把他們分別出來，好像牧羊的分別綿羊山羊一般，","万民都要聚集在他面前。他要把他们分别出来，好像牧羊的分别绵羊山羊一般，","And before him shall be gathered all nations: and he shall separate them one from another, as a shepherd divideth [his] sheep from the goats:"],"39.25.33":["把綿羊安置在右邊，山羊在左邊。","把绵羊安置在右边，山羊在左边。","And he shall set the sheep on his right hand, but the goats on the left."],"39.25.34":["於是王要向那右邊的說：你們這蒙我父賜福的，可來承受那創世以來為你們所預備的國；","于是王要向那右边的说：你们这蒙我父赐福的，可来承受那创世以来为你们所预备的国；","Then shall the King say unto them on his right hand, Come, ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world:"],"39.25.35":["因為我餓了，你們給我吃，渴了，你們給我喝；我作客旅，你們留我住；","因为我饿了，你们给我吃，渴了，你们给我喝；我作客旅，你们留我住；","For I was an hungred, and ye gave me meat: I was thirsty, and ye gave me drink: I was a stranger, and ye took me in:"],"39.25.36":["我赤身露體，你們給我穿；我病了、你們看顧我；我在監裡，你們來看我。","我赤身露体，你们给我穿；我病了、你们看顾我；我在监里，你们来看我。","Naked, and ye clothed me: I was sick, and ye visited me: I was in prison, and ye came unto me."],"39.13.18":["所以，你們當聽這撒種的比喻。","所以，你们当听这撒种的比喻。","Hear ye therefore the parable of the sower."],"39.13.19":["凡聽見天國道理不明白的，那惡者就來，把所撒在他心裡的奪了去；這就是撒在路旁的了。","凡听见天国道理不明白的，那恶者就来，把所撒在他心里的夺了去；这就是撒在路旁的了。","When any one heareth the word of the kingdom, and understandeth [it] not, then cometh the wicked [one], and catcheth away that which was sown in his heart. This is he which received seed by the way side."],"39.13.20":["撒在石頭地上的，就是人聽了道，當下歡喜領受，","撒在石头地上的，就是人听了道，当下欢喜领受，","But he that received the seed into stony places, the same is he that heareth the word, and anon with joy receiveth it;"],"39.13.21":["只因心裡沒有根，不過是暫時的，及至為道遭了患難，或是受了逼迫，立刻就跌倒了。","只因心里没有根，不过是暂时的，及至为道遭了患难，或是受了逼迫，立刻就跌倒了。","Yet hath he not root in himself, but dureth for a while: for when tribulation or persecution ariseth because of the word, by and by he is offended."],"39.13.22":["撒在荊棘裡的，就是人聽了道，後來有世上的思慮、錢財的迷惑把道擠住了，不能結實。","撒在荆棘里的，就是人听了道，后来有世上的思虑、钱财的迷惑把道挤住了，不能结实。","He also that received seed among the thorns is he that heareth the word; and the care of this world, and the deceitfulness of riches, choke the word, and he becometh unfruitful."],"39.13.23":["撒在好地上的，就是人聽道明白了，後來結實，有一百倍的，有六十倍的，有三十倍的。","撒在好地上的，就是人听道明白了，后来结实，有一百倍的，有六十倍的，有三十倍的。","But he that received seed into the good ground is he that heareth the word, and understandeth [it]; which also beareth fruit, and bringeth forth, some an hundredfold, some sixty, some thirty."],"39.25.14":["天國又好比一個人要往外國去，就叫了僕人來，把他的家業交給他們，","天国又好比一个人要往外国去，就叫了仆人来，把他的家业交给他们，","For [the kingdom of heaven is] as a man travelling into a far country, [who] called his own servants, and delivered unto them his goods."],"39.25.15":["按著各人的才幹給他們銀子：一個給了五千，一個給了二千，一個給了一千，就往外國去了。","按着各人的才干给他们银子：一个给了五千，一个给了二千，一个给了一千，就往外国去了。","And unto one he gave five talents, to another two, and to another one; to every man according to his several ability; and straightway took his journey."],"39.25.16":["那領五千的隨即拿去做買賣，另外賺了五千。","那领五千的随即拿去做买卖，另外赚了五千。","Then he that had received the five talents went and traded with the same, and made [them] other five talents."],"39.25.17":["那領二千的也照樣另賺了二千。","那领二千的也照样另赚了二千。","And likewise he that [had received] two, he also gained other two."],"39.25.18":["但那領一千的去掘開地，把主人的銀子埋藏了。","但那领一千的去掘开地，把主人的银子埋藏了。","But he that had received one went and digged in the earth, and hid his lord's money."],"39.25.19":["過了許久，那些僕人的主人來了，和他們算帳。","过了许久，那些仆人的主人来了，和他们算帐。","After a long time the lord of those servants cometh, and reckoneth with them."],"39.25.20":["那領五千銀子的又帶著那另外的五千來，說：主啊，你交給我五千銀子。請看，我又賺了五千。","那领五千银子的又带着那另外的五千来，说：主啊，你交给我五千银子。请看，我又赚了五千。","And so he that had received five talents came and brought other five talents, saying, Lord, thou deliveredst unto me five talents: behold, I have gained beside them five talents more."],"39.25.21":["主人說：好，你這又良善又忠心的僕人，你在不多的事上有忠心，我要把許多事派你管理；可以進來享受你主人的快樂。","主人说：好，你这又良善又忠心的仆人，你在不多的事上有忠心，我要把许多事派你管理；可以进来享受你主人的快乐。","His lord said unto him, Well done, [thou] good and faithful servant: thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord."],"39.13.24":["耶穌又設個比喻對他們說：天國好像人撒好種在田裡，","耶稣又设个比喻对他们说：天国好像人撒好种在田里，","Another parable put he forth unto them, saying, The kingdom of heaven is likened unto a man which sowed good seed in his field:"],"39.13.25":["及至人睡覺的時候，有仇敵來，將稗子撒在麥子裡就走了。","及至人睡觉的时候，有仇敌来，将稗子撒在麦子里就走了。","But while men slept, his enemy came and sowed tares among the wheat, and went his way."],"39.13.26":["到長苗吐穗的時候，稗子也顯出來。","到长苗吐穗的时候，稗子也显出来。","But when the blade was sprung up, and brought forth fruit, then appeared the tares also."],"39.13.27":["田主的僕人來告訴他說：主啊，你不是撒好種在田裡嗎？從哪裡來的稗子呢？","田主的仆人来告诉他说：主啊，你不是撒好种在田里吗？从哪里来的稗子呢？","So the servants of the householder came and said unto him, Sir, didst not thou sow good seed in thy field? from whence then hath it tares?"],"39.13.28":["主人說：這是仇敵做的。僕人說：你要我們去薅出來嗎？","主人说：这是仇敌做的。仆人说：你要我们去薅出来吗？","He said unto them, An enemy hath done this. The servants said unto him, Wilt thou then that we go and gather them up?"],"39.13.29":["主人說：不必，恐怕薅稗子，連麥子也拔出來。","主人说：不必，恐怕薅稗子，连麦子也拔出来。","But he said, Nay; lest while ye gather up the tares, ye root up also the wheat with them."],"39.13.30":["容這兩樣一齊長，等著收割。當收割的時候，我要對收割的人說，先將稗子薅出來，捆成捆，留著燒；惟有麥子要收在倉裡。","容这两样一齐长，等着收割。当收割的时候，我要对收割的人说，先将稗子薅出来，捆成捆，留着烧；惟有麦子要收在仓里。","Let both grow together until the harvest: and in the time of harvest I will say to the reapers, Gather ye together first the tares, and bind them in bundles to burn them: but gather the wheat into my barn."],"39.25.1":["那時，天國好比十個童女拿著燈出去迎接新郎。","那时，天国好比十个童女拿着灯出去迎接新郎。","Then shall the kingdom of heaven be likened unto ten virgins, which took their lamps, and went forth to meet the bridegroom."],"39.25.2":["其中有五個是愚拙的，五個是聰明的。","其中有五个是愚拙的，五个是聪明的。","And five of them were wise, and five [were] foolish."],"39.25.3":["愚拙的拿著燈，卻不預備油；","愚拙的拿着灯，却不预备油；","They that [were] foolish took their lamps, and took no oil with them:"],"39.25.4":["聰明的拿著燈，又預備油在器皿裡。","聪明的拿着灯，又预备油在器皿里。","But the wise took oil in their vessels with their lamps."],"39.25.5":["新郎遲延的時候，他們都打盹，睡著了。","新郎迟延的时候，他们都打盹，睡着了。","While the bridegroom tarried, they all slumbered and slept."],"39.25.6":["半夜有人喊著說：新郎來了，你們出來迎接他！","半夜有人喊着说：新郎来了，你们出来迎接他！","And at midnight there was a cry made, Behold, the bridegroom cometh; go ye out to meet him."],"39.25.7":["那些童女就都起來收拾燈。","那些童女就都起来收拾灯。","Then all those virgins arose, and trimmed their lamps."],"39.25.8":["愚拙的對聰明的說：請分點油給我們，因為我們的燈要滅了。","愚拙的对聪明的说：请分点油给我们，因为我们的灯要灭了。","And the foolish said unto the wise, Give us of your oil; for our lamps are gone out."],"39.25.9":["聰明的回答說：恐怕不夠你我用的；不如你們自己到賣油的那裡去買吧。","聪明的回答说：恐怕不够你我用的；不如你们自己到卖油的那里去买吧。","But the wise answered, saying, [Not so]; lest there be not enough for us and you: but go ye rather to them that sell, and buy for yourselves."],"39.25.10":["他們去買的時候，新郎到了。那預備好了的，同他進去坐席，門就關了。","他们去买的时候，新郎到了。那预备好了的，同他进去坐席，门就关了。","And while they went to buy, the bridegroom came; and they that were ready went in with him to the marriage: and the door was shut."],"39.25.11":["其餘的童女隨後也來了，說：主啊，主啊，給我們開門！","其余的童女随后也来了，说：主啊，主啊，给我们开门！","Afterward came also the other virgins, saying, Lord, Lord, open to us."],"39.25.12":["他卻回答說：我實在告訴你們，我不認識你們。","他却回答说：我实在告诉你们，我不认识你们。","But he answered and said, Verily I say unto you, I know you not."],"39.25.13":["所以，你們要警醒；因為那日子，那時辰，你們不知道。","所以，你们要警醒；因为那日子，那时辰，你们不知道。","Watch therefore, for ye know neither the day nor the hour wherein the Son of man cometh."],"22.5.1":["我要為我所親愛的唱歌，是我所愛者的歌，論他葡萄園的事：我所親愛的有葡萄園在肥美的山岡上。","我要为我所亲爱的唱歌，是我所爱者的歌，论他葡萄园的事：我所亲爱的有葡萄园在肥美的山冈上。","Now will I sing to my wellbeloved a song of my beloved touching his vineyard. My wellbeloved hath a vineyard in a very fruitful hill:"],"22.5.2":["他刨挖園子，撿去石頭，栽種上等的葡萄樹，在園中蓋了一座樓，又鑿出壓酒池；指望結好葡萄，反倒結了野葡萄。","他刨挖园子，捡去石头，栽种上等的葡萄树，在园中盖了一座楼，又凿出压酒池；指望结好葡萄，反倒结了野葡萄。","And he fenced it, and gathered out the stones thereof, and planted it with the choicest vine, and built a tower in the midst of it, and also made a winepress therein: and he looked that it should bring forth grapes, and it brought forth wild grapes."],"22.5.3":["耶路撒冷的居民和猶大人哪，請你們現今在我與我的葡萄園中，斷定是非。","耶路撒冷的居民和犹大人哪，请你们现今在我与我的葡萄园中，断定是非。","And now, O inhabitants of Jerusalem, and men of Judah, judge, I pray you, betwixt me and my vineyard."],"22.5.4":["我為我葡萄園所做之外，還有什麼可做的呢？我指望結好葡萄，怎麼倒結了野葡萄呢？","我为我葡萄园所做之外，还有什么可做的呢？我指望结好葡萄，怎么倒结了野葡萄呢？","What could have been done more to my vineyard, that I have not done in it? wherefore, when I looked that it should bring forth grapes, brought it forth wild grapes?"],"22.5.5":["現在我告訴你們，我要向我葡萄園怎樣行：我必撤去籬笆，使他被吞滅，拆毀牆垣，使他被踐踏。","现在我告诉你们，我要向我葡萄园怎样行：我必撤去篱笆，使他被吞灭，拆毁墙垣，使他被践踏。","And now go to; I will tell you what I will do to my vineyard: I will take away the hedge thereof, and it shall be eaten up; [and] break down the wall thereof, and it shall be trodden down:"],"22.5.6":["我必使他荒廢，不再修理，不再鋤刨，荊棘蒺藜倒要生長。我也必命雲不降雨在其上。","我必使他荒废，不再修理，不再锄刨，荆棘蒺藜倒要生长。我也必命云不降雨在其上。","And I will lay it waste: it shall not be pruned, nor digged; but there shall come up briers and thorns: I will also command the clouds that they rain no rain upon it."],"22.5.7":["萬軍之耶和華的葡萄園就是以色列家；他所喜愛的樹就是猶大人。他指望的是公平，誰知倒有暴虐（或譯：倒流人血）；指望的是公義，誰知倒有冤聲。","万军之耶和华的葡萄园就是以色列家；他所喜爱的树就是犹大人。他指望的是公平，谁知倒有暴虐（或译：倒流人血）；指望的是公义，谁知倒有冤声。","For the vineyard of the LORD of hosts [is] the house of Israel, and the men of Judah his pleasant plant: and he looked for judgment, but behold oppression; for righteousness, but behold a cry."],"22.14.12":["明亮之星，早晨之子啊，你何竟從天墜落？你這攻敗列國的何竟被砍倒在地上？","明亮之星，早晨之子啊，你何竟从天坠落？你这攻败列国的何竟被砍倒在地上？","How art thou fallen from heaven, O Lucifer, son of the morning! [how] art thou cut down to the ground, which didst weaken the nations!"],"22.14.13":["你心裡曾說：我要升到天上；我要高舉我的寶座在神眾星以上；我要坐在聚會的山上，在北方的極處。","你心里曾说：我要升到天上；我要高举我的宝座在神众星以上；我要坐在聚会的山上，在北方的极处。","For thou hast said in thine heart, I will ascend into heaven, I will exalt my throne above the stars of God: I will sit also upon the mount of the congregation, in the sides of the north:"],"22.14.14":["我要升到高雲之上；我要與至上者同等。","我要升到高云之上；我要与至上者同等。","I will ascend above the heights of the clouds; I will be like the most High."],"22.14.15":["然而，你必墜落陰間，到坑中極深之處。","然而，你必坠落阴间，到坑中极深之处。","Yet thou shalt be brought down to hell, to the sides of the pit."],"61.3.8":["犯罪的是屬魔鬼，因為魔鬼從起初就犯罪。神的兒子顯現出來，為要除滅魔鬼的作為。","犯罪的是属魔鬼，因为魔鬼从起初就犯罪。神的儿子显现出来，为要除灭魔鬼的作为。","He that committeth sin is of the devil; for the devil sinneth from the beginning. For this purpose the Son of God was manifested, that he might destroy the works of the devil."],"65.12.7":["在天上就有了爭戰。米迦勒同他的使者與龍爭戰，龍也同他的使者去爭戰，","在天上就有了争战。米迦勒同他的使者与龙争战，龙也同他的使者去争战，","And there was war in heaven: Michael and his angels fought against the dragon; and the dragon fought and his angels,"],"65.12.8":["並沒有得勝，天上再沒有他們的地方。","并没有得胜，天上再没有他们的地方。","And prevailed not; neither was their place found any more in heaven."],"65.12.9":["大龍就是那古蛇，名叫魔鬼，又叫撒但，是迷惑普天下的。他被摔在地上，他的使者也一同被摔下去。","大龙就是那古蛇，名叫魔鬼，又叫撒但，是迷惑普天下的。他被摔在地上，他的使者也一同被摔下去。","And the great dragon was cast out, that old serpent, called the Devil, and Satan, which deceiveth the whole world: he was cast out into the earth, and his angels were cast out with him."],"0.3.1":["耶和華神所造的，惟有蛇比田野一切的活物更狡猾。蛇對女人說：神豈是真說不許你們吃園中所有樹上的果子嗎？","耶和华神所造的，惟有蛇比田野一切的活物更狡猾。蛇对女人说：神岂是真说不许你们吃园中所有树上的果子吗？","Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of every tree of the garden?"],"0.3.2":["女人對蛇說：園中樹上的果子，我們可以吃，","女人对蛇说：园中树上的果子，我们可以吃，","And the woman said unto the serpent, We may eat of the fruit of the trees of the garden:"],"0.3.3":["惟有園當中那棵樹上的果子，神曾說：你們不可吃，也不可摸，免得你們死。","惟有园当中那棵树上的果子，神曾说：你们不可吃，也不可摸，免得你们死。","But of the fruit of the tree which [is] in the midst of the garden, God hath said, Ye shall not eat of it, neither shall ye touch it, lest ye die."],"0.3.4":["蛇對女人說：你們不一定死；","蛇对女人说：你们不一定死；","And the serpent said unto the woman, Ye shall not surely die:"],"0.3.5":["因為神知道，你們吃的日子眼睛就明亮了，你們便如神能知道善惡。","因为神知道，你们吃的日子眼睛就明亮了，你们便如神能知道善恶。","For God doth know that in the day ye eat thereof, then your eyes shall be opened, and ye shall be as gods, knowing good and evil."],"0.3.6":["於是女人見那棵樹的果子好作食物，也悅人的眼目，且是可喜愛的，能使人有智慧，就摘下果子來吃了，又給他丈夫，他丈夫也吃了。","于是女人见那棵树的果子好作食物，也悦人的眼目，且是可喜爱的，能使人有智能，就摘下果子来吃了，又给他丈夫，他丈夫也吃了。","And when the woman saw that the tree [was] good for food, and that it [was] pleasant to the eyes, and a tree to be desired to make [one] wise, she took of the fruit thereof, and did eat, and gave also unto her husband with her; and he did eat."],"25.28.14":["你是那受膏遮掩約櫃的基路伯；我將你安置在神的聖山上；你在發光如火的寶石中間往來。","你是那受膏遮掩约柜的基路伯；我将你安置在神的圣山上；你在发光如火的宝石中间往来。","Thou [art] the anointed cherub that covereth; and I have set thee [so]: thou wast upon the holy mountain of God; thou hast walked up and down in the midst of the stones of fire."],"25.28.15":["你從受造之日所行的都完全，後來在你中間又察出不義。","你从受造之日所行的都完全，后来在你中间又察出不义。","Thou [wast] perfect in thy ways from the day that thou wast created, till iniquity was found in thee."],"25.28.16":["因你貿易很多，就被強暴的事充滿，以致犯罪，所以我因你褻瀆聖地，就從神的山驅逐你。遮掩約櫃的基路伯啊，我已將你從發光如火的寶石中除滅。","因你贸易很多，就被强暴的事充满，以致犯罪，所以我因你亵渎圣地，就从神的山驱逐你。遮掩约柜的基路伯啊，我已将你从发光如火的宝石中除灭。","By the multitude of thy merchandise they have filled the midst of thee with violence, and thou hast sinned: therefore I will cast thee as profane out of the mountain of God: and I will destroy thee, O covering cherub, from the midst of the stones of fire."],"25.28.17":["你因美麗心中高傲，又因榮光敗壞智慧，我已將你摔倒在地，使你倒在君王面前，好叫他們目睹眼見。","你因美丽心中高傲，又因荣光败坏智能，我已将你摔倒在地，使你倒在君王面前，好叫他们目睹眼见。","Thine heart was lifted up because of thy beauty, thou hast corrupted thy wisdom by reason of thy brightness: I will cast thee to the ground, I will lay thee before kings, that they may behold thee."],"39.4.1":["當時，耶穌被聖靈引到曠野，受魔鬼的試探。","当时，耶稣被圣灵引到旷野，受魔鬼的试探。","Then was Jesus led up of the Spirit into the wilderness to be tempted of the devil."],"39.4.2":["他禁食四十晝夜，後來就餓了。","他禁食四十昼夜，后来就饿了。","And when he had fasted forty days and forty nights, he was afterward an hungred."],"39.4.3":["那試探人的進前來，對他說：你若是神的兒子，可以吩咐這些石頭變成食物。","那试探人的进前来，对他说：你若是神的儿子，可以吩咐这些石头变成食物。","And when the tempter came to him, he said, If thou be the Son of God, command that these stones be made bread."],"39.4.5":["魔鬼就帶他進了聖城，叫他站在殿頂（頂：原文是翅）上，","魔鬼就带他进了圣城，叫他站在殿顶（顶：原文是翅）上，","Then the devil taketh him up into the holy city, and setteth him on a pinnacle of the temple,"],"39.4.6":["對他說：你若是神的兒子，可以跳下去，因為經上記著說：主要為你吩咐他的使者用手托著你，免得你的腳碰在石頭上。","对他说：你若是神的儿子，可以跳下去，因为经上记着说：主要为你吩咐他的使者用手托着你，免得你的脚碰在石头上。","And saith unto him, If thou be the Son of God, cast thyself down: for it is written, He shall give his angels charge concerning thee: and in [their] hands they shall bear thee up, lest at any time thou dash thy foot against a stone."],"39.4.7":["耶穌對他說：經上又記著說：不可試探主─你的神。","耶稣对他说：经上又记着说：不可试探主─你的神。","Jesus said unto him, It is written again, Thou shalt not tempt the Lord thy God."],"39.4.8":["魔鬼又帶他上了一座最高的山，將世上的萬國與萬國的榮華都指給他看，","魔鬼又带他上了一座最高的山，将世上的万国与万国的荣华都指给他看，","Again, the devil taketh him up into an exceeding high mountain, and sheweth him all the kingdoms of the world, and the glory of them;"],"39.4.9":["對他說：你若俯伏拜我，我就把這一切都賜給你。","对他说：你若俯伏拜我，我就把这一切都赐给你。","And saith unto him, All these things will I give thee, if thou wilt fall down and worship me."],"39.4.10":["耶穌說：撒但（撒但就是抵擋的意思，乃魔鬼的別名），退去吧！因為經上記著說：當拜主你的神，單要事奉他。","耶稣说：撒但（撒但就是抵挡的意思，乃魔鬼的别名），退去吧！因为经上记着说：当拜主你的神，单要事奉他。","Then saith Jesus unto him, Get thee hence, Satan: for it is written, Thou shalt worship the Lord thy God, and him only shalt thou serve."],"39.4.11":["於是，魔鬼離了耶穌，有天使來伺候他。","于是，魔鬼离了耶稣，有天使来伺候他。","Then the devil leaveth him, and, behold, angels came and ministered unto him."],"42.8.44":["你們是出於你們的父魔鬼，你們父的私慾你們偏要行。他從起初是殺人的，不守真理，因他心裡沒有真理。他說謊是出於自己；因他本來是說謊的，也是說謊之人的父。","你们是出于你们的父魔鬼，你们父的私欲你们偏要行。他从起初是杀人的，不守真理，因他心里没有真理。他说谎是出于自己；因他本来是说谎的，也是说谎之人的父。","Ye are of [your] father the devil, and the lusts of your father ye will do. He was a murderer from the beginning, and abode not in the truth, because there is no truth in him. When he speaketh a lie, he speaketh of his own: for he is a liar, and the father of it."],"46.11.13":["那等人是假使徒，行事詭詐，裝作基督使徒的模樣。","那等人是假使徒，行事诡诈，装作基督使徒的模样。","For such [are] false apostles, deceitful workers, transforming themselves into the apostles of Christ."],"46.11.14":["這也不足為怪，因為連撒但也裝作光明的天使。","这也不足为怪，因为连撒但也装作光明的天使。","And no marvel; for Satan himself is transformed into an angel of light."],"59.5.8":["務要謹守，警醒。因為你們的仇敵魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。","务要谨守，警醒。因为你们的仇敌魔鬼，如同吼叫的狮子，遍地游行，寻找可吞吃的人。","Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:"],"46.11.15":["所以他的差役，若裝作仁義的差役，也不算希奇。他們的結局必然照著他們的行為。","所以他的差役，若装作仁义的差役，也不算希奇。他们的结局必然照着他们的行为。","Therefore [it is] no great thing if his ministers also be transformed as the ministers of righteousness; whose end shall be according to their works."],"65.20.1":["我又看見一位天使從天降下，手裡拿著無底坑的鑰匙和一條大鍊子。","我又看见一位天使从天降下，手里拿着无底坑的钥匙和一条大链子。","And I saw an angel come down from heaven, having the key of the bottomless pit and a great chain in his hand."],"65.20.2":["他捉住那龍，就是古蛇，又叫魔鬼，也叫撒但，把他捆綁一千年，","他捉住那龙，就是古蛇，又叫魔鬼，也叫撒但，把他捆绑一千年，","And he laid hold on the dragon, that old serpent, which is the Devil, and Satan, and bound him a thousand years,"],"65.20.3":["扔在無底坑裡，將無底坑關閉，用印封上，使他不得再迷惑列國。等到那一千年完了，以後必須暫時釋放他。","扔在无底坑里，将无底坑关闭，用印封上，使他不得再迷惑列国。等到那一千年完了，以后必须暂时释放他。","And cast him into the bottomless pit, and shut him up, and set a seal upon him, that he should deceive the nations no more, till the thousand years should be fulfilled: and after that he must be loosed a little season."],"52.2.7":["因為那不法的隱意已經發動，只是現在有一個攔阻的，等到那攔阻的被除去，","因为那不法的隐意已经发动，只是现在有一个拦阻的，等到那拦阻的被除去，","For the mystery of iniquity doth already work: only he who now letteth [will let], until he be taken out of the way."],"52.2.8":["那時這不法的人必顯露出來。主耶穌要用口中的氣滅絕他，用降臨的榮光廢掉他。","那时这不法的人必显露出来。主耶稣要用口中的气灭绝他，用降临的荣光废掉他。","And then shall that Wicked be revealed, whom the Lord shall consume with the spirit of his mouth, and shall destroy with the brightness of his coming:"],"52.2.9":["這不法的人來，是照撒但的運動，行各樣的異能、神蹟，和一切虛假的奇事，","这不法的人来，是照撒但的运动，行各样的异能、神迹，和一切虚假的奇事，","[Even him], whose coming is after the working of Satan with all power and signs and lying wonders,"],"52.2.10":["並且在那沉淪的人身上行各樣出於不義的詭詐；因他們不領受愛真理的心，使他們得救。","并且在那沉沦的人身上行各样出于不义的诡诈；因他们不领受爱真理的心，使他们得救。","And with all deceivableness of unrighteousness in them that perish; because they received not the love of the truth, that they might be saved."],"39.25.41":["王又要向那左邊的說：你們這被咒詛的人，離開我！進入那為魔鬼和他的使者所預備的永火裡去！","王又要向那左边的说：你们这被咒诅的人，离开我！进入那为魔鬼和他的使者所预备的永火里去！","Then shall he say also unto them on the left hand, Depart from me, ye cursed, into everlasting fire, prepared for the devil and his angels:"],"65.20.10":["那迷惑他們的魔鬼被扔在硫磺的火湖裡，就是獸和假先知所在的地方。他們必晝夜受痛苦，直到永永遠遠。","那迷惑他们的魔鬼被扔在硫磺的火湖里，就是兽和假先知所在的地方。他们必昼夜受痛苦，直到永永远远。","And the devil that deceived them was cast into the lake of fire and brimstone, where the beast and the false prophet [are], and shall be tormented day and night for ever and ever."],"45.10.13":["你們所遇見的試探，無非是人所能受的。神是信實的，必不叫你們受試探過於所能受的；在受試探的時候，總要給你們開一條出路，叫你們能忍受得住。","你们所遇见的试探，无非是人所能受的。神是信实的，必不叫你们受试探过于所能受的；在受试探的时候，总要给你们开一条出路，叫你们能忍受得住。","There hath no temptation taken you but such as is common to man: but God [is] faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear [it]."],"39.26.41":["總要警醒禱告，免得入了迷惑。你們心靈固然願意，肉體卻軟弱了。","总要警醒祷告，免得入了迷惑。你们心灵固然愿意，肉体却软弱了。","Watch and pray, that ye enter not into temptation: the spirit indeed [is] willing, but the flesh [is] weak."],"57.2.17":["所以，他凡事該與他的弟兄相同，為要在神的事上成為慈悲忠信的大祭司，為百姓的罪獻上挽回祭。","所以，他凡事该与他的弟兄相同，为要在神的事上成为慈悲忠信的大祭司，为百姓的罪献上挽回祭。","Wherefore in all things it behoved him to be made like unto [his] brethren, that he might be a merciful and faithful high priest in things [pertaining] to God, to make reconciliation for the sins of the people."],"57.2.18":["他自己既然被試探而受苦，就能搭救被試探的人。","他自己既然被试探而受苦，就能搭救被试探的人。","For in that he himself hath suffered being tempted, he is able to succour them that are tempted."],"61.3.4":["凡犯罪的，就是違背律法；違背律法就是罪。","凡犯罪的，就是违背律法；违背律法就是罪。","Whosoever committeth sin transgresseth also the law: for sin is the transgression of the law."],"61.3.7":["小子們哪，不要被人誘惑，行義的才是義人，正如主是義的一樣。","小子们哪，不要被人诱惑，行义的才是义人，正如主是义的一样。","Little children, let no man deceive you: he that doeth righteousness is righteous, even as he is righteous."],"48.2.1":["你們死在過犯罪惡之中，他叫你們活過來。","你们死在过犯罪恶之中，他叫你们活过来。","And you [hath he quickened], who were dead in trespasses and sins;"],"48.2.2":["那時，你們在其中行事為人，隨從今世的風俗，順服空中掌權者的首領，就是現今在悖逆之子心中運行的邪靈。","那时，你们在其中行事为人，随从今世的风俗，顺服空中掌权者的首领，就是现今在悖逆之子心中运行的邪灵。","Wherein in time past ye walked according to the course of this world, according to the prince of the power of the air, the spirit that now worketh in the children of disobedience:"],"48.2.3":["我們從前也都在他們中間，放縱肉體的私慾，隨著肉體和心中所喜好的去行，本為可怒之子，和別人一樣。","我们从前也都在他们中间，放纵肉体的私欲，随着肉体和心中所喜好的去行，本为可怒之子，和别人一样。","Among whom also we all had our conversation in times past in the lusts of our flesh, fulfilling the desires of the flesh and of the mind; and were by nature the children of wrath, even as others."],"47.5.20":["拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、異端、","拜偶像、邪术、仇恨、争竞、忌恨、恼怒、结党、纷争、异端、","Idolatry, witchcraft, hatred, variance, emulations, wrath, strife, seditions, heresies,"],"47.5.21":["嫉妒（有古卷在此有：兇殺二字）、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，行這樣事的人必不能承受神的國。","嫉妒（有古卷在此有：凶杀二字）、醉酒、荒宴等类。我从前告诉你们，现在又告诉你们，行这样事的人必不能承受神的国。","Envyings, murders, drunkenness, revellings, and such like: of the which I tell you before, as I have also told [you] in time past, that they which do such things shall not inherit the kingdom of God."],"55.3.3":["我們從前也是無知、悖逆、受迷惑、服事各樣私慾，和宴樂，常存惡毒（或作：陰毒）嫉妒的心，是可恨的，又是彼此相恨。","我们从前也是无知、悖逆、受迷惑、服事各样私欲，和宴乐，常存恶毒（或作：阴毒）嫉妒的心，是可恨的，又是彼此相恨。","For we ourselves also were sometimes foolish, disobedient, deceived, serving divers lusts and pleasures, living in malice and envy, hateful, [and] hating one another."],"0.3.14":["耶和華神對蛇說：你既做了這事，就必受咒詛，比一切的牲畜野獸更甚。你必用肚子行走，終身吃土。","耶和华神对蛇说：你既做了这事，就必受咒诅，比一切的牲畜野兽更甚。你必用肚子行走，终身吃土。","And the LORD God said unto the serpent, Because thou hast done this, thou [art] cursed above all cattle, and above every beast of the field; upon thy belly shalt thou go, and dust shalt thou eat all the days of thy life:"],"0.3.15":["我又要叫你和女人彼此為仇；你的後裔和女人的後裔也彼此為仇。女人的後裔要傷你的頭；你要傷他的腳跟。","我又要叫你和女人彼此为仇；你的后裔和女人的后裔也彼此为仇。女人的后裔要伤你的头；你要伤他的脚跟。","And I will put enmity between thee and the woman, and between thy seed and her seed; it shall bruise thy head, and thou shalt bruise his heel."],"0.3.16":["又對女人說：我必多多加增你懷胎的苦楚；你生產兒女必多受苦楚。你必戀慕你丈夫；你丈夫必管轄你。","又对女人说：我必多多加增你怀胎的苦楚；你生产儿女必多受苦楚。你必恋慕你丈夫；你丈夫必管辖你。","Unto the woman he said, I will greatly multiply thy sorrow and thy conception; in sorrow thou shalt bring forth children; and thy desire [shall be] to thy husband, and he shall rule over thee."],"0.3.17":["又對亞當說：你既聽從妻子的話，吃了我所吩咐你不可吃的那樹上的果子，地必為你的緣故受咒詛；你必終身勞苦才能從地裡得吃的。","又对亚当说：你既听从妻子的话，吃了我所吩咐你不可吃的那树上的果子，地必为你的缘故受咒诅；你必终身劳苦才能从地里得吃的。","And unto Adam he said, Because thou hast hearkened unto the voice of thy wife, and hast eaten of the tree, of which I commanded thee, saying, Thou shalt not eat of it: cursed [is] the ground for thy sake; in sorrow shalt thou eat [of] it all the days of thy life;"],"0.3.19":["你必汗流滿面才得糊口，直到你歸了土，因為你是從土而出的。你本是塵土，仍要歸於塵土。","你必汗流满面才得糊口，直到你归了土，因为你是从土而出的。你本是尘土，仍要归于尘土。","In the sweat of thy face shalt thou eat bread, till thou return unto the ground; for out of it wast thou taken: for dust thou [art], and unto dust shalt thou return."],"44.6.23":["因為罪的工價乃是死；惟有神的恩賜，在我們的主基督耶穌裡，乃是永生。","因为罪的工价乃是死；惟有神的恩赐，在我们的主基督耶稣里，乃是永生。","For the wages of sin [is] death; but the gift of God [is] eternal life through Jesus Christ our Lord."],"41.13.4":["從前西羅亞樓倒塌了，壓死十八個人；你們以為那些人比一切住在耶路撒冷的人更有罪嗎？","从前西罗亚楼倒塌了，压死十八个人；你们以为那些人比一切住在耶路撒冷的人更有罪吗？","Or those eighteen, upon whom the tower in Siloam fell, and slew them, think ye that they were sinners above all men that dwelt in Jerusalem?"],"41.13.5":["我告訴你們，不是的！你們若不悔改，都要如此滅亡！","我告诉你们，不是的！你们若不悔改，都要如此灭亡！","I tell you, Nay: but, except ye repent, ye shall all likewise perish."],"58.1.15":["私慾既懷了胎，就生出罪來；罪既長成，就生出死來。","私欲既怀了胎，就生出罪来；罪既长成，就生出死来。","Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death."],"49.4.3":["我也求你這真實同負一軛的，幫助這兩個女人，因為他們在福音上曾與我一同勞苦；還有革利免，並其餘和我一同做工的，他們的名字都在生命冊上。","我也求你这真实同负一轭的，帮助这两个女人，因为他们在福音上曾与我一同劳苦；还有革利免，并其余和我一同做工的，他们的名字都在生命册上。","And I intreat thee also, true yokefellow, help those women which laboured with me in the gospel, with Clement also, and [with] other my fellowlabourers, whose names [are] in the book of life."],"65.20.15":["若有人名字沒記在生命冊上，他就被扔在火湖裡。","若有人名字没记在生命册上，他就被扔在火湖里。","And whosoever was not found written in the book of life was cast into the lake of fire."],"38.4.1":["萬軍之耶和華說：那日臨近，勢如燒著的火爐，凡狂傲的和行惡的必如碎稭，在那日必被燒盡，根本枝條一無存留。","万军之耶和华说：那日临近，势如烧着的火炉，凡狂傲的和行恶的必如碎稭，在那日必被烧尽，根本枝条一无存留。","For, behold, the day cometh, that shall burn as an oven; and all the proud, yea, and all that do wickedly, shall be stubble: and the day that cometh shall burn them up, saith the LORD of hosts, that it shall leave them neither root nor branch."],"38.4.2":["但向你們敬畏我名的人必有公義的日頭出現，其光線（原文是翅膀）有醫治之能。你們必出來跳躍如圈裡的肥犢。","但向你们敬畏我名的人必有公义的日头出现，其光线（原文是翅膀）有医治之能。你们必出来跳跃如圈里的肥犊。","But unto you that fear my name shall the Sun of righteousness arise with healing in his wings; and ye shall go forth, and grow up as calves of the stall."],"38.4.3":["你們必踐踏惡人；在我所定的日子，他們必如灰塵在你們腳掌之下。這是萬軍之耶和華說的。","你们必践踏恶人；在我所定的日子，他们必如灰尘在你们脚掌之下。这是万军之耶和华说的。","And ye shall tread down the wicked; for they shall be ashes under the soles of your feet in the day that I shall do [this], saith the LORD of hosts."],"18.73.1":["（亞薩的詩。）神實在恩待以色列那些清心的人！","（亚萨的诗。）神实在恩待以色列那些清心的人！","A Psalm of Asaph. Truly God [is] good to Israel, [even] to such as are of a clean heart."],"18.73.2":["至於我，我的腳幾乎失閃；我的腳險些滑跌。","至于我，我的脚几乎失闪；我的脚险些滑跌。","But as for me, my feet were almost gone; my steps had well nigh slipped."],"18.73.3":["我見惡人和狂傲人享平安就心懷不平。","我见恶人和狂傲人享平安就心怀不平。","For I was envious at the foolish, [when] I saw the prosperity of the wicked."],"18.73.4":["他們死的時候沒有疼痛；他們的力氣卻也壯實。","他们死的时候没有疼痛；他们的力气却也壮实。","For [there are] no bands in their death: but their strength [is] firm."],"18.73.5":["他們不像別人受苦，也不像別人遭災。","他们不像别人受苦，也不像别人遭灾。","They [are] not in trouble [as other] men; neither are they plagued like [other] men."],"18.73.6":["所以，驕傲如鏈子戴在他們的項上；強暴像衣裳遮住他們的身體。","所以，骄傲如链子戴在他们的项上；强暴像衣裳遮住他们的身体。","Therefore pride compasseth them about as a chain; violence covereth them [as] a garment."],"18.73.7":["他們的眼睛因體胖而凸出；他們所得的，過於心裡所想的。","他们的眼睛因体胖而凸出；他们所得的，过于心里所想的。","Their eyes stand out with fatness: they have more than heart could wish."],"18.73.8":["他們譏笑人，憑惡意說欺壓人的話；他們說話自高。","他们讥笑人，凭恶意说欺压人的话；他们说话自高。","They are corrupt, and speak wickedly [concerning] oppression: they speak loftily."],"18.73.9":["他們的口褻瀆上天；他們的舌毀謗全地。","他们的口亵渎上天；他们的舌毁谤全地。","They set their mouth against the heavens, and their tongue walketh through the earth."],"18.73.10":["所以神的民歸到這裡，喝盡了滿杯的苦水。","所以神的民归到这里，喝尽了满杯的苦水。","Therefore his people return hither: and waters of a full [cup] are wrung out to them."],"18.73.11":["他們說：神怎能曉得？至高者豈有知識呢？","他们说：神怎能晓得？至高者岂有知识呢？","And they say, How doth God know? and is there knowledge in the most High?"],"18.73.12":["看哪，這就是惡人；他們既是常享安逸，財寶便加增。","看哪，这就是恶人；他们既是常享安逸，财宝便加增。","Behold, these [are] the ungodly, who prosper in the world; they increase [in] riches."],"18.73.13":["我實在徒然潔淨了我的心，徒然洗手表明無辜。","我实在徒然洁净了我的心，徒然洗手表明无辜。","Verily I have cleansed my heart [in] vain, and washed my hands in innocency."],"18.73.14":["因為，我終日遭災難；每早晨受懲治。","因为，我终日遭灾难；每早晨受惩治。","For all the day long have I been plagued, and chastened every morning."],"18.73.15":["我若說，我要這樣講，這就是以奸詐待你的眾子。","我若说，我要这样讲，这就是以奸诈待你的众子。","If I say, I will speak thus; behold, I should offend [against] the generation of thy children."],"18.73.16":["我思索怎能明白這事，眼看實係為難，","我思索怎能明白这事，眼看实系为难，","When I thought to know this, it [was] too painful for me;"],"18.73.17":["等我進了神的聖所，思想他們的結局。","等我进了神的圣所，思想他们的结局。","Until I went into the sanctuary of God; [then] understood I their end."],"18.73.18":["你實在把他們安在滑地，使他們掉在沉淪之中。","你实在把他们安在滑地，使他们掉在沉沦之中。","Surely thou didst set them in slippery places: thou castedst them down into destruction."],"18.73.19":["他們轉眼之間成了何等的荒涼！他們被驚恐滅盡了。","他们转眼之间成了何等的荒凉！他们被惊恐灭尽了。","How are they [brought] into desolation, as in a moment! they are utterly consumed with terrors."],"18.73.20":["人睡醒了，怎樣看夢；主啊，你醒了也必照樣輕看他們的影像。","人睡醒了，怎样看梦；主啊，你醒了也必照样轻看他们的影像。","As a dream when [one] awaketh; [so], O Lord, when thou awakest, thou shalt despise their image."],"18.73.21":["因而，我心裡發酸，肺腑被刺。","因而，我心里发酸，肺腑被刺。","Thus my heart was grieved, and I was pricked in my reins."],"18.73.22":["我這樣愚昧無知，在你面前如畜類一般。","我这样愚昧无知，在你面前如畜类一般。","So foolish [was] I, and ignorant: I was [as] a beast before thee."],"18.73.23":["然而，我常與你同在；你攙著我的右手。","然而，我常与你同在；你搀着我的右手。","Nevertheless I [am] continually with thee: thou hast holden [me] by my right hand."],"18.73.24":["你要以你的訓言引導我，以後必接我到榮耀裡。","你要以你的训言引导我，以后必接我到荣耀里。","Thou shalt guide me with thy counsel, and afterward receive me [to] glory."],"18.73.25":["除你以外，在天上我有誰呢？除你以外，在地上我也沒有所愛慕的。","除你以外，在天上我有谁呢？除你以外，在地上我也没有所爱慕的。","Whom have I in heaven [but thee]? and [there is] none upon earth [that] I desire beside thee."],"18.73.26":["我的肉體和我的心腸衰殘；但神是我心裡的力量，又是我的福分，直到永遠。","我的肉体和我的心肠衰残；但神是我心里的力量，又是我的福分，直到永远。","My flesh and my heart faileth: [but] God [is] the strength of my heart, and my portion for ever."],"18.73.27":["遠離你的，必要死亡；凡離棄你行邪淫的，你都滅絕了。","远离你的，必要死亡；凡离弃你行邪淫的，你都灭绝了。","For, lo, they that are far from thee shall perish: thou hast destroyed all them that go a whoring from thee."],"18.73.28":["但我親近神是於我有益；我以主耶和華為我的避難所，好叫我述說你一切的作為。","但我亲近神是于我有益；我以主耶和华为我的避难所，好叫我述说你一切的作为。","But [it is] good for me to draw near to God: I have put my trust in the Lord GOD, that I may declare all thy works."],"17.21.7":["惡人為何存活，享大壽數，勢力強盛呢？","恶人为何存活，享大寿数，势力强盛呢？","Wherefore do the wicked live, become old, yea, are mighty in power?"],"17.21.8":["他們眼見兒孫，和他們一同堅立。","他们眼见儿孙，和他们一同坚立。","Their seed is established in their sight with them, and their offspring before their eyes."],"17.21.9":["他們的家宅平安無懼；神的杖也不加在他們身上。","他们的家宅平安无惧；神的杖也不加在他们身上。","Their houses [are] safe from fear, neither [is] the rod of God upon them."],"17.21.10":["他們的公牛孳生而不斷絕；母牛下犢而不掉胎。","他们的公牛孳生而不断绝；母牛下犊而不掉胎。","Their bull gendereth, and faileth not; their cow calveth, and casteth not her calf."],"17.21.11":["他們打發小孩子出去，多如羊群；他們的兒女踴躍跳舞。","他们打发小孩子出去，多如羊群；他们的儿女踊跃跳舞。","They send forth their little ones like a flock, and their children dance."],"17.21.12":["他們隨著琴鼓歌唱，又因簫聲歡喜。","他们随着琴鼓歌唱，又因箫声欢喜。","They take the timbrel and harp, and rejoice at the sound of the organ."],"17.21.13":["他們度日諸事亨通，轉眼下入陰間。","他们度日诸事亨通，转眼下入阴间。","They spend their days in wealth, and in a moment go down to the grave."],"44.3.23":["因為世人都犯了罪，虧缺了神的榮耀；","因为世人都犯了罪，亏缺了神的荣耀；","For all have sinned, and come short of the glory of God;"],"61.1.8":["我們若說自己無罪，便是自欺，真理不在我們心裡了。","我们若说自己无罪，便是自欺，真理不在我们心里了。","If we say that we have no sin, we deceive ourselves, and the truth is not in us."],"61.1.9":["我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。","我们若认自己的罪，神是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义。","If we confess our sins, he is faithful and just to forgive us [our] sins, and to cleanse us from all unrighteousness."],"61.1.10":["我們若說自己沒有犯過罪，便是以神為說謊的，他的道也不在我們心裡了。","我们若说自己没有犯过罪，便是以神为说谎的，他的道也不在我们心里了。","If we say that we have not sinned, we make him a liar, and his word is not in us."],"39.12.31":["所以我告訴你們：人一切的罪和褻瀆的話都可得赦免，惟獨褻瀆聖靈，總不得赦免。","所以我告诉你们：人一切的罪和亵渎的话都可得赦免，惟独亵渎圣灵，总不得赦免。","Wherefore I say unto you, All manner of sin and blasphemy shall be forgiven unto men: but the blasphemy [against] the [Holy] Ghost shall not be forgiven unto men."],"39.12.32":["凡說話干犯人子的，還可得赦免；惟獨說話干犯聖靈的，今世來世總不得赦免。","凡说话干犯人子的，还可得赦免；惟独说话干犯圣灵的，今世来世总不得赦免。","And whosoever speaketh a word against the Son of man, it shall be forgiven him: but whosoever speaketh against the Holy Ghost, it shall not be forgiven him, neither in this world, neither in the [world] to come."],"2.18.22":["不可與男人苟合，像與女人一樣；這本是可憎惡的。","不可与男人苟合，像与女人一样；这本是可憎恶的。","Thou shalt not lie with mankind, as with womankind: it [is] abomination."],"44.1.26":["因此，神任憑他們放縱可羞恥的情慾。他們的女人把順性的用處變為逆性的用處；","因此，神任凭他们放纵可羞耻的情欲。他们的女人把顺性的用处变为逆性的用处；","For this cause God gave them up unto vile affections: for even their women did change the natural use into that which is against nature:"],"44.1.27":["男人也是如此，棄了女人順性的用處，慾火攻心，彼此貪戀，男和男行可羞恥的事，就在自己身上受這妄為當得的報應。","男人也是如此，弃了女人顺性的用处，欲火攻心，彼此贪恋，男和男行可羞耻的事，就在自己身上受这妄为当得的报应。","And likewise also the men, leaving the natural use of the woman, burned in their lust one toward another; men with men working that which is unseemly, and receiving in themselves that recompence of their error which was meet."],"44.1.28":["他們既然故意不認識神，神就任憑他們存邪僻的心，行那些不合理的事；","他们既然故意不认识神，神就任凭他们存邪僻的心，行那些不合理的事；","And even as they did not like to retain God in [their] knowledge, God gave them over to a reprobate mind, to do those things which are not convenient;"],"44.1.29":["裝滿了各樣不義、邪惡、貪婪、惡毒（或作：陰毒），滿心是嫉妒、兇殺、爭競、詭詐、毒恨；","装满了各样不义、邪恶、贪婪、恶毒（或作：阴毒），满心是嫉妒、凶杀、争竞、诡诈、毒恨；","Being filled with all unrighteousness, fornication, wickedness, covetousness, maliciousness; full of envy, murder, debate, deceit, malignity; whisperers,"],"44.1.30":["又是讒毀的、背後說人的、怨恨神的（或作：被神所憎惡的）、侮慢人的、狂傲的、自誇的、捏造惡事的、違背父母的。","又是谗毁的、背后说人的、怨恨神的（或作：被神所憎恶的）、侮慢人的、狂傲的、自夸的、捏造恶事的、违背父母的。","Backbiters, haters of God, despiteful, proud, boasters, inventors of evil things, disobedient to parents,"],"44.1.31":["無知的，背約的，無親情的，不憐憫人的。","无知的，背约的，无亲情的，不怜悯人的。","Without understanding, covenantbreakers, without natural affection, implacable, unmerciful:"],"44.1.32":["他們雖知道神判定行這樣事的人是當死的，然而他們不但自己去行，還喜歡別人去行。","他们虽知道神判定行这样事的人是当死的，然而他们不但自己去行，还喜欢别人去行。","Who knowing the judgment of God, that they which commit such things are worthy of death, not only do the same, but have pleasure in them that do them."],"44.7.15":["因為我所做的，我自己不明白；我所願意的，我並不做；我所恨惡的，我倒去做。","因为我所做的，我自己不明白；我所愿意的，我并不做；我所恨恶的，我倒去做。","For that which I do I allow not: for what I would, that do I not; but what I hate, that do I."],"44.7.16":["若我所做的，是我所不願意的，我就應承律法是善的。","若我所做的，是我所不愿意的，我就应承律法是善的。","If then I do that which I would not, I consent unto the law that [it is] good."],"44.7.17":["既是這樣，就不是我做的，乃是住在我裡頭的罪做的。","既是这样，就不是我做的，乃是住在我里头的罪做的。","Now then it is no more I that do it, but sin that dwelleth in me."],"44.7.18":["我也知道在我裡頭，就是我肉體之中，沒有良善。因為，立志為善由得我，只是行出來由不得我。","我也知道在我里头，就是我肉体之中，没有良善。因为，立志为善由得我，只是行出来由不得我。","For I know that in me (that is, in my flesh,) dwelleth no good thing: for to will is present with me; but [how] to perform that which is good I find not."],"44.7.19":["故此，我所願意的善，我反不做；我所不願意的惡，我倒去做。","故此，我所愿意的善，我反不做；我所不愿意的恶，我倒去做。","For the good that I would I do not: but the evil which I would not, that I do."],"44.7.20":["若我去做所不願意做的，就不是我做的，乃是住在我裡頭的罪做的。","若我去做所不愿意做的，就不是我做的，乃是住在我里头的罪做的。","Now if I do that I would not, it is no more I that do it, but sin that dwelleth in me."],"42.3.16":["神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。","神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不致灭亡，反得永生。","For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life."],"44.7.25":["感謝神，靠著我們的主耶穌基督就能脫離了。這樣看來，我以內心順服神的律，我肉體卻順服罪的律了。","感谢神，靠着我们的主耶稣基督就能脱离了。这样看来，我以内心顺服神的律，我肉体却顺服罪的律了。","I thank God through Jesus Christ our Lord. So then with the mind I myself serve the law of God; but with the flesh the law of sin."],"49.1.29":["因為你們蒙恩，不但得以信服基督，並要為他受苦。","因为你们蒙恩，不但得以信服基督，并要为他受苦。","For unto you it is given in the behalf of Christ, not only to believe on him, but also to suffer for his sake;"],"54.3.12":["不但如此，凡立志在基督耶穌裡敬虔度日的也都要受逼迫。","不但如此，凡立志在基督耶稣里敬虔度日的也都要受逼迫。","Yea, and all that will live godly in Christ Jesus shall suffer persecution."],"59.3.18":["因基督也曾一次為罪受苦（有古卷作：受死），就是義的代替不義的，為要引我們到神面前。按著肉體說，他被治死；按著靈性說，他復活了。","因基督也曾一次为罪受苦（有古卷作：受死），就是义的代替不义的，为要引我们到神面前。按着肉体说，他被治死；按着灵性说，他复活了。","For Christ also hath once suffered for sins, the just for the unjust, that he might bring us to God, being put to death in the flesh, but quickened by the Spirit:"],"44.8.18":["我想，現在的苦楚若比起將來要顯於我們的榮耀就不足介意了。","我想，现在的苦楚若比起将来要显于我们的荣耀就不足介意了。","For I reckon that the sufferings of this present time [are] not worthy [to be compared] with the glory which shall be revealed in us."],"44.8.28":["我們曉得萬事都互相效力，叫愛神的人得益處，就是按他旨意被召的人。","我们晓得万事都互相效力，叫爱神的人得益处，就是按他旨意被召的人。","And we know that all things work together for good to them that love God, to them who are the called according to [his] purpose."],"43.5.41":["他們離開公會，心裡歡喜，因被算是配為這名受辱。","他们离开公会，心里欢喜，因被算是配为这名受辱。","And they departed from the presence of the council, rejoicing that they were counted worthy to suffer shame for his name."],"59.5.10":["那賜諸般恩典的神曾在基督裡召你們，得享他永遠的榮耀，等你們暫受苦難之後，必要親自成全你們，堅固你們，賜力量給你們。","那赐诸般恩典的神曾在基督里召你们，得享他永远的荣耀，等你们暂受苦难之后，必要亲自成全你们，坚固你们，赐力量给你们。","But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make you perfect, stablish, strengthen, settle [you]."],"54.2.12":["我們若能忍耐，也必和他一同作王；我們若不認他，他也必不認我們；","我们若能忍耐，也必和他一同作王；我们若不认他，他也必不认我们；","If we suffer, we shall also reign with [him]: if we deny [him], he also will deny us:"],"65.13.1":["我又看見一個獸從海中上來，有十角七頭，在十角上戴著十個冠冕，七頭上有褻瀆的名號。","我又看见一个兽从海中上来，有十角七头，在十角上戴着十个冠冕，七头上有亵渎的名号。","And I stood upon the sand of the sea, and saw a beast rise up out of the sea, having seven heads and ten horns, and upon his horns ten crowns, and upon his heads the name of blasphemy."],"65.13.2":["我所看見的獸，形狀像豹，腳像熊的腳，口像獅子的口。那龍將自己的能力、座位、和大權柄都給了他。","我所看见的兽，形状像豹，脚像熊的脚，口像狮子的口。那龙将自己的能力、座位、和大权柄都给了他。","And the beast which I saw was like unto a leopard, and his feet were as [the feet] of a bear, and his mouth as the mouth of a lion: and the dragon gave him his power, and his seat, and great authority."],"65.13.3":["我看見獸的七頭中，有一個似乎受了死傷，那死傷卻醫好了。全地的人都希奇跟從那獸，","我看见兽的七头中，有一个似乎受了死伤，那死伤却医好了。全地的人都希奇跟从那兽，","And I saw one of his heads as it were wounded to death; and his deadly wound was healed: and all the world wondered after the beast."],"65.13.4":["又拜那龍─因為他將自己的權柄給了獸，也拜獸，說：誰能比這獸，誰能與他交戰呢？","又拜那龙─因为他将自己的权柄给了兽，也拜兽，说：谁能比这兽，谁能与他交战呢？","And they worshipped the dragon which gave power unto the beast: and they worshipped the beast, saying, Who [is] like unto the beast? who is able to make war with him?"],"65.13.5":["又賜給他說誇大褻瀆話的口，又有權柄賜給他，可以任意而行四十二個月。","又赐给他说夸大亵渎话的口，又有权柄赐给他，可以任意而行四十二个月。","And there was given unto him a mouth speaking great things and blasphemies; and power was given unto him to continue forty [and] two months."],"65.13.6":["獸就開口向神說褻瀆的話，褻瀆神的名並他的帳幕，以及那些住在天上的。","兽就开口向神说亵渎的话，亵渎神的名并他的帐幕，以及那些住在天上的。","And he opened his mouth in blasphemy against God, to blaspheme his name, and his tabernacle, and them that dwell in heaven."],"65.13.7":["又任憑他與聖徒爭戰，並且得勝；也把權柄賜給他，制伏各族、各民、各方、各國。","又任凭他与圣徒争战，并且得胜；也把权柄赐给他，制伏各族、各民、各方、各国。","And it was given unto him to make war with the saints, and to overcome them: and power was given him over all kindreds, and tongues, and nations."],"65.13.8":["凡住在地上、名字從創世以來沒有記在被殺之羔羊生命冊上的人，都要拜他。","凡住在地上、名字从创世以来没有记在被杀之羔羊生命册上的人，都要拜他。","And all that dwell upon the earth shall worship him, whose names are not written in the book of life of the Lamb slain from the foundation of the world."],"65.13.9":["凡有耳的，就應當聽！","凡有耳的，就应当听！","If any man have an ear, let him hear."],"65.13.10":["擄掠人的，必被擄掠；用刀殺人的，必被刀殺。聖徒的忍耐和信心就是在此。","掳掠人的，必被掳掠；用刀杀人的，必被刀杀。圣徒的忍耐和信心就是在此。","He that leadeth into captivity shall go into captivity: he that killeth with the sword must be killed with the sword. Here is the patience and the faith of the saints."],"65.13.11":["我又看見另有一個獸從地中上來有兩角如同羊羔，說話好像龍。","我又看见另有一个兽从地中上来有两角如同羊羔，说话好像龙。","And I beheld another beast coming up out of the earth; and he had two horns like a lamb, and he spake as a dragon."],"65.13.12":["他在頭一個獸面前，施行頭一個獸所有的權柄，並且叫地和住在地上的人拜那死傷醫好的頭一個獸。","他在头一个兽面前，施行头一个兽所有的权柄，并且叫地和住在地上的人拜那死伤医好的头一个兽。","And he exerciseth all the power of the first beast before him, and causeth the earth and them which dwell therein to worship the first beast, whose deadly wound was healed."],"65.13.13":["又行大奇事，甚至在人面前，叫火從天降在地上。","又行大奇事，甚至在人面前，叫火从天降在地上。","And he doeth great wonders, so that he maketh fire come down from heaven on the earth in the sight of men,"],"65.13.14":["他因賜給他權柄在獸面前能行奇事，就迷惑住在地上的人，說：要給那受刀傷還活著的獸作個像。","他因赐给他权柄在兽面前能行奇事，就迷惑住在地上的人，说：要给那受刀伤还活着的兽作个像。","And deceiveth them that dwell on the earth by [the means of] those miracles which he had power to do in the sight of the beast; saying to them that dwell on the earth, that they should make an image to the beast, which had the wound by a sword, and did live."],"65.13.15":["又有權柄賜給他，叫獸像有生氣，並且能說話，又叫所有不拜獸像的人都被殺害。","又有权柄赐给他，叫兽像有生气，并且能说话，又叫所有不拜兽像的人都被杀害。","And he had power to give life unto the image of the beast, that the image of the beast should both speak, and cause that as many as would not worship the image of the beast should be killed."],"65.13.18":["在這裡有智慧：凡有聰明的，可以算計獸的數目；因為這是人的數目，他的數目是六百六十六。","在这里有智能：凡有聪明的，可以算计兽的数目；因为这是人的数目，他的数目是六百六十六。","Here is wisdom. Let him that hath understanding count the number of the beast: for it is the number of a man; and his number [is] Six hundred threescore [and] six."],"42.14.15":["你們若愛我，就必遵守我的命令。","你们若爱我，就必遵守我的命令。","If ye love me, keep my commandments."],"61.5.3":["我們遵守神的誡命，這就是愛他了，並且他的誡命不是難守的。","我们遵守神的诫命，这就是爱他了，并且他的诫命不是难守的。","For this is the love of God, that we keep his commandments: and his commandments are not grievous."],"65.13.16":["他又叫眾人，無論大小、貧富、自主的、為奴的，都在右手上或是在額上受一個印記。","他又叫众人，无论大小、贫富、自主的、为奴的，都在右手上或是在额上受一个印记。","And he causeth all, both small and great, rich and poor, free and bond, to receive a mark in their right hand, or in their foreheads:"],"65.13.17":["除了那受印記、有了獸名或有獸名數目的，都不得做買賣。","除了那受印记、有了兽名或有兽名数目的，都不得做买卖。","And that no man might buy or sell, save he that had the mark, or the name of the beast, or the number of his name."],"65.15.2":["我看見彷彿有玻璃海，其中有火攙雜。又看見那些勝了獸和獸的像並他名字數目的人，都站在玻璃海上，拿著神的琴，","我看见仿佛有玻璃海，其中有火搀杂。又看见那些胜了兽和兽的像并他名字数目的人，都站在玻璃海上，拿着神的琴，","And I saw as it were a sea of glass mingled with fire: and them that had gotten the victory over the beast, and over his image, and over his mark, [and] over the number of his name, stand on the sea of glass, having the harps of God."],"65.16.2":["第一位天使便去，把碗倒在地上，就有惡而且毒的瘡生在那些有獸印記、拜獸像的人身上。","第一位天使便去，把碗倒在地上，就有恶而且毒的疮生在那些有兽印记、拜兽像的人身上。","And the first went, and poured out his vial upon the earth; and there fell a noisome and grievous sore upon the men which had the mark of the beast, and [upon] them which worshipped his image."],"65.15.1":["我又看見在天上有異象，大而且奇，就是七位天使掌管末了的七災，因為神的大怒在這七災中發盡了。","我又看见在天上有异象，大而且奇，就是七位天使掌管末了的七灾，因为神的大怒在这七灾中发尽了。","And I saw another sign in heaven, great and marvellous, seven angels having the seven last plagues; for in them is filled up the wrath of God."],"65.15.3":["唱神僕人摩西的歌，和羔羊的歌，說：主神─全能者啊，你的作為大哉！奇哉！萬世（或作：國）之王啊，你的道途義哉！誠哉！","唱神仆人摩西的歌，和羔羊的歌，说：主神─全能者啊，你的作为大哉！奇哉！万世（或作：国）之王啊，你的道途义哉！诚哉！","And they sing the song of Moses the servant of God, and the song of the Lamb, saying, Great and marvellous [are] thy works, Lord God Almighty; just and true [are] thy ways, thou King of saints."],"65.15.4":["主啊，誰敢不敬畏你，不將榮耀歸與你的名呢？因為獨有你是聖的。萬民都要來在你面前敬拜，因你公義的作為已經顯出來了。","主啊，谁敢不敬畏你，不将荣耀归与你的名呢？因为独有你是圣的。万民都要来在你面前敬拜，因你公义的作为已经显出来了。","Who shall not fear thee, O Lord, and glorify thy name? for [thou] only [art] holy: for all nations shall come and worship before thee; for thy judgments are made manifest."],"53.2.4":["他願意萬人得救，明白真道。","他愿意万人得救，明白真道。","Who will have all men to be saved, and to come unto the knowledge of the truth."],"39.11.28":["凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。","凡劳苦担重担的人可以到我这里来，我就使你们得安息。","Come unto me, all [ye] that labour and are heavy laden, and I will give you rest."],"39.11.29":["我心裡柔和謙卑，你們當負我的軛，學我的樣式；這樣，你們心裡就必得享安息。","我心里柔和谦卑，你们当负我的轭，学我的样式；这样，你们心里就必得享安息。","Take my yoke upon you, and learn of me; for I am meek and lowly in heart: and ye shall find rest unto your souls."],"39.11.30":["因為我的軛是容易的，我的擔子是輕省的。","因为我的轭是容易的，我的担子是轻省的。","For my yoke [is] easy, and my burden is light."],"65.20.4":["我又看見幾個寶座，也有坐在上面的，並有審判的權柄賜給他們。我又看見那些因為給耶穌作見證，並為神之道被斬者的靈魂，和那沒有拜過獸與獸像，也沒有在額上和手上受過他印記之人的靈魂，他們都復活了，與基督一同作王一千年。","我又看见几个宝座，也有坐在上面的，并有审判的权柄赐给他们。我又看见那些因为给耶稣作见证，并为神之道被斩者的灵魂，和那没有拜过兽与兽像，也没有在额上和手上受过他印记之人的灵魂，他们都复活了，与基督一同作王一千年。","And I saw thrones, and they sat upon them, and judgment was given unto them: and [I saw] the souls of them that were beheaded for the witness of Jesus, and for the word of God, and which had not worshipped the beast, neither his image, neither had received [his] mark upon their foreheads, or in their hands; and they lived and reigned with Christ a thousand years."],"65.18.2":["他大聲喊著說：巴比倫大城傾倒了！傾倒了！成了鬼魔的住處和各樣污穢之靈的巢穴（或作：牢獄；下同），並各樣污穢可憎之雀鳥的巢穴。","他大声喊着说：巴比伦大城倾倒了！倾倒了！成了鬼魔的住处和各样污秽之灵的巢穴（或作：牢狱；下同），并各样污秽可憎之雀鸟的巢穴。","And he cried mightily with a strong voice, saying, Babylon the great is fallen, is fallen, and is become the habitation of devils, and the hold of every foul spirit, and a cage of every unclean and hateful bird."],"65.18.3":["因為列國都被他邪淫大怒的酒傾倒了。地上的君王與他行淫；地上的客商因他奢華太過就發了財。","因为列国都被他邪淫大怒的酒倾倒了。地上的君王与他行淫；地上的客商因他奢华太过就发了财。","For all nations have drunk of the wine of the wrath of her fornication, and the kings of the earth have committed fornication with her, and the merchants of the earth are waxed rich through the abundance of her delicacies."],"65.18.4":["我又聽見從天上有聲音說：我的民哪，你們要從那城出來，免得與他一同有罪，受他所受的災殃；","我又听见从天上有声音说：我的民哪，你们要从那城出来，免得与他一同有罪，受他所受的灾殃；","And I heard another voice from heaven, saying, Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues."],"65.18.8":["所以在一天之內，他的災殃要一齊來到，就是死亡、悲哀、饑荒。他又要被火燒盡了，因為審判他的主神大有能力。","所以在一天之内，他的灾殃要一齐来到，就是死亡、悲哀、饥荒。他又要被火烧尽了，因为审判他的主神大有能力。","Therefore shall her plagues come in one day, death, and mourning, and famine; and she shall be utterly burned with fire: for strong [is] the Lord God who judgeth her."],"65.18.9":["地上的君王，素來與他行淫、一同奢華的，看見燒他的煙，就必為他哭泣哀號。","地上的君王，素来与他行淫、一同奢华的，看见烧他的烟，就必为他哭泣哀号。","And the kings of the earth, who have committed fornication and lived deliciously with her, shall bewail her, and lament for her, when they shall see the smoke of her burning,"],"65.18.10":["因怕他的痛苦，就遠遠的站著說：哀哉！哀哉！巴比倫大城，堅固的城啊，一時之間你的刑罰就來到了。","因怕他的痛苦，就远远的站着说：哀哉！哀哉！巴比伦大城，坚固的城啊，一时之间你的刑罚就来到了。","Standing afar off for the fear of her torment, saying, Alas, alas, that great city Babylon, that mighty city! for in one hour is thy judgment come."],"65.18.11":["地上的客商也都為他哭泣悲哀，因為沒有人再買他們的貨物了；","地上的客商也都为他哭泣悲哀，因为没有人再买他们的货物了；","And the merchants of the earth shall weep and mourn over her; for no man buyeth their merchandise any more:"],"65.18.12":["這貨物就是金、銀、寶石、珍珠、細麻布、紫色料、綢子、朱紅色料、各樣香木、各樣象牙的器皿、各樣極寶貴的木頭，和銅、鐵、漢白玉的器皿，","这货物就是金、银、宝石、珍珠、细麻布、紫色料、绸子、朱红色料、各样香木、各样象牙的器皿、各样极宝贵的木头，和铜、铁、汉白玉的器皿，","The merchandise of gold, and silver, and precious stones, and of pearls, and fine linen, and purple, and silk, and scarlet, and all thyine wood, and all manner vessels of ivory, and all manner vessels of most precious wood, and of brass, and iron, and marble,"],"65.18.13":["並肉桂、荳蔻、香料、香膏、乳香、酒、油、細麵、麥子、牛、羊、車、馬，和奴僕、人口。","并肉桂、荳蔻、香料、香膏、乳香、酒、油、细面、麦子、牛、羊、车、马，和奴仆、人口。","And cinnamon, and odours, and ointments, and frankincense, and wine, and oil, and fine flour, and wheat, and beasts, and sheep, and horses, and chariots, and slaves, and souls of men."],"65.18.14":["巴比倫哪，你所貪愛的果子離開了你；你一切的珍饈美味，和華美的物件也從你中間毀滅，決不能再見了。","巴比伦哪，你所贪爱的果子离开了你；你一切的珍馐美味，和华美的对象也从你中间毁灭，决不能再见了。","And the fruits that thy soul lusted after are departed from thee, and all things which were dainty and goodly are departed from thee, and thou shalt find them no more at all."],"65.18.15":["販賣這些貨物、藉著他發了財的客商，因怕他的痛苦，就遠遠的站著哭泣悲哀，說：","贩卖这些货物、借着他发了财的客商，因怕他的痛苦，就远远的站着哭泣悲哀，说：","The merchants of these things, which were made rich by her, shall stand afar off for the fear of her torment, weeping and wailing,"],"65.18.16":["哀哉！哀哉！這大城啊，素常穿著細麻、紫色、朱紅色的衣服，又用金子、寶石，和珍珠為妝飾。","哀哉！哀哉！这大城啊，素常穿着细麻、紫色、朱红色的衣服，又用金子、宝石，和珍珠为妆饰。","And saying, Alas, alas, that great city, that was clothed in fine linen, and purple, and scarlet, and decked with gold, and precious stones, and pearls!"],"65.18.17":["一時之間，這麼大的富厚就歸於無有了。凡船主和坐船往各處去的，並眾水手，連所有靠海為業的，都遠遠的站著，","一时之间，这么大的富厚就归于无有了。凡船主和坐船往各处去的，并众水手，连所有靠海为业的，都远远的站着，","For in one hour so great riches is come to nought. And every shipmaster, and all the company in ships, and sailors, and as many as trade by sea, stood afar off,"],"65.18.18":["看見燒他的煙，就喊著說：有何城能比這大城呢？","看见烧他的烟，就喊着说：有何城能比这大城呢？","And cried when they saw the smoke of her burning, saying, What [city is] like unto this great city!"],"65.18.19":["他們又把塵土撒在頭上，哭泣悲哀，喊著說：哀哉！哀哉！這大城啊。凡有船在海中的，都因他的珍寶成了富足！他在一時之間就成了荒場！","他们又把尘土撒在头上，哭泣悲哀，喊着说：哀哉！哀哉！这大城啊。凡有船在海中的，都因他的珍宝成了富足！他在一时之间就成了荒场！","And they cast dust on their heads, and cried, weeping and wailing, saying, Alas, alas, that great city, wherein were made rich all that had ships in the sea by reason of her costliness! for in one hour is she made desolate."],"65.18.20":["天哪，眾聖徒、眾使徒、眾先知啊，你們都要因他歡喜，因為神已經在他身上伸了你們的冤。","天哪，众圣徒、众使徒、众先知啊，你们都要因他欢喜，因为神已经在他身上伸了你们的冤。","Rejoice over her, [thou] heaven, and [ye] holy apostles and prophets; for God hath avenged you on her."],"65.18.21":["有一位大力的天使舉起一塊石頭，好像大磨石，扔在海裡，說：巴比倫大城也必這樣猛力的被扔下去，決不能再見了。","有一位大力的天使举起一块石头，好像大磨石，扔在海里，说：巴比伦大城也必这样猛力的被扔下去，决不能再见了。","And a mighty angel took up a stone like a great millstone, and cast [it] into the sea, saying, Thus with violence shall that great city Babylon be thrown down, and shall be found no more at all."],"42.5.25":["我實實在在的告訴你們，時候將到，現在就是了，死人要聽見神兒子的聲音，聽見的人就要活了。","我实实在在的告诉你们，时候将到，现在就是了，死人要听见神儿子的声音，听见的人就要活了。","Verily, verily, I say unto you, The hour is coming, and now is, when the dead shall hear the voice of the Son of God: and they that hear shall live."],"42.5.26":["因為父怎樣在自己有生命，就賜給他兒子也照樣在自己有生命，","因为父怎样在自己有生命，就赐给他儿子也照样在自己有生命，","For as the Father hath life in himself; so hath he given to the Son to have life in himself;"],"42.5.27":["並且因為他是人子，就賜給他行審判的權柄。","并且因为他是人子，就赐给他行审判的权柄。","And hath given him authority to execute judgment also, because he is the Son of man."],"42.5.28":["你們不要把這事看作希奇。時候要到，凡在墳墓裡的，都要聽見他的聲音，就出來；","你们不要把这事看作希奇。时候要到，凡在坟墓里的，都要听见他的声音，就出来；","Marvel not at this: for the hour is coming, in the which all that are in the graves shall hear his voice,"],"54.1.10":["但如今藉著我們救主基督耶穌的顯現才表明出來了。他已經把死廢去，藉著福音，將不能壞的生命彰顯出來。","但如今借着我们救主基督耶稣的显现才表明出来了。他已经把死废去，借着福音，将不能坏的生命彰显出来。","But is now made manifest by the appearing of our Saviour Jesus Christ, who hath abolished death, and hath brought life and immortality to light through the gospel:"],"57.2.14":["兒女既同有血肉之體，他也照樣親自成了血肉之體，特要藉著死敗壞那掌死權的，就是魔鬼，","儿女既同有血肉之体，他也照样亲自成了血肉之体，特要借着死败坏那掌死权的，就是魔鬼，","Forasmuch then as the children are partakers of flesh and blood, he also himself likewise took part of the same; that through death he might destroy him that had the power of death, that is, the devil;"],"44.5.12":["這就如罪是從一人入了世界，死又是從罪來的；於是死就臨到眾人，因為眾人都犯了罪。","这就如罪是从一人入了世界，死又是从罪来的；于是死就临到众人，因为众人都犯了罪。","Wherefore, as by one man sin entered into the world, and death by sin; and so death passed upon all men, for that all have sinned:"],"43.17.25":["也不用人手服事，好像缺少什麼；自己倒將生命、氣息、萬物，賜給萬人。","也不用人手服事，好像缺少什么；自己倒将生命、气息、万物，赐给万人。","Neither is worshipped with men's hands, as though he needed any thing, seeing he giveth to all life, and breath, and all things;"],"25.37.5":["主耶和華對這些骸骨如此說：我必使氣息進入你們裡面，你們就要活了。","主耶和华对这些骸骨如此说：我必使气息进入你们里面，你们就要活了。","Thus saith the Lord GOD unto these bones; Behold, I will cause breath to enter into you, and ye shall live:"],"18.146.4":["他的氣一斷，就歸回塵土；他所打算的，當日就消滅了。","他的气一断，就归回尘土；他所打算的，当日就消灭了。","His breath goeth forth, he returneth to his earth; in that very day his thoughts perish."],"26.5.23":["竟向天上的主自高，使人將他殿中的器皿拿到你面前，你和大臣、皇后、妃嬪用這器皿飲酒。你又讚美那不能看、不能聽、無知無識、金、銀、銅、鐵、木、石所造的神，卻沒有將榮耀歸與那手中有你氣息，管理你一切行動的神。","竟向天上的主自高，使人将他殿中的器皿拿到你面前，你和大臣、皇后、妃嫔用这器皿饮酒。你又赞美那不能看、不能听、无知无识、金、银、铜、铁、木、石所造的神，却没有将荣耀归与那手中有你气息，管理你一切行动的神。","But hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou, and thy lords, thy wives, and thy concubines, have drunk wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know: and the God in whose hand thy breath [is], and whose [are] all thy ways, hast thou not glorified:"],"0.25.8":["亞伯拉罕壽高年邁，氣絕而死，歸到他列祖【原文作本民】那裡。","亚伯拉罕寿高年迈，气绝而死，归到他列祖【原文作本民】那里。","Then Abraham gave up the ghost, and died in a good old age, an old man, and full [of years]; and was gathered to his people."],"20.9.5":["活著的人知道必死；死了的人毫無所知，也不再得賞賜；他們的名無人記念。","活着的人知道必死；死了的人毫无所知，也不再得赏赐；他们的名无人记念。","For the living know that they shall die: but the dead know not any thing, neither have they any more a reward; for the memory of them is forgotten."],"20.9.6":["他們的愛，他們的恨，他們的嫉妒，早都消滅了。在日光之下所行的一切事上，他們永不再有分了。","他们的爱，他们的恨，他们的嫉妒，早都消灭了。在日光之下所行的一切事上，他们永不再有分了。","Also their love, and their hatred, and their envy, is now perished; neither have they any more a portion for ever in any [thing] that is done under the sun."],"17.14.12":["人也是如此，躺下不再起來，等到天沒有了，仍不得復醒，也不得從睡中喚醒。","人也是如此，躺下不再起来，等到天没有了，仍不得复醒，也不得从睡中唤醒。","So man lieth down, and riseth not: till the heavens [be] no more, they shall not awake, nor be raised out of their sleep."],"17.14.21":["他兒子得尊榮，他也不知道，降為卑，他也不覺得。","他儿子得尊荣，他也不知道，降为卑，他也不觉得。","His sons come to honour, and he knoweth [it] not; and they are brought low, but he perceiveth [it] not of them."],"42.11.11":["耶穌說了這話，隨後對他們說：我們的朋友拉撒路睡了，我去叫醒他。","耶稣说了这话，随后对他们说：我们的朋友拉撒路睡了，我去叫醒他。","These things said he: and after that he saith unto them, Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep."],"42.11.12":["門徒說：主啊，他若睡了，就必好了。","门徒说：主啊，他若睡了，就必好了。","Then said his disciples, Lord, if he sleep, he shall do well."],"42.11.13":["耶穌這話是指著他死說的，他們卻以為是說照常睡了。","耶稣这话是指着他死说的，他们却以为是说照常睡了。","Howbeit Jesus spake of his death: but they thought that he had spoken of taking of rest in sleep."],"42.11.14":["耶穌就明明的告訴他們說：拉撒路死了。","耶稣就明明的告诉他们说：拉撒路死了。","Then said Jesus unto them plainly, Lazarus is dead."],"51.4.13":["論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。","论到睡了的人，我们不愿意弟兄们不知道，恐怕你们忧伤，像那些没有指望的人一样。","But I would not have you to be ignorant, brethren, concerning them which are asleep, that ye sorrow not, even as others which have no hope."],"51.4.14":["我們若信耶穌死而復活了，那已經在耶穌裡睡了的人，神也必將他與耶穌一同帶來。","我们若信耶稣死而复活了，那已经在耶稣里睡了的人，神也必将他与耶稣一同带来。","For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with him."],"51.4.15":["我們現在照主的話告訴你們一件事：我們這活著還存留到主降臨的人，斷不能在那已經睡了的人之先。","我们现在照主的话告诉你们一件事：我们这活着还存留到主降临的人，断不能在那已经睡了的人之先。","For this we say unto you by the word of the Lord, that we which are alive [and] remain unto the coming of the Lord shall not prevent them which are asleep."],"39.27.52":["墳墓也開了，已睡聖徒的身體多有起來的。","坟墓也开了，已睡圣徒的身体多有起来的。","And the graves were opened; and many bodies of the saints which slept arose,"],"26.12.2":["睡在塵埃中的，必有多人復醒。其中有得永生的，有受羞辱永遠被憎惡的。","睡在尘埃中的，必有多人复醒。其中有得永生的，有受羞辱永远被憎恶的。","And many of them that sleep in the dust of the earth shall awake, some to everlasting life, and some to shame [and] everlasting contempt."],"22.57.1":["義人死亡，無人放在心上；虔誠人被收去，無人思念。這義人被收去是免了將來的禍患；","义人死亡，无人放在心上；虔诚人被收去，无人思念。这义人被收去是免了将来的祸患；","The righteous perisheth, and no man layeth [it] to heart: and merciful men [are] taken away, none considering that the righteous is taken away from the evil [to come]."],"22.57.2":["他們得享（原文是進入）平安。素行正直的，各人在墳裡（原文是床上）安歇。","他们得享（原文是进入）平安。素行正直的，各人在坟里（原文是床上）安歇。","He shall enter into peace: they shall rest in their beds, [each one] walking [in] his uprightness."],"22.26.19":["死人（原文是你的死人）要復活，屍首（原文是我的屍首）要興起。睡在塵埃的啊，要醒起歌唱！因你的甘露好像菜蔬上的甘露，地也要交出死人來。","死人（原文是你的死人）要复活，尸首（原文是我的尸首）要兴起。睡在尘埃的啊，要醒起歌唱！因你的甘露好像菜蔬上的甘露，地也要交出死人来。","Thy dead [men] shall live, [together with] my dead body shall they arise. Awake and sing, ye that dwell in dust: for thy dew [is as] the dew of herbs, and the earth shall cast out the dead."],"43.24.15":["並且靠著神，盼望死人，無論善惡，都要復活，就是他們自己也有這個盼望。","并且靠着神，盼望死人，无论善恶，都要复活，就是他们自己也有这个盼望。","And have hope toward God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust."],"42.5.29":["行善的，復活得生；作惡的，復活定罪。","行善的，复活得生；作恶的，复活定罪。","And shall come forth; they that have done good, unto the resurrection of life; and they that have done evil, unto the resurrection of damnation."],"39.27.53":["到耶穌復活以後，他們從墳墓裡出來，進了聖城，向許多人顯現。","到耶稣复活以后，他们从坟墓里出来，进了圣城，向许多人显现。","And came out of the graves after his resurrection, and went into the holy city, and appeared unto many."],"26.12.1":["那時，保佑你本國之民的天使長（原文是大君）米迦勒必站起來，並且有大艱難，從有國以來直到此時，沒有這樣的。你本國的民中，凡名錄在冊上的，必得拯救。","那时，保佑你本国之民的天使长（原文是大君）米迦勒必站起来，并且有大艰难，从有国以来直到此时，没有这样的。你本国的民中，凡名录在册上的，必得拯救。","And at that time shall Michael stand up, the great prince which standeth for the children of thy people: and there shall be a time of trouble, such as never was since there was a nation [even] to that same time: and at that time thy people shall be delivered, every one that shall be found written in the book."],"42.11.24":["馬大說：我知道在末日復活的時候，他必復活。","马大说：我知道在末日复活的时候，他必复活。","Martha saith unto him, I know that he shall rise again in the resurrection at the last day."],"51.4.16":["因為主必親自從天降臨，有呼叫的聲音和天使長的聲音，又有神的號吹響；那在基督裡死了的人必先復活。","因为主必亲自从天降临，有调用的声音和天使长的声音，又有神的号吹响；那在基督里死了的人必先复活。","For the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God: and the dead in Christ shall rise first:"],"51.4.17":["以後我們這活著還存留的人必和他們一同被提到雲裡，在空中與主相遇。這樣，我們就要和主永遠同在。","以后我们这活着还存留的人必和他们一同被提到云里，在空中与主相遇。这样，我们就要和主永远同在。","Then we which are alive [and] remain shall be caught up together with them in the clouds, to meet the Lord in the air: and so shall we ever be with the Lord."],"51.4.18":["所以，你們當用這些話彼此勸慰。","所以，你们当用这些话彼此劝慰。","Wherefore comfort one another with these words."],"45.15.20":["但基督已經從死裡復活，成為睡了之人初熟的果子。","但基督已经从死里复活，成为睡了之人初熟的果子。","But now is Christ risen from the dead, [and] become the firstfruits of them that slept."],"45.15.21":["死既是因一人而來，死人復活也是因一人而來。","死既是因一人而来，死人复活也是因一人而来。","For since by man [came] death, by man [came] also the resurrection of the dead."],"45.15.22":["在亞當裡眾人都死了；照樣，在基督裡眾人也都要復活。","在亚当里众人都死了；照样，在基督里众人也都要复活。","For as in Adam all die, even so in Christ shall all be made alive."],"45.15.51":["我如今把一件奧祕的事告訴你們：我們不是都要睡覺，乃是都要改變，","我如今把一件奥秘的事告诉你们：我们不是都要睡觉，乃是都要改变，","Behold, I shew you a mystery; We shall not all sleep, but we shall all be changed,"],"45.15.52":["就在一霎時，眨眼之間，號筒末次吹響的時候。因號筒要響，死人要復活成為不朽壞的，我們也要改變。","就在一霎时，眨眼之间，号筒末次吹响的时候。因号筒要响，死人要复活成为不朽坏的，我们也要改变。","In a moment, in the twinkling of an eye, at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible, and we shall be changed."],"45.15.53":["這必朽壞的總要變成（變成：原文是穿；下同）不朽壞的，這必死的總要變成不死的。","这必朽坏的总要变成（变成：原文是穿；下同）不朽坏的，这必死的总要变成不死的。","For this corruptible must put on incorruption, and this mortal [must] put on immortality."],"42.6.40":["因為我父的意思是叫一切見子而信的人得永生，並且在末日我要叫他復活。","因为我父的意思是叫一切见子而信的人得永生，并且在末日我要叫他复活。","And this is the will of him that sent me, that every one which seeth the Son, and believeth on him, may have everlasting life: and I will raise him up at the last day."],"25.33.18":["義人轉離他的義而作罪孽，就必因此死亡。","义人转离他的义而作罪孽，就必因此死亡。","When the righteous turneth from his righteousness, and committeth iniquity, he shall even die thereby."],"65.20.5":["這是頭一次的復活。（其餘的死人還沒有復活，直等那一千年完了。）","这是头一次的复活。（其余的死人还没有复活，直等那一千年完了。）","But the rest of the dead lived not again until the thousand years were finished. This [is] the first resurrection."],"65.20.6":["在頭一次復活有分的有福了，聖潔了！第二次的死在他們身上沒有權柄。他們必作神和基督的祭司，並要與基督一同作王一千年。","在头一次复活有分的有福了，圣洁了！第二次的死在他们身上没有权柄。他们必作神和基督的祭司，并要与基督一同作王一千年。","Blessed and holy [is] he that hath part in the first resurrection: on such the second death hath no power, but they shall be priests of God and of Christ, and shall reign with him a thousand years."],"65.20.13":["於是海交出其中的死人；死亡和陰間也交出其中的死人；他們都照各人所行的受審判。","于是海交出其中的死人；死亡和阴间也交出其中的死人；他们都照各人所行的受审判。","And the sea gave up the dead which were in it; and death and hell delivered up the dead which were in them: and they were judged every man according to their works."],"65.20.14":["死亡和陰間也被扔在火湖裡；這火湖就是第二次的死。","死亡和阴间也被扔在火湖里；这火湖就是第二次的死。","And death and hell were cast into the lake of fire. This is the second death."],"54.3.16":["聖經都是神所默示的（或作：凡神所默示的聖經），於教訓、督責、使人歸正、教導人學義都是有益的，","圣经都是神所默示的（或作：凡神所默示的圣经），于教训、督责、使人归正、教导人学义都是有益的，","All scripture [is] given by inspiration of God, and [is] profitable for doctrine, for reproof, for correction, for instruction in righteousness:"],"59.1.25":["惟有主的道是永存的。所傳給你們的福音就是這道。","惟有主的道是永存的。所传给你们的福音就是这道。","But the word of the Lord endureth for ever. And this is the word which by the gospel is preached unto you."],"65.19.9":["天使吩咐我說：你要寫上：凡被請赴羔羊之婚筵的有福了！又對我說：這是神真實的話。","天使吩咐我说：你要写上：凡被请赴羔羊之婚筵的有福了！又对我说：这是神真实的话。","And he saith unto me, Write, Blessed [are] they which are called unto the marriage supper of the Lamb. And he saith unto me, These are the true sayings of God."],"57.4.12":["神的道是活潑的，是有功效的，比一切兩刃的劍更快，甚至魂與靈，骨節與骨髓，都能刺入、剖開，連心中的思念和主意都能辨明。","神的道是活泼的，是有功效的，比一切两刃的剑更快，甚至魂与灵，骨节与骨髓，都能刺入、剖开，连心中的思念和主意都能辨明。","For the word of God [is] quick, and powerful, and sharper than any twoedged sword, piercing even to the dividing asunder of soul and spirit, and of the joints and marrow, and [is] a discerner of the thoughts and intents of the heart."],"60.1.19":["我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。","我们并有先知更确的预言，如同灯照在暗处。你们在这预言上留意，直等到天发亮，晨星在你们心里出现的时候，才是好的。","We have also a more sure word of prophecy; whereunto ye do well that ye take heed, as unto a light that shineth in a dark place, until the day dawn, and the day star arise in your hearts:"],"44.15.4":["從前所寫的聖經都是為教訓我們寫的，叫我們因聖經所生的忍耐和安慰可以得著盼望。","从前所写的圣经都是为教训我们写的，叫我们因圣经所生的忍耐和安慰可以得着盼望。","For whatsoever things were written aforetime were written for our learning, that we through patience and comfort of the scriptures might have hope."],"18.119.130":["你的言語一解開就發出亮光，使愚人通達。","你的言语一解开就发出亮光，使愚人通达。","The entrance of thy words giveth light; it giveth understanding unto the simple."],"18.119.105":["你的話是我腳前的燈，是我路上的光。","你的话是我脚前的灯，是我路上的光。","NUN. Thy word [is] a lamp unto my feet, and a light unto my path."],"54.3.15":["並且知道你是從小明白聖經，這聖經能使你因信基督耶穌，有得救的智慧。","并且知道你是从小明白圣经，这圣经能使你因信基督耶稣，有得救的智能。","And that from a child thou hast known the holy scriptures, which are able to make thee wise unto salvation through faith which is in Christ Jesus."],"42.17.17":["求你用真理使他們成聖；你的道就是真理。","求你用真理使他们成圣；你的道就是真理。","Sanctify them through thy truth: thy word is truth."],"18.19.7":["耶和華的律法全備，能甦醒人心；耶和華的法度確定，能使愚人有智慧。","耶和华的律法全备，能苏醒人心；耶和华的法度确定，能使愚人有智能。","The law of the
