<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F141D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="隨身經典">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<title>隨身經典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens: full light palette on bare :root ---------- */
:root{
  --ground:#FBFBF9; --surface:#FFFFFF; --surface-2:#F3F4F2;
  --ink:#16233A; --muted:#5A6379; --faint:#8A93A5;
  --rule:#DBDDE3; --rule-soft:#EBECF0;
  --brass:#8C6420; --brass-ink:#6B4B16; --brass-soft:#F4E8CE; --brass-line:#DDC58E;
  --sage:#3D5E44; --sage-soft:#E3ECE4;
  --clay:#964734; --clay-soft:#F6E4DF;
  --shadow:0 1px 2px rgba(22,35,58,.05), 0 10px 28px rgba(22,35,58,.06);
  --f-disp:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-scr:"Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,serif;
  --maxw:620px; --fs:1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F141D; --surface:#161C27; --surface-2:#1C2331;
    --ink:#E6EAF1; --muted:#96A0B4; --faint:#6C7587;
    --rule:#28303E; --rule-soft:#1E2532;
    --brass:#D4A95C; --brass-ink:#E9CE96; --brass-soft:#2C2517; --brass-line:#4A3C22;
    --sage:#8FB897; --sage-soft:#1B2A1F;
    --clay:#DD9484; --clay-soft:#2E1C18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0F141D; --surface:#161C27; --surface-2:#1C2331;
  --ink:#E6EAF1; --muted:#96A0B4; --faint:#6C7587;
  --rule:#28303E; --rule-soft:#1E2532;
  --brass:#D4A95C; --brass-ink:#E9CE96; --brass-soft:#2C2517; --brass-line:#4A3C22;
  --sage:#8FB897; --sage-soft:#1B2A1F;
  --clay:#DD9484; --clay-soft:#2E1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:calc(16px * var(--fs));line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule-soft)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:54px}
.bar-title{font-weight:600;font-size:16px;letter-spacing:.01em;flex:1 1 auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wordmark{font-family:var(--f-disp);font-size:19px;font-weight:600;letter-spacing:.01em;flex:1 1 auto;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wordmark i{font-style:normal;font-weight:500;color:var(--brass)}
.back{display:flex;align-items:center;gap:3px;color:var(--brass);font-size:15px;white-space:nowrap;flex:0 0 auto;
  margin-left:-6px;padding:6px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--rule-soft);
  border-radius:9px;padding:2px;gap:2px;flex:0 0 auto}
.seg button{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.04em;
  padding:5px 8px;border-radius:7px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{padding:18px 0 calc(104px * var(--fs))}

/* ---------- topic list ---------- */
.search{width:100%;padding:11px 14px;border-radius:11px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink);font:inherit;font-size:calc(15px * var(--fs));margin-bottom:6px}
.search::placeholder{color:var(--faint)}
.hint{color:var(--muted);font-size:calc(12.5px * var(--fs));line-height:1.55;margin:10px 2px 16px}
.tlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.trow{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;
  border-bottom:1px solid var(--rule-soft)}
.tlist .trow:last-child{border-bottom:0}
.trow:active{background:var(--surface-2)}
.trow-main{flex:1 1 auto;min-width:0}
.trow-zh{display:block;font-weight:600;font-size:calc(16px * var(--fs));letter-spacing:.01em}
.trow-en{display:block;font-family:var(--f-disp);font-weight:500;
  font-size:calc(12px * var(--fs));letter-spacing:.07em;color:var(--muted);
  margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.count{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--muted);font-variant-numeric:tabular-nums}
.pagebadge{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));font-weight:600;color:var(--brass-ink);
  background:var(--brass-soft);border:1px solid var(--brass-line);border-radius:5px;
  padding:1px 5px;letter-spacing:.03em}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brass);flex:0 0 auto}
.chev{color:var(--faint);font-size:calc(17px * var(--fs));flex:0 0 auto}

/* ---------- topic detail ---------- */
.thead{margin:2px 0 18px}
.thead h1{font-size:calc(26px * var(--fs));line-height:1.25;margin:0;letter-spacing:.01em;text-wrap:balance}
.thead .en{font-family:var(--f-disp);font-weight:500;font-size:calc(13px * var(--fs));
  color:var(--brass);margin-top:4px;letter-spacing:.1em}
.thead .src{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint);margin-top:8px;letter-spacing:.03em}
.actions{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;
  border-radius:10px;border:1px solid var(--rule);background:var(--surface);font-size:calc(14.5px * var(--fs));
  font-weight:500;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn-brass{background:var(--brass-soft);color:var(--brass-ink);border-color:var(--brass-line);box-shadow:none}
.btn-wide{flex:1 1 0}
.btn-sage{background:var(--sage-soft);color:var(--sage);border-color:transparent}
.btn-clay{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.btn:disabled{opacity:.4}

.sub{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--brass);margin:22px 0 8px;padding-bottom:5px;
  border-bottom:1px solid var(--brass-line)}
.sub em{display:block;font-family:var(--f-ui);font-style:normal;font-size:calc(14.5px * var(--fs));font-weight:600;
  letter-spacing:.01em;color:var(--ink);text-transform:none;margin-bottom:3px}
.entry{display:block;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
.entry:active{background:var(--surface-2)}
.eline{display:flex;align-items:baseline;gap:0}
.enum{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--faint);
  flex:0 0 auto;min-width:calc(26px * var(--fs));
  font-variant-numeric:tabular-nums;padding-top:2px}
.etext{font-size:calc(15px * var(--fs));line-height:1.45}
.i1 .etext{padding-left:14px}
.leader{flex:1 1 auto;border-bottom:1px dotted var(--rule);margin:0 6px;transform:translateY(-4px);min-width:10px}
.eref{font-family:var(--f-mono);font-size:calc(12.5px * var(--fs));color:var(--brass-ink);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.eref.blank{color:var(--faint)}
.erefs{display:flex;flex-direction:column;align-items:flex-end;gap:1px;
  padding-left:26px;margin-top:2px}
.een{font-size:calc(11.5px * var(--fs));color:var(--faint);padding-left:26px;margin-top:1px;line-height:1.4}

/* ---------- drill card ---------- */
.prog{height:4px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--brass);border-radius:99px;transition:width .25s ease}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.stepback{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--brass);
  padding:2px 0;letter-spacing:.03em}
.qmeta .n{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--muted);letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;
  padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card .ctx{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));letter-spacing:.1em;text-transform:uppercase;
  color:var(--brass)}
.card .qtext{font-size:calc(19px * var(--fs));line-height:1.5;letter-spacing:.01em;text-wrap:balance}
.card .qen{font-size:calc(12.5px * var(--fs));color:var(--faint);line-height:1.45}
.card hr{border:0;border-top:1px solid var(--rule-soft);margin:0}
.answer{font-family:var(--f-mono);font-size:calc(17px * var(--fs));color:var(--brass-ink);letter-spacing:.02em;
  font-variant-numeric:tabular-nums;word-break:break-word}
.rseg{display:inline-block;padding:1px 4px 3px;border-radius:4px}
.rseg.hid{color:var(--faint);cursor:pointer;border-bottom:1.5px dashed var(--brass-line)}
.rseg.hid:active{background:var(--brass-soft)}
.rsep{color:var(--faint);padding:0 1px}
.rline{display:block;height:2px}
.answer .rseg{display:inline-block}
.taprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.taprow .h{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--brass);
  letter-spacing:.05em}
.rchips{display:flex;align-items:center;gap:4px;margin-left:auto}
.rchips .lbl{font-family:var(--f-mono);font-size:calc(10px * var(--fs));color:var(--faint);
  letter-spacing:.08em}
.rchips button{font-family:var(--f-mono);font-size:calc(10px * var(--fs));padding:4px 8px;
  border-radius:99px;border:1px solid var(--rule-soft);color:var(--muted);background:var(--surface)}
.rchips button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink);
  border-color:var(--brass-line);font-weight:600}
.qtext.tap,.vbody.tap{cursor:pointer;border-radius:8px}
.qtext.tap:active,.vbody.tap:active{background:var(--brass-soft)}
.taphint{font-family:var(--f-mono);font-size:calc(10.5px * var(--fs));color:var(--brass);
  letter-spacing:.05em;margin-top:-6px}
.rbk{font-size:.72em;color:var(--faint);letter-spacing:0}
.spacer{flex:1 1 auto}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule-soft);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
.footbar .wrap{display:flex;gap:8px}

/* ---------- verse ---------- */
.vrow{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:11px 0;
  border-bottom:1px solid var(--rule-soft)}
.vkey{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--brass-ink);flex:0 0 auto;min-width:calc(62px * var(--fs));
  font-variant-numeric:tabular-nums}
.vtext{font-family:var(--f-scr);font-size:calc(15px * var(--fs));line-height:1.6;flex:1 1 auto;min-width:0}
.vbody{font-family:var(--f-scr);font-size:calc(20px * var(--fs));line-height:1.95;letter-spacing:.01em}
.vbody.en{line-height:1.7;letter-spacing:0}
.blk{display:inline-block;background:var(--brass-soft);border-bottom:1.5px solid var(--brass-line);
  border-radius:3px;color:transparent;margin:0 1px;cursor:pointer;user-select:none}
.blk.on{background:transparent;border-bottom-color:var(--brass);color:var(--brass-ink)}
.stat{display:flex;gap:14px;margin-top:14px}
.stat div{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));color:var(--muted);letter-spacing:.04em}
.stat b{color:var(--ink)}
.note{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:12px;
  padding:13px 14px;color:var(--muted);font-size:calc(13px * var(--fs));line-height:1.6}
.done{text-align:center;padding:34px 10px}
.done .big{font-family:var(--f-mono);font-weight:600;font-size:calc(38px * var(--fs));
  color:var(--brass);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.done p{color:var(--muted);font-size:calc(14px * var(--fs));margin:12px 0 22px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule-soft);
  color:var(--faint);font-size:calc(11.5px * var(--fs));line-height:1.7}

/* ---------- filter row + item state ---------- */
.filt{display:flex;align-items:center;gap:4px;margin:0 0 12px}
.filt button{font-family:var(--f-mono);font-size:calc(11.5px * var(--fs));letter-spacing:.04em;
  padding:5px 10px;border-radius:99px;color:var(--muted);border:1px solid var(--rule-soft);
  background:var(--surface)}
.filt button[aria-pressed="true"]{background:var(--brass-soft);color:var(--brass-ink);
  border-color:var(--brass-line);font-weight:600}
.vstate{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:.45em}
.vstate.solid{background:var(--sage)}
.vstate.weak{background:var(--clay)}
.vstate.new{background:transparent;box-shadow:inset 0 0 0 1.5px var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 2px 14px}
.legend span{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);
  font-size:calc(10.5px * var(--fs));color:var(--faint)}
.legend .vstate{margin-top:0}
.clearbtn{display:block;margin:26px auto 0;font-size:calc(12.5px * var(--fs));color:var(--faint);
  padding:8px 12px;border-radius:8px}
.clearbtn.armed{color:var(--clay);background:var(--clay-soft);font-weight:600}

/* ---------- type-size control ---------- */
.abtn{display:flex;align-items:baseline;gap:1px;padding:6px 8px;border-radius:8px;
  border:1px solid var(--rule-soft);background:var(--surface-2);color:var(--muted);flex:0 0 auto}
.abtn[aria-expanded="true"]{background:var(--brass-soft);border-color:var(--brass-line);color:var(--brass-ink)}
.abtn .s{font-family:var(--f-disp);font-size:12px;line-height:1}
.abtn .l{font-family:var(--f-disp);font-size:17px;line-height:1}
.fspanel{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.fspanel h2{font-size:calc(13px * var(--fs));margin:0 0 12px;letter-spacing:.02em}
.fsrow{display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--rule);border-radius:10px;
  overflow:hidden;flex:0 0 auto}
.stepper button{width:46px;height:40px;font-size:20px;line-height:1;color:var(--brass-ink);
  background:var(--surface)}
.stepper button:disabled{color:var(--faint);opacity:.5}
.stepper button:active:not(:disabled){background:var(--brass-soft)}
.stepper span{width:1px;height:24px;background:var(--rule)}
.fsname{font-family:var(--f-mono);font-size:calc(12px * var(--fs));color:var(--muted);
  letter-spacing:.06em;flex:1 1 auto}
.fsname b{color:var(--ink);font-weight:600}
.fssample{margin-top:14px;padding-top:13px;border-top:1px solid var(--rule-soft)}
.fssample .k{font-family:var(--f-mono);font-size:calc(11px * var(--fs));color:var(--brass-ink);
  margin-bottom:3px}
.fssample .v{font-family:var(--f-scr);font-size:calc(20px * var(--fs));line-height:1.95}
.fsreset{margin-top:12px;font-size:calc(12.5px * var(--fs));color:var(--brass-ink);
  text-decoration:underline;text-decoration-color:var(--brass-line);text-underline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

f the fat thereof. And the LORD had respect unto Abel and to his offering:"],"0.4.5":["只是看不中該隱和他的供物。該隱就大大的發怒，變了臉色。","只是看不中该隐和他的供物。该隐就大大的发怒，变了脸色。","But unto Cain and to his offering he had not respect. And Cain was very wroth, and his countenance fell."],"0.4.6":["耶和華對該隱說：你為什麼發怒呢？你為什麼變了臉色呢？","耶和华对该隐说：你为什么发怒呢？你为什么变了脸色呢？","And the LORD said unto Cain, Why art thou wroth? and why is thy countenance fallen?"],"0.4.7":["你若行得好，豈不蒙悅納？你若行得不好，罪就伏在門前。他必戀慕你，你卻要制伏他。","你若行得好，岂不蒙悦纳？你若行得不好，罪就伏在门前。他必恋慕你，你却要制伏他。","If thou doest well, shalt thou not be accepted? and if thou doest not well, sin lieth at the door. And unto thee [shall be] his desire, and thou shalt rule over him."],"0.4.8":["該隱與他兄弟亞伯說話；二人正在田間。該隱起來打他兄弟亞伯，把他殺了。","该隐与他兄弟亚伯说话；二人正在田间。该隐起来打他兄弟亚伯，把他杀了。","And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him."],"0.4.9":["耶和華對該隱說：你兄弟亞伯在哪裡？他說：我不知道！我豈是看守我兄弟的嗎？","耶和华对该隐说：你兄弟亚伯在哪里？他说：我不知道！我岂是看守我兄弟的吗？","And the LORD said unto Cain, Where [is] Abel thy brother? And he said, I know not: [Am] I my brother's keeper?"],"0.4.10":["耶和華說：你做了什麼事呢？你兄弟的血有聲音從地裡向我哀告。","耶和华说：你做了什么事呢？你兄弟的血有声音从地里向我哀告。","And he said, What hast thou done? the voice of thy brother's blood crieth unto me from the ground."],"0.4.11":["地開了口，從你手裡接受你兄弟的血。現在你必從這地受咒詛。","地开了口，从你手里接受你兄弟的血。现在你必从这地受咒诅。","And now [art] thou cursed from the earth, which hath opened her mouth to receive thy brother's blood from thy hand;"],"0.4.12":["你種地，地不再給你效力；你必流離飄蕩在地上。","你种地，地不再给你效力；你必流离飘荡在地上。","When thou tillest the ground, it shall not henceforth yield unto thee her strength; a fugitive and a vagabond shalt thou be in the earth."],"0.8.20":["挪亞為耶和華築了一座壇，拿各類潔淨的牲畜、飛鳥獻在壇上為燔祭。","挪亚为耶和华筑了一座坛，拿各类洁净的牲畜、飞鸟献在坛上为燔祭。","And Noah builded an altar unto the LORD; and took of every clean beast, and of every clean fowl, and offered burnt offerings on the altar."],"0.22.1":["這些事以後，神要試驗亞伯拉罕，就呼叫他說：亞伯拉罕！他說：我在這裡。","这些事以后，神要试验亚伯拉罕，就调用他说：亚伯拉罕！他说：我在这里。","And it came to pass after these things, that God did tempt Abraham, and said unto him, Abraham: and he said, Behold, [here] I [am]."],"0.22.2":["神說：你帶著你的兒子，就是你獨生的兒子，你所愛的以撒，往摩利亞地去，在我所要指示你的山上，把他獻為燔祭。","神说：你带着你的儿子，就是你独生的儿子，你所爱的以撒，往摩利亚地去，在我所要指示你的山上，把他献为燔祭。","And he said, Take now thy son, thine only [son] Isaac, whom thou lovest, and get thee into the land of Moriah; and offer him there for a burnt offering upon one of the mountains which I will tell thee of."],"0.22.3":["亞伯拉罕清早起來，備上驢，帶著兩個僕人和他兒子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去了。","亚伯拉罕清早起来，备上驴，带着两个仆人和他儿子以撒，也劈好了燔祭的柴，就起身往神所指示他的地方去了。","And Abraham rose up early in the morning, and saddled his ass, and took two of his young men with him, and Isaac his son, and clave the wood for the burnt offering, and rose up, and went unto the place of which God had told him."],"0.22.4":["到了第三日，亞伯拉罕舉目遠遠的看見那地方。","到了第三日，亚伯拉罕举目远远的看见那地方。","Then on the third day Abraham lifted up his eyes, and saw the place afar off."],"0.22.5":["亞伯拉罕對他的僕人說：你們和驢在此等候，我與童子往那裡去拜一拜，就回到你們這裡來。","亚伯拉罕对他的仆人说：你们和驴在此等候，我与童子往那里去拜一拜，就回到你们这里来。","And Abraham said unto his young men, Abide ye here with the ass; and I and the lad will go yonder and worship, and come again to you."],"0.22.6":["亞伯拉罕把燔祭的柴放在他兒子以撒身上，自己手裡拿著火與刀；於是二人同行。","亚伯拉罕把燔祭的柴放在他儿子以撒身上，自己手里拿着火与刀；于是二人同行。","And Abraham took the wood of the burnt offering, and laid [it] upon Isaac his son; and he took the fire in his hand, and a knife; and they went both of them together."],"0.22.7":["以撒對他父親亞伯拉罕說：父親哪！亞伯拉罕說：我兒，我在這裡。以撒說：請看，火與柴都有了，但燔祭的羊羔在哪裡呢？","以撒对他父亲亚伯拉罕说：父亲哪！亚伯拉罕说：我儿，我在这里。以撒说：请看，火与柴都有了，但燔祭的羊羔在哪里呢？","And Isaac spake unto Abraham his father, and said, My father: and he said, Here [am] I, my son. And he said, Behold the fire and the wood: but where [is] the lamb for a burnt offering?"],"0.22.8":["亞伯拉罕說：我兒，神必自己預備作燔祭的羊羔。於是二人同行。","亚伯拉罕说：我儿，神必自己预备作燔祭的羊羔。于是二人同行。","And Abraham said, My son, God will provide himself a lamb for a burnt offering: so they went both of them together."],"0.22.9":["他們到了神所指示的地方，亞伯拉罕在那裡築壇，把柴擺好，捆綁他的兒子以撒，放在壇的柴上。","他们到了神所指示的地方，亚伯拉罕在那里筑坛，把柴摆好，捆绑他的儿子以撒，放在坛的柴上。","And they came to the place which God had told him of; and Abraham built an altar there, and laid the wood in order, and bound Isaac his son, and laid him on the altar upon the wood."],"0.22.10":["亞伯拉罕就伸手拿刀，要殺他的兒子。","亚伯拉罕就伸手拿刀，要杀他的儿子。","And Abraham stretched forth his hand, and took the knife to slay his son."],"0.22.11":["耶和華的使者從天上呼叫他說：亞伯拉罕！亞伯拉罕！他說：我在這裡。","耶和华的使者从天上调用他说：亚伯拉罕！亚伯拉罕！他说：我在这里。","And the angel of the LORD called unto him out of heaven, and said, Abraham, Abraham: and he said, Here [am] I."],"0.22.12":["天使說：你不可在這童子身上下手。一點不可害他！現在我知道你是敬畏神的了；因為你沒有將你的兒子，就是你獨生的兒子，留下不給我。","天使说：你不可在这童子身上下手。一点不可害他！现在我知道你是敬畏神的了；因为你没有将你的儿子，就是你独生的儿子，留下不给我。","And he said, Lay not thine hand upon the lad, neither do thou any thing unto him: for now I know that thou fearest God, seeing thou hast not withheld thy son, thine only [son] from me."],"0.22.13":["亞伯拉罕舉目觀看，不料，有一隻公羊，兩角扣在稠密的小樹中，亞伯拉罕就取了那隻公羊來，獻為燔祭，代替他的兒子。","亚伯拉罕举目观看，不料，有一只公羊，两角扣在稠密的小树中，亚伯拉罕就取了那只公羊来，献为燔祭，代替他的儿子。","And Abraham lifted up his eyes, and looked, and behold behind [him] a ram caught in a thicket by his horns: and Abraham went and took the ram, and offered him up for a burnt offering in the stead of his son."],"0.22.14":["亞伯拉罕給那地方起名叫耶和華以勒【就是耶和華必預備的意思】，直到今日人還說：在耶和華的山上必有預備。","亚伯拉罕给那地方起名叫耶和华以勒【就是耶和华必预备的意思】，直到今日人还说：在耶和华的山上必有预备。","And Abraham called the name of that place Jehovahjireh: as it is said [to] this day, In the mount of the LORD it shall be seen."],"39.5.3":["虛心的人有福了！因為天國是他們的。","虚心的人有福了！因为天国是他们的。","Blessed [are] the poor in spirit: for theirs is the kingdom of heaven."],"39.5.4":["哀慟的人有福了！因為他們必得安慰。","哀恸的人有福了！因为他们必得安慰。","Blessed [are] they that mourn: for they shall be comforted."],"39.5.5":["溫柔的人有福了！因為他們必承受地土。","温柔的人有福了！因为他们必承受地土。","Blessed [are] the meek: for they shall inherit the earth."],"39.5.6":["飢渴慕義的人有福了！因為他們必得飽足。","饥渴慕义的人有福了！因为他们必得饱足。","Blessed [are] they which do hunger and thirst after righteousness: for they shall be filled."],"39.5.7":["憐恤人的人有福了！因為他們必蒙憐恤。","怜恤人的人有福了！因为他们必蒙怜恤。","Blessed [are] the merciful: for they shall obtain mercy."],"39.5.8":["清心的人有福了！因為他們必得見神。","清心的人有福了！因为他们必得见神。","Blessed [are] the pure in heart: for they shall see God."],"39.5.9":["使人和睦的人有福了！因為他們必稱為神的兒子。","使人和睦的人有福了！因为他们必称为神的儿子。","Blessed [are] the peacemakers: for they shall be called the children of God."],"39.5.10":["為義受逼迫的人有福了！因為天國是他們的。","为义受逼迫的人有福了！因为天国是他们的。","Blessed [are] they which are persecuted for righteousness' sake: for theirs is the kingdom of heaven."],"39.5.11":["人若因我辱罵你們，逼迫你們，捏造各樣壞話毀謗你們，你們就有福了！","人若因我辱骂你们，逼迫你们，捏造各样坏话毁谤你们，你们就有福了！","Blessed are ye, when [men] shall revile you, and persecute [you], and shall say all manner of evil against you falsely, for my sake."],"39.5.12":["應當歡喜快樂，因為你們在天上的賞賜是大的。在你們以前的先知，人也是這樣逼迫他們。","应当欢喜快乐，因为你们在天上的赏赐是大的。在你们以前的先知，人也是这样逼迫他们。","Rejoice, and be exceeding glad: for great [is] your reward in heaven: for so persecuted they the prophets which were before you."],"0.9.6":["凡流人血的，他的血也必被人所流，因為神造人是照自己的形像造的。","凡流人血的，他的血也必被人所流，因为神造人是照自己的形像造的。","Whoso sheddeth man's blood, by man shall his blood be shed: for in the image of God made he man."],"45.13.1":["我若能說萬人的方言，並天使的話語，卻沒有愛，我就成了鳴的鑼，響的鈸一般。","我若能说万人的方言，并天使的话语，却没有爱，我就成了鸣的锣，响的钹一般。","Though I speak with the tongues of men and of angels, and have not charity, I am become [as] sounding brass, or a tinkling cymbal."],"45.13.2":["我若有先知講道之能，也明白各樣的奧祕，各樣的知識，而且有全備的信，叫我能夠移山，卻沒有愛，我就算不得什麼。","我若有先知讲道之能，也明白各样的奥秘，各样的知识，而且有全备的信，叫我能够移山，却没有爱，我就算不得什么。","And though I have [the gift of] prophecy, and understand all mysteries, and all knowledge; and though I have all faith, so that I could remove mountains, and have not charity, I am nothing."],"45.13.3":["我若將所有的賙濟窮人，又捨己身叫人焚燒，卻沒有愛，仍然於我無益。","我若将所有的赒济穷人，又舍己身叫人焚烧，却没有爱，仍然于我无益。","And though I bestow all my goods to feed [the poor], and though I give my body to be burned, and have not charity, it profiteth me nothing."],"45.13.4":["愛是恆久忍耐，又有恩慈；愛是不嫉妒；愛是不自誇，不張狂，","爱是恒久忍耐，又有恩慈；爱是不嫉妒；爱是不自夸，不张狂，","Charity suffereth long, [and] is kind; charity envieth not; charity vaunteth not itself, is not puffed up,"],"45.13.5":["不做害羞的事，不求自己的益處，不輕易發怒，不計算人的惡，","不做害羞的事，不求自己的益处，不轻易发怒，不计算人的恶，","Doth not behave itself unseemly, seeketh not her own, is not easily provoked, thinketh no evil;"],"45.13.6":["不喜歡不義，只喜歡真理；","不喜欢不义，只喜欢真理；","Rejoiceth not in iniquity, but rejoiceth in the truth;"],"45.13.7":["凡事包容，凡事相信，凡事盼望，凡事忍耐。","凡事包容，凡事相信，凡事盼望，凡事忍耐。","Beareth all things, believeth all things, hopeth all things, endureth all things."],"45.13.8":["愛是永不止息。先知講道之能終必歸於無有；說方言之能終必停止；知識也終必歸於無有。","爱是永不止息。先知讲道之能终必归于无有；说方言之能终必停止；知识也终必归于无有。","Charity never faileth: but whether [there be] prophecies, they shall fail; whether [there be] tongues, they shall cease; whether [there be] knowledge, it shall vanish away."],"45.13.9":["我們現在所知道的有限，先知所講的也有限，","我们现在所知道的有限，先知所讲的也有限，","For we know in part, and we prophesy in part."],"45.13.10":["等那完全的來到，這有限的必歸於無有了。","等那完全的来到，这有限的必归于无有了。","But when that which is perfect is come, then that which is in part shall be done away."],"45.13.11":["我作孩子的時候，話語像孩子，心思像孩子，意念像孩子，既成了人，就把孩子的事丟棄了。","我作孩子的时候，话语像孩子，心思像孩子，意念像孩子，既成了人，就把孩子的事丢弃了。","When I was a child, I spake as a child, I understood as a child, I thought as a child: but when I became a man, I put away childish things."],"45.13.12":["我們如今彷彿對著鏡子觀看，糢糊不清（原文作：如同猜謎）；到那時就要面對面了。我如今所知道的有限，到那時就全知道，如同主知道我一樣。","我们如今仿佛对着镜子观看，糢糊不清（原文作：如同猜谜）；到那时就要面对面了。我如今所知道的有限，到那时就全知道，如同主知道我一样。","For now we see through a glass, darkly; but then face to face: now I know in part; but then shall I know even as also I am known."],"45.13.13":["如今常存的有信，有望，有愛這三樣，其中最大的是愛。","如今常存的有信，有望，有爱这三样，其中最大的是爱。","And now abideth faith, hope, charity, these three; but the greatest of these [is] charity."],"41.14.28":["你們哪一個要蓋一座樓，不先坐下算計花費，能蓋成不能呢？","你们哪一个要盖一座楼，不先坐下算计花费，能盖成不能呢？","For which of you, intending to build a tower, sitteth not down first, and counteth the cost, whether he have [sufficient] to finish [it]?"],"41.14.29":["恐怕安了地基，不能成功，看見的人都笑話他，說：","恐怕安了地基，不能成功，看见的人都笑话他，说：","Lest haply, after he hath laid the foundation, and is not able to finish [it], all that behold [it] begin to mock him,"],"41.14.30":["這個人開了工，卻不能完工。","这个人开了工，却不能完工。","Saying, This man began to build, and was not able to finish."],"44.16.17":["弟兄們，那些離間你們、叫你們跌倒、背乎所學之道的人，我勸你們要留意躲避他們。","弟兄们，那些离间你们、叫你们跌倒、背乎所学之道的人，我劝你们要留意躲避他们。","Now I beseech you, brethren, mark them which cause divisions and offences contrary to the doctrine which ye have learned; and avoid them."],"44.16.18":["因為這樣的人不服事我們的主基督，只服事自己的肚腹，用花言巧語誘惑那些老實人的心。","因为这样的人不服事我们的主基督，只服事自己的肚腹，用花言巧语诱惑那些老实人的心。","For they that are such serve not our Lord Jesus Christ, but their own belly; and by good words and fair speeches deceive the hearts of the simple."],"45.1.10":["弟兄們，我藉我們主耶穌基督的名勸你們都說一樣的話。你們中間也不可分黨，只要一心一意，彼此相合。","弟兄们，我藉我们主耶稣基督的名劝你们都说一样的话。你们中间也不可分党，只要一心一意，彼此相合。","Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and [that] there be no divisions among you; but [that] ye be perfectly joined together in the same mind and in the same judgment."],"45.2.1":["弟兄們，從前我到你們那裡去，並沒有用高言大智對你們宣傳神的奧祕。","弟兄们，从前我到你们那里去，并没有用高言大智对你们宣传神的奥秘。","And I, brethren, when I came to you, came not with excellency of speech or of wisdom, declaring unto you the testimony of God."],"45.2.2":["因為我曾定了主意，在你們中間不知道別的，只知道耶穌基督並他釘十字架。","因为我曾定了主意，在你们中间不知道别的，只知道耶稣基督并他钉十字架。","For I determined not to know any thing among you, save Jesus Christ, and him crucified."],"45.2.3":["我在你們那裡，又軟弱又懼怕，又甚戰兢。","我在你们那里，又软弱又惧怕，又甚战兢。","And I was with you in weakness, and in fear, and in much trembling."],"45.2.4":["我說的話、講的道，不是用智慧委婉的言語，乃是用聖靈和大能的明證，","我说的话、讲的道，不是用智能委婉的言语，乃是用圣灵和大能的明证，","And my speech and my preaching [was] not with enticing words of man's wisdom, but in demonstration of the Spirit and of power:"],"45.2.5":["叫你們的信不在乎人的智慧，只在乎神的大能。","叫你们的信不在乎人的智能，只在乎神的大能。","That your faith should not stand in the wisdom of men, but in the power of God."],"60.3.15":["並且要以我主長久忍耐為得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。","并且要以我主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智能写了信给你们。","And account [that] the longsuffering of our Lord [is] salvation; even as our beloved brother Paul also according to the wisdom given unto him hath written unto you;"],"60.3.16":["他一切的信上也都是講論這事。信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。","他一切的信上也都是讲论这事。信中有些难明白的，那无学问、不坚固的人强解，如强解别的经书一样，就自取沉沦。","As also in all [his] epistles, speaking in them of these things; in which are some things hard to be understood, which they that are unlearned and unstable wrest, as [they do] also the other scriptures, unto their own destruction."],"60.3.17":["親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。","亲爱的弟兄啊，你们既然预先知道这事，就当防备，恐怕被恶人的错谬诱惑，就从自己坚固的地步上坠落。","Ye therefore, beloved, seeing ye know [these things] before, beware lest ye also, being led away with the error of the wicked, fall from your own stedfastness."],"57.13.8":["耶穌基督，昨日、今日、一直到永遠、是一樣的。","耶稣基督，昨日、今日、一直到永远、是一样的。","Jesus Christ the same yesterday, and to day, and for ever."],"57.13.9":["你們不要被那諸般怪異的教訓勾引了去；因為人心靠恩得堅固才是好的，並不是靠飲食。那在飲食上專心的從來沒有得著益處。","你们不要被那诸般怪异的教训勾引了去；因为人心靠恩得坚固才是好的，并不是靠饮食。那在饮食上专心的从来没有得着益处。","Be not carried about with divers and strange doctrines. For [it is] a good thing that the heart be established with grace; not with meats, which have not profited them that have been occupied therein."],"57.5.12":["看你們學習的工夫，本該作師傅，誰知還得有人將神聖言小學的開端另教導你們，並且成了那必須吃奶，不能吃乾糧的人。","看你们学习的工夫，本该作师傅，谁知还得有人将神圣言小学的开端另教导你们，并且成了那必须吃奶，不能吃干粮的人。","For when for the time ye ought to be teachers, ye have need that one teach you again which [be] the first principles of the oracles of God; and are become such as have need of milk, and not of strong meat."],"57.5.13":["凡只能吃奶的都不熟練仁義的道理，因為他是嬰孩；","凡只能吃奶的都不熟练仁义的道理，因为他是婴孩；","For every one that useth milk [is] unskilful in the word of righteousness: for he is a babe."],"57.5.14":["惟獨長大成人的才能吃乾糧；他們的心竅習練得通達，就能分辨好歹了。","惟独长大成人的才能吃干粮；他们的心窍习练得通达，就能分辨好歹了。","But strong meat belongeth to them that are of full age, [even] those who by reason of use have their senses exercised to discern both good and evil."],"57.8.6":["如今耶穌所得的職任是更美的，正如他作更美之約的中保；這約原是憑更美之應許立的。","如今耶稣所得的职任是更美的，正如他作更美之约的中保；这约原是凭更美之应许立的。","But now hath he obtained a more excellent ministry, by how much also he is the mediator of a better covenant, which was established upon better promises."],"57.8.7":["那前約若沒有瑕疵，就無處尋求後約了。","那前约若没有瑕疵，就无处寻求后约了。","For if that first [covenant] had been faultless, then should no place have been sought for the second."],"57.8.8":["所以主指責他的百姓說（或作：所以主指前約的缺欠說）：日子將到，我要與以色列家和猶大家另立新約，","所以主指责他的百姓说（或作：所以主指前约的缺欠说）：日子将到，我要与以色列家和犹大家另立新约，","For finding fault with them, he saith, Behold, the days come, saith the Lord, when I will make a new covenant with the house of Israel and with the house of Judah:"],"57.8.9":["不像我拉著他們祖宗的手，領他們出埃及的時候，與他們所立的約。因為他們不恆心守我的約，我也不理他們。這是主說的。","不像我拉着他们祖宗的手，领他们出埃及的时候，与他们所立的约。因为他们不恒心守我的约，我也不理他们。这是主说的。","Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord."],"57.8.10":["主又說：那些日子以後，我與以色列家所立的約乃是這樣：我要將我的律法放在他們裡面，寫在他們心上；我要作他們的神；他們要作我的子民。","主又说：那些日子以后，我与以色列家所立的约乃是这样：我要将我的律法放在他们里面，写在他们心上；我要作他们的神；他们要作我的子民。","For this [is] the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws into their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people:"],"23.31.31":["耶和華說：日子將到，我要與以色列家和猶大家另立新約，","耶和华说：日子将到，我要与以色列家和犹大家另立新约，","Behold, the days come, saith the LORD, that I will make a new covenant with the house of Israel, and with the house of Judah:"],"23.31.32":["不像我拉著他們祖宗的手，領他們出埃及地的時候，與他們所立的約。我雖作他們的丈夫，他們卻背了我的約。這是耶和華說的。","不像我拉着他们祖宗的手，领他们出埃及地的时候，与他们所立的约。我虽作他们的丈夫，他们却背了我的约。这是耶和华说的。","Not according to the covenant that I made with their fathers in the day [that] I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, although I was an husband unto them, saith the LORD:"],"23.31.33":["耶和華說：那些日子以後，我與以色列家所立的約乃是這樣：我要將我的律法放在他們裡面，寫在他們心上。我要作他們的神，他們要作我的子民。","耶和华说：那些日子以后，我与以色列家所立的约乃是这样：我要将我的律法放在他们里面，写在他们心上。我要作他们的神，他们要作我的子民。","But this [shall be] the covenant that I will make with the house of Israel; After those days, saith the LORD, I will put my law in their inward parts, and write it in their hearts; and will be their God, and they shall be my people."],"23.31.34":["他們各人不再教導自己的鄰舍和自己的弟兄說：你該認識耶和華，因為他們從最小的到至大的都必認識我。我要赦免他們的罪孽，不再記念他們的罪惡。這是耶和華說的。","他们各人不再教导自己的邻舍和自己的弟兄说：你该认识耶和华，因为他们从最小的到至大的都必认识我。我要赦免他们的罪孽，不再记念他们的罪恶。这是耶和华说的。","And they shall teach no more every man his neighbour, and every man his brother, saying, Know the LORD: for they shall all know me, from the least of them unto the greatest of them, saith the LORD: for I will forgive their iniquity, and I will remember their sin no more."],"57.11.1":["信就是所望之事的實底，是未見之事的確據。","信就是所望之事的实底，是未见之事的确据。","Now faith is the substance of things hoped for, the evidence of things not seen."],"57.11.2":["古人在這信上得了美好的證據。","古人在这信上得了美好的证据。","For by it the elders obtained a good report."],"57.11.3":["我們因著信，就知道諸世界是藉神話造成的；這樣，所看見的，並不是從顯然之物造出來的。","我们因着信，就知道诸世界是藉神话造成的；这样，所看见的，并不是从显然之物造出来的。","Through faith we understand that the worlds were framed by the word of God, so that things which are seen were not made of things which do appear."],"57.11.4":["亞伯因著信，獻祭與神，比該隱所獻的更美，因此便得了稱義的見證，就是神指他禮物作的見證。他雖然死了，卻因這信，仍舊說話。","亚伯因着信，献祭与神，比该隐所献的更美，因此便得了称义的见证，就是神指他礼物作的见证。他虽然死了，却因这信，仍旧说话。","By faith Abel offered unto God a more excellent sacrifice than Cain, by which he obtained witness that he was righteous, God testifying of his gifts: and by it he being dead yet speaketh."],"57.11.5":["以諾因著信，被接去，不至於見死，人也找不著他，因為神已經把他接去了；只是他被接去以先，已經得了神喜悅他的明證。","以诺因着信，被接去，不至于见死，人也找不着他，因为神已经把他接去了；只是他被接去以先，已经得了神喜悦他的明证。","By faith Enoch was translated that he should not see death; and was not found, because God had translated him: for before his translation he had this testimony, that he pleased God."],"57.11.6":["人非有信，就不能得神的喜悅；因為到神面前來的人必須信有神，且信他賞賜那尋求他的人。","人非有信，就不能得神的喜悦；因为到神面前来的人必须信有神，且信他赏赐那寻求他的人。","But without faith [it is] impossible to please [him]: for he that cometh to God must believe that he is, and [that] he is a rewarder of them that diligently seek him."],"57.11.7":["挪亞因著信，既蒙神指示他未見的事，動了敬畏的心，預備了一隻方舟，使他全家得救。因此就定了那世代的罪，自己也承受了那從信而來的義。","挪亚因着信，既蒙神指示他未见的事，动了敬畏的心，预备了一只方舟，使他全家得救。因此就定了那世代的罪，自己也承受了那从信而来的义。","By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith."],"57.11.8":["亞伯拉罕因著信，蒙召的時候就遵命出去，往將來要得為業的地方去；出去的時候，還不知往哪裡去。","亚伯拉罕因着信，蒙召的时候就遵命出去，往将来要得为业的地方去；出去的时候，还不知往哪里去。","By faith Abraham, when he was called to go out into a place which he should after receive for an inheritance, obeyed; and he went out, not knowing whither he went."],"57.11.9":["他因著信，就在所應許之地作客，好像在異地居住帳棚，與那同蒙一個應許的以撒、雅各一樣。","他因着信，就在所应许之地作客，好像在异地居住帐棚，与那同蒙一个应许的以撒、雅各一样。","By faith he sojourned in the land of promise, as [in] a strange country, dwelling in tabernacles with Isaac and Jacob, the heirs with him of the same promise:"],"57.11.10":["因為他等候那座有根基的城，就是神所經營所建造的。","因为他等候那座有根基的城，就是神所经营所建造的。","For he looked for a city which hath foundations, whose builder and maker [is] God."],"57.11.11":["因著信，連撒拉自己，雖然過了生育的歲數，還能懷孕，因他以為那應許他的是可信的。","因着信，连撒拉自己，虽然过了生育的岁数，还能怀孕，因他以为那应许他的是可信的。","Through faith also Sara herself received strength to conceive seed, and was delivered of a child when she was past age, because she judged him faithful who had promised."],"57.11.12":["所以從一個彷彿已死的人就生出子孫，如同天上的星那樣眾多，海邊的沙那樣無數。","所以从一个仿佛已死的人就生出子孙，如同天上的星那样众多，海边的沙那样无数。","Therefore sprang there even of one, and him as good as dead, [so many] as the stars of the sky in multitude, and as the sand which is by the sea shore innumerable."],"57.11.13":["這些人都是存著信心死的，並沒有得著所應許的；卻從遠處望見，且歡喜迎接，又承認自己在世上是客旅，是寄居的。","这些人都是存着信心死的，并没有得着所应许的；却从远处望见，且欢喜迎接，又承认自己在世上是客旅，是寄居的。","These all died in faith, not having received the promises, but having seen them afar off, and were persuaded of [them], and embraced [them], and confessed that they were strangers and pilgrims on the earth."],"57.11.14":["說這樣話的人是表明自己要找一個家鄉。","说这样话的人是表明自己要找一个家乡。","For they that say such things declare plainly that they seek a country."],"57.11.15":["他們若想念所離開的家鄉，還有可以回去的機會。","他们若想念所离开的家乡，还有可以回去的机会。","And truly, if they had been mindful of that [country] from whence they came out, they might have had opportunity to have returned."],"57.11.16":["他們卻羨慕一個更美的家鄉，就是在天上的。所以神被稱為他們的神，並不以為恥，因為他已經給他們預備了一座城。","他们却羡慕一个更美的家乡，就是在天上的。所以神被称为他们的神，并不以为耻，因为他已经给他们预备了一座城。","But now they desire a better [country], that is, an heavenly: wherefore God is not ashamed to be called their God: for he hath prepared for them a city."],"57.11.17":["亞伯拉罕因著信，被試驗的時候，就把以撒獻上；這便是那歡喜領受應許的，將自己獨生的兒子獻上。","亚伯拉罕因着信，被试验的时候，就把以撒献上；这便是那欢喜领受应许的，将自己独生的儿子献上。","By faith Abraham, when he was tried, offered up Isaac: and he that had received the promises offered up his only begotten [son],"],"57.11.18":["論到這兒子，曾有話說：從以撒生的才要稱為你的後裔。","论到这儿子，曾有话说：从以撒生的才要称为你的后裔。","Of whom it was said, That in Isaac shall thy seed be called:"],"57.11.19":["他以為神還能叫人從死裡復活；他也彷彿從死中得回他的兒子來。","他以为神还能叫人从死里复活；他也仿佛从死中得回他的儿子来。","Accounting that God [was] able to raise [him] up, even from the dead; from whence also he received him in a figure."],"57.11.20":["以撒因著信，就指著將來的事給雅各、以掃祝福。","以撒因着信，就指着将来的事给雅各、以扫祝福。","By faith Isaac blessed Jacob and Esau concerning things to come."],"57.11.21":["雅各因著信，臨死的時候，給約瑟的兩個兒子各自祝福，扶著杖頭敬拜神。","雅各因着信，临死的时候，给约瑟的两个儿子各自祝福，扶着杖头敬拜神。","By faith Jacob, when he was a dying, blessed both the sons of Joseph; and worshipped, [leaning] upon the top of his staff."],"57.11.22":["約瑟因著信，臨終的時候，提到以色列族將來要出埃及，並為自己的骸骨留下遺命。","约瑟因着信，临终的时候，提到以色列族将来要出埃及，并为自己的骸骨留下遗命。","By faith Joseph, when he died, made mention of the departing of the children of Israel; and gave commandment concerning his bones."],"57.11.23":["摩西生下來，他的父母見他是個俊美的孩子，就因著信，把他藏了三個月，並不怕王命。","摩西生下来，他的父母见他是个俊美的孩子，就因着信，把他藏了三个月，并不怕王命。","By faith Moses, when he was born, was hid three months of his parents, because they saw [he was] a proper child; and they were not afraid of the king's commandment."],"57.11.24":["摩西因著信，長大了就不肯稱為法老女兒之子。","摩西因着信，长大了就不肯称为法老女儿之子。","By faith Moses, when he was come to years, refused to be called the son of Pharaoh's daughter;"],"57.11.25":["他寧可和神的百姓同受苦害，也不願暫時享受罪中之樂。","他宁可和神的百姓同受苦害，也不愿暂时享受罪中之乐。","Choosing rather to suffer affliction with the people of God, than to enjoy the pleasures of sin for a season;"],"57.11.26":["他看為基督受的凌辱比埃及的財物更寶貴，因他想望所要得的賞賜。","他看为基督受的凌辱比埃及的财物更宝贵，因他想望所要得的赏赐。","Esteeming the reproach of Christ greater riches than the treasures in Egypt: for he had respect unto the recompence of the reward."],"57.11.27":["他因著信，就離開埃及，不怕王怒；因為他恆心忍耐，如同看見那不能看見的主。","他因着信，就离开埃及，不怕王怒；因为他恒心忍耐，如同看见那不能看见的主。","By faith he forsook Egypt, not fearing the wrath of the king: for he endured, as seeing him who is invisible."],"57.11.28":["他因著信，就守（或作：立）逾越節，行灑血的禮，免得那滅長子的臨近以色列人。","他因着信，就守（或作：立）逾越节，行洒血的礼，免得那灭长子的临近以色列人。","Through faith he kept the passover, and the sprinkling of blood, lest he that destroyed the firstborn should touch them."],"57.11.29":["他們因著信，過紅海如行乾地；埃及人試著要過去，就被吞滅了。","他们因着信，过红海如行干地；埃及人试着要过去，就被吞灭了。","By faith they passed through the Red sea as by dry [land]: which the Egyptians assaying to do were drowned."],"57.11.30":["以色列人因著信，圍繞耶利哥城七日，城牆就倒塌了。","以色列人因着信，围绕耶利哥城七日，城墙就倒塌了。","By faith the walls of Jericho fell down, after they were compassed about seven days."],"57.11.31":["妓女喇合因著信，曾和和平平的接待探子，就不與那些不順從的人一同滅亡。","妓女喇合因着信，曾和和平平的接待探子，就不与那些不顺从的人一同灭亡。","By faith the harlot Rahab perished not with them that believed not, when she had received the spies with peace."],"57.11.32":["我又何必再說呢？若要一一細說，基甸、巴拉、參孫、耶弗他、大衛、撒母耳，和眾先知的事，時候就不夠了。","我又何必再说呢？若要一一细说，基甸、巴拉、参孙、耶弗他、大卫、撒母耳，和众先知的事，时候就不够了。","And what shall I more say? for the time would fail me to tell of Gedeon, and [of] Barak, and [of] Samson, and [of] Jephthae; [of] David also, and Samuel, and [of] the prophets:"],"57.11.33":["他們因著信，制伏了敵國，行了公義，得了應許，堵了獅子的口，","他们因着信，制伏了敌国，行了公义，得了应许，堵了狮子的口，","Who through faith subdued kingdoms, wrought righteousness, obtained promises, stopped the mouths of lions,"],"57.11.34":["滅了烈火的猛勢，脫了刀劍的鋒刃；軟弱變為剛強，爭戰顯出勇敢，打退外邦的全軍。","灭了烈火的猛势，脱了刀剑的锋刃；软弱变为刚强，争战显出勇敢，打退外邦的全军。","Quenched the violence of fire, escaped the edge of the sword, out of weakness were made strong, waxed valiant in fight, turned to flight the armies of the aliens."],"57.11.35":["有婦人得自己的死人復活。又有人忍受嚴刑，不肯苟且得釋放（原文是贖），為要得著更美的復活。","有妇人得自己的死人复活。又有人忍受严刑，不肯苟且得释放（原文是赎），为要得着更美的复活。","Women received their dead raised to life again: and others were tortured, not accepting deliverance; that they might obtain a better resurrection:"],"57.11.36":["又有人忍受戲弄、鞭打、捆鎖、監禁、各等的磨煉，","又有人忍受戏弄、鞭打、捆锁、监禁、各等的磨炼，","And others had trial of [cruel] mockings and scourgings, yea, moreover of bonds and imprisonment:"],"57.11.37":["被石頭打死，被鋸鋸死，受試探，被刀殺，披著綿羊山羊的皮各處奔跑，受窮乏、患難、苦害，","被石头打死，被锯锯死，受试探，被刀杀，披着绵羊山羊的皮各处奔跑，受穷乏、患难、苦害，","They were stoned, they were sawn asunder, were tempted, were slain with the sword: they wandered about in sheepskins and goatskins; being destitute, afflicted, tormented;"],"57.11.38":["在曠野、山嶺、山洞、地穴，飄流無定，本是世界不配有的人。","在旷野、山岭、山洞、地穴，飘流无定，本是世界不配有的人。","(Of whom the world was not worthy:) they wandered in deserts, and [in] mountains, and [in] dens and caves of the earth."],"57.11.39":["這些人都是因信得了美好的證據，卻仍未得著所應許的；","这些人都是因信得了美好的证据，却仍未得着所应许的；","And these all, having obtained a good report through faith, received not the promise:"],"57.11.40":["因為神給我們預備了更美的事，叫他們若不與我們同得，就不能完全。","因为神给我们预备了更美的事，叫他们若不与我们同得，就不能完全。","God having provided some better thing for us, that they without us should not be made perfect."],"2.27.30":["地上所有的，無論是地上的種子是樹上的果子，十分之一是耶和華的，是歸給耶和華為聖的。","地上所有的，无论是地上的种子是树上的果子，十分之一是耶和华的，是归给耶和华为圣的。","And all the tithe of the land, [whether] of the seed of the land, [or] of the fruit of the tree, [is] the LORD'S: [it is] holy unto the LORD."],"2.27.31":["人若要贖這十分之一的什麼物，就要加上五分之一。","人若要赎这十分之一的什么物，就要加上五分之一。","And if a man will at all redeem [ought] of his tithes, he shall add thereto the fifth [part] thereof."],"2.27.32":["凡牛群羊群中，一切從杖下經過的，每第十隻要歸給耶和華為聖。","凡牛群羊群中，一切从杖下经过的，每第十只要归给耶和华为圣。","And concerning the tithe of the herd, or of the flock, [even] of whatsoever passeth under the rod, the tenth shall be holy unto the LORD."],"38.3.8":["人豈可奪取神之物呢？你們竟奪取我的供物。你們卻說：我們在何事上奪取你的供物呢？就是你們在當納的十分之一和當獻的供物上。","人岂可夺取神之物呢？你们竟夺取我的供物。你们却说：我们在何事上夺取你的供物呢？就是你们在当纳的十分之一和当献的供物上。","Will a man rob God? Yet ye have robbed me. But ye say, Wherein have we robbed thee? In tithes and offerings."],"38.3.9":["因你們通國的人都奪取我的供物，咒詛就臨到你們身上。","因你们通国的人都夺取我的供物，咒诅就临到你们身上。","Ye [are] cursed with a curse: for ye have robbed me, [even] this whole nation."],"38.3.10":["萬軍之耶和華說：你們要將當納的十分之一全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。","万军之耶和华说：你们要将当纳的十分之一全然送入仓库，使我家有粮，以此试试我，是否为你们敞开天上的窗户，倾福与你们，甚至无处可容。","Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that [there shall] not [be room] enough [to receive it]."],"0.6.5":["耶和華見人在地上罪惡很大，終日所思想的盡都是惡，","耶和华见人在地上罪恶很大，终日所思想的尽都是恶，","And GOD saw that the wickedness of man [was] great in the earth, and [that] every imagination of the thoughts of his heart [was] only evil continually."],"0.6.6":["耶和華就後悔造人在地上，心中憂傷。","耶和华就后悔造人在地上，心中忧伤。","And it repented the LORD that he had made man on the earth, and it grieved him at his heart."],"0.6.7":["耶和華說：我要將所造的人和走獸，並昆蟲，以及空中的飛鳥，都從地上除滅，因為我造他們後悔了。","耶和华说：我要将所造的人和走兽，并昆虫，以及空中的飞鸟，都从地上除灭，因为我造他们后悔了。","And the LORD said, I will destroy man whom I have created from the face of the earth; both man, and beast, and the creeping thing, and the fowls of the air; for it repenteth me that I have made them."],"0.6.8":["惟有挪亞在耶和華眼前蒙恩。","惟有挪亚在耶和华眼前蒙恩。","But Noah found grace in the eyes of the LORD."],"0.6.9":["挪亞的後代記在下面。挪亞是個義人，在當時的世代是個完全人。挪亞與神同行。","挪亚的后代记在下面。挪亚是个义人，在当时的世代是个完全人。挪亚与神同行。","These [are] the generations of Noah: Noah was a just man [and] perfect in his generations, [and] Noah walked with God."],"0.6.10":["挪亞生了三個兒子，就是閃、含、雅弗。","挪亚生了三个儿子，就是闪、含、雅弗。","And Noah begat three sons, Shem, Ham, and Japheth."],"0.6.11":["世界在神面前敗壞，地上滿了強暴。","世界在神面前败坏，地上满了强暴。","The earth also was corrupt before God, and the earth was filled with violence."],"0.6.12":["神觀看世界，見是敗壞了；凡有血氣的人在地上都敗壞了行為。","神观看世界，见是败坏了；凡有血气的人在地上都败坏了行为。","And God looked upon the earth, and, behold, it was corrupt; for all flesh had corrupted his way upon the earth."],"0.6.13":["神就對挪亞說：凡有血氣的人，他的盡頭已經來到我面前；因為地上滿了他們的強暴，我要把他們和地一併毀滅。","神就对挪亚说：凡有血气的人，他的尽头已经来到我面前；因为地上满了他们的强暴，我要把他们和地一并毁灭。","And God said unto Noah, The end of all flesh is come before me; for the earth is filled with violence through them; and, behold, I will destroy them with the earth."],"0.6.14":["你要用歌斐木造一隻方舟，分一間一間地造，裡外抹上松香。","你要用歌斐木造一只方舟，分一间一间地造，里外抹上松香。","Make thee an ark of gopher wood; rooms shalt thou make in the ark, and shalt pitch it within and without with pitch."],"39.7.12":["所以，無論何事，你們願意人怎樣待你們，你們也要怎樣待人，因為這就是律法和先知的道理。","所以，无论何事，你们愿意人怎样待你们，你们也要怎样待人，因为这就是律法和先知的道理。","Therefore all things whatsoever ye would that men should do to you, do ye even so to them: for this is the law and the prophets."],"39.28.19":["所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗（或作：給他們施洗，歸於父、子、聖靈的名）。","所以，你们要去，使万民作我的门徒，奉父、子、圣灵的名给他们施洗（或作：给他们施洗，归于父、子、圣灵的名）。","Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost:"],"39.28.20":["凡我所吩咐你們的，都教訓他們遵守，我就常與你們同在，直到世界的末了。","凡我所吩咐你们的，都教训他们遵守，我就常与你们同在，直到世界的末了。","Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you alway, [even] unto the end of the world. Amen."],"39.4.4":["耶穌卻回答說：經上記著說：人活著，不是單靠食物，乃是靠神口裡所出的一切話。","耶稣却回答说：经上记着说：人活着，不是单靠食物，乃是靠神口里所出的一切话。","But he answered and said, It is written, Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God."],"39.18.1":["當時，門徒進前來，問耶穌說：天國裡誰是最大的？","当时，门徒进前来，问耶稣说：天国里谁是最大的？","At the same time came the disciples unto Jesus, saying, Who is the greatest in the kingdom of heaven?"],"39.18.2":["耶穌便叫一個小孩子來，使他站在他們當中，","耶稣便叫一个小孩子来，使他站在他们当中，","And Jesus called a little child unto him, and set him in the midst of them,"],"39.18.3":["說：我實在告訴你們，你們若不回轉，變成小孩子的樣式，斷不得進天國。","说：我实在告诉你们，你们若不回转，变成小孩子的样式，断不得进天国。","And said, Verily I say unto you, Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven."],"39.18.4":["所以，凡自己謙卑像這小孩子的，他在天國裡就是最大的。","所以，凡自己谦卑像这小孩子的，他在天国里就是最大的。","Whosoever therefore shall humble himself as this little child, the same is greatest in the kingdom of heaven."],"39.18.5":["凡為我的名接待一個像這小孩子的，就是接待我。","凡为我的名接待一个像这小孩子的，就是接待我。","And whoso shall receive one such little child in my name receiveth me."],"39.18.6":["凡使這信我的一個小子跌倒的，倒不如把大磨石拴在這人的頸項上，沉在深海裡。","凡使这信我的一个小子跌倒的，倒不如把大磨石拴在这人的颈项上，沉在深海里。","But whoso shall offend one of these little ones which believe in me, it were better for him that a millstone were hanged about his neck, and [that] he were drowned in the depth of the sea."],"39.19.14":["耶穌說：讓小孩子到我這裡來，不要禁止他們；因為在天國的，正是這樣的人。","耶稣说：让小孩子到我这里来，不要禁止他们；因为在天国的，正是这样的人。","But Jesus said, Suffer little children, and forbid them not, to come unto me: for of such is the kingdom of heaven."],"39.13.10":["門徒進前來，問耶穌說：對眾人講話，為什麼用比喻呢？","门徒进前来，问耶稣说：对众人讲话，为什么用比喻呢？","And the disciples came, and said unto him, Why speakest thou unto them in parables?"],"39.13.11":["耶穌回答說：因為天國的奧祕只叫你們知道，不叫他們知道。","耶稣回答说：因为天国的奥秘只叫你们知道，不叫他们知道。","He answered and said unto them, Because it is given unto you to know the mysteries of the kingdom of heaven, but to them it is not given."],"39.13.12":["凡有的，還要加給他，叫他有餘；凡沒有的，連他所有的，也要奪去。","凡有的，还要加给他，叫他有余；凡没有的，连他所有的，也要夺去。","For whosoever hath, to him shall be given, and he shall have more abundance: but whosoever hath not, from him shall be taken away even that he hath."],"39.13.13":["所以我用比喻對他們講，是因他們看也看不見，聽也聽不見，也不明白。","所以我用比喻对他们讲，是因他们看也看不见，听也听不见，也不明白。","Therefore speak I to them in parables: because they seeing see not; and hearing they hear not, neither do they understand."],"39.13.14":["在他們身上，正應了以賽亞的預言，說：你們聽是要聽見，卻不明白；看是要看見，卻不曉得；","在他们身上，正应了以赛亚的预言，说：你们听是要听见，却不明白；看是要看见，却不晓得；","And in them is fulfilled the prophecy of Esaias, which saith, By hearing ye shall hear, and shall not understand; and seeing ye shall see, and shall not perceive:"],"39.13.15":["因為這百姓油蒙了心，耳朵發沉，眼睛閉著，恐怕眼睛看見，耳朵聽見，心裡明白，回轉過來，我就醫治他們。","因为这百姓油蒙了心，耳朵发沉，眼睛闭着，恐怕眼睛看见，耳朵听见，心里明白，回转过来，我就医治他们。","For this people's heart is waxed gross, and [their] ears are dull of hearing, and their eyes they have closed; lest at any time they should see with [their] eyes, and hear with [their] ears, and should understand with [their] heart, and should be converted, and I should heal them."],"39.13.16":["但你們的眼睛是有福的，因為看見了；你們的耳朵也是有福的，因為聽見了。","但你们的眼睛是有福的，因为看见了；你们的耳朵也是有福的，因为听见了。","But blessed [are] your eyes, for they see: and your ears, for they hear."],"39.13.17":["我實在告訴你們，從前有許多先知和義人要看你們所看的，卻沒有看見，要聽你們所聽的，卻沒有聽見。","我实在告诉你们，从前有许多先知和义人要看你们所看的，却没有看见，要听你们所听的，却没有听见。","For verily I say unto you, That many prophets and righteous [men] have desired to see [those things] which ye see, and have not seen [them]; and to hear [those things] which ye hear, and have not heard [them]."],"18.119.1":["行為完全、遵行耶和華律法的，這人便為有福！","行为完全、遵行耶和华律法的，这人便为有福！","ALEPH. Blessed [are] the undefiled in the way, who walk in the law of the LORD."],"18.119.2":["遵守他的法度、一心尋求他的，這人便為有福！","遵守他的法度、一心寻求他的，这人便为有福！","Blessed [are] they that keep his testimonies, [and that] seek him with the whole heart."],"18.119.3":["這人不做非義的事，但遵行他的道。","这人不做非义的事，但遵行他的道。","They also do no iniquity: they walk in his ways."],"18.119.4":["耶和華啊，你曾將你的訓詞吩咐我們，為要我們殷勤遵守。","耶和华啊，你曾将你的训词吩咐我们，为要我们殷勤遵守。","Thou hast commanded [us] to keep thy precepts diligently."],"18.119.5":["但願我行事堅定，得以遵守你的律例。","但愿我行事坚定，得以遵守你的律例。","O that my ways were directed to keep thy statutes!"],"18.119.6":["我看重你的一切命令，就不至於羞愧。","我看重你的一切命令，就不至于羞愧。","Then shall I not be ashamed, when I have respect unto all thy commandments."],"18.119.7":["我學了你公義的判語，就要以正直的心稱謝你。","我学了你公义的判语，就要以正直的心称谢你。","I will praise thee with uprightness of heart, when I shall have learned thy righteous judgments."],"18.119.8":["我必守你的律例；求你總不要丟棄我！","我必守你的律例；求你总不要丢弃我！","I will keep thy statutes: O forsake me not utterly."],"18.119.9":["少年人用什麼潔淨他的行為呢？是要遵行你的話！","少年人用什么洁净他的行为呢？是要遵行你的话！","BETH. Wherewithal shall a young man cleanse his way? by taking heed [thereto] according to thy word."],"18.119.10":["我一心尋求了你；求你不要叫我偏離你的命令。","我一心寻求了你；求你不要叫我偏离你的命令。","With my whole heart have I sought thee: O let me not wander from thy commandments."],"39.6.9":["所以，你們禱告要這樣說：我們在天上的父：願人都尊你的名為聖。","所以，你们祷告要这样说：我们在天上的父：愿人都尊你的名为圣。","After this manner therefore pray ye: Our Father which art in heaven, Hallowed be thy name."],"39.6.10":["願你的國降臨；願你的旨意行在地上，如同行在天上。","愿你的国降临；愿你的旨意行在地上，如同行在天上。","Thy kingdom come. Thy will be done in earth, as [it is] in heaven."],"39.6.11":["我們日用的飲食，今日賜給我們。","我们日用的饮食，今日赐给我们。","Give us this day our daily bread."],"39.6.12":["免我們的債，如同我們免了人的債。","免我们的债，如同我们免了人的债。","And forgive us our debts, as we forgive our debtors."],"39.6.13":["不叫我們遇見試探；救我們脫離兇惡（或作：脫離惡者）。因為國度、權柄、榮耀，全是你的，直到永遠。阿們（有古卷沒有因為……阿們等字）！","不叫我们遇见试探；救我们脱离凶恶（或作：脱离恶者）。因为国度、权柄、荣耀，全是你的，直到永远。阿们（有古卷没有因为……阿们等字）！","And lead us not into temptation, but deliver us from evil: For thine is the kingdom, and the power, and the glory, for ever. Amen."],"39.26.26":["他們吃的時候，耶穌拿起餅來，祝福，就擘開，遞給門徒，說：你們拿著吃，這是我的身體；","他们吃的时候，耶稣拿起饼来，祝福，就擘开，递给门徒，说：你们拿着吃，这是我的身体；","And as they were eating, Jesus took bread, and blessed [it], and brake [it], and gave [it] to the disciples, and said, Take, eat; this is my body."],"39.26.27":["又拿起杯來，祝謝了，遞給他們，說：你們都喝這個；","又拿起杯来，祝谢了，递给他们，说：你们都喝这个；","And he took the cup, and gave thanks, and gave [it] to them, saying, Drink ye all of it;"],"39.26.28":["因為這是我立約的血，為多人流出來，使罪得赦。","因为这是我立约的血，为多人流出来，使罪得赦。","For this is my blood of the new testament, which is shed for many for the remission of sins."],"39.26.29":["但我告訴你們，從今以後，我不再喝這葡萄汁，直到我在我父的國裡同你們喝新的那日子。","但我告诉你们，从今以后，我不再喝这葡萄汁，直到我在我父的国里同你们喝新的那日子。","But I say unto you, I will not drink henceforth of this fruit of the vine, until that day when I drink it new with you in my Father's kingdom."],"39.26.30":["他們唱了詩，就出來往橄欖山去。","他们唱了诗，就出来往橄榄山去。","And when they had sung an hymn, they went out into the mount of Olives."],"41.22.13":["他們去了，所遇見的正如耶穌所說的；他們就預備了逾越節的筵席。","他们去了，所遇见的正如耶稣所说的；他们就预备了逾越节的筵席。","And they went, and found as he had said unto them: and they made ready the passover."],"41.22.14":["時候到了，耶穌坐席，使徒也和他同坐。","时候到了，耶稣坐席，使徒也和他同坐。","And when the hour was come, he sat down, and the twelve apostles with him."],"41.22.15":["耶穌對他們說：我很願意在受害以先和你們吃這逾越節的筵席。","耶稣对他们说：我很愿意在受害以先和你们吃这逾越节的筵席。","And he said unto them, With desire I have desired to eat this passover with you before I suffer:"],"41.22.16":["我告訴你們，我不再吃這筵席，直到成就在神的國裡。","我告诉你们，我不再吃这筵席，直到成就在神的国里。","For I say unto you, I will not any more eat thereof, until it be fulfilled in the kingdom of God."],"41.22.17":["耶穌接過杯來，祝謝了，說：你們拿這個，大家分著喝。","耶稣接过杯来，祝谢了，说：你们拿这个，大家分着喝。","And he took the cup, and gave thanks, and said, Take this, and divide [it] among yourselves:"],"41.22.18":["我告訴你們，從今以後，我不再喝這葡萄汁，直等神的國來到。","我告诉你们，从今以后，我不再喝这葡萄汁，直等神的国来到。","For I say unto you, I will not drink of the fruit of the vine, until the kingdom of God shall come."],"41.22.19":["又拿起餅來，祝謝了，就擘開，遞給他們，說：這是我的身體，為你們捨的，你們也應當如此行，為的是記念我。","又拿起饼来，祝谢了，就擘开，递给他们，说：这是我的身体，为你们舍的，你们也应当如此行，为的是记念我。","And he took bread, and gave thanks, and brake [it], and gave unto them, saying, This is my body which is given for you: this do in remembrance of me."],"41.22.20":["飯後也照樣拿起杯來，說：這杯是用我血所立的新約，是為你們流出來的。","饭后也照样拿起杯来，说：这杯是用我血所立的新约，是为你们流出来的。","Likewise also the cup after supper, saying, This cup [is] the new testament in my blood, which is shed for you."],"42.20.19":["那日（就是七日的第一日）晚上，門徒所在的地方，因怕猶太人，門都關了。耶穌來，站在當中，對他們說：願你們平安！","那日（就是七日的第一日）晚上，门徒所在的地方，因怕犹太人，门都关了。耶稣来，站在当中，对他们说：愿你们平安！","Then the same day at evening, being the first [day] of the week, when the doors were shut where the disciples were assembled for fear of the Jews, came Jesus and stood in the midst, and saith unto them, Peace [be] unto you."],"42.20.20":["說了這話，就把手和肋旁指給他們看。門徒看見主，就喜樂了。","说了这话，就把手和肋旁指给他们看。门徒看见主，就喜乐了。","And when he had so said, he shewed unto them [his] hands and his side. Then were the disciples glad, when they saw the Lord."],"42.20.21":["耶穌又對他們說：願你們平安！父怎樣差遣了我，我也照樣差遣你們。","耶稣又对他们说：愿你们平安！父怎样差遣了我，我也照样差遣你们。","Then said Jesus to them again, Peace [be] unto you: as [my] Father hath sent me, even so send I you."],"42.20.22":["說了這話，就向他們吹一口氣，說：你們受聖靈！","说了这话，就向他们吹一口气，说：你们受圣灵！","And when he had said this, he breathed on [them], and saith unto them, Receive ye the Holy Ghost:"],"42.20.23":["你們赦免誰的罪，誰的罪就赦免了；你們留下誰的罪，誰的罪就留下了。","你们赦免谁的罪，谁的罪就赦免了；你们留下谁的罪，谁的罪就留下了。","Whose soever sins ye remit, they are remitted unto them; [and] whose soever [sins] ye retain, they are retained."],"42.20.24":["那十二個門徒中，有稱為低土馬的多馬；耶穌來的時候，他沒有和他們同在。","那十二个门徒中，有称为低土马的多马；耶稣来的时候，他没有和他们同在。","But Thomas, one of the twelve, called Didymus, was not with them when Jesus came."],"42.20.25":["那些門徒就對他說：我們已經看見主了。多馬卻說：我非看見他手上的釘痕，用指頭探入那釘痕，又用手探入他的肋旁，我總不信。","那些门徒就对他说：我们已经看见主了。多马却说：我非看见他手上的钉痕，用指头探入那钉痕，又用手探入他的肋旁，我总不信。","The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe."],"42.20.26":["過了八日，門徒又在屋裡，多馬也和他們同在，門都關了。耶穌來，站在當中說：願你們平安！","过了八日，门徒又在屋里，多马也和他们同在，门都关了。耶稣来，站在当中说：愿你们平安！","And after eight days again his disciples were within, and Thomas with them: [then] came Jesus, the doors being shut, and stood in the midst, and said, Peace [be] unto you."],"42.20.27":["就對多馬說：伸過你的指頭來，摸（原文是看）我的手；伸出你的手來，探入我的肋旁。不要疑惑，總要信。","就对多马说：伸过你的指头来，摸（原文是看）我的手；伸出你的手来，探入我的肋旁。不要疑惑，总要信。","Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust [it] into my side: and be not faithless, but believing."],"42.20.28":["多馬說：我的主！我的神！","多马说：我的主！我的神！","And Thomas answered and said unto him, My Lord and my God."],"41.24.36":["正說這話的時候，耶穌親自站在他們當中，說：願你們平安！","正说这话的时候，耶稣亲自站在他们当中，说：愿你们平安！","And as they thus spake, Jesus himself stood in the midst of them, and saith unto them, Peace [be] unto you."],"41.24.37":["他們卻驚慌害怕，以為所看見的是魂。","他们却惊慌害怕，以为所看见的是魂。","But they were terrified and affrighted, and supposed that they had seen a spirit."],"41.24.38":["耶穌說：你們為什麼愁煩？為什麼心裡起疑念呢？","耶稣说：你们为什么愁烦？为什么心里起疑念呢？","And he said unto them, Why are ye troubled? and why do thoughts arise in your hearts?"],"41.24.39":["你們看我的手，我的腳，就知道實在是我了。摸我看看！魂無骨無肉，你們看，我是有的。","你们看我的手，我的脚，就知道实在是我了。摸我看看！魂无骨无肉，你们看，我是有的。","Behold my hands and my feet, that it is I myself: handle me, and see; for a spirit hath not flesh and bones, as ye see me have."],"41.24.40":["說了這話，就把手和腳給他們看。","说了这话，就把手和脚给他们看。","And when he had thus spoken, he shewed them [his] hands and [his] feet."],"39.10.1":["耶穌叫了十二個門徒來，給他們權柄，能趕逐污鬼，並醫治各樣的病症。","耶稣叫了十二个门徒来，给他们权柄，能赶逐污鬼，并医治各样的病症。","And when he had called unto [him] his twelve disciples, he gave them power [against] unclean spirits, to cast them out, and to heal all manner of sickness and all manner of disease."],"39.10.2":["這十二使徒的名：頭一個叫西門、又稱彼得，還有他兄弟安得烈，西庇太的兒子雅各和雅各的兄弟約翰，","这十二使徒的名：头一个叫西门、又称彼得，还有他兄弟安得烈，西庇太的儿子雅各和雅各的兄弟约翰，","Now the names of the twelve apostles are these; The first, Simon, who is called Peter, and Andrew his brother; James [the son] of Zebedee, and John his brother;"],"39.10.3":["腓力和巴多羅買，多馬和稅吏馬太，亞勒腓的兒子雅各，和達太，","腓力和巴多罗买，多马和税吏马太，亚勒腓的儿子雅各，和达太，","Philip, and Bartholomew; Thomas, and Matthew the publican; James [the son] of Alphaeus, and Lebbaeus, whose surname was Thaddaeus;"],"39.10.4":["奮銳黨的西門，還有賣耶穌的加略人猶大。","奋锐党的西门，还有卖耶稣的加略人犹大。","Simon the Canaanite, and Judas Iscariot, who also betrayed him."],"26.2.31":["王啊，你夢見一個大像，這像甚高，極其光耀，站在你面前，形狀甚是可怕。","王啊，你梦见一个大像，这像甚高，极其光耀，站在你面前，形状甚是可怕。","Thou, O king, sawest, and behold a great image. This great image, whose brightness [was] excellent, stood before thee; and the form thereof [was] terrible."],"26.2.32":["這像的頭是精金的，胸膛和膀臂是銀的，肚腹和腰是銅的，","这像的头是精金的，胸膛和膀臂是银的，肚腹和腰是铜的，","This image's head [was] of fine gold, his breast and his arms of silver, his belly and his thighs of brass,"],"26.2.33":["腿是鐵的，腳是半鐵半泥的。","腿是铁的，脚是半铁半泥的。","His legs of iron, his feet part of iron and part of clay."],"26.2.34":["你觀看，見有一塊非人手鑿出來的石頭打在這像半鐵半泥的腳上，把腳砸碎；","你观看，见有一块非人手凿出来的石头打在这像半铁半泥的脚上，把脚砸碎；","Thou sawest till that a stone was cut out without hands, which smote the image upon his feet [that were] of iron and clay, and brake them to pieces."],"26.2.35":["於是金、銀、銅、鐵、泥都一同砸得粉碎，成如夏天禾場上的糠粃，被風吹散，無處可尋。打碎這像的石頭變成一座大山，充滿天下。","于是金、银、铜、铁、泥都一同砸得粉碎，成如夏天禾场上的糠粃，被风吹散，无处可寻。打碎这像的石头变成一座大山，充满天下。","Then was the iron, the clay, the brass, the silver, and the gold, broken to pieces together, and became like the chaff of the summer threshingfloors; and the wind carried them away, that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth."],"26.2.36":["這就是那夢。我們在王面前要講解那夢。","这就是那梦。我们在王面前要讲解那梦。","This [is] the dream; and we will tell the interpretation thereof before the king."],"26.2.37":["王啊，你是諸王之王。天上的神已將國度、權柄、能力、尊榮都賜給你。","王啊，你是诸王之王。天上的神已将国度、权柄、能力、尊荣都赐给你。","Thou, O king, [art] a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory."],"26.2.38":["凡世人所住之地的走獸，並天空的飛鳥，他都交付你手，使你掌管這一切。你就是那金頭。","凡世人所住之地的走兽，并天空的飞鸟，他都交付你手，使你掌管这一切。你就是那金头。","And wheresoever the children of men dwell, the beasts of the field and the fowls of the heaven hath he given into thine hand, and hath made thee ruler over them all. Thou [art] this head of gold."],"26.2.39":["在你以後必另興一國，不及於你；又有第三國，就是銅的，必掌管天下。","在你以后必另兴一国，不及于你；又有第三国，就是铜的，必掌管天下。","And after thee shall arise another kingdom inferior to thee, and another third kingdom of brass, which shall bear rule over all the earth."],"26.2.40":["第四國，必堅壯如鐵，鐵能打碎剋制百物，又能壓碎一切，那國也必打碎壓制列國。","第四国，必坚壮如铁，铁能打碎克制百物，又能压碎一切，那国也必打碎压制列国。","And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth all [things]: and as iron that breaketh all these, shall it break in pieces and bruise."],"26.2.41":["你既見像的腳和腳指頭，一半是窰匠的泥，一半是鐵，那國將來也必分開。你既見鐵與泥攙雜，那國也必有鐵的力量。","你既见像的脚和脚指头，一半是窰匠的泥，一半是铁，那国将来也必分开。你既见铁与泥搀杂，那国也必有铁的力量。","And whereas thou sawest the feet and toes, part of potters' clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay."],"26.2.42":["那腳指頭，既是半鐵半泥，那國也必半強半弱。","那脚指头，既是半铁半泥，那国也必半强半弱。","And [as] the toes of the feet [were] part of iron, and part of clay, [so] the kingdom shall be partly strong, and partly broken."],"26.2.43":["你既見鐵與泥攙雜，那國民也必與各種人攙雜，卻不能彼此相合，正如鐵與泥不能相合一樣。","你既见铁与泥搀杂，那国民也必与各种人搀杂，却不能彼此相合，正如铁与泥不能相合一样。","And whereas thou sawest iron mixed with miry clay, they shall mingle themselves with the seed of men: but they shall not cleave one to another, even as iron is not mixed with clay."],"26.2.44":["當那列王在位的時候，天上的神必另立一國，永不敗壞，也不歸別國的人，卻要打碎滅絕那一切國，這國必存到永遠。","当那列王在位的时候，天上的神必另立一国，永不败坏，也不归别国的人，却要打碎灭绝那一切国，这国必存到永远。","And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, [but] it shall break in pieces and consume all these kingdoms, and it shall stand for ever."],"26.2.45":["你既看見非人手鑿出來的一塊石頭從山而出，打碎金、銀、銅、鐵、泥，那就是至大的神把後來必有的事給王指明。這夢準是這樣，這講解也是確實的。","你既看见非人手凿出来的一块石头从山而出，打碎金、银、铜、铁、泥，那就是至大的神把后来必有的事给王指明。这梦准是这样，这讲解也是确实的。","Forasmuch as thou sawest that the stone was cut out of the mountain without hands, and that it brake in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream [is] certain, and the interpretation thereof sure."],"26.2.46":["當時，尼布甲尼撒王俯伏在地，向但以理下拜，並且吩咐人給他奉上供物和香品。","当时，尼布甲尼撒王俯伏在地，向但以理下拜，并且吩咐人给他奉上供物和香品。","Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an oblation and sweet odours unto him."],"26.2.47":["王對但以理說：你既能顯明這奧祕的事，你們的神誠然是萬神之神、萬王之主，又是顯明奧祕事的。","王对但以理说：你既能显明这奥秘的事，你们的神诚然是万神之神、万王之主，又是显明奥秘事的。","The king answered unto Daniel, and said, Of a truth [it is], that your God [is] a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldest reveal this secret."],"42.10.16":["我另外有羊，不是這圈裡的；我必須領他們來，他們也要聽我的聲音，並且要合成一群，歸一個牧人了。","我另外有羊，不是这圈里的；我必须领他们来，他们也要听我的声音，并且要合成一群，归一个牧人了。","And other sheep I have, which are not of this fold: them also I must bring, and they shall hear my voice; and there shall be one fold, [and] one shepherd."],"58.2.8":["經上記著說：要愛人如己。你們若全守這至尊的律法，才是好的。","经上记着说：要爱人如己。你们若全守这至尊的律法，才是好的。","If ye fulfil the royal law according to the scripture, Thou shalt love thy neighbour as thyself, ye do well:"],"58.2.9":["但你們若按外貌待人，便是犯罪，被律法定為犯法的。","但你们若按外貌待人，便是犯罪，被律法定为犯法的。","But if ye have respect to persons, ye commit sin, and are convinced of the law as transgressors."],"58.2.10":["因為凡遵守全律法的，只在一條上跌倒，他就是犯了眾條。","因为凡遵守全律法的，只在一条上跌倒，他就是犯了众条。","For whosoever shall keep the whole law, and yet offend in one [point], he is guilty of all."],"58.2.11":["原來那說不可姦淫的，也說不可殺人；你就是不姦淫，卻殺人，仍是成了犯律法的。","原来那说不可奸淫的，也说不可杀人；你就是不奸淫，却杀人，仍是成了犯律法的。","For he that said, Do not commit adultery, said also, Do not kill. Now if thou commit no adultery, yet if thou kill, thou art become a transgressor of the law."],"58.2.12":["你們既然要按使人自由的律法受審判，就該照這律法說話行事。","你们既然要按使人自由的律法受审判，就该照这律法说话行事。","So speak ye, and so do, as they that shall be judged by the law of liberty."],"57.10.1":["律法既是將來美事的影兒，不是本物的真像，總不能藉著每年常獻一樣的祭物叫那近前來的人得以完全。","律法既是将来美事的影儿，不是本物的真像，总不能借着每年常献一样的祭物叫那近前来的人得以完全。","For the law having a shadow of good things to come, [and] not the very image of the things, can never with those sacrifices which they offered year by year continually make the comers thereunto perfect."],"57.10.2":["若不然，獻祭的事豈不早已止住了嗎？因為禮拜的人，良心既被潔淨，就不再覺得有罪了。","若不然，献祭的事岂不早已止住了吗？因为礼拜的人，良心既被洁净，就不再觉得有罪了。","For then would they not have ceased to be offered? because that the worshippers once purged should have had no more conscience of sins."],"57.10.3":["但這些祭物是叫人每年想起罪來；","但这些祭物是叫人每年想起罪来；","But in those [sacrifices there is] a remembrance again [made] of sins every year."],"57.10.4":["因為公牛和山羊的血，斷不能除罪。","因为公牛和山羊的血，断不能除罪。","For [it is] not possible that the blood of bulls and of goats should take away sins."],"57.10.5":["所以基督到世上來的時候，就說：神啊，祭物和禮物是你不願意的；你曾給我預備了身體。","所以基督到世上来的时候，就说：神啊，祭物和礼物是你不愿意的；你曾给我预备了身体。","Wherefore when he cometh into the world, he saith, Sacrifice and offering thou wouldest not, but a body hast thou prepared me:"],"57.10.6":["燔祭和贖罪祭是你不喜歡的。","燔祭和赎罪祭是你不喜欢的。","In burnt offerings and [sacrifices] for sin thou hast had no pleasure."],"57.10.7":["那時我說：神啊，我來了，為要照你的旨意行；我的事在經卷上已經記載了。","那时我说：神啊，我来了，为要照你的旨意行；我的事在经卷上已经记载了。","Then said I, Lo, I come (in the volume of the book it is written of me,) to do thy will, O God."],"57.10.8":["以上說：祭物和禮物，燔祭和贖罪祭，是你不願意的，也是你不喜歡的（這都是按著律法獻的）；","以上说：祭物和礼物，燔祭和赎罪祭，是你不愿意的，也是你不喜欢的（这都是按着律法献的）；","Above when he said, Sacrifice and offering and burnt offerings and [offering] for sin thou wouldest not, neither hadst pleasure [therein]; which are offered by the law;"],"57.10.9":["後又說：我來了為要照你的旨意行；可見他是除去在先的，為要立定在後的。","后又说：我来了为要照你的旨意行；可见他是除去在先的，为要立定在后的。","Then said he, Lo, I come to do thy will, O God. He taketh away the first, that he may establish the second."],"57.10.10":["我們憑這旨意，靠耶穌基督，只一次獻上他的身體，就得以成聖。","我们凭这旨意，靠耶稣基督，只一次献上他的身体，就得以成圣。","By the which will we are sanctified through the offering of the body of Jesus Christ once [for all]."],"57.10.11":["凡祭司天天站著事奉神，屢次獻上一樣的祭物，這祭物永不能除罪。","凡祭司天天站着事奉神，屡次献上一样的祭物，这祭物永不能除罪。","And every priest standeth daily ministering and offering oftentimes the same sacrifices, which can never take away sins:"],"57.10.12":["但基督獻了一次永遠的贖罪祭，就在神的右邊坐下了。","但基督献了一次永远的赎罪祭，就在神的右边坐下了。","But this man, after he had offered one sacrifice for sins for ever, sat down on the right hand of God;"],"57.10.13":["從此，等候他仇敵成了他的腳凳。","从此，等候他仇敌成了他的脚凳。","From henceforth expecting till his enemies be made his footstool."],"57.10.14":["因為他一次獻祭，便叫那得以成聖的人永遠完全。","因为他一次献祭，便叫那得以成圣的人永远完全。","For by one offering he hath perfected for ever them that are sanctified."],"57.10.15":["聖靈也對我們作見證；因為他既已說過：","圣灵也对我们作见证；因为他既已说过：","[Whereof] the Holy Ghost also is a witness to us: for after that he had said before,"],"57.10.16":["主說：那些日子以後，我與他們所立的約乃是這樣：我要將我的律法寫在他們心上，又要放在他們的裡面。","主说：那些日子以后，我与他们所立的约乃是这样：我要将我的律法写在他们心上，又要放在他们的里面。","This [is] the covenant that I will make with them after those days, saith the Lord, I will put my laws into their hearts, and in their minds will I write them;"],"57.10.17":["以後就說：我不再記念他們的罪愆和他們的過犯。","以后就说：我不再记念他们的罪愆和他们的过犯。","And their sins and iniquities will I remember no more."],"57.10.18":["這些罪過既已赦免，就不用再為罪獻祭了。","这些罪过既已赦免，就不用再为罪献祭了。","Now where remission of these [is, there is] no more offering for sin."],"39.5.1":["耶穌看見這許多的人，就上了山，既已坐下，門徒到他跟前來，","耶稣看见这许多的人，就上了山，既已坐下，门徒到他跟前来，","And seeing the multitudes, he went up into a mountain: and when he was set, his disciples came unto him:"],"39.5.2":["他就開口教訓他們，說：","他就开口教训他们，说：","And he opened his mouth, and taught them, saying,"],"18.117.1":["萬國啊，你們都當讚美耶和華！萬民哪，你們都當頌讚他！","万国啊，你们都当赞美耶和华！万民哪，你们都当颂赞他！","O praise the LORD, all ye nations: praise him, all ye people."],"18.117.2":["因為他向我們大施慈愛；耶和華的誠實存到永遠。你們要讚美耶和華！","因为他向我们大施慈爱；耶和华的诚实存到永远。你们要赞美耶和华！","For his merciful kindness is great toward us: and the truth of the LORD [endureth] for ever. Praise ye the LORD."],"42.11.35":["耶穌哭了。","耶稣哭了。","Jesus wept."],"54.2.15":["你當竭力在神面前得蒙喜悅，作無愧的工人，按著正意分解真理的道。","你当竭力在神面前得蒙喜悦，作无愧的工人，按着正意分解真理的道。","Study to shew thyself approved unto God, a workman that needeth not to be ashamed, rightly dividing the word of truth."],"1.20.3":["除了我以外，你不可有別的神。","除了我以外，你不可有别的神。","Thou shalt have no other gods before me."],"1.20.4":["不可為自己雕刻偶像，也不可做什麼形像彷彿上天、下地，和地底下、水中的百物。","不可为自己雕刻偶像，也不可做什么形像仿佛上天、下地，和地底下、水中的百物。","Thou shalt not make unto thee any graven image, or any likeness [of any thing] that [is] in heaven above, or that [is] in the earth beneath, or that [is] in the water under the earth:"],"1.20.5":["不可跪拜那些像，也不可事奉他，因為我耶和華─你的神是忌邪的神。恨我的，我必追討他的罪，自父及子，直到三四代；","不可跪拜那些像，也不可事奉他，因为我耶和华─你的神是忌邪的神。恨我的，我必追讨他的罪，自父及子，直到三四代；","Thou shalt not bow down thyself to them, nor serve them: for I the LORD thy God [am] a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth [generation] of them that hate me;"],"1.20.6":["愛我、守我誡命的，我必向他們發慈愛，直到千代。","爱我、守我诫命的，我必向他们发慈爱，直到千代。","And shewing mercy unto thousands of them that love me, and keep my commandments."],"1.20.7":["不可妄稱耶和華─你神的名；因為妄稱耶和華名的，耶和華必不以他為無罪。","不可妄称耶和华─你神的名；因为妄称耶和华名的，耶和华必不以他为无罪。","Thou shalt not take the name of the LORD thy God in vain; for the LORD will not hold him guiltless that taketh his name in vain."],"1.20.8":["當記念安息日，守為聖日。","当记念安息日，守为圣日。","Remember the sabbath day, to keep it holy."],"1.20.9":["六日要勞碌做你一切的工，","六日要劳碌做你一切的工，","Six days shalt thou labour, and do all thy work:"],"1.20.10":["但第七日是向耶和華─你神當守的安息日。這一日你和你的兒女、僕婢、牲畜，並你城裡寄居的客旅，無論何工都不可做；","但第七日是向耶和华─你神当守的安息日。这一日你和你的儿女、仆婢、牲畜，并你城里寄居的客旅，无论何工都不可做；","But the seventh day [is] the sabbath of the LORD thy God: [in it] thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that [is] within thy gates:"],"1.20.11":["因為六日之內，耶和華造天、地、海，和其中的萬物，第七日便安息，所以耶和華賜福與安息日，定為聖日。","因为六日之内，耶和华造天、地、海，和其中的万物，第七日便安息，所以耶和华赐福与安息日，定为圣日。","For [in] six days the LORD made heaven and earth, the sea, and all that in them [is], and rested the seventh day: wherefore the LORD blessed the sabbath day, and hallowed it."],"1.20.12":["當孝敬父母，使你的日子在耶和華─你神所賜你的地上得以長久。","当孝敬父母，使你的日子在耶和华─你神所赐你的地上得以长久。","Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth thee."],"1.20.13":["不可殺人。","不可杀人。","Thou shalt not kill."],"1.20.14":["不可姦淫。","不可奸淫。","Thou shalt not commit adultery."],"1.20.15":["不可偷盜。","不可偷盗。","Thou shalt not steal."],"1.20.16":["不可作假見證陷害人。","不可作假见证陷害人。","Thou shalt not bear false witness against thy neighbour."],"1.20.17":["不可貪戀人的房屋；也不可貪戀人的妻子、僕婢、牛驢，並他一切所有的。","不可贪恋人的房屋；也不可贪恋人的妻子、仆婢、牛驴，并他一切所有的。","Thou shalt not covet thy neighbour's house, thou shalt not covet thy neighbour's wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that [is] thy neighbour's."],"65.14.6":["我又看見另有一位天使飛在空中，有永遠的福音要傳給住在地上的人，就是各國、各族、各方、各民。","我又看见另有一位天使飞在空中，有永远的福音要传给住在地上的人，就是各国、各族、各方、各民。","And I saw another angel fly in the midst of heaven, having the everlasting gospel to preach unto them that dwell on the earth, and to every nation, and kindred, and tongue, and people,"],"65.14.7":["他大聲說：應當敬畏神，將榮耀歸給他！因他施行審判的時候已經到了。應當敬拜那創造天地海和眾水泉源的。","他大声说：应当敬畏神，将荣耀归给他！因他施行审判的时候已经到了。应当敬拜那创造天地海和众水泉源的。","Saying with a loud voice, Fear God, and give glory to him; for the hour of his judgment is come: and worship him that made heaven, and earth, and the sea, and the fountains of waters."],"65.14.8":["又有第二位天使接著說：叫萬民喝邪淫、大怒之酒的巴比倫大城傾倒了！傾倒了！","又有第二位天使接着说：叫万民喝邪淫、大怒之酒的巴比伦大城倾倒了！倾倒了！","And there followed another angel, saying, Babylon is fallen, is fallen, that great city, because she made all nations drink of the wine of the wrath of her fornication."],"65.14.9":["又有第三位天使接著他們，大聲說：若有人拜獸和獸像，在額上或在手上受了印記，","又有第三位天使接着他们，大声说：若有人拜兽和兽像，在额上或在手上受了印记，","And the third angel followed them, saying with a loud voice, If any man worship the beast and his image, and receive [his] mark in his forehead, or in his hand,"],"65.14.10":["這人也必喝神大怒的酒；此酒斟在神忿怒的杯中純一不雜。他要在聖天使和羔羊面前，在火與硫磺之中受痛苦。","这人也必喝神大怒的酒；此酒斟在神忿怒的杯中纯一不杂。他要在圣天使和羔羊面前，在火与硫磺之中受痛苦。","The same shall drink of the wine of the wrath of God, which is poured out without mixture into the cup of his indignation; and he shall be tormented with fire and brimstone in the presence of the holy angels, and in the presence of the Lamb:"],"65.14.11":["他受痛苦的煙往上冒，直到永永遠遠。那些拜獸和獸像，受他名之印記的，晝夜不得安寧。","他受痛苦的烟往上冒，直到永永远远。那些拜兽和兽像，受他名之印记的，昼夜不得安宁。","And the smoke of their torment ascendeth up for ever and ever: and they have no rest day nor night, who worship the beast and his image, and whosoever receiveth the mark of his name."],"65.14.12":["聖徒的忍耐就在此；他們是守神誡命和耶穌真道的。","圣徒的忍耐就在此；他们是守神诫命和耶稣真道的。","Here is the patience of the saints: here [are] they that keep the commandments of God, and the faith of Jesus."],"40.12.29":["耶穌回答說：第一要緊的就是說：以色列啊，你要聽，主─我們神是獨一的主。","耶稣回答说：第一要紧的就是说：以色列啊，你要听，主─我们神是独一的主。","And Jesus answered him, The first of all the commandments [is], Hear, O Israel; The Lord our God is one Lord:"],"40.12.30":["你要盡心、盡性、盡意、盡力愛主─你的神。","你要尽心、尽性、尽意、尽力爱主─你的神。","And thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind, and with all thy strength: this [is] the first commandment."],"40.12.31":["其次就是說：要愛人如己。再沒有比這兩條誡命更大的了。","其次就是说：要爱人如己。再没有比这两条诫命更大的了。","And the second [is] like, [namely] this, Thou shalt love thy neighbour as thyself. There is none other commandment greater than these."],"23.23.1":["耶和華說：那些殘害、趕散我草場之羊的牧人有禍了！","耶和华说：那些残害、赶散我草场之羊的牧人有祸了！","Woe be unto the pastors that destroy and scatter the sheep of my pasture! saith the LORD."],"23.23.2":["耶和華─以色列的神斥責那些牧養他百姓的牧人，如此說：你們趕散我的羊群，並沒有看顧他們；我必討你們這行惡的罪。這是耶和華說的。","耶和华─以色列的神斥责那些牧养他百姓的牧人，如此说：你们赶散我的羊群，并没有看顾他们；我必讨你们这行恶的罪。这是耶和华说的。","Therefore thus saith the LORD God of Israel against the pastors that feed my people; Ye have scattered my flock, and driven them away, and have not visited them: behold, I will visit upon you the evil of your doings, saith the LORD."],"23.23.3":["我要將我羊群中所餘剩的，從我趕他們到的各國內招聚出來，領他們歸回本圈；他們也必生養眾多。","我要将我羊群中所余剩的，从我赶他们到的各国内招聚出来，领他们归回本圈；他们也必生养众多。","And I will gather the remnant of my flock out of all countries whither I have driven them, and will bring them again to their folds; and they shall be fruitful and increase."],"23.23.4":["我必設立照管他們的牧人，牧養他們。他們不再懼怕，不再驚惶，也不缺少一個；這是耶和華說的。","我必设立照管他们的牧人，牧养他们。他们不再惧怕，不再惊惶，也不缺少一个；这是耶和华说的。","And I will set up shepherds over them which shall feed them: and they shall fear no more, nor be dismayed, neither shall they be lacking, saith the LORD."],"48.2.11":["所以你們應當記念：你們從前按肉體是外邦人，是稱為沒受割禮的；這名原是那些憑人手在肉身上稱為受割禮之人所起的。","所以你们应当记念：你们从前按肉体是外邦人，是称为没受割礼的；这名原是那些凭人手在肉身上称为受割礼之人所起的。","Wherefore remember, that ye [being] in time past Gentiles in the flesh, who are called Uncircumcision by that which is called the Circumcision in the flesh made by hands;"],"48.2.12":["那時，你們與基督無關，在以色列國民以外，在所應許的諸約上是局外人，並且活在世上沒有指望，沒有神。","那时，你们与基督无关，在以色列国民以外，在所应许的诸约上是局外人，并且活在世上没有指望，没有神。","That at that time ye were without Christ, being aliens from the commonwealth of Israel, and strangers from the covenants of promise, having no hope, and without God in the world:"],"48.2.13":["你們從前遠離神的人，如今卻在基督耶穌裡，靠著他的血，已經得親近了。","你们从前远离神的人，如今却在基督耶稣里，靠着他的血，已经得亲近了。","But now in Christ Jesus ye who sometimes were far off are made nigh by the blood of Christ."],"48.2.14":["因他使我們和睦（原文作：因他是我們的和睦），將兩下合而為一，拆毀了中間隔斷的牆；","因他使我们和睦（原文作：因他是我们的和睦），将两下合而为一，拆毁了中间隔断的墙；","For he is our peace, who hath made both one, and hath broken down the middle wall of partition [between us];"],"48.2.15":["而且以自己的身體廢掉冤仇，就是那記在律法上的規條，為要將兩下藉著自己造成一個新人，如此便成就了和睦。","而且以自己的身体废掉冤仇，就是那记在律法上的规条，为要将两下借着自己造成一个新人，如此便成就了和睦。","Having abolished in his flesh the enmity, [even] the law of commandments [contained] in ordinances; for to make in himself of twain one new man, [so] making peace;"],"48.2.16":["既在十字架上滅了冤仇，便藉這十字架使兩下歸為一體，與神和好了，","既在十字架上灭了冤仇，便藉这十字架使两下归为一体，与神和好了，","And that he might reconcile both unto God in one body by the cross, having slain the enmity thereby:"],"48.2.17":["並且來傳和平的福音給你們遠處的人，也給那近處的人。","并且来传和平的福音给你们远处的人，也给那近处的人。","And came and preached peace to you which were afar off, and to them that were nigh."],"48.2.18":["因為我們兩下藉著他被一個聖靈所感，得以進到父面前。","因为我们两下借着他被一个圣灵所感，得以进到父面前。","For through him we both have access by one Spirit unto the Father."],"48.2.19":["這樣，你們不再作外人和客旅，是與聖徒同國，是神家裡的人了；","这样，你们不再作外人和客旅，是与圣徒同国，是神家里的人了；","Now therefore ye are no more strangers and foreigners, but fellowcitizens with the saints, and of the household of God;"],"48.2.20":["並且被建造在使徒和先知的根基上，有基督耶穌自己為房角石，","并且被建造在使徒和先知的根基上，有基督耶稣自己为房角石，","And are built upon the foundation of the apostles and prophets, Jesus Christ himself being the chief corner [stone];"],"48.2.21":["各（或作：全）房靠他聯絡得合式，漸漸成為主的聖殿。","各（或作：全）房靠他联系得合式，渐渐成为主的圣殿。","In whom all the building fitly framed together groweth unto an holy temple in the Lord:"],"48.2.22":["你們也靠他同被建造，成為神藉著聖靈居住的所在。","你们也靠他同被建造，成为神借着圣灵居住的所在。","In whom ye also are builded together for an habitation of God through the Spirit."],"43.13.42":["他們出會堂的時候，眾人請他們到下安息日再講這話給他們聽。","他们出会堂的时候，众人请他们到下安息日再讲这话给他们听。","And when the Jews were gone out of the synagogue, the Gentiles besought that these words might be preached to them the next sabbath."],"43.13.43":["散會以後，猶太人和敬虔進猶太教的人多有跟從保羅、巴拿巴的。二人對他們講道，勸他們務要恆久在神的恩中。","散会以后，犹太人和敬虔进犹太教的人多有跟从保罗、巴拿巴的。二人对他们讲道，劝他们务要恒久在神的恩中。","Now when the congregation was broken up, many of the Jews and religious proselytes followed Paul and Barnabas: who, speaking to them, persuaded them to continue in the grace of God."],"43.13.44":["到下安息日，合城的人幾乎都來聚集，要聽神的道。","到下安息日，合城的人几乎都来聚集，要听神的道。","And the next sabbath day came almost the whole city together to hear the word of God."],"43.13.45":["但猶太人看見人這樣多，就滿心嫉妒，硬駁保羅所說的話，並且毀謗。","但犹太人看见人这样多，就满心嫉妒，硬驳保罗所说的话，并且毁谤。","But when the Jews saw the multitudes, they were filled with envy, and spake against those things which were spoken by Paul, contradicting and blaspheming."],"43.13.46":["保羅和巴拿巴放膽說：神的道先講給你們原是應當的；只因你們棄絕這道，斷定自己不配得永生，我們就轉向外邦人去。","保罗和巴拿巴放胆说：神的道先讲给你们原是应当的；只因你们弃绝这道，断定自己不配得永生，我们就转向外邦人去。","Then Paul and Barnabas waxed bold, and said, It was necessary that the word of God should first have been spoken to you: but seeing ye put it from you, and judge yourselves unworthy of everlasting life, lo, we turn to the Gentiles."],"43.13.47":["因為主曾這樣吩咐我們說：我已經立你作外邦人的光，叫你施行救恩，直到地極。","因为主曾这样吩咐我们说：我已经立你作外邦人的光，叫你施行救恩，直到地极。","For so hath the Lord commanded us, [saying], I have set thee to be a light of the Gentiles, that thou shouldest be for salvation unto the ends of the earth."],"43.13.48":["外邦人聽見這話，就歡喜了，讚美神的道；凡預定得永生的人都信了。","外邦人听见这话，就欢喜了，赞美神的道；凡预定得永生的人都信了。","And when the Gentiles heard this, they were glad, and glorified the word of the Lord: and as many as were ordained to eternal life believed."],"43.13.49":["於是主的道傳遍了那一帶地方。","于是主的道传遍了那一带地方。","And the word of the Lord was published throughout al
