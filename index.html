 them that fear him."],"18.103.13":["父親怎樣憐恤他的兒女，耶和華也怎樣憐恤敬畏他的人！","父亲怎样怜恤他的儿女，耶和华也怎样怜恤敬畏他的人！","Like as a father pitieth [his] children, [so] the LORD pitieth them that fear him."],"18.103.14":["因為他知道我們的本體，思念我們不過是塵土。","因为他知道我们的本体，思念我们不过是尘土。","For he knoweth our frame; he remembereth that we [are] dust."],"18.103.15":["至於世人，他的年日如草一樣。他發旺如野地的花，","至于世人，他的年日如草一样。他发旺如野地的花，","[As for] man, his days [are] as grass: as a flower of the field, so he flourisheth."],"18.103.16":["經風一吹，便歸無有；他的原處也不再認識他。","经风一吹，便归无有；他的原处也不再认识他。","For the wind passeth over it, and it is gone; and the place thereof shall know it no more."],"1.34.6":["耶和華在他面前宣告說：耶和華，耶和華，是有憐憫有恩典的神，不輕易發怒，並有豐盛的慈愛和誠實，","耶和华在他面前声明说：耶和华，耶和华，是有怜悯有恩典的神，不轻易发怒，并有丰盛的慈爱和诚实，","And the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth,"],"1.34.7":["為千萬人存留慈愛，赦免罪孽、過犯，和罪惡，萬不以有罪的為無罪，必追討他的罪，自父及子，直到三、四代。","为千万人存留慈爱，赦免罪孽、过犯，和罪恶，万不以有罪的为无罪，必追讨他的罪，自父及子，直到三、四代。","Keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear [the guilty]; visiting the iniquity of the fathers upon the children, and upon the children's children, unto the third and to the fourth [generation]."],"46.1.3":["願頌讚歸與我們的主耶穌基督的父神，就是發慈悲的父，賜各樣安慰的神。","愿颂赞归与我们的主耶稣基督的父神，就是发慈悲的父，赐各样安慰的神。","Blessed [be] God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort;"],"15.9.17":["不肯順從，也不記念你在他們中間所行的奇事，竟硬著頸項，居心背逆，自立首領，要回他們為奴之地。但你是樂意饒恕人，有恩典，有憐憫，不輕易發怒，有豐盛慈愛的神，並不丟棄他們。","不肯顺从，也不记念你在他们中间所行的奇事，竟硬着颈项，居心背逆，自立首领，要回他们为奴之地。但你是乐意饶恕人，有恩典，有怜悯，不轻易发怒，有丰盛慈爱的神，并不丢弃他们。","And refused to obey, neither were mindful of thy wonders that thou didst among them; but hardened their necks, and in their rebellion appointed a captain to return to their bondage: but thou [art] a God ready to pardon, gracious and merciful, slow to anger, and of great kindness, and forsookest them not."],"15.9.31":["然而你大發憐憫，不全然滅絕他們，也不丟棄他們；因為你是有恩典、有憐憫的神。","然而你大发怜悯，不全然灭绝他们，也不丢弃他们；因为你是有恩典、有怜悯的神。","Nevertheless for thy great mercies' sake thou didst not utterly consume them, nor forsake them; for thou [art] a gracious and merciful God."],"18.86.15":["主啊，你是有憐憫有恩典的神，不輕易發怒，並有豐盛的慈愛和誠實。","主啊，你是有怜悯有恩典的神，不轻易发怒，并有丰盛的慈爱和诚实。","But thou, O Lord, [art] a God full of compassion, and gracious, longsuffering, and plenteous in mercy and truth."],"28.2.13":["你們要撕裂心腸，不撕裂衣服。歸向耶和華─你們的神；因為他有恩典，有憐憫，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災。","你们要撕裂心肠，不撕裂衣服。归向耶和华─你们的神；因为他有恩典，有怜悯，不轻易发怒，有丰盛的慈爱，并且后悔不降所说的灾。","And rend your heart, and not your garments, and turn unto the LORD your God: for he [is] gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil."],"58.5.11":["那先前忍耐的人，我們稱他們是有福的。你們聽見過約伯的忍耐，也知道主給他的結局，明顯主是滿心憐憫，大有慈悲。","那先前忍耐的人，我们称他们是有福的。你们听见过约伯的忍耐，也知道主给他的结局，明显主是满心怜悯，大有慈悲。","Behold, we count them happy which endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy."],"49.4.7":["神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。","神所赐、出人意外的平安必在基督耶稣里保守你们的心怀意念。","And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus."],"49.4.8":["弟兄們，我還有未盡的話：凡是真實的、可敬的、公義的、清潔的、可愛的、有美名的，若有什麼德行，若有什麼稱讚，這些事你們都要思念。","弟兄们，我还有未尽的话：凡是真实的、可敬的、公义的、清洁的、可爱的、有美名的，若有什么德行，若有什么称赞，这些事你们都要思念。","Finally, brethren, whatsoever things are true, whatsoever things [are] honest, whatsoever things [are] just, whatsoever things [are] pure, whatsoever things [are] lovely, whatsoever things [are] of good report; if [there be] any virtue, and if [there be] any praise, think on these things."],"49.4.9":["你們在我身上所學習的，所領受的，所聽見的，所看見的，這些事你們都要去行，賜平安的神就必與你們同在。","你们在我身上所学习的，所领受的，所听见的，所看见的，这些事你们都要去行，赐平安的神就必与你们同在。","Those things, which ye have both learned, and received, and heard, and seen in me, do: and the God of peace shall be with you."],"22.26.3":["堅心倚賴你的，你必保守他十分平安，因為他倚靠你。","坚心倚赖你的，你必保守他十分平安，因为他倚靠你。","Thou wilt keep [him] in perfect peace, [whose] mind [is] stayed [on thee]: because he trusteth in thee."],"22.48.22":["耶和華說：惡人必不得平安！","耶和华说：恶人必不得平安！","[There is] no peace, saith the LORD, unto the wicked."],"61.5.13":["我將這些話寫給你們信奉神兒子之名的人，要叫你們知道自己有永生。","我将这些话写给你们信奉神儿子之名的人，要叫你们知道自己有永生。","These things have I written unto you that believe on the name of the Son of God; that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God."],"61.5.15":["既然知道他聽我們一切所求的，就知道我們所求於他的，無不得著。","既然知道他听我们一切所求的，就知道我们所求于他的，无不得着。","And if we know that he hear us, whatsoever we ask, we know that we have the petitions that we desired of him."],"35.3.17":["耶和華─你的神是施行拯救、大有能力的主。他在你中間必因你歡欣喜樂，默然愛你，且因你喜樂而歡呼。","耶和华─你的神是施行拯救、大有能力的主。他在你中间必因你欢欣喜乐，默然爱你，且因你喜乐而欢呼。","The LORD thy God in the midst of thee [is] mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing."],"54.1.12":["為這緣故，我也受這些苦難。然而我不以為恥；因為知道我所信的是誰，也深信他能保全我所交付他的（或作：他所交託我的），直到那日。","为这缘故，我也受这些苦难。然而我不以为耻；因为知道我所信的是谁，也深信他能保全我所交付他的（或作：他所交托我的），直到那日。","For the which cause I also suffer these things: nevertheless I am not ashamed: for I know whom I have believed, and am persuaded that he is able to keep that which I have committed unto him against that day."],"41.12.31":["你們只要求他的國，這些東西就必加給你們了。","你们只要求他的国，这些东西就必加给你们了。","But rather seek ye the kingdom of God; and all these things shall be added unto you."],"65.21.4":["神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。","神要擦去他们一切的眼泪；不再有死亡，也不再有悲哀、哭号、疼痛，因为以前的事都过去了。","And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away."],"57.13.6":["所以我們可以放膽說：主是幫助我的，我必不懼怕；人能把我怎麼樣呢？","所以我们可以放胆说：主是帮助我的，我必不惧怕；人能把我怎么样呢？","So that we may boldly say, The Lord [is] my helper, and I will not fear what man shall do unto me."],"22.41.9":["你是我從地極所領（原文是抓）來的，從地角所召來的，且對你說：你是我的僕人；我揀選你，並不棄絕你。","你是我从地极所领（原文是抓）来的，从地角所召来的，且对你说：你是我的仆人；我拣选你，并不弃绝你。","[Thou] whom I have taken from the ends of the earth, and called thee from the chief men thereof, and said unto thee, Thou [art] my servant; I have chosen thee, and not cast thee away."],"22.41.10":["你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。","你不要害怕，因为我与你同在；不要惊惶，因为我是你的神。我必坚固你，我必帮助你；我必用我公义的右手扶持你。","Fear thou not; for I [am] with thee: be not dismayed; for I [am] thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness."],"18.46.1":["（可拉後裔的詩歌，交與伶長。調用女音。）神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。","（可拉后裔的诗歌，交与伶长。调用女音。）神是我们的避难所，是我们的力量，是我们在患难中随时的帮助。","To the chief Musician for the sons of Korah, A Song upon Alamoth. God [is] our refuge and strength, a very present help in trouble."],"18.46.2":["所以，地雖改變，山雖搖動到海心，","所以，地虽改变，山虽摇动到海心，","Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea;"],"18.46.3":["其中的水雖匉訇翻騰，山雖因海漲而戰抖，我們也不害怕。（細拉）","其中的水虽匉訇翻腾，山虽因海涨而战抖，我们也不害怕。（细拉）","[Though] the waters thereof roar [and] be troubled, [though] the mountains shake with the swelling thereof. Selah."],"18.46.4":["有一道河，這河的分汊使神的城歡喜；這城就是至高者居住的聖所。","有一道河，这河的分汊使神的城欢喜；这城就是至高者居住的圣所。","[There is] a river, the streams whereof shall make glad the city of God, the holy [place] of the tabernacles of the most High."],"18.46.5":["神在其中，城必不動搖；到天一亮，神必幫助這城。","神在其中，城必不动摇；到天一亮，神必帮助这城。","God [is] in the midst of her; she shall not be moved: God shall help her, [and that] right early."],"18.46.6":["外邦喧嚷，列國動搖；神發聲，地便鎔化。","外邦喧嚷，列国动摇；神发声，地便镕化。","The heathen raged, the kingdoms were moved: he uttered his voice, the earth melted."],"18.46.7":["萬軍之耶和華與我們同在；雅各的神是我們的避難所！（細拉）","万军之耶和华与我们同在；雅各的神是我们的避难所！（细拉）","The LORD of hosts [is] with us; the God of Jacob [is] our refuge. Selah."],"18.46.8":["你們來看耶和華的作為，看他使地怎樣荒涼。","你们来看耶和华的作为，看他使地怎样荒凉。","Come, behold the works of the LORD, what desolations he hath made in the earth."],"18.46.9":["他止息刀兵，直到地極；他折弓、斷槍，把戰車焚燒在火中。","他止息刀兵，直到地极；他折弓、断枪，把战车焚烧在火中。","He maketh wars to cease unto the end of the earth; he breaketh the bow, and cutteth the spear in sunder; he burneth the chariot in the fire."],"18.46.10":["你們要休息，要知道我是神！我必在外邦中被尊崇，在遍地上也被尊崇。","你们要休息，要知道我是神！我必在外邦中被尊崇，在遍地上也被尊崇。","Be still, and know that I [am] God: I will be exalted among the heathen, I will be exalted in the earth."],"18.46.11":["萬軍之耶和華與我們同在；雅各的神是我們的避難所！","万军之耶和华与我们同在；雅各的神是我们的避难所！","The LORD of hosts [is] with us; the God of Jacob [is] our refuge. Selah."],"61.4.4":["小子們哪，你們是屬神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大。","小子们哪，你们是属神的，并且胜了他们；因为那在你们里面的，比那在世界上的更大。","Ye are of God, little children, and have overcome them: because greater is he that is in you, than he that is in the world."],"61.4.5":["他們是屬世界的，所以論世界的事，世人也聽從他們。","他们是属世界的，所以论世界的事，世人也听从他们。","They are of the world: therefore speak they of the world, and the world heareth them."],"61.4.6":["我們是屬神的，認識神的就聽從我們；不屬神的就不聽從我們。從此我們可以認出真理的靈和謬妄的靈來。","我们是属神的，认识神的就听从我们；不属神的就不听从我们。从此我们可以认出真理的灵和谬妄的灵来。","We are of God: he that knoweth God heareth us; he that is not of God heareth not us. Hereby know we the spirit of truth, and the spirit of error."],"61.4.7":["親愛的弟兄啊，我們應當彼此相愛，因為愛是從神來的。凡有愛心的，都是由神而生，並且認識神。","亲爱的弟兄啊，我们应当彼此相爱，因为爱是从神来的。凡有爱心的，都是由神而生，并且认识神。","Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God."],"61.4.9":["神差他獨生子到世間來，使我們藉著他得生，神愛我們的心在此就顯明了。","神差他独生子到世间来，使我们借着他得生，神爱我们的心在此就显明了。","In this was manifested the love of God toward us, because that God sent his only begotten Son into the world, that we might live through him."],"61.4.12":["從來沒有人見過神，我們若彼此相愛，神就住在我們裡面，愛他的心在我們裡面得以完全了。","从来没有人见过神，我们若彼此相爱，神就住在我们里面，爱他的心在我们里面得以完全了。","No man hath seen God at any time. If we love one another, God dwelleth in us, and his love is perfected in us."],"61.4.13":["神將他的靈賜給我們，從此就知道我們是住在他裡面，他也住在我們裡面。","神将他的灵赐给我们，从此就知道我们是住在他里面，他也住在我们里面。","Hereby know we that we dwell in him, and he in us, because he hath given us of his Spirit."],"61.4.14":["父差子作世人的救主；這是我們所看見且作見證的。","父差子作世人的救主；这是我们所看见且作见证的。","And we have seen and do testify that the Father sent the Son [to be] the Saviour of the world."],"61.4.15":["凡認耶穌為神兒子的，神就住在他裡面，他也住在神裡面。","凡认耶稣为神儿子的，神就住在他里面，他也住在神里面。","Whosoever shall confess that Jesus is the Son of God, God dwelleth in him, and he in God."],"42.6.37":["凡父所賜給我的人必到我這裡來；到我這裡來的，我總不丟棄他。","凡父所赐给我的人必到我这里来；到我这里来的，我总不丢弃他。","All that the Father giveth me shall come to me; and him that cometh to me I will in no wise cast out."],"64.1.24":["那能保守你們不失腳、叫你們無瑕無疵、歡歡喜喜站在他榮耀之前的我們的救主─獨一的神，","那能保守你们不失脚、叫你们无瑕无疵、欢欢喜喜站在他荣耀之前的我们的救主─独一的神，","Now unto him that is able to keep you from falling, and to present [you] faultless before the presence of his glory with exceeding joy,"],"41.12.22":["耶穌又對門徒說：所以我告訴你們，不要為生命憂慮吃什麼，為身體憂慮穿什麼；","耶稣又对门徒说：所以我告诉你们，不要为生命忧虑吃什么，为身体忧虑穿什么；","And he said unto his disciples, Therefore I say unto you, Take no thought for your life, what ye shall eat; neither for the body, what ye shall put on."],"41.12.23":["因為生命勝於飲食，身體勝於衣裳。","因为生命胜于饮食，身体胜于衣裳。","The life is more than meat, and the body [is more] than raiment."],"41.12.24":["你想烏鴉，也不種也不收，又沒有倉又沒有庫，神尚且養活他。你們比飛鳥是何等的貴重呢！","你想乌鸦，也不种也不收，又没有仓又没有库，神尚且养活他。你们比飞鸟是何等的贵重呢！","Consider the ravens: for they neither sow nor reap; which neither have storehouse nor barn; and God feedeth them: how much more are ye better than the fowls?"],"41.12.25":["你們哪一個能用思慮使壽數多加一刻呢（或作：使身量多加一肘呢）？","你们哪一个能用思虑使寿数多加一刻呢（或作：使身量多加一肘呢）？","And which of you with taking thought can add to his stature one cubit?"],"41.12.26":["這最小的事，你們尚且不能做，為什麼還憂慮其餘的事呢？","这最小的事，你们尚且不能做，为什么还忧虑其余的事呢？","If ye then be not able to do that thing which is least, why take ye thought for the rest?"],"41.12.27":["你想百合花怎麼長起來；他也不勞苦，也不紡線。然而我告訴你們，就是所羅門極榮華的時候，他所穿戴的，還不如這花一朵呢！","你想百合花怎么长起来；他也不劳苦，也不纺线。然而我告诉你们，就是所罗门极荣华的时候，他所穿戴的，还不如这花一朵呢！","Consider the lilies how they grow: they toil not, they spin not; and yet I say unto you, that Solomon in all his glory was not arrayed like one of these."],"41.12.28":["你們這小信的人哪，野地裡的草今天還在，明天就丟在爐裡，神還給他這樣的妝飾，何況你們呢！","你们这小信的人哪，野地里的草今天还在，明天就丢在炉里，神还给他这样的妆饰，何况你们呢！","If then God so clothe the grass, which is to day in the field, and to morrow is cast into the oven; how much more [will he clothe] you, O ye of little faith?"],"41.12.29":["你們不要求吃什麼，喝什麼，也不要掛心；","你们不要求吃什么，喝什么，也不要挂心；","And seek not ye what ye shall eat, or what ye shall drink, neither be ye of doubtful mind."],"41.12.30":["這都是外邦人所求的。你們必須用這些東西，你們的父是知道的。","这都是外邦人所求的。你们必须用这些东西，你们的父是知道的。","For all these things do the nations of the world seek after: and your Father knoweth that ye have need of these things."],"39.10.28":["那殺身體，不能殺靈魂的，不要怕他們；惟有能把身體和靈魂都滅在地獄裡的，正要怕他。","那杀身体，不能杀灵魂的，不要怕他们；惟有能把身体和灵魂都灭在地狱里的，正要怕他。","And fear not them which kill the body, but are not able to kill the soul: but rather fear him which is able to destroy both soul and body in hell."],"39.10.29":["兩個麻雀不是賣一分銀子嗎？若是你們的父不許，一個也不能掉在地上；","两个麻雀不是卖一分银子吗？若是你们的父不许，一个也不能掉在地上；","Are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father."],"39.10.30":["就是你們的頭髮也都被數過了。","就是你们的头发也都被数过了。","But the very hairs of your head are all numbered."],"39.10.31":["所以，不要懼怕，你們比許多麻雀還貴重！","所以，不要惧怕，你们比许多麻雀还贵重！","Fear ye not therefore, ye are of more value than many sparrows."],"39.10.32":["凡在人面前認我的，我在我天上的父面前也必認他；","凡在人面前认我的，我在我天上的父面前也必认他；","Whosoever therefore shall confess me before men, him will I confess also before my Father which is in heaven."],"39.10.33":["凡在人面前不認我的，我在我天上的父面前也必不認他。","凡在人面前不认我的，我在我天上的父面前也必不认他。","But whosoever shall deny me before men, him will I also deny before my Father which is in heaven."],"39.10.18":["並且你們要為我的緣故被送到諸侯君王面前，對他們和外邦人作見證。","并且你们要为我的缘故被送到诸侯君王面前，对他们和外邦人作见证。","And ye shall be brought before governors and kings for my sake, for a testimony against them and the Gentiles."],"39.10.19":["你們被交的時候，不要思慮怎樣說話，或說什麼話。到那時候，必賜給你們當說的話；","你们被交的时候，不要思虑怎样说话，或说什么话。到那时候，必赐给你们当说的话；","But when they deliver you up, take no thought how or what ye shall speak: for it shall be given you in that same hour what ye shall speak."],"39.10.20":["因為不是你們自己說的，乃是你們父的靈在你們裡頭說的。","因为不是你们自己说的，乃是你们父的灵在你们里头说的。","For it is not ye that speak, but the Spirit of your Father which speaketh in you."],"39.10.21":["弟兄要把弟兄，父親要把兒子，送到死地；兒女要與父母為敵，害死他們；","弟兄要把弟兄，父亲要把儿子，送到死地；儿女要与父母为敌，害死他们；","And the brother shall deliver up the brother to death, and the father the child: and the children shall rise up against [their] parents, and cause them to be put to death."],"40.13.11":["人把你們拉去交官的時候，不要預先思慮說什麼；到那時候，賜給你們什麼話，你們就說什麼；因為說話的不是你們，乃是聖靈。","人把你们拉去交官的时候，不要预先思虑说什么；到那时候，赐给你们什么话，你们就说什么；因为说话的不是你们，乃是圣灵。","But when they shall lead [you], and deliver you up, take no thought beforehand what ye shall speak, neither do ye premeditate: but whatsoever shall be given you in that hour, that speak ye: for it is not ye that speak, but the Holy Ghost."],"42.16.33":["我將這些事告訴你們，是要叫你們在我裡面有平安。在世上，你們有苦難；但你們可以放心，我已經勝了世界。","我将这些事告诉你们，是要叫你们在我里面有平安。在世上，你们有苦难；但你们可以放心，我已经胜了世界。","These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world."],"18.91.1":["住在至高者隱密處的，必住在全能者的蔭下。","住在至高者隐密处的，必住在全能者的荫下。","He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty."],"18.91.2":["我要論到耶和華說：他是我的避難所，是我的山寨，是我的神，是我所倚靠的。","我要论到耶和华说：他是我的避难所，是我的山寨，是我的神，是我所倚靠的。","I will say of the LORD, [He is] my refuge and my fortress: my God; in him will I trust."],"18.91.3":["他必救你脫離捕鳥人的網羅和毒害的瘟疫。","他必救你脱离捕鸟人的网罗和毒害的瘟疫。","Surely he shall deliver thee from the snare of the fowler, [and] from the noisome pestilence."],"18.91.4":["他必用自己的翎毛遮蔽你；你要投靠在他的翅膀底下；他的誠實是大小的盾牌。","他必用自己的翎毛屏蔽你；你要投靠在他的翅膀底下；他的诚实是大小的盾牌。","He shall cover thee with his feathers, and under his wings shalt thou trust: his truth [shall be thy] shield and buckler."],"18.91.5":["你必不怕黑夜的驚駭，或是白日飛的箭，","你必不怕黑夜的惊骇，或是白日飞的箭，","Thou shalt not be afraid for the terror by night; [nor] for the arrow [that] flieth by day;"],"18.91.6":["也不怕黑夜行的瘟疫，或是午間滅人的毒病。","也不怕黑夜行的瘟疫，或是午间灭人的毒病。","[Nor] for the pestilence [that] walketh in darkness; [nor] for the destruction [that] wasteth at noonday."],"18.91.7":["雖有千人仆倒在你旁邊，萬人仆倒在你右邊，這災卻不得臨近你。","虽有千人仆倒在你旁边，万人仆倒在你右边，这灾却不得临近你。","A thousand shall fall at thy side, and ten thousand at thy right hand; [but] it shall not come nigh thee."],"18.91.8":["你惟親眼觀看，見惡人遭報。","你惟亲眼观看，见恶人遭报。","Only with thine eyes shalt thou behold and see the reward of the wicked."],"18.91.9":["耶和華是我的避難所；你已將至高者當你的居所，","耶和华是我的避难所；你已将至高者当你的居所，","Because thou hast made the LORD, [which is] my refuge, [even] the most High, thy habitation;"],"18.91.10":["禍患必不臨到你，災害也不挨近你的帳棚。","祸患必不临到你，灾害也不挨近你的帐棚。","There shall no evil befall thee, neither shall any plague come nigh thy dwelling."],"18.91.13":["你要踹在獅子和虺蛇的身上，踐踏少壯獅子和大蛇。","你要踹在狮子和虺蛇的身上，践踏少壮狮子和大蛇。","Thou shalt tread upon the lion and adder: the young lion and the dragon shalt thou trample under feet."],"18.91.14":["神說：因為他專心愛我，我就要搭救他；因為他知道我的名，我要把他安置在高處。","神说：因为他专心爱我，我就要搭救他；因为他知道我的名，我要把他安置在高处。","Because he hath set his love upon me, therefore will I deliver him: I will set him on high, because he hath known my name."],"18.91.15":["他若求告我，我就應允他；他在急難中，我要與他同在；我要搭救他，使他尊貴。","他若求告我，我就应允他；他在急难中，我要与他同在；我要搭救他，使他尊贵。","He shall call upon me, and I will answer him: I [will be] with him in trouble; I will deliver him, and honour him."],"18.91.16":["我要使他足享長壽，將我的救恩顯明給他。","我要使他足享长寿，将我的救恩显明给他。","With long life will I satisfy him, and shew him my salvation."],"39.5.43":["你們聽見有話說：當愛你的鄰舍，恨你的仇敵。","你们听见有话说：当爱你的邻舍，恨你的仇敌。","Ye have heard that it hath been said, Thou shalt love thy neighbour, and hate thine enemy."],"37.7.9":["萬軍之耶和華曾對你們的列祖如此說：要按至理判斷，各人以慈愛憐憫弟兄。","万军之耶和华曾对你们的列祖如此说：要按至理判断，各人以慈爱怜悯弟兄。","Thus speaketh the LORD of hosts, saying, Execute true judgment, and shew mercy and compassions every man to his brother:"],"44.14.13":["所以，我們不可再彼此論斷，寧可定意誰也不給弟兄放下絆腳跌人之物。","所以，我们不可再彼此论断，宁可定意谁也不给弟兄放下绊脚跌人之物。","Let us not therefore judge one another any more: but judge this rather, that no man put a stumblingblock or an occasion to fall in [his] brother's way."],"44.14.10":["你這個人，為什麼論斷弟兄呢？又為什麼輕看弟兄呢？因我們都要站在神的臺前。","你这个人，为什么论断弟兄呢？又为什么轻看弟兄呢？因我们都要站在神的台前。","But why dost thou judge thy brother? or why dost thou set at nought thy brother? for we shall all stand before the judgment seat of Christ."],"44.14.11":["經上寫著：主說：我憑著我的永生起誓：萬膝必向我跪拜；萬口必向我承認。","经上写着：主说：我凭着我的永生起誓：万膝必向我跪拜；万口必向我承认。","For it is written, [As] I live, saith the Lord, every knee shall bow to me, and every tongue shall confess to God."],"44.14.12":["這樣看來，我們各人必要將自己的事在神面前說明。","这样看来，我们各人必要将自己的事在神面前说明。","So then every one of us shall give account of himself to God."],"46.10.12":["因為我們不敢將自己和那自薦的人同列相比。他們用自己度量自己，用自己比較自己，乃是不通達的。","因为我们不敢将自己和那自荐的人同列相比。他们用自己度量自己，用自己比较自己，乃是不通达的。","For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise."],"43.17.30":["世人蒙昧無知的時候，神並不監察，如今卻吩咐各處的人都要悔改。","世人蒙昧无知的时候，神并不监察，如今却吩咐各处的人都要悔改。","And the times of this ignorance God winked at; but now commandeth all men every where to repent:"],"43.17.31":["因為他已經定了日子，要藉著他所設立的人按公義審判天下，並且叫他從死裡復活，給萬人作可信的憑據。","因为他已经定了日子，要借着他所设立的人按公义审判天下，并且叫他从死里复活，给万人作可信的凭据。","Because he hath appointed a day, in the which he will judge the world in righteousness by [that] man whom he hath ordained; [whereof] he hath given assurance unto all [men], in that he hath raised him from the dead."],"20.12.14":["因為人所做的事，連一切隱藏的事，無論是善是惡，神都必審問。","因为人所做的事，连一切隐藏的事，无论是善是恶，神都必审问。","For God shall bring every work into judgment, with every secret thing, whether [it be] good, or whether [it be] evil."],"52.1.5":["這正是神公義判斷的明證，叫你們可算配得神的國；你們就是為這國受苦。","这正是神公义判断的明证，叫你们可算配得神的国；你们就是为这国受苦。","[Which is] a manifest token of the righteous judgment of God, that ye may be counted worthy of the kingdom of God, for which ye also suffer:"],"45.4.5":["所以，時候未到，什麼都不要論斷，只等主來，他要照出暗中的隱情，顯明人心的意念。那時，各人要從神那裡得著稱讚。","所以，时候未到，什么都不要论断，只等主来，他要照出暗中的隐情，显明人心的意念。那时，各人要从神那里得著称赞。","Therefore judge nothing before the time, until the Lord come, who both will bring to light the hidden things of darkness, and will make manifest the counsels of the hearts: and then shall every man have praise of God."],"57.10.30":["因為我們知道誰說：伸冤在我，我必報應；又說：主要審判他的百姓。","因为我们知道谁说：伸冤在我，我必报应；又说：主要审判他的百姓。","For we know him that hath said, Vengeance [belongeth] unto me, I will recompense, saith the Lord. And again, The Lord shall judge his people."],"8.16.7":["耶和華卻對撒母耳說：不要看他的外貌和他身材高大，我不揀選他。因為，耶和華不像人看人：人是看外貌；耶和華是看內心。","耶和华却对撒母耳说：不要看他的外貌和他身材高大，我不拣选他。因为，耶和华不像人看人：人是看外貌；耶和华是看内心。","But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for [the LORD seeth] not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart."],"42.5.21":["父怎樣叫死人起來，使他們活著，子也照樣隨自己的意思使人活著。","父怎样叫死人起来，使他们活着，子也照样随自己的意思使人活着。","For as the Father raiseth up the dead, and quickeneth [them]; even so the Son quickeneth whom he will."],"42.5.23":["叫人都尊敬子如同尊敬父一樣。不尊敬子的，就是不尊敬差子來的父。","叫人都尊敬子如同尊敬父一样。不尊敬子的，就是不尊敬差子来的父。","That all [men] should honour the Son, even as they honour the Father. He that honoureth not the Son honoureth not the Father which hath sent him."],"42.5.24":["我實實在在的告訴你們，那聽我話、又信差我來者的，就有永生；不至於定罪，是已經出死入生了。","我实实在在的告诉你们，那听我话、又信差我来者的，就有永生；不至于定罪，是已经出死入生了。","Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life."],"22.40.9":["報好信息給錫安的啊，你要登高山；報好信息給耶路撒冷的啊，你要極力揚聲。揚聲不要懼怕，對猶大的城邑說：看哪，你們的神！","报好信息给锡安的啊，你要登高山；报好信息给耶路撒冷的啊，你要极力扬声。扬声不要惧怕，对犹大的城邑说：看哪，你们的神！","O Zion, that bringest good tidings, get thee up into the high mountain; O Jerusalem, that bringest good tidings, lift up thy voice with strength; lift [it] up, be not afraid; say unto the cities of Judah, Behold your God!"],"22.40.10":["主耶和華必像大能者臨到；他的膀臂必為他掌權。他的賞賜在他那裡；他的報應在他面前。","主耶和华必像大能者临到；他的膀臂必为他掌权。他的赏赐在他那里；他的报应在他面前。","Behold, the Lord GOD will come with strong [hand], and his arm shall rule for him: behold, his reward [is] with him, and his work before him."],"26.7.9":["我觀看，見有寶座設立，上頭坐著亙古常在者。他的衣服潔白如雪，頭髮如純淨的羊毛。寶座乃火焰，其輪乃烈火。","我观看，见有宝座设立，上头坐着亘古常在者。他的衣服洁白如雪，头发如纯净的羊毛。宝座乃火焰，其轮乃烈火。","I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment [was] white as snow, and the hair of his head like the pure wool: his throne [was like] the fiery flame, [and] his wheels [as] burning fire."],"26.7.10":["從他面前有火，像河發出；事奉他的有千千，在他面前侍立的有萬萬；他坐著要行審判，案卷都展開了。","从他面前有火，像河发出；事奉他的有千千，在他面前侍立的有万万；他坐着要行审判，案卷都展开了。","A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened."],"26.7.13":["我在夜間的異象中觀看，見有一位像人子的，駕著天雲而來，被領到亙古常在者面前，","我在夜间的异象中观看，见有一位像人子的，驾着天云而来，被领到亘古常在者面前，","I saw in the night visions, and, behold, [one] like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before him."],"26.7.14":["得了權柄、榮耀、國度，使各方、各國、各族的人都事奉他。他的權柄是永遠的，不能廢去；他的國必不敗壞。","得了权柄、荣耀、国度，使各方、各国、各族的人都事奉他。他的权柄是永远的，不能废去；他的国必不败坏。","And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion [is] an everlasting dominion, which shall not pass away, and his kingdom [that] which shall not be destroyed."],"45.6.2":["豈不知聖徒要審判世界嗎？若世界為你們所審，難道你們不配審判這最小的事嗎？","岂不知圣徒要审判世界吗？若世界为你们所审，难道你们不配审判这最小的事吗？","Do ye not know that the saints shall judge the world? and if the world shall be judged by you, are ye unworthy to judge the smallest matters?"],"45.6.3":["豈不知我們要審判天使嗎？何況今生的事呢？","岂不知我们要审判天使吗？何况今生的事呢？","Know ye not that we shall judge angels? how much more things that pertain to this life?"],"65.20.11":["我又看見一個白色的大寶座與坐在上面的；從他面前天地都逃避，再無可見之處了。","我又看见一个白色的大宝座与坐在上面的；从他面前天地都逃避，再无可见之处了。","And I saw a great white throne, and him that sat on it, from whose face the earth and the heaven fled away; and there was found no place for them."],"65.20.12":["我又看見死了的人，無論大小，都站在寶座前。案卷展開了，並且另有一卷展開，就是生命冊。死了的人都憑著這些案卷所記載的，照他們所行的受審判。","我又看见死了的人，无论大小，都站在宝座前。案卷展开了，并且另有一卷展开，就是生命册。死了的人都凭着这些案卷所记载的，照他们所行的受审判。","And I saw the dead, small and great, stand before God; and the books were opened: and another book was opened, which is [the book] of life: and the dead were judged out of those things which were written in the books, according to their works."],"39.24.42":["所以，你們要警醒，因為不知道你們的主是哪一天來到。","所以，你们要警醒，因为不知道你们的主是哪一天来到。","Watch therefore: for ye know not what hour your Lord doth come."],"39.24.43":["家主若知道幾更天有賊來，就必警醒，不容人挖透房屋；這是你們所知道的。","家主若知道几更天有贼来，就必警醒，不容人挖透房屋；这是你们所知道的。","But know this, that if the goodman of the house had known in what watch the thief would come, he would have watched, and would not have suffered his house to be broken up."],"39.24.44":["所以，你們也要預備，因為你們想不到的時候，人子就來了。","所以，你们也要预备，因为你们想不到的时候，人子就来了。","Therefore be ye also ready: for in such an hour as ye think not the Son of man cometh."],"65.14.14":["我又觀看，見有一片白雲，雲上坐著一位好像人子，頭上戴著金冠冕，手裡拿著快鐮刀。","我又观看，见有一片白云，云上坐着一位好像人子，头上戴着金冠冕，手里拿着快镰刀。","And I looked, and behold a white cloud, and upon the cloud [one] sat like unto the Son of man, having on his head a golden crown, and in his hand a sharp sickle."],"39.24.30":["那時，人子的兆頭要顯在天上，地上的萬族都要哀哭。他們要看見人子，有能力，有大榮耀，駕著天上的雲降臨。","那时，人子的兆头要显在天上，地上的万族都要哀哭。他们要看见人子，有能力，有大荣耀，驾着天上的云降临。","And then shall appear the sign of the Son of man in heaven: and then shall all the tribes of the earth mourn, and they shall see the Son of man coming in the clouds of heaven with power and great glory."],"10.8.30":["你僕人和你民以色列向此處祈禱的時候，求你在天上你的居所垂聽，垂聽而赦免。","你仆人和你民以色列向此处祈祷的时候，求你在天上你的居所垂听，垂听而赦免。","And hearken thou to the supplication of thy servant, and of thy people Israel, when they shall pray toward this place: and hear thou in heaven thy dwelling place: and when thou hearest, forgive."],"43.7.49":["主說：天是我的座位，地是我的腳凳；你們要為我造何等的殿宇？哪裡是我安息的地方呢？","主说：天是我的座位，地是我的脚凳；你们要为我造何等的殿宇？哪里是我安息的地方呢？","Heaven [is] my throne, and earth [is] my footstool: what house will ye build me? saith the Lord: or what [is] the place of my rest?"],"22.35.8":["在那裡必有一條大道，稱為聖路。污穢人不得經過，必專為贖民行走；行路的人雖愚昧，也不致失迷。","在那里必有一条大道，称为圣路。污秽人不得经过，必专为赎民行走；行路的人虽愚昧，也不致失迷。","And an highway shall be there, and a way, and it shall be called The way of holiness; the unclean shall not pass over it; but it [shall be] for those: the wayfaring men, though fools, shall not err [therein]."],"65.20.7":["那一千年完了，撒但必從監牢裡被釋放，","那一千年完了，撒但必从监牢里被释放，","And when the thousand years are expired, Satan shall be loosed out of his prison,"],"65.20.8":["出來要迷惑地上四方（原文是角）的列國，就是歌革和瑪各，叫他們聚集爭戰。他們的人數多如海沙。","出来要迷惑地上四方（原文是角）的列国，就是歌革和玛各，叫他们聚集争战。他们的人数多如海沙。","And shall go out to deceive the nations which are in the four quarters of the earth, Gog and Magog, to gather them together to battle: the number of whom [is] as the sand of the sea."],"65.20.9":["他們上來遍滿了全地，圍住聖徒的營與蒙愛的城，就有火從天降下，燒滅了他們。","他们上来遍满了全地，围住圣徒的营与蒙爱的城，就有火从天降下，烧灭了他们。","And they went up on the breadth of the earth, and compassed the camp of the saints about, and the beloved city: and fire came down from God out of heaven, and devoured them."],"65.21.10":["我被聖靈感動，天使就帶我到一座高大的山，將那由神那裡、從天而降的聖城耶路撒冷指示我。","我被圣灵感动，天使就带我到一座高大的山，将那由神那里、从天而降的圣城耶路撒冷指示我。","And he carried me away in the spirit to a great and high mountain, and shewed me that great city, the holy Jerusalem, descending out of heaven from God,"],"65.21.11":["城中有神的榮耀；城的光輝如同極貴的寶石，好像碧玉，明如水晶。","城中有神的荣耀；城的光辉如同极贵的宝石，好像碧玉，明如水晶。","Having the glory of God: and her light [was] like unto a stone most precious, even like a jasper stone, clear as crystal;"],"65.21.12":["有高大的牆，有十二個門，門上有十二位天使；門上又寫著以色列十二個支派的名字。","有高大的墙，有十二个门，门上有十二位天使；门上又写着以色列十二个支派的名字。","And had a wall great and high, [and] had twelve gates, and at the gates twelve angels, and names written thereon, which are [the names] of the twelve tribes of the children of Israel:"],"65.21.13":["東邊有三門、北邊有三門、南邊有三門、西邊有三門。","东边有三门、北边有三门、南边有三门、西边有三门。","On the east three gates; on the north three gates; on the south three gates; and on the west three gates."],"65.21.14":["城牆有十二根基，根基上有羔羊十二使徒的名字。","城墙有十二根基，根基上有羔羊十二使徒的名字。","And the wall of the city had twelve foundations, and in them the names of the twelve apostles of the Lamb."],"65.21.15":["對我說話的，拿著金葦子當尺，要量那城和城門城牆。","对我说话的，拿着金苇子当尺，要量那城和城门城墙。","And he that talked with me had a golden reed to measure the city, and the gates thereof, and the wall thereof."],"65.21.16":["城是四方的，長寬一樣。天使用葦子量那城，共有四千里，長、寬、高都是一樣；","城是四方的，长宽一样。天使用苇子量那城，共有四千里，长、宽、高都是一样；","And the city lieth foursquare, and the length is as large as the breadth: and he measured the city with the reed, twelve thousand furlongs. The length and the breadth and the height of it are equal."],"65.21.17":["又量了城牆，按著人的尺寸，就是天使的尺寸，共有一百四十四肘。","又量了城墙，按着人的尺寸，就是天使的尺寸，共有一百四十四肘。","And he measured the wall thereof, an hundred [and] forty [and] four cubits, [according to] the measure of a man, that is, of the angel."],"65.21.18":["牆是碧玉造的；城是精金的，如同明淨的玻璃。","墙是碧玉造的；城是精金的，如同明净的玻璃。","And the building of the wall of it was [of] jasper: and the city [was] pure gold, like unto clear glass."],"65.21.19":["城牆的根基是用各樣寶石修飾的：第一根基是碧玉；第二是藍寶石；第三是綠瑪瑙；第四是綠寶石；","城墙的根基是用各样宝石修饰的：第一根基是碧玉；第二是蓝宝石；第三是绿玛瑙；第四是绿宝石；","And the foundations of the wall of the city [were] garnished with all manner of precious stones. The first foundation [was] jasper; the second, sapphire; the third, a chalcedony; the fourth, an emerald;"],"65.21.20":["第五是紅瑪瑙；第六是紅寶石；第七是黃璧璽；第八是水蒼玉；第九是紅璧璽；第十是翡翠；第十一是紫瑪瑙；第十二是紫晶。","第五是红玛瑙；第六是红宝石；第七是黄璧玺；第八是水苍玉；第九是红璧玺；第十是翡翠；第十一是紫玛瑙；第十二是紫晶。","The fifth, sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, a topaz; the tenth, a chrysoprasus; the eleventh, a jacinth; the twelfth, an amethyst."],"65.21.21":["十二個門是十二顆珍珠，每門是一顆珍珠。城內的街道是精金，好像明透的玻璃。","十二个门是十二颗珍珠，每门是一颗珍珠。城内的街道是精金，好像明透的玻璃。","And the twelve gates [were] twelve pearls; every several gate was of one pearl: and the street of the city [was] pure gold, as it were transparent glass."],"65.21.22":["我未見城內有殿，因主神─全能者和羔羊為城的殿。","我未见城内有殿，因主神─全能者和羔羊为城的殿。","And I saw no temple therein: for the Lord God Almighty and the Lamb are the temple of it."],"65.21.23":["那城內又不用日月光照；因有神的榮耀光照，又有羔羊為城的燈。","那城内又不用日月光照；因有神的荣耀光照，又有羔羊为城的灯。","And the city had no need of the sun, neither of the moon, to shine in it: for the glory of God did lighten it, and the Lamb [is] the light thereof."],"65.21.24":["列國要在城的光裡行走；地上的君王必將自己的榮耀歸與那城。","列国要在城的光里行走；地上的君王必将自己的荣耀归与那城。","And the nations of them which are saved shall walk in the light of it: and the kings of the earth do bring their glory and honour into it."],"65.21.25":["城門白晝總不關閉，在那裡原沒有黑夜。","城门白昼总不关闭，在那里原没有黑夜。","And the gates of it shall not be shut at all by day: for there shall be no night there."],"65.21.26":["人必將列國的榮耀、尊貴歸與那城。","人必将列国的荣耀、尊贵归与那城。","And they shall bring the glory and honour of the nations into it."],"65.21.27":["凡不潔淨的，並那行可憎與虛謊之事的，總不得進那城；只有名字寫在羔羊生命冊上的才得進去。","凡不洁净的，并那行可憎与虚谎之事的，总不得进那城；只有名字写在羔羊生命册上的才得进去。","And there shall in no wise enter into it any thing that defileth, neither [whatsoever] worketh abomination, or [maketh] a lie: but they which are written in the Lamb's book of life."],"65.22.1":["天使又指示我在城內街道當中一道生命水的河，明亮如水晶，從神和羔羊的寶座流出來。","天使又指示我在城内街道当中一道生命水的河，明亮如水晶，从神和羔羊的宝座流出来。","And he shewed me a pure river of water of life, clear as crystal, proceeding out of the throne of God and of the Lamb."],"65.22.2":["在河這邊與那邊有生命樹，結十二樣（或作：回）果子，每月都結果子；樹上的葉子乃為醫治萬民。","在河这边与那边有生命树，结十二样（或作：回）果子，每月都结果子；树上的叶子乃为医治万民。","In the midst of the street of it, and on either side of the river, [was there] the tree of life, which bare twelve [manner of] fruits, [and] yielded her fruit every month: and the leaves of the tree [were] for the healing of the nations."],"65.22.3":["以後再沒有咒詛；在城裡有神和羔羊的寶座；他的僕人都要事奉他，","以后再没有咒诅；在城里有神和羔羊的宝座；他的仆人都要事奉他，","And there shall be no more curse: but the throne of God and of the Lamb shall be in it; and his servants shall serve him:"],"65.22.4":["也要見他的面。他的名字必寫在他們的額上。","也要见他的面。他的名字必写在他们的额上。","And they shall see his face; and his name [shall be] in their foreheads."],"65.22.5":["不再有黑夜；他們也不用燈光、日光，因為主神要光照他們。他們要作王，直到永永遠遠。","不再有黑夜；他们也不用灯光、日光，因为主神要光照他们。他们要作王，直到永永远远。","And there shall be no night there; and they need no candle, neither light of the sun; for the Lord God giveth them light: and they shall reign for ever and ever."],"22.65.17":["看哪！我造新天新地；從前的事不再被記念，也不再追想。","看哪！我造新天新地；从前的事不再被记念，也不再追想。","For, behold, I create new heavens and a new earth: and the former shall not be remembered, nor come into mind."],"22.65.18":["你們當因我所造的永遠歡喜快樂；因我造耶路撒冷為人所喜，造其中的居民為人所樂。","你们当因我所造的永远欢喜快乐；因我造耶路撒冷为人所喜，造其中的居民为人所乐。","But be ye glad and rejoice for ever [in that] which I create: for, behold, I create Jerusalem a rejoicing, and her people a joy."],"22.65.19":["我必因耶路撒冷歡喜，因我的百姓快樂；其中必不再聽見哭泣的聲音和哀號的聲音。","我必因耶路撒冷欢喜，因我的百姓快乐；其中必不再听见哭泣的声音和哀号的声音。","And I will rejoice in Jerusalem, and joy in my people: and the voice of weeping shall be no more heard in her, nor the voice of crying."],"22.65.20":["其中必沒有數日夭亡的嬰孩，也沒有壽數不滿的老者；因為百歲死的仍算孩童，有百歲死的罪人算被咒詛。","其中必没有数日夭亡的婴孩，也没有寿数不满的老者；因为百岁死的仍算孩童，有百岁死的罪人算被咒诅。","There shall be no more thence an infant of days, nor an old man that hath not filled his days: for the child shall die an hundred years old; but the sinner [being] an hundred years old shall be accursed."],"22.65.21":["他們要建造房屋，自己居住；栽種葡萄園，吃其中的果子。","他们要建造房屋，自己居住；栽种葡萄园，吃其中的果子。","And they shall build houses, and inhabit [them]; and they shall plant vineyards, and eat the fruit of them."],"22.65.22":["他們建造的，別人不得住；他們栽種的，別人不得吃；因為我民的日子必像樹木的日子；我選民親手勞碌得來的必長久享用。","他们建造的，别人不得住；他们栽种的，别人不得吃；因为我民的日子必像树木的日子；我选民亲手劳碌得来的必长久享用。","They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree [are] the days of my people, and mine elect shall long enjoy the work of their hands."],"22.65.23":["他們必不徒然勞碌，所生產的，也不遭災害，因為都是蒙耶和華賜福的後裔；他們的子孫也是如此。","他们必不徒然劳碌，所生产的，也不遭灾害，因为都是蒙耶和华赐福的后裔；他们的子孙也是如此。","They shall not labour in vain, nor bring forth for trouble; for they [are] the seed of the blessed of the LORD, and their offspring with them."],"22.65.24":["他們尚未求告，我就應允；正說話的時候，我就垂聽。","他们尚未求告，我就应允；正说话的时候，我就垂听。","And it shall come to pass, that before they call, I will answer; and while they are yet speaking, I will hear."],"22.65.25":["豺狼必與羊羔同食；獅子必吃草與牛一樣；塵土必作蛇的食物。在我聖山的遍處，這一切都不傷人，不害物。這是耶和華說的。","豺狼必与羊羔同食；狮子必吃草与牛一样；尘土必作蛇的食物。在我圣山的遍处，这一切都不伤人，不害物。这是耶和华说的。","The wolf and the lamb shall feed together, and the lion shall eat straw like the bullock: and dust [shall be] the serpent's meat. They shall not hurt nor destroy in all my holy mountain, saith the LORD."],"22.66.22":["耶和華說：我所要造的新天新地，怎樣在我面前長存；你們的後裔和你們的名字也必照樣長存。","耶和华说：我所要造的新天新地，怎样在我面前长存；你们的后裔和你们的名字也必照样长存。","For as the new heavens and the new earth, which I will make, shall remain before me, saith the LORD, so shall your seed and your name remain."],"42.6.68":["西門彼得回答說：主啊，你有永生之道，我們還歸從誰呢？","西门彼得回答说：主啊，你有永生之道，我们还归从谁呢？","Then Simon Peter answered him, Lord, to whom shall we go? thou hast the words of eternal life."],"57.5.9":["他既得以完全，就為凡順從他的人成了永遠得救的根源、","他既得以完全，就为凡顺从他的人成了永远得救的根源、","And being made perfect, he became the author of eternal salvation unto all them that obey him;"],"39.19.29":["凡為我的名撇下房屋，或是弟兄、姊妹、父親、母親、（有古卷在此有：妻子）兒女、田地的，必要得著百倍，並且承受永生。","凡为我的名撇下房屋，或是弟兄、姊妹、父亲、母亲、（有古卷在此有：妻子）儿女、田地的，必要得着百倍，并且承受永生。","And every one that hath forsaken houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands, for my name's sake, shall receive an hundredfold, and shall inherit everlasting life."],"42.3.36":["信子的人有永生；不信子的人得不著永生（原文作不得見永生），神的震怒常在他身上。","信子的人有永生；不信子的人得不着永生（原文作不得见永生），神的震怒常在他身上。","He that believeth on the Son hath everlasting life: and he that believeth not the Son shall not see life; but the wrath of God abideth on him."],"44.5.21":["就如罪作王叫人死；照樣，恩典也藉著義作王，叫人因我們的主耶穌基督得永生。","就如罪作王叫人死；照样，恩典也借着义作王，叫人因我们的主耶稣基督得永生。","That as sin hath reigned unto death, even so might grace reign through righteousness unto eternal life by Jesus Christ our Lord."]},"topics":[{"id":0,"page":2,"zh":"何處查找","hans":"何处查找","en":"WHERE TO FIND","items":[{"k":"e","i":0,"zh":"祭壇——為罪流血","hans":"祭坛——为罪流血","en":"Altars, Blood Shed for Sins","rz":"","rh":"","re":""},{"k":"e","i":1,"zh":"該隱與亞伯的供物","hans":"该隐与亚伯的供物","en":"Offerings of Cain and Abel","rz":"創4:1-12","rh":"创4:1-12","re":"G /* ---------------- helpers ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ var a=seed>>>0; return function(){ a+=0x6D2B79F5; var x=a; x=Math.imul(x^(x>>>15),x|1); x^=x+Math.imul(x^(x>>>7),x|61); return ((x^(x>>>14))>>>0)/4294967296; }; }
var PUNC = /[\s，。、；：？！「」『』（）〔〕《》…—·,.;:?!"'()\[\]\-–—]/;
var CJK  = /[㐀-鿿豈-﫿]/;

function isEn(lang){ return lang==="en"; }
/* split text into maskable units + fixed punctuation */
function units(text,lang){
  var out=[],i;
  if(isEn(lang)){
    text.split(/(\s+)/).forEach(function(w){
      out.push({s:w, m:!/^\s*$/.test(w) && /[A-Za-z0-9]/.test(w)});
    });
  } else {
    for(i=0;i<text.length;i++){
      var c=text[i];
      out.push({s:c, m:!PUNC.test(c)});
    }
  }
  return out;
}
function maskUnits(text,lang,ratio,salt,shown,group){
  var u=units(text,lang), r=rng(hash(text+"|"+salt)), html="", idx=0;
  /* short verses: mask single characters so even a one-line verse gets blanks.
     Topic entries are short phrases — they read better masked two characters at a time. */
  var groupLen = group ? group : (isEn(lang) ? 1 : (text.length < 26 ? 1 : 2));
  /* first decide what is hidden, merging neighbouring runs so two blanks
     never end up sitting side by side */
  var parts=[], i=0;
  while(i<u.length){
    if(!u[i].m){
      if(parts.length && !parts[parts.length-1].m) parts[parts.length-1].s+=u[i].s;
      else parts.push({m:false,s:u[i].s});
      i++; continue;
    }
    var take=0, j=i;
    while(j<u.length && u[j].m && take<groupLen){ take++; j++; }
    var chunk=u.slice(i,j).map(function(x){return x.s}).join("");
    var hide=r()<ratio;
    if(parts.length && parts[parts.length-1].m===hide) parts[parts.length-1].s+=chunk;
    else parts.push({m:hide,s:chunk});
    i=j;
  }
  parts.forEach(function(pt){
    if(!pt.m){ html+=esc(pt.s); return; }
    var on = shown && shown[idx];
    html+='<span class="blk'+(on?" on":"")+'" data-b="'+idx+'">'+esc(pt.s)+"</span>";
    idx++;
  });
  return html;
}
function firstHint(text,lang){
  if(isEn(lang)){
    return esc(text).replace(/[A-Za-z][A-Za-z''-]*/g,function(w){
      return w[0]+"▁".repeat(Math.max(0,w.length-1)); });
  }
  var parts=text.split(/([，。、；：？！「」『』（）…—\s]+)/), out="";
  parts.forEach(function(p){
    if(!p) return;
    if(/^[，。、；：？！「」『』（）…—\s]+$/.test(p)){ out+=esc(p); return; }
    out+=esc(p[0])+"▁".repeat(Math.max(0,p.length-1));
  });
  return out;
}
function blankAll(text,lang){
  if(isEn(lang)) return esc(text).replace(/[A-Za-z0-9][A-Za-z0-9''-]*/g,function(w){return "▁".repeat(w.length)});
  return text.split("").map(function(c){ return PUNC.test(c)?esc(c):"▁" }).join("");
}
function maskRef(ref,mode){
  if(!ref) return "";
  if(mode==="digits") return ref.replace(/\d/g,"▁");     /* 書卷名看得見 */
  return ref.replace(/[^\s，,\-]/g,"▁");                 /* 連書卷名一起遮 */
}
/* a reference can hold several passages — keep them as separate pieces */
function refSegs(ref){
  if(!ref) return [];
  return ref.split(/[；;]/).map(function(x){ return x.trim(); }).filter(Boolean);
}

  var refShown = q.revealed || segs.every(function(_,i){ return q.rshown[i]; });
  var refTxt = segs.map(function(sg,i){
    var on = q.revealed || q.rshown[i];
    if(!on) return '<span class="rseg hid" data-rseg="'+i+'">'+
                     esc(maskRef(sg,st.refmask))+"</span>";
    var bk = oSegs[i] ? oSegs[i].replace(oTail,"") : "";
    return '<span class="rseg">'+esc(sg)+
      (bk?'<span class="rbk">（'+esc(bk)+"）</span>":"")+"</span>";
  }).join(segs.length>1 ? '<span class="rline"></span>'
                        : '<span class="rsep">'+sep+"</span>");
  var refChips='<div class="rchips"><span class="lbl">'+esc(s.refLabel)+"</span>"+
    '<button data-refmask="digits" aria-pressed="'+(st.refmask==="digits")+'">'+esc(s.refDigits)+"</button>"+
    '<button data-refmask="all" aria-pressed="'+(st.refmask==="all")+'">'+esc(s.refAll)+"</button></div>";
  return bar(backBtn(s)+'<span class="bar-title">'+esc(tp[s.key==="en"?"en":s.key])+"</span>")+
   '<main><div class="wrap">'+lvSeg+filtRow+
   '<div class="prog"><i style="width:'+Math.round(100*q.i/Math.max(1,list.length))+'%"></i></div>'+
   '<div class="qmeta"><span class="n">'+
     (q.hist.length?'<button class="stepback" data-prev="1">‹ '+esc(s.prev)+"</button>　":"")+
     esc(t(s.qn,q.i+1,list.length))+"</span>"+
   '<span class="n">'+esc(s.lvMastered)+" "+nSolidLv+"/"+all.length+"</span></div>"+
   '<div class="card">'+
     (ctx?'<div class="ctx">'+esc(ctx[s.key==="en"?"en":s.key])+"</div>":"")+
     '<div class="qtext'+(!q.revealed&&q.level==="blank"?" tap":"")+'"'+
       (!q.revealed&&q.level==="blank"?' data-reveal="1"':"")+">"+txt+"</div>"+
     (s.key!=="en" && (q.level==="hint"||q.revealed)
        ? '<div class="qen">'+esc(it.en)+"</div>" : "")+
     "<hr>"+
     '<div class="answer">'+refTxt+"</div>"+
     '<div class="taprow">'+
       (refShown?"":'<span class="h">'+esc(segs.length>1?s.tapEach:s.tapReveal)+"</span>")+
       refChips+"</div>"+
   "</div>"+
   (refShown?'<div class="actions" style="margin-top:14px">'+
      '<button class="btn btn-wide" data-retry="1">'+esc(s.retry)+"</button>"+
      (it.vs&&it.vs.length
        ? '<button class="btn btn-brass btn-wide" data-openv="'+tp.items.indexOf(it)+'">'+
          esc(s.vsHead)+" · "+esc(t(s.verseOf,it.vs.length))+"</button>" : "")+
    "</div>":"")+
   "</div></main>"+
   '<div class="footbar"><div class="wrap">'+
     (refShown
       ? '<button class="btn btn-clay btn-wide" data-mark="0">'+esc(s.forgot)+"</button>"+
         '<button class="btn btn-sage btn-wide" data-mark="1">'+esc(s.got)+"</button>"
       : '<button class="btn btn-p btn-wide" data-reveal="1">'+esc(s.reveal)+"</button>")+
   "</div></div>";
}

/* ---- pick a passage (verse drill entry) ---- */
function viewVpick(s){
  var tp=TOPICS[st.tid];
  var rows=tp.items.map(function(it,ii){
    if(it.k!=="e"||!it.vs||!it.vs.length) return "";
    return '<button class="vrow" data-item="'+ii+'">'+
      '<span class="vkey">'+esc(it[s.rk])+"</span>"+
      '<span class="vtext" style="font-family:var(--f-ui);font-size:14px">'+esc(it[s.key])+
      '<br><span style="color:var(--faint);font-size:11.5px;font-family:var(--f-mono)">'+
      esc(t(s.verseOf,it.vs.length))+"</span></span></button>";
  }).join("");
  return bar(backBtn(s)+'<span class="bar-title">'+esc(s.verseDrill)+"</span>")+
    '<main><div class="wrap"><div class="thead"><h1>'+esc(tp[s.key])+"</h1>"+
    '<div class="en">'+esc(s.verseDrill)+"</div></div>"+
    '<p class="hint">'+esc(s.vpick)+"</p>"+
    (rows||'<div class="note">'+esc(s.noVerse)+"</div>")+"</div></main>";
}

/* ---- verse list for one entry ---- */
function viewVerses(s){
  var tp=TOPICS[st.tid], it=tp.items[st.itemIdx];
  var head=bar(backBtn(s)+'<span class="bar-title">'+esc(it[s.rk])+"</span>");
  if(!it.vs||!it.vs.length){
    return head+'<main><div class="wrap"><div class="thead"><h1>'+esc(it[s.key])+"</h1>"+
      '<div class="en">'+esc(it[s.rk])+"</div></div>"+
      '<div class="note">'+esc(s.noVerse)+"</div></div></main>";
  }
  var f=st.vfilt||"all";
  var shown=it.vs.map(function(v,vi){ return {v:v,vi:vi,st:vStateAny(v)}; })
                 .filter(function(x){ return f==="all" || x.st!=="solid"; });
  var nWeak=it.vs.filter(function(v){ return vStateAny(v)!=="solid"; }).length;
  var filtRow='<div class="filt">'+
    '<button data-vfilt="all" aria-pressed="'+(f==="all")+'">'+esc(s.filtAll)+" "+it.vs.length+"</button>"+
    '<button data-vfilt="weak" aria-pressed="'+(f==="weak")+'">'+esc(s.filtWeak)+" "+nWeak+"</button>"+
    "</div>"+
    '<div class="legend">'+
      '<span><i class="vstate solid"></i>'+esc(s.stSolid)+"</span>"+
      '<span><i class="vstate weak"></i>'+esc(s.stWeak)+"</span>"+
      '<span><i class="vstate new"></i>'+esc(s.stNew)+"</span></div>";
  var rows=shown.map(function(x){
    return '<button class="vrow" data-verse="'+x.vi+'">'+
      '<i class="vstate '+x.st+'"></i>'+
      '<span class="vkey">'+esc(x.v[s.vk])+"</span>"+
      '<span class="vtext">'+esc(x.v[s.key])+"</span></button>";
  }).join("") || '<div class="note">'+esc(s.allSolid)+"</div>";
  return head+'<main><div class="wrap"><div class="thead">'+
    "<h1>"+esc(it[s.key])+"</h1>"+
    '<div class="en">'+esc(it[s.rk])+"</div>"+
    '<div class="src">'+esc(t(s.verseOf,it.vs.length))+
      (it.trunc?" "+esc(s.trunc):"")+"</div></div>"+
    filtRow+'<p class="hint">'+esc(s.pickVerse)+"<br>"+esc(s.weakHow)+"</p>"+rows+"</div></main>";
}

/* ---- single verse drill ---- */
function viewVerse(s){
  var tp=TOPICS[st.tid], it=tp.items[st.itemIdx], v=it.vs[st.vd.vi], d=st.vd;
  var rec=P.v[vkeyOf(v,d.level)]||{ok:0,ng:0};
  var body;
  if(d.revealed)            body=esc(v[s.key]);
  else if(d.level==="fill") body=maskUnits(v[s.key],s.lang,.38,d.salt,d.shown);
  else if(d.level==="hint") body=firstHint(v[s.key],s.lang);
  else                      body=blankAll(v[s.key],s.lang);
  var lvSeg='<div class="seg" role="group" style="margin-bottom:16px;width:100%">'+
    [["fill",s.lv.fill],["hint",s.lv.hint],["blank",s.lv.blank]].map(function(p){
      return '<button data-vlv="'+p[0]+'" aria-pressed="'+(d.level===p[0])+'" style="flex:1">'+
        esc(p[1])+"</button>"; }).join("")+"</div>";
  return bar(backBtn(s)+'<span class="bar-title">'+esc(v[s.vk])+"</span>")+
    '<main><div class="wrap">'+lvSeg+
    '<div class="qmeta"><span class="n">'+esc(v[s.vk])+"</span>"+
      '<span class="n">'+esc(t(s.scoreline,rec.ok,rec.ng))+"</span></div>"+
    '<div class="card"><div class="vbody'+(s.key==="en"?" en":"")+
      (!d.revealed&&d.level!=="fill"?" tap":"")+'" id="vbody"'+
      (!d.revealed&&d.level!=="fill"?' data-vreveal="1"':"")+">"+body+"</div>"+
      (d.level==="fill"&&!d.revealed
        ? '<div class="stat"><div>'+esc(s.vlvDesc.fill)+"</div></div>" : "")+
    "</div>"+
    '<div class="actions" style="margin-top:14px">'+
      '<button class="btn btn-wide" data-reshuffle="1">'+esc(s.reshuffle)+"</button>"+
      (st.vd.vi+1<it.vs.length?'<button class="btn btn-wide" data-nextv="1">'+esc(s.nextv)+"</button>":"")+
    "</div></div></main>"+
    '<div class="footbar"><div class="wrap">'+
      (d.revealed
        ? '<button class="btn btn-clay btn-wide" data-vmark="0">'+esc(s.forgot)+"</button>"+
          '<button class="btn btn-sage btn-wide" data-vmark="1">'+esc(s.got)+"</button>"
        : '<button class="btn btn-p btn-wide" data-vreveal="1">'+esc(s.showAll)+"</button>")+
    "</div></div>";
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-sort],[data-retry],[data-prev],[data-rseg],[data-refmask],[data-filt],[data-vfilt],[data-clear],[data-fs],[data-lang],[data-topic],[data-vpick],[data-back],[data-seq],[data-lv],[data-reveal],[data-mark],[data-restart],[data-item],[data-openv],[data-verse],[data-vlv],[data-vreveal],[data-vmark],[data-reshuffle],[data-nextv],.blk");
  if(!el) return;
  var d=el.dataset;
  if(d.fs){
    if(d.fs==="toggle") st.fsOpen=!st.fsOpen;
    else if(d.fs==="up"   && st.fs<FS.length-1) st.fs++;
    else if(d.fs==="down" && st.fs>0) st.fs--;
    else if(d.fs==="reset") st.fs=1;
    P.fs=st.fs; save(); applyFs(); st.keepScroll=window.scrollY; return render();
  }
  if(d.lang){ st.lang=d.lang; P.lang=d.lang; save(); return render(); }
  if(d.back!==undefined){
    if(st.screen==="verse") st.screen="verses";
    else if(st.screen==="verses") st.screen=st.from||"topic";
    else if(st.screen==="seq"||st.screen==="vpick") st.screen="topic";
    else st.screen="list";
    st.armAll=false; st.armTopic=false;
    return render();
  }
  if(d.vpick!==undefined){ st.screen="vpick"; return render(); }
  if(d.topic!==undefined){ st.tid=+d.topic; st.screen="topic";
    st.armAll=false; st.armTopic=false; st.vfilt="all"; return render(); }
  if(d.seq!==undefined){ return startSeq(); }
  if(d.lv){ return startSeq(st.seq.filter, d.lv); }
  if(d.filt){ return startSeq(d.filt, st.seq?st.seq.level:"hint"); }
  if(d.vfilt){ st.vfilt=d.vfilt; return render(); }
  if(d.sort){ st.sort=d.sort; P.sort=d.sort; save(); return render(); }
  if(d.clear){
    if(d.clear==="all"){
      if(!st.armAll){ st.armAll=true; }
      else { P.i={}; P.v={}; save(); st.armAll=false; }
    } else {
      if(!st.armTopic){ st.armTopic=true; }
      else { clearTopic(st.tid); st.armTopic=false; }
    }
    st.keepScroll=window.scrollY; return render();
  }
  if(d.rseg!==undefined){
    st.seq.rshown[d.rseg]=1; st.keepScroll=window.scrollY; return render();
  }
  if(d.refmask){
    st.refmask=d.refmask; P.refmask=d.refmask; save();
    st.keepScroll=window.scrollY; return render();
  }
  if(d.reveal!==undefined){ st.seq.revealed=true; return render(); }
  if(d.retry!==undefined){                      /* stay on this item, hide it again */
    var q=st.seq;
    q.revealed=false; q.shown={}; q.rshown={}; q.salt++;
    st.keepScroll=0; return render();
  }
  if(d.prev!==undefined){                       /* step back and undo that answer */
    var q=st.seq, last=q.hist.pop();
    if(last){ if(last.ok) q.ok--; else q.ng--; q.i=last.i; }
    q.revealed=false; q.shown={}; q.rshown={}; q.salt++;
    return render();
  }
  if(d.mark!==undefined){
    var q=st.seq, cur=q.list[q.i], ok=(+d.mark===1);
    if(ok) q.ok++; else q.ng++;
    markItem(st.tid, cur._ix, q.level, ok);
    q.hist.push({i:q.i, ok:ok});
    q.i++; q.revealed=false; q.shown={}; q.rshown={}; q.salt=0; return render();
  }
  if(d.restart!==undefined){ return startSeq(); }
  if(d.item!==undefined){ st.from=st.screen; st.itemIdx=+d.item; st.screen="verses"; return render(); }
  if(d.openv!==undefined){ st.from="seq"; st.itemIdx=+d.openv; st.screen="verses"; return render(); }
  if(d.verse!==undefined){
    st.vd={vi:+d.verse, level:"fill", revealed:false, shown:{}, salt:0};
    st.screen="verse"; return render();
  }
  if(d.vlv){ st.vd.level=d.vlv; st.vd.revealed=false; st.vd.shown={}; return render(); }
  if(d.vreveal!==undefined){ st.vd.revealed=true; return render(); }
  if(d.reshuffle!==undefined){ st.vd.salt++; st.vd.shown={}; st.vd.revealed=false; return render(); }
  if(d.nextv!==undefined){
    st.vd={vi:st.vd.vi+1, level:st.vd.level, revealed:false, shown:{}, salt:0};
    return render();
  }
  if(d.vmark!==undefined){
    var tp=TOPICS[st.tid], it=tp.items[st.itemIdx], v=it.vs[st.vd.vi];
    markVerse(v, st.vd.level, +d.vmark===1);
    if(st.vd.vi+1<it.vs.length){ st.vd={vi:st.vd.vi+1,level:st.vd.level,revealed:false,shown:{},salt:0}; }
    else { st.screen="verses"; }
    return render();
  }
  if(el.classList.contains("blk")){
    var bi=el.dataset.b;
    if(st.screen==="verse" && st.vd)     st.vd.shown[bi]=1;
    else if(st.screen==="seq" && st.seq) st.seq.shown[bi]=1;
    else return;
    st.keepScroll=window.scrollY; return render();
  }
});
var composing=false;
document.addEventListener("compositionstart",function(e){
  if(e.target.id==="q") composing=true;
});
document.addEventListener("compositionend",function(e){
  if(e.target.id!=="q") return;
  composing=false; st.q=e.target.value; refreshList();
});
document.addEventListener("input",function(e){
  if(e.target.id!=="q") return;
  st.q=e.target.value;
  if(composing || e.isComposing) return;   /* 組字中，等選完字再篩選 */
  refreshList();
});
render();
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
